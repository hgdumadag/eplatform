<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Midpoint reference figure</title>
  <desc id="desc">A segment between two points with the midpoint shown at the center.</desc>
  <rect width="760" height="420" fill="#f7fbff"/>
  <g stroke="#d8e6f4" stroke-width="1">
    <line x1="120" y1="40" x2="120" y2="360"/>
    <line x1="200" y1="40" x2="200" y2="360"/>
    <line x1="280" y1="40" x2="280" y2="360"/>
    <line x1="360" y1="40" x2="360" y2="360"/>
    <line x1="440" y1="40" x2="440" y2="360"/>
    <line x1="520" y1="40" x2="520" y2="360"/>
    <line x1="600" y1="40" x2="600" y2="360"/>
    <line x1="80" y1="80" x2="680" y2="80"/>
    <line x1="80" y1="140" x2="680" y2="140"/>
    <line x1="80" y1="200" x2="680" y2="200"/>
    <line x1="80" y1="260" x2="680" y2="260"/>
    <line x1="80" y1="320" x2="680" y2="320"/>
  </g>
  <g stroke="#557a95" stroke-width="3">
    <line x1="80" y1="200" x2="680" y2="200"/>
    <line x1="360" y1="40" x2="360" y2="360"/>
  </g>
  <line x1="160" y1="300" x2="560" y2="120" stroke="#2b6cb0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="160" cy="300" r="12" fill="#f97316"/>
  <circle cx="560" cy="120" r="12" fill="#10b981"/>
  <circle cx="360" cy="210" r="13" fill="#1d4ed8"/>
  <g fill="#163c63" font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <text x="142" y="336">A</text>
    <text x="572" y="116">B</text>
    <text x="375" y="235">M</text>
  </g>
  <g fill="#4b647d" font-family="Arial, sans-serif" font-size="20">
    <text x="160" y="390">Average the x-values and average the y-values.</text>
  </g>
</svg>
