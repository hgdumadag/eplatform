<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Slope reference grid</title>
  <desc id="desc">A coordinate plane showing four example lines with positive, zero, negative, and undefined slope.</desc>
  <rect width="760" height="420" fill="#f7fbff"/>
  <g stroke="#d8e6f4" stroke-width="1">
    <line x1="80" y1="40" x2="80" y2="380"/>
    <line x1="140" y1="40" x2="140" y2="380"/>
    <line x1="200" y1="40" x2="200" y2="380"/>
    <line x1="260" y1="40" x2="260" y2="380"/>
    <line x1="320" y1="40" x2="320" y2="380"/>
    <line x1="380" y1="40" x2="380" y2="380"/>
    <line x1="440" y1="40" x2="440" y2="380"/>
    <line x1="500" y1="40" x2="500" y2="380"/>
    <line x1="560" y1="40" x2="560" y2="380"/>
    <line x1="620" y1="40" x2="620" y2="380"/>
    <line x1="680" y1="40" x2="680" y2="380"/>
    <line x1="60" y1="70" x2="700" y2="70"/>
    <line x1="60" y1="130" x2="700" y2="130"/>
    <line x1="60" y1="190" x2="700" y2="190"/>
    <line x1="60" y1="250" x2="700" y2="250"/>
    <line x1="60" y1="310" x2="700" y2="310"/>
    <line x1="60" y1="370" x2="700" y2="370"/>
  </g>
  <g stroke="#557a95" stroke-width="3">
    <line x1="60" y1="250" x2="700" y2="250"/>
    <line x1="380" y1="40" x2="380" y2="380"/>
  </g>
  <g fill="#1d3557" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="706" y="258">x</text>
    <text x="389" y="35">y</text>
  </g>
  <g stroke-linecap="round" stroke-width="6" fill="none">
    <line x1="120" y1="320" x2="300" y2="120" stroke="#1e88e5"/>
    <line x1="110" y1="110" x2="290" y2="110" stroke="#7cb342"/>
    <line x1="470" y1="120" x2="650" y2="300" stroke="#f57c00"/>
    <line x1="570" y1="70" x2="570" y2="350" stroke="#8e24aa"/>
  </g>
  <g fill="#163c63" font-family="Arial, sans-serif" font-size="20" font-weight="700">
    <text x="145" y="105">Positive slope</text>
    <text x="120" y="96">Zero slope</text>
    <text x="470" y="108">Negative slope</text>
    <text x="520" y="52">Undefined slope</text>
  </g>
</svg>
