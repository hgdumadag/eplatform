<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc">
  <title id="title">Geometry traps sheet</title>
  <desc id="desc">A compact sheet showing common geometry mistakes with short labels that stay readable at small sizes.</desc>
  <rect width="1080" height="640" fill="#fbfaf6"/>
  <text x="64" y="76" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#43331a">Geometry Traps at a Glance</text>
  <text x="64" y="110" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6d5a3b">Mark the right clue before you compute.</text>

  <rect x="44" y="146" width="306" height="196" rx="24" fill="#fff3ef" stroke="#efb4a0" stroke-width="4"/>
  <text x="72" y="182" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#8a2d13">Trap 1</text>
  <text x="72" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8a2d13">Slanted side is not the height</text>
  <polygon points="112,286 112,228 244,286" fill="#f7d9cf" stroke="#c9542e" stroke-width="5"/>
  <line x1="98" y1="286" x2="244" y2="286" stroke="#1d5b87" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="112" y1="286" x2="112" y2="228" stroke="#17a673" stroke-width="4"/>
  <text x="74" y="316" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#8a2d13">Wrong: slanted side</text>
  <text x="74" y="336" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2d5b49">Right: perpendicular height</text>

  <rect x="386" y="146" width="306" height="196" rx="24" fill="#eef7ff" stroke="#b8d3ee" stroke-width="4"/>
  <text x="414" y="182" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#17436e">Trap 2</text>
  <text x="414" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#17436e">Area vs perimeter</text>
  <rect x="470" y="228" width="136" height="92" fill="#d7ebff" stroke="#2c74b3" stroke-width="5"/>
  <text x="414" y="316" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#17436e">Perimeter: around the edge</text>
  <text x="414" y="336" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#17436e">Area: inside the shape</text>

  <rect x="728" y="146" width="308" height="196" rx="24" fill="#f7f1ff" stroke="#d4c2f0" stroke-width="4"/>
  <text x="756" y="182" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5d2fa3">Trap 3</text>
  <text x="756" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5d2fa3">Radius vs diameter</text>
  <circle cx="882" cy="268" r="56" fill="#ece1ff" stroke="#7c3aed" stroke-width="5"/>
  <line x1="826" y1="268" x2="938" y2="268" stroke="#7c3aed" stroke-width="5"/>
  <line x1="882" y1="268" x2="938" y2="268" stroke="#e04b4b" stroke-width="5"/>
  <text x="774" y="316" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5d2fa3">Diameter = full width</text>
  <text x="774" y="336" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5d2fa3">Radius = half of diameter</text>

  <rect x="44" y="382" width="476" height="210" rx="24" fill="#fff9e8" stroke="#f2d58a" stroke-width="4"/>
  <text x="72" y="418" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#8a5a00">Trap 4</text>
  <text x="72" y="444" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8a5a00">Supplementary does not mean equal</text>
  <line x1="136" y1="506" x2="336" y2="506" stroke="#8a5a00" stroke-width="5"/>
  <line x1="236" y1="506" x2="298" y2="426" stroke="#8a5a00" stroke-width="5"/>
  <path d="M190 506 A40 40 0 0 1 216 468" fill="none" stroke="#d8572a" stroke-width="4"/>
  <path d="M274 468 A40 40 0 0 1 306 506" fill="none" stroke="#2c74b3" stroke-width="4"/>
  <text x="76" y="548" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#8a5a00">Angles on a straight line add to 180°.</text>
  <text x="76" y="568" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#8a5a00">They are equal only if both are 90°.</text>

  <rect x="558" y="382" width="478" height="210" rx="24" fill="#eefaf4" stroke="#bedecc" stroke-width="4"/>
  <text x="586" y="418" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#245438">Exam habit to keep</text>
  <text x="586" y="466" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#245438">1. Mark the useful givens.</text>
  <text x="586" y="500" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#245438">2. Say what quantity you need.</text>
  <text x="586" y="534" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#245438">3. Check the unit before you finalize.</text>
</svg>
