<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Sphere radius and diameter</title>
  <desc id="desc">A shaded sphere with its center, radius from the center to the surface, and diameter across the whole sphere labeled.</desc>
  <defs>
    <radialGradient id="sphereGradient" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="48%" stop-color="#9ed0ff"/>
      <stop offset="100%" stop-color="#2f6fb0"/>
    </radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="760" height="420" rx="18" fill="#f7fafc"/>
  <circle cx="330" cy="210" r="145" fill="url(#sphereGradient)" stroke="#1f4f7a" stroke-width="3"/>
  <ellipse cx="330" cy="210" rx="145" ry="38" fill="none" stroke="#1f4f7a" stroke-width="2" stroke-dasharray="8 7" opacity="0.7"/>
  <circle cx="330" cy="210" r="6" fill="#111827"/>
  <line x1="185" y1="210" x2="475" y2="210" stroke="#111827" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="330" y1="210" x2="430" y2="108" stroke="#b42318" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="70" y="52" width="210" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="92" y="84" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Diameter</text>
  <text x="92" y="111" font-family="Arial, sans-serif" font-size="16" fill="#475569">across the whole sphere</text>
  <line x1="278" y1="105" x2="214" y2="190" stroke="#111827" stroke-width="2"/>
  <rect x="492" y="70" width="190" height="74" rx="10" fill="#ffffff" stroke="#fecaca"/>
  <text x="514" y="102" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#b42318">Radius</text>
  <text x="514" y="129" font-family="Arial, sans-serif" font-size="16" fill="#475569">center to surface</text>
  <line x1="500" y1="123" x2="430" y2="108" stroke="#b42318" stroke-width="2"/>
  <text x="344" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">center</text>
  <text x="285" y="344" font-family="Arial, sans-serif" font-size="20" fill="#111827">d = 2r</text>
</svg>
