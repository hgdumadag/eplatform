<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Sphere volume formula parts</title>
  <desc id="desc">The formula V equals four thirds pi r cubed with labels for volume, pi, radius, and cubing the radius.</desc>
  <rect width="760" height="420" rx="18" fill="#fbfcfe"/>
  <rect x="72" y="62" width="616" height="162" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="130" y="160" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#111827">V = </text>
  <text x="238" y="137" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0f766e">4</text>
  <line x1="222" y1="150" x2="276" y2="150" stroke="#0f766e" stroke-width="4"/>
  <text x="238" y="195" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0f766e">3</text>
  <text x="292" y="160" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#111827">pi r</text>
  <text x="420" y="124" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#b42318">3</text>
  <line x1="160" y1="184" x2="160" y2="264" stroke="#334155" stroke-width="2"/>
  <line x1="250" y1="204" x2="250" y2="286" stroke="#0f766e" stroke-width="2"/>
  <line x1="338" y1="184" x2="338" y2="264" stroke="#334155" stroke-width="2"/>
  <line x1="412" y1="154" x2="510" y2="274" stroke="#b42318" stroke-width="2"/>
  <rect x="86" y="266" width="150" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="105" y="301" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#312e81">V: volume</text>
  <rect x="248" y="288" width="170" height="58" rx="10" fill="#ecfdf5" stroke="#99f6e4"/>
  <text x="267" y="323" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">4/3: scale factor</text>
  <rect x="430" y="288" width="244" height="58" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="449" y="314" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">r^3: radius cubed</text>
  <text x="449" y="338" font-family="Arial, sans-serif" font-size="15" fill="#475569">multiply r by itself 3 times</text>
  <text x="95" y="382" font-family="Arial, sans-serif" font-size="18" fill="#334155">Use radius only. If diameter is given, divide it by 2 first.</text>
</svg>
