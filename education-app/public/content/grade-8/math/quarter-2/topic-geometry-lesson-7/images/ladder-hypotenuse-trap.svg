<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Ladder hypotenuse trap</title>
  <desc id="desc">A ladder leans against a wall, forming the hypotenuse of a right triangle with wall height 12 feet and ground distance 9 feet.</desc>
  <rect width="760" height="430" fill="#f7fafc"/>
  <rect x="88" y="70" width="32" height="290" fill="#d8dee9" stroke="#64748b" stroke-width="3"/>
  <rect x="88" y="328" width="430" height="32" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
  <line x1="120" y1="80" x2="450" y2="328" stroke="#a16207" stroke-width="14" stroke-linecap="round"/>
  <line x1="120" y1="80" x2="450" y2="328" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
  <path d="M120 328 L120 292 L156 292 L156 328 Z" fill="none" stroke="#334155" stroke-width="4"/>
  <text x="47" y="214" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#24515f">12 ft</text>
  <text x="250" y="394" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#24515f">9 ft</text>
  <text x="260" y="180" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#8a3b12" transform="rotate(37 260 180)">ladder = c</text>
  <rect x="520" y="94" width="190" height="202" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="542" y="136" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">Common trap</text>
  <text x="542" y="178" font-family="Arial, sans-serif" font-size="22" fill="#334155">The slanted</text>
  <text x="542" y="207" font-family="Arial, sans-serif" font-size="22" fill="#334155">ladder is across</text>
  <text x="542" y="236" font-family="Arial, sans-serif" font-size="22" fill="#334155">from the right</text>
  <text x="542" y="265" font-family="Arial, sans-serif" font-size="22" fill="#334155">angle, so it is c.</text>
  <text x="122" y="44" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Check which side is the hypotenuse.</text>
</svg>
