<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Solid Components Volume Plan</title>
  <desc id="desc">A model structure split into rectangular prism base, cylindrical post, and triangular prism roof with volume formulas.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="205" y="36" font-size="24" font-weight="700" fill="#0f172a">Solid Components in the Model</text>
    <polygon points="168,228 474,228 554,278 248,278" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/>
    <polygon points="168,228 248,278 248,314 168,264" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/>
    <polygon points="248,278 554,278 554,314 248,314" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3"/>
    <ellipse cx="360" cy="194" rx="38" ry="12" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
    <rect x="322" y="116" width="76" height="78" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
    <ellipse cx="360" cy="116" rx="38" ry="12" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <polygon points="232,116 488,116 552,168 296,168" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/>
    <polygon points="232,116 296,168 360,70" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <path d="M360 70L488 116L552 168" fill="none" stroke="#15803d" stroke-width="3"/>
    <g fill="#0f172a" font-size="16">
      <text x="70" y="340">Rectangular prism: V = lwh</text>
      <text x="276" y="96">Cylinder: V = pi r^2 h</text>
      <text x="438" y="92">Triangular prism: V = (1/2)bhL</text>
    </g>
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="5 5">
      <path d="M212 314L134 334"/>
      <path d="M360 116L358 78"/>
      <path d="M488 116L582 86"/>
    </g>
  </g>
</svg>
