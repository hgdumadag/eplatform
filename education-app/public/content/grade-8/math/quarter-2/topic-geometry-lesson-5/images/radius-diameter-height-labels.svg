<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="title desc">
  <title id="title">Cone Radius Diameter and Height Labels</title>
  <desc id="desc">A cone diagram labels the radius, diameter, and perpendicular height used in the volume formula.</desc>
  <rect width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Read the Cone Before You Calculate</text>
  <g transform="translate(190 72)">
    <path d="M105 300 L250 45 L395 300" fill="#fef3c7" stroke="#d97706" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="250" cy="300" rx="145" ry="42" fill="#fde68a" stroke="#d97706" stroke-width="5"/>
    <line x1="250" y1="45" x2="250" y2="300" stroke="#2563eb" stroke-width="4" stroke-dasharray="9 7"/>
    <path d="M238 300 H262 M238 45 H262" stroke="#2563eb" stroke-width="4"/>
    <text x="266" y="178" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">height h</text>
    <line x1="105" y1="300" x2="395" y2="300" stroke="#7c2d12" stroke-width="4"/>
    <text x="250" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#7c2d12">diameter d</text>
    <line x1="250" y1="300" x2="395" y2="300" stroke="#dc2626" stroke-width="7"/>
    <circle cx="250" cy="300" r="6" fill="#dc2626"/>
    <text x="318" y="286" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#991b1b">radius r</text>
  </g>
  <g transform="translate(70 390)">
    <rect x="0" y="0" width="680" height="48" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="340" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#075985">Use radius in the formula. If diameter is given, compute r = d ÷ 2 first.</text>
  </g>
</svg>
