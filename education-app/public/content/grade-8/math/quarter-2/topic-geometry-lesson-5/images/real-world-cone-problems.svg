<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Real-World Cone Volume Problems</title>
  <desc id="desc">Three real-world cone contexts: a sand pile, a funnel, and a cone-shaped cup with radius and height cues.</desc>
  <rect width="920" height="430" fill="#f8fafc"/>
  <text x="460" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Cone Volume Appears in Real Contexts</text>
  <g transform="translate(55 90)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="240" height="250" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <path d="M45 170 Q120 52 195 170" fill="#fde68a" stroke="#d97706" stroke-width="4"/>
    <ellipse cx="120" cy="170" rx="75" ry="20" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
    <text x="120" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#92400e">Sand Pile</text>
    <text x="120" y="238" text-anchor="middle" font-size="16" fill="#78350f">Use radius and height.</text>
  </g>
  <g transform="translate(340 90)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="240" height="250" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <path d="M52 62 L188 62 L138 166 L138 198 L102 198 L102 166 Z" fill="#cffafe" stroke="#0891b2" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="120" cy="62" rx="68" ry="18" fill="#a5f3fc" stroke="#0891b2" stroke-width="4"/>
    <text x="120" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#155e75">Funnel</text>
    <text x="120" y="238" text-anchor="middle" font-size="16" fill="#164e63">Volume capacity.</text>
  </g>
  <g transform="translate(625 90)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="240" height="250" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <path d="M55 58 L185 58 L120 185 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="120" cy="58" rx="65" ry="18" fill="#bbf7d0" stroke="#16a34a" stroke-width="4"/>
    <line x1="120" y1="58" x2="185" y2="58" stroke="#dc2626" stroke-width="4"/>
    <text x="153" y="48" font-size="16" fill="#991b1b">r</text>
    <line x1="200" y1="58" x2="200" y2="185" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="209" y="126" font-size="16" fill="#1d4ed8">h</text>
    <text x="120" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">Cone Cup</text>
    <text x="120" y="238" text-anchor="middle" font-size="16" fill="#14532d">Label cubic units.</text>
  </g>
  <text x="460" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#334155">The same formula works after the radius and height are identified.</text>
</svg>
