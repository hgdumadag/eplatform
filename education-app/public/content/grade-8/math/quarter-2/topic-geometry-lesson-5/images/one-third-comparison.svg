<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">One-Third Cone Volume Comparison</title>
  <desc id="desc">Three equal cone volumes are shown as combining to match the volume of one cylinder with the same base and height.</desc>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Three Matching Cones Fill One Cylinder</text>
  <g transform="translate(55 92)">
    <rect x="0" y="0" width="365" height="280" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="182" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">One Cylinder</text>
    <ellipse cx="182" cy="82" rx="92" ry="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <path d="M90 82 V218 M274 82 V218" stroke="#2563eb" stroke-width="4"/>
    <ellipse cx="182" cy="218" rx="92" ry="24" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/>
    <text x="182" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#0f172a">πr²h</text>
  </g>
  <text x="452" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#475569">=</text>
  <g transform="translate(495 92)">
    <rect x="0" y="0" width="350" height="280" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="175" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d">Three Cones</text>
    <g transform="translate(18 60)">
      <path d="M35 150 L80 35 L125 150" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <ellipse cx="80" cy="150" rx="45" ry="14" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
      <text x="80" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#166534">⅓</text>
    </g>
    <g transform="translate(118 60)">
      <path d="M35 150 L80 35 L125 150" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <ellipse cx="80" cy="150" rx="45" ry="14" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
      <text x="80" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#166534">⅓</text>
    </g>
    <g transform="translate(218 60)">
      <path d="M35 150 L80 35 L125 150" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <ellipse cx="80" cy="150" rx="45" ry="14" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
      <text x="80" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#166534">⅓</text>
    </g>
    <text x="175" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#0f172a">3 × ⅓πr²h</text>
  </g>
  <text x="450" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">One cone volume is one-third of the matching cylinder volume.</text>
</svg>
