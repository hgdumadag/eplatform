<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img">
  <title>Valid and invalid triangle side examples</title>
  <desc>Two worked examples compare side lengths 5, 6, 8 as valid and 3, 4, 8 as invalid.</desc>
  <rect width="760" height="380" fill="#f8fafc"/>
  <text x="52" y="44" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Valid vs. Invalid Examples</text>
  <rect x="48" y="76" width="312" height="250" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/>
  <rect x="400" y="76" width="312" height="250" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="3"/>
  <text x="204" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">Valid</text>
  <text x="556" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#991b1b">Invalid</text>
  <polygon points="106,252 302,252 214,138" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="202" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0f172a">5, 6, 8</text>
  <text x="202" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#166534">5 + 6 = 11 &gt; 8</text>
  <line x1="454" y1="244" x2="650" y2="244" stroke="#ef4444" stroke-width="9" stroke-linecap="round"/>
  <line x1="454" y1="222" x2="528" y2="222" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
  <line x1="528" y1="222" x2="626" y2="222" stroke="#f97316" stroke-width="9" stroke-linecap="round"/>
  <text x="554" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0f172a">3, 4, 8</text>
  <text x="554" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">3 + 4 = 7 &lt; 8</text>
</svg>
