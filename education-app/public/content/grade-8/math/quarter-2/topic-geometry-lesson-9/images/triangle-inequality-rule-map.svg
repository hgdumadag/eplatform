<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img">
  <title>Triangle inequality rule map</title>
  <desc>A rule map showing the three pairwise triangle inequality checks and the shortcut of adding the two shorter sides.</desc>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="52" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Triangle Inequality Rule Map</text>
  <polygon points="104,296 292,296 182,134" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <text x="186" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">sides a, b, c</text>
  <text x="90" y="226" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">a</text>
  <text x="224" y="214" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">b</text>
  <text x="180" y="288" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">c</text>
  <rect x="380" y="92" width="300" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="380" y="178" width="300" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="380" y="264" width="300" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="530" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">a + b &gt; c</text>
  <text x="530" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">a + c &gt; b</text>
  <text x="530" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">b + c &gt; a</text>
  <path d="M302 188 C334 155 352 130 380 123" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M302 212 C334 212 352 209 380 209" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M302 244 C334 274 352 296 380 296" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="84" y="356" width="592" height="42" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">Shortcut: two shorter sides must add to more than the longest side.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
