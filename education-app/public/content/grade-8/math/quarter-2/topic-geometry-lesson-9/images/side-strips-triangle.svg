<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img">
  <title>Side strips forming and not forming a triangle</title>
  <desc>Two panels compare three strips that close into a triangle with three strips that lie flat and fail to form a triangle.</desc>
  <rect width="760" height="360" fill="#f8fafc"/>
  <text x="62" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Can the side strips close?</text>
  <rect x="44" y="74" width="312" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="404" y="74" width="312" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="76" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">Forms a triangle</text>
  <text x="436" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">Does not close</text>
  <polygon points="98,244 298,244 188,128" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <line x1="98" y1="244" x2="298" y2="244" stroke="#0f766e" stroke-width="10" stroke-linecap="round"/>
  <line x1="98" y1="244" x2="188" y2="128" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
  <line x1="298" y1="244" x2="188" y2="128" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>
  <text x="184" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">4 + 5 > 6</text>
  <line x1="448" y1="236" x2="648" y2="236" stroke="#0f766e" stroke-width="10" stroke-linecap="round"/>
  <line x1="448" y1="218" x2="528" y2="218" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
  <line x1="528" y1="218" x2="648" y2="218" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>
  <path d="M448 218 C496 160 600 160 648 218" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="548" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">3 + 5 = 8</text>
  <text x="548" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">equality lies flat</text>
</svg>
