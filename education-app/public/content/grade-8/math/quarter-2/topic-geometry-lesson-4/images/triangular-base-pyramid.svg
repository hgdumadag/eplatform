<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Triangular-base pyramid</title>
  <desc id="desc">A pyramid with a triangular base shows how to compute base area before using the pyramid volume formula.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <rect x="50" y="42" width="800" height="436" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="260,390 590,390 420,292" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <polygon points="260,390 420,292 432,110" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/>
  <polygon points="590,390 420,292 432,110" fill="#86efac" stroke="#15803d" stroke-width="3" opacity="0.78"/>
  <polygon points="260,390 590,390 432,110" fill="#f0fdf4" stroke="#15803d" stroke-width="3" opacity="0.55"/>
  <line x1="420" y1="292" x2="420" y2="390" stroke="#166534" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M420 390 L444 390 L444 366" fill="none" stroke="#166534" stroke-width="3"/>
  <text x="375" y="430" font-family="Arial, sans-serif" font-size="24" fill="#166534" font-weight="700">triangular base</text>
  <text x="312" y="374" font-family="Arial, sans-serif" font-size="22" fill="#166534">base length</text>
  <text x="448" y="348" font-family="Arial, sans-serif" font-size="22" fill="#166534">triangle height</text>
  <text x="624" y="148" font-family="Arial, sans-serif" font-size="30" fill="#0f172a" font-weight="700">Step 1</text>
  <text x="624" y="190" font-family="Arial, sans-serif" font-size="24" fill="#334155">Find B for the triangle:</text>
  <text x="624" y="232" font-family="Arial, sans-serif" font-size="28" fill="#15803d" font-weight="700">B = 1/2 bh</text>
  <text x="624" y="290" font-family="Arial, sans-serif" font-size="30" fill="#0f172a" font-weight="700">Step 2</text>
  <text x="624" y="332" font-family="Arial, sans-serif" font-size="24" fill="#334155">Use V = 1/3 Bh</text>
</svg>
