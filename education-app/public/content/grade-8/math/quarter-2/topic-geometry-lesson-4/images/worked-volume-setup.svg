<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Worked pyramid volume setup</title>
  <desc id="desc">A step-by-step calculation shows base area first, then substitution into the pyramid volume formula.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <rect x="42" y="40" width="816" height="440" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="86" y="100" font-family="Arial, sans-serif" font-size="34" fill="#0f172a" font-weight="700">Worked setup</text>
  <rect x="86" y="135" width="728" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="112" y="180" font-family="Arial, sans-serif" font-size="26" fill="#0c4a6e" font-weight="700">1. Find base area: B = 1/2(12)(8) = 48 cm^2</text>
  <rect x="86" y="225" width="728" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="112" y="270" font-family="Arial, sans-serif" font-size="26" fill="#14532d" font-weight="700">2. Identify pyramid height: h = 15 cm</text>
  <rect x="86" y="315" width="728" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="112" y="360" font-family="Arial, sans-serif" font-size="26" fill="#78350f" font-weight="700">3. Substitute: V = 1/3(48)(15)</text>
  <rect x="86" y="405" width="728" height="48" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="112" y="438" font-family="Arial, sans-serif" font-size="25" fill="#7f1d1d" font-weight="700">4. Volume: V = 240 cm^3</text>
</svg>
