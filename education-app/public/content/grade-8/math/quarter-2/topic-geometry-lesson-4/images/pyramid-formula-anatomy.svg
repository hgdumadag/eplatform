<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Pyramid volume formula anatomy</title>
  <desc id="desc">A pyramid diagram labels base area B, perpendicular height h, and the formula V equals one-third times B times h.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <rect x="42" y="38" width="816" height="444" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="255,390 505,390 610,315 355,315" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <polygon points="355,315 610,315 430,98" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <polygon points="255,390 355,315 430,98" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3" opacity="0.9"/>
  <polygon points="505,390 610,315 430,98" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3" opacity="0.65"/>
  <line x1="430" y1="98" x2="430" y2="348" stroke="#dc2626" stroke-width="4"/>
  <path d="M430 348 L458 348 L458 320" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="454" y="222" font-family="Arial, sans-serif" font-size="28" fill="#b91c1c" font-weight="700">h</text>
  <text x="362" y="404" font-family="Arial, sans-serif" font-size="28" fill="#1e40af" font-weight="700">base area B</text>
  <text x="642" y="132" font-family="Arial, sans-serif" font-size="42" fill="#0f172a" font-weight="700">V = 1/3 Bh</text>
  <text x="642" y="188" font-family="Arial, sans-serif" font-size="24" fill="#334155">B is area, not a side length</text>
  <text x="642" y="226" font-family="Arial, sans-serif" font-size="24" fill="#334155">h is perpendicular height</text>
  <line x1="590" y1="315" x2="642" y2="206" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/>
</svg>
