<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Hexagonal base area for a pyramid</title>
  <desc id="desc">A regular hexagonal base is labeled with perimeter and apothem to show that base area is one-half apothem times perimeter.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <rect x="48" y="40" width="804" height="440" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="305,118 430,118 493,226 430,334 305,334 242,226" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  <line x1="367" y1="226" x2="367" y2="118" stroke="#b45309" stroke-width="4"/>
  <circle cx="367" cy="226" r="5" fill="#b45309"/>
  <path d="M367 118 L389 118 L389 140" fill="none" stroke="#b45309" stroke-width="3"/>
  <text x="385" y="182" font-family="Arial, sans-serif" font-size="24" fill="#92400e" font-weight="700">apothem a</text>
  <text x="276" y="370" font-family="Arial, sans-serif" font-size="24" fill="#92400e" font-weight="700">perimeter p</text>
  <line x1="242" y1="350" x2="493" y2="350" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
  </defs>
  <text x="572" y="138" font-family="Arial, sans-serif" font-size="34" fill="#0f172a" font-weight="700">Regular polygon base</text>
  <text x="572" y="196" font-family="Arial, sans-serif" font-size="28" fill="#92400e" font-weight="700">B = 1/2 ap</text>
  <text x="572" y="246" font-family="Arial, sans-serif" font-size="24" fill="#334155">a = apothem</text>
  <text x="572" y="284" font-family="Arial, sans-serif" font-size="24" fill="#334155">p = perimeter</text>
  <text x="572" y="344" font-family="Arial, sans-serif" font-size="24" fill="#334155">Then use V = 1/3 Bh.</text>
</svg>
