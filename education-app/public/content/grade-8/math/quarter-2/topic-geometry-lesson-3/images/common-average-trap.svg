<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Common average-the-wrong-values trap</title>
  <desc id="desc">A comparison of an incorrect midpoint setup that averages x with y and a correct setup that averages x with x and y with y.</desc>
  <rect width="760" height="390" fill="#f8fafc"/>
  <text x="46" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Common trap: average the right pairs</text>
  <g font-family="Arial, sans-serif">
    <rect x="54" y="84" width="300" height="236" rx="8" fill="#fff1f2" stroke="#fb7185"/>
    <text x="82" y="124" font-size="23" font-weight="700" fill="#be123c">Incorrect</text>
    <text x="82" y="166" font-size="20" fill="#0f172a">A(-4, 6), B(8, -2)</text>
    <text x="82" y="212" font-size="20" fill="#0f172a">(-4 + 6) / 2</text>
    <text x="82" y="248" font-size="20" fill="#0f172a">(8 + -2) / 2</text>
    <text x="82" y="292" font-size="18" font-weight="700" fill="#be123c">This mixes x and y values.</text>
    <path d="M282 104L326 148M326 104L282 148" stroke="#be123c" stroke-width="6" stroke-linecap="round"/>
    <rect x="406" y="84" width="300" height="236" rx="8" fill="#ecfdf5" stroke="#34d399"/>
    <text x="434" y="124" font-size="23" font-weight="700" fill="#047857">Correct</text>
    <text x="434" y="166" font-size="20" fill="#0f172a">A(-4, 6), B(8, -2)</text>
    <text x="434" y="212" font-size="20" fill="#0f172a">x: (-4 + 8) / 2 = 2</text>
    <text x="434" y="248" font-size="20" fill="#0f172a">y: (6 + -2) / 2 = 2</text>
    <text x="434" y="292" font-size="18" font-weight="700" fill="#047857">Midpoint = (2, 2)</text>
    <path d="M642 112L654 128L684 96" fill="none" stroke="#047857" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="56" y="354" font-family="Arial, sans-serif" font-size="19" fill="#475569">Rule: x with x, y with y, then write the midpoint as an ordered pair.</text>
</svg>
