<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Averaging x-coordinates and y-coordinates separately</title>
  <desc id="desc">A visual formula card showing that midpoint coordinates are found by averaging x one with x two and y one with y two.</desc>
  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="38" y="34" width="684" height="292" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="68" y="82" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Average coordinates separately</text>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700">
    <text x="90" y="150" fill="#1d4ed8">Endpoint 1: (x1, y1)</text>
    <text x="430" y="150" fill="#b45309">Endpoint 2: (x2, y2)</text>
  </g>
  <path d="M142 166C130 206 154 228 232 232" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <path d="M482 166C494 204 462 228 258 232" fill="none" stroke="#b45309" stroke-width="3"/>
  <path d="M246 166C234 270 318 284 430 268" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <path d="M584 166C606 268 528 288 456 268" fill="none" stroke="#b45309" stroke-width="3"/>
  <rect x="144" y="210" width="170" height="58" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="374" y="210" width="170" height="58" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="172" y="246" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">(x1 + x2) / 2</text>
  <text x="402" y="246" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#92400e">(y1 + y2) / 2</text>
  <text x="198" y="306" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">M = ( x-average, y-average )</text>
</svg>
