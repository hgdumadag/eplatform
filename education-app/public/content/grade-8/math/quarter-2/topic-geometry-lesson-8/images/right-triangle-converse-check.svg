<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">Right triangle converse check</title>
  <desc id="desc">A 5-12-13 triangle is checked by showing that 5 squared plus 12 squared equals 13 squared.</desc>
  <rect width="900" height="460" fill="#f8fafc"/>
  <rect x="38" y="38" width="824" height="384" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="3"/>
  <text x="72" y="92" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Converse check: does it make a right triangle?</text>
  <g transform="translate(100 130)">
    <polygon points="0,230 0,50 360,230" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
    <rect x="0" y="207" width="23" height="23" fill="none" stroke="#2563eb" stroke-width="4"/>
    <text x="-35" y="145" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e40af">5</text>
    <text x="175" y="265" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e40af">12</text>
    <text x="205" y="126" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e40af">13</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="540" y="170" font-size="26" font-weight="700">Compare squares</text>
    <text x="540" y="220" font-size="24">5^2 + 12^2 = 25 + 144</text>
    <text x="540" y="260" font-size="24">= 169</text>
    <text x="540" y="315" font-size="24">13^2 = 169</text>
    <rect x="540" y="340" width="250" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="665" y="372" font-size="23" font-weight="700" text-anchor="middle" fill="#14532d">Equal: right triangle</text>
  </g>
</svg>
