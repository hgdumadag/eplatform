<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Common longest-side trap</title>
  <desc id="desc">A warning diagram shows that the longest side must be labeled c, even when side lengths are listed out of order.</desc>
  <rect width="940" height="500" fill="#f8fafc"/>
  <rect x="40" y="38" width="860" height="410" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="76" y="92" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Trap: c is not the last listed side</text>
  <text x="76" y="132" font-family="Arial, sans-serif" font-size="21" fill="#475569">Given side lengths: 13, 5, 12</text>
  <g font-family="Arial, sans-serif">
    <rect x="76" y="170" width="365" height="190" rx="14" fill="#fff1f2" stroke="#dc2626" stroke-width="3"/>
    <text x="105" y="215" font-size="24" font-weight="700" fill="#991b1b">Wrong</text>
    <text x="105" y="258" font-size="22" fill="#334155">13^2 + 5^2 ? 12^2</text>
    <text x="105" y="302" font-size="19" fill="#7f1d1d">Uses the last listed side as c.</text>
    <line x1="112" y1="322" x2="390" y2="190" stroke="#dc2626" stroke-width="6" opacity="0.65"/>
    <rect x="500" y="170" width="365" height="190" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
    <text x="529" y="215" font-size="24" font-weight="700" fill="#166534">Correct</text>
    <text x="529" y="258" font-size="22" fill="#334155">Sort: 5, 12, 13</text>
    <text x="529" y="302" font-size="22" fill="#334155">5^2 + 12^2 = 13^2</text>
    <text x="529" y="338" font-size="19" fill="#166534">The triangle is right.</text>
  </g>
  <path d="M454 265 H486" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="470" y="398" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#0f172a">Longest side = c</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
