<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Acute and obtuse comparison rules</title>
  <desc id="desc">Three comparison cards show how a squared plus b squared compared with c squared determines right, acute, or obtuse classification.</desc>
  <rect width="980" height="520" fill="#f8fafc"/>
  <text x="490" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#0f172a">Compare a^2 + b^2 with c^2</text>
  <g font-family="Arial, sans-serif">
    <rect x="50" y="105" width="270" height="340" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <polygon points="95,335 95,210 245,335" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <rect x="95" y="314" width="21" height="21" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="185" y="150" font-size="25" font-weight="700" text-anchor="middle" fill="#1e3a8a">Right</text>
    <text x="185" y="188" font-size="22" text-anchor="middle" fill="#334155">a^2 + b^2 = c^2</text>
    <text x="185" y="390" font-size="19" text-anchor="middle" fill="#334155">one 90 degree angle</text>
    <rect x="355" y="105" width="270" height="340" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <polygon points="400,335 475,205 570,335" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="490" y="150" font-size="25" font-weight="700" text-anchor="middle" fill="#14532d">Acute</text>
    <text x="490" y="188" font-size="22" text-anchor="middle" fill="#334155">a^2 + b^2 &gt; c^2</text>
    <text x="490" y="390" font-size="19" text-anchor="middle" fill="#334155">all angles less than 90 degrees</text>
    <rect x="660" y="105" width="270" height="340" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <polygon points="705,335 750,230 880,335" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <text x="795" y="150" font-size="25" font-weight="700" text-anchor="middle" fill="#7f1d1d">Obtuse</text>
    <text x="795" y="188" font-size="22" text-anchor="middle" fill="#334155">a^2 + b^2 &lt; c^2</text>
    <text x="795" y="390" font-size="19" text-anchor="middle" fill="#334155">one angle greater than 90 degrees</text>
  </g>
</svg>
