<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Ordered Pair Walking Path</title>
  <desc id="desc">A plotting path for the point four comma two, moving right four units from the origin and then up two units.</desc>
  <rect width="760" height="520" fill="#f8fafc"/>
  <g transform="translate(380 280)">
    <g stroke="#d1d5db" stroke-width="1">
      <path d="M-300 -180 V180"/><path d="M-240 -180 V180"/><path d="M-180 -180 V180"/><path d="M-120 -180 V180"/><path d="M-60 -180 V180"/><path d="M60 -180 V180"/><path d="M120 -180 V180"/><path d="M180 -180 V180"/><path d="M240 -180 V180"/><path d="M300 -180 V180"/>
      <path d="M-300 -180 H300"/><path d="M-300 -120 H300"/><path d="M-300 -60 H300"/><path d="M-300 60 H300"/><path d="M-300 120 H300"/><path d="M-300 180 H300"/>
    </g>
    <path d="M-330 0 H330" stroke="#111827" stroke-width="3"/>
    <path d="M0 210 V-210" stroke="#111827" stroke-width="3"/>
    <circle cx="0" cy="0" r="7" fill="#111827"/>
    <text x="-70" y="28" font-family="Arial, sans-serif" font-size="18" fill="#111827">Start (0,0)</text>
    <path d="M0 0 H240" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <path d="M222 -12 L248 0 L222 12 Z" fill="#2563eb"/>
    <path d="M240 0 V-120" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
    <path d="M228 -102 L240 -128 L252 -102 Z" fill="#16a34a"/>
    <circle cx="240" cy="-120" r="12" fill="#dc2626"/>
    <text x="255" y="-132" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#dc2626">(4, 2)</text>
    <text x="108" y="-18" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2563eb">x = 4 right</text>
    <text x="258" y="-58" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#15803d">y = 2 up</text>
  </g>
</svg>
