<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Coordinate Plane with Axes and Origin</title>
  <desc id="desc">A coordinate plane grid showing the horizontal x-axis, vertical y-axis, and origin labeled at zero zero.</desc>
  <rect width="760" height="520" fill="#f8fafc"/>
  <g transform="translate(380 260)">
    <g stroke="#d0d7de" stroke-width="1">
      <path d="M-300 -200 V200"/>
      <path d="M-240 -200 V200"/>
      <path d="M-180 -200 V200"/>
      <path d="M-120 -200 V200"/>
      <path d="M-60 -200 V200"/>
      <path d="M60 -200 V200"/>
      <path d="M120 -200 V200"/>
      <path d="M180 -200 V200"/>
      <path d="M240 -200 V200"/>
      <path d="M300 -200 V200"/>
      <path d="M-300 -180 H300"/>
      <path d="M-300 -120 H300"/>
      <path d="M-300 -60 H300"/>
      <path d="M-300 60 H300"/>
      <path d="M-300 120 H300"/>
      <path d="M-300 180 H300"/>
    </g>
    <path d="M-330 0 H330" stroke="#1f2937" stroke-width="4"/>
    <path d="M318 -10 L338 0 L318 10 Z" fill="#1f2937"/>
    <path d="M0 220 V-220" stroke="#1f2937" stroke-width="4"/>
    <path d="M-10 -208 L0 -228 L10 -208 Z" fill="#1f2937"/>
    <circle cx="0" cy="0" r="8" fill="#dc2626"/>
    <text x="16" y="24" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#dc2626">Origin (0, 0)</text>
    <text x="276" y="-18" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">x-axis</text>
    <text x="14" y="-188" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">y-axis</text>
    <g font-family="Arial, sans-serif" font-size="15" fill="#4b5563" text-anchor="middle">
      <text x="-300" y="24">-5</text><text x="-240" y="24">-4</text><text x="-180" y="24">-3</text><text x="-120" y="24">-2</text><text x="-60" y="24">-1</text>
      <text x="60" y="24">1</text><text x="120" y="24">2</text><text x="180" y="24">3</text><text x="240" y="24">4</text><text x="300" y="24">5</text>
    </g>
    <g font-family="Arial, sans-serif" font-size="15" fill="#4b5563" text-anchor="end">
      <text x="-12" y="-176">3</text><text x="-12" y="-116">2</text><text x="-12" y="-56">1</text><text x="-12" y="66">-1</text><text x="-12" y="126">-2</text><text x="-12" y="186">-3</text>
    </g>
  </g>
</svg>
