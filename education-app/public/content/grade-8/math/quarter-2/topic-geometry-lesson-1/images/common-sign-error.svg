<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Common Coordinate Sign Error</title>
  <desc id="desc">A comparison showing the correct location of negative two comma four and two common mistakes caused by sign and order errors.</desc>
  <rect width="760" height="520" fill="#f8fafc"/>
  <text x="380" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Target point: (-2, 4)</text>
  <g transform="translate(380 290)">
    <g stroke="#d1d5db" stroke-width="1">
      <path d="M-300 -210 V180"/><path d="M-240 -210 V180"/><path d="M-180 -210 V180"/><path d="M-120 -210 V180"/><path d="M-60 -210 V180"/><path d="M60 -210 V180"/><path d="M120 -210 V180"/><path d="M180 -210 V180"/><path d="M240 -210 V180"/><path d="M300 -210 V180"/>
      <path d="M-300 -180 H300"/><path d="M-300 -120 H300"/><path d="M-300 -60 H300"/><path d="M-300 60 H300"/><path d="M-300 120 H300"/><path d="M-300 180 H300"/>
    </g>
    <path d="M-330 0 H330" stroke="#111827" stroke-width="3"/>
    <path d="M0 210 V-230" stroke="#111827" stroke-width="3"/>
    <circle cx="-120" cy="-240" r="13" fill="#16a34a"/>
    <text x="-102" y="-236" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#15803d">Correct: (-2, 4)</text>
    <circle cx="120" cy="-240" r="12" fill="#ef4444"/>
    <path d="M108 -252 L132 -228 M132 -252 L108 -228" stroke="#ffffff" stroke-width="5"/>
    <text x="138" y="-236" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#b91c1c">Wrong sign: (2, 4)</text>
    <circle cx="-240" cy="-120" r="12" fill="#f97316"/>
    <path d="M-252 -132 L-228 -108 M-228 -132 L-252 -108" stroke="#ffffff" stroke-width="5"/>
    <text x="-300" y="-142" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#c2410c">Reversed: (-4, 2)</text>
    <path d="M0 0 H-120 V-240" fill="none" stroke="#16a34a" stroke-width="6" stroke-dasharray="10 8"/>
    <path d="M0 0 H120 V-240" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="8 8"/>
    <path d="M0 0 H-240 V-120" fill="none" stroke="#f97316" stroke-width="5" stroke-dasharray="8 8"/>
    <text x="-160" y="154" font-family="Arial, sans-serif" font-size="22" fill="#111827">Read the sign, then keep the order: x first, y second.</text>
  </g>
</svg>
