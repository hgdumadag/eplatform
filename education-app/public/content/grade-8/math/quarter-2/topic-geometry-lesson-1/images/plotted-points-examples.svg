<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Plotted Points Examples</title>
  <desc id="desc">A coordinate plane with points A, B, C, and D plotted in all four quadrants and labeled with ordered pairs.</desc>
  <rect width="760" height="520" fill="#ffffff"/>
  <g transform="translate(380 260)">
    <g stroke="#d1d5db" stroke-width="1">
      <path d="M-300 -210 V210"/><path d="M-240 -210 V210"/><path d="M-180 -210 V210"/><path d="M-120 -210 V210"/><path d="M-60 -210 V210"/><path d="M60 -210 V210"/><path d="M120 -210 V210"/><path d="M180 -210 V210"/><path d="M240 -210 V210"/><path d="M300 -210 V210"/>
      <path d="M-300 -180 H300"/><path d="M-300 -120 H300"/><path d="M-300 -60 H300"/><path d="M-300 60 H300"/><path d="M-300 120 H300"/><path d="M-300 180 H300"/>
    </g>
    <path d="M-330 0 H330" stroke="#111827" stroke-width="3"/>
    <path d="M0 230 V-230" stroke="#111827" stroke-width="3"/>
    <g font-family="Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">
      <text x="-240" y="23">-4</text><text x="-180" y="23">-3</text><text x="-120" y="23">-2</text><text x="-60" y="23">-1</text><text x="60" y="23">1</text><text x="120" y="23">2</text><text x="180" y="23">3</text><text x="240" y="23">4</text>
    </g>
    <g font-family="Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="end">
      <text x="-10" y="-176">3</text><text x="-10" y="-116">2</text><text x="-10" y="-56">1</text><text x="-10" y="66">-1</text><text x="-10" y="126">-2</text><text x="-10" y="186">-3</text>
    </g>
    <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
      <circle cx="120" cy="-180" r="10" fill="#2563eb"/><text x="136" y="-188" fill="#1d4ed8">A (2, 3)</text>
      <circle cx="-240" cy="-120" r="10" fill="#059669"/><text x="-220" y="-130" fill="#047857">B (-4, 2)</text>
      <circle cx="-180" cy="120" r="10" fill="#d97706"/><text x="-160" y="132" fill="#b45309">C (-3, -2)</text>
      <circle cx="240" cy="180" r="10" fill="#dc2626"/><text x="18" y="188" fill="#b91c1c">D (4, -3)</text>
    </g>
  </g>
</svg>
