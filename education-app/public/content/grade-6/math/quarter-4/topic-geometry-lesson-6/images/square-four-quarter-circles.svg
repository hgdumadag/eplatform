<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Square with four quarter circles removed</title>
  <desc id="desc">A square labeled 12 cm on each side with four quarter circles of radius 3 cm removed from the corners.</desc>
  <rect width="720" height="360" fill="#fbfcf8"/>
  <rect x="230" y="55" width="260" height="260" fill="#e9f5d8" stroke="#4b7f25" stroke-width="4"/>
  <path d="M230 55h78a78 78 0 0 1-78 78z" fill="#ffffff" stroke="#b54f1f" stroke-width="4"/>
  <path d="M490 55v78a78 78 0 0 1-78-78z" fill="#ffffff" stroke="#b54f1f" stroke-width="4"/>
  <path d="M490 315h-78a78 78 0 0 1 78-78z" fill="#ffffff" stroke="#b54f1f" stroke-width="4"/>
  <path d="M230 315v-78a78 78 0 0 1 78 78z" fill="#ffffff" stroke="#b54f1f" stroke-width="4"/>
  <text x="360" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">12 cm</text>
  <text x="207" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d" transform="rotate(-90 207 188)">12 cm</text>
  <text x="360" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#4b7f25">shaded area left</text>
  <text x="360" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">four quarter circles = one whole circle</text>
</svg>
