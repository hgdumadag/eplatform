<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Diameter is not radius warning</title>
  <desc id="desc">A warning diagram showing that diameter should not be used directly as radius.</desc>
  <rect width="760" height="340" rx="20" fill="#fef2f2"/>
  <path d="M110 260L230 60l120 200z" fill="#fee2e2" stroke="#ef4444" stroke-width="7" stroke-linejoin="round"/>
  <text x="214" y="205" text-anchor="middle" fill="#991b1b" font-family="Arial, sans-serif" font-size="88" font-weight="700">!</text>
  <g font-family="Arial, sans-serif">
    <text x="400" y="100" fill="#991b1b" font-size="32" font-weight="700">Do not use d as r</text>
    <text x="400" y="155" fill="#1f2937" font-size="25">If d = 8, then r = 4.</text>
    <text x="400" y="205" fill="#1f2937" font-size="25">Correct: A = 3.14(4^2)</text>
    <text x="400" y="255" fill="#1f2937" font-size="25">Incorrect: A = 3.14(8^2)</text>
  </g>
</svg>
