<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="title desc">
  <title id="title">Error analysis board</title>
  <desc id="desc">A classroom board showing a student's incorrect circle area work and the correction.</desc>
  <rect width="780" height="420" rx="20" fill="#eef2ff"/>
  <rect x="60" y="50" width="660" height="300" rx="16" fill="#1f2937" stroke="#475569" stroke-width="6"/>
  <g font-family="Arial, sans-serif">
    <text x="100" y="105" fill="#f8fafc" font-size="27" font-weight="700">Error Analysis</text>
    <text x="100" y="160" fill="#fecaca" font-size="24">Given: diameter = 14 ft</text>
    <text x="100" y="205" fill="#fecaca" font-size="24">Mistake: A = 3.14(14^2)</text>
    <line x1="98" y1="214" x2="398" y2="174" stroke="#ef4444" stroke-width="5"/>
    <text x="100" y="270" fill="#bbf7d0" font-size="24">Fix: r = 14 / 2 = 7</text>
    <text x="100" y="315" fill="#bbf7d0" font-size="24">A = 3.14(7^2) = 153.86</text>
    <circle cx="600" cy="205" r="70" fill="#dbeafe" stroke="#60a5fa" stroke-width="5"/>
    <line x1="530" y1="205" x2="670" y2="205" stroke="#ef4444" stroke-width="5"/>
    <line x1="600" y1="205" x2="670" y2="205" stroke="#22c55e" stroke-width="5"/>
    <text x="546" y="190" fill="#f8fafc" font-size="18">d</text>
    <text x="630" y="190" fill="#f8fafc" font-size="18">r</text>
  </g>
</svg>
