<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
  <title id="title">Area formula flow</title>
  <desc id="desc">A three-step flow from diameter to radius to circle area formula.</desc>
  <rect width="820" height="360" rx="20" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif">
    <rect x="40" y="100" width="200" height="130" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="81" y="147" fill="#0c4a6e" font-size="24" font-weight="700">Given</text>
    <text x="80" y="185" fill="#0c4a6e" font-size="30">diameter</text>
    <text x="103" y="215" fill="#0c4a6e" font-size="22">d = 12</text>
    <rect x="310" y="100" width="200" height="130" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="363" y="147" fill="#14532d" font-size="24" font-weight="700">Find</text>
    <text x="353" y="185" fill="#14532d" font-size="30">radius</text>
    <text x="361" y="215" fill="#14532d" font-size="22">r = d / 2</text>
    <rect x="580" y="100" width="200" height="130" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="636" y="147" fill="#92400e" font-size="24" font-weight="700">Use</text>
    <text x="613" y="185" fill="#92400e" font-size="30">A = pi r^2</text>
    <text x="621" y="215" fill="#92400e" font-size="22">not pi d^2</text>
  </g>
  <path d="M250 165h50" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <path d="M288 148l20 17-20 17" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M520 165h50" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <path d="M558 148l20 17-20 17" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="191" y="288" fill="#1f2937" font-family="Arial, sans-serif" font-size="24" font-weight="700">Area starts only after radius is known.</text>
</svg>
