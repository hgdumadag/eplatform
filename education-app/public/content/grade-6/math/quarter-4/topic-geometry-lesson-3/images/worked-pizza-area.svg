<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Pizza diameter and radius example</title>
  <desc id="desc">A round pizza with 12 inch diameter and 6 inch radius labeled.</desc>
  <rect width="720" height="380" rx="20" fill="#fff7ed"/>
  <circle cx="250" cy="190" r="125" fill="#facc15" stroke="#b45309" stroke-width="8"/>
  <circle cx="210" cy="150" r="12" fill="#dc2626"/>
  <circle cx="278" cy="125" r="11" fill="#dc2626"/>
  <circle cx="310" cy="205" r="13" fill="#dc2626"/>
  <circle cx="185" cy="230" r="10" fill="#dc2626"/>
  <path d="M250 190L250 65M250 190L360 250M250 190L140 250" stroke="#f59e0b" stroke-width="4"/>
  <line x1="125" y1="190" x2="375" y2="190" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
  <line x1="250" y1="190" x2="375" y2="190" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="250" cy="190" r="7" fill="#111827"/>
  <text x="176" y="176" fill="#991b1b" font-family="Arial, sans-serif" font-size="24" font-weight="700">12 in diameter</text>
  <text x="276" y="224" fill="#14532d" font-family="Arial, sans-serif" font-size="24" font-weight="700">6 in radius</text>
  <g font-family="Arial, sans-serif" fill="#1f2937">
    <text x="470" y="128" font-size="28" font-weight="700">Worked setup</text>
    <text x="470" y="176" font-size="24">r = 12 / 2 = 6</text>
    <text x="470" y="220" font-size="24">A = 3.14(6^2)</text>
    <text x="470" y="264" font-size="24">A = 113.04 sq in</text>
  </g>
</svg>
