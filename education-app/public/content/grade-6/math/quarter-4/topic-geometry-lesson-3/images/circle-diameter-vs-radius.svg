<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Diameter and radius of a circle</title>
  <desc id="desc">A blue circle showing a full-width diameter and a half-width radius from center to edge.</desc>
  <rect width="720" height="360" rx="20" fill="#f6fbff"/>
  <circle cx="260" cy="180" r="110" fill="#dff3ff" stroke="#2563eb" stroke-width="5"/>
  <line x1="150" y1="180" x2="370" y2="180" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <line x1="260" y1="180" x2="350" y2="120" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="260" cy="180" r="8" fill="#111827"/>
  <text x="210" y="164" fill="#b91c1c" font-family="Arial, sans-serif" font-size="24" font-weight="700">diameter</text>
  <text x="318" y="112" fill="#166534" font-family="Arial, sans-serif" font-size="24" font-weight="700">radius</text>
  <path d="M470 110h150M470 180h150" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <text x="470" y="96" fill="#1f2937" font-family="Arial, sans-serif" font-size="24" font-weight="700">Key idea</text>
  <text x="470" y="145" fill="#1f2937" font-family="Arial, sans-serif" font-size="22">d = 2r</text>
  <text x="470" y="215" fill="#1f2937" font-family="Arial, sans-serif" font-size="22">r = d / 2</text>
</svg>
