<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Circle cut into equal sectors</title>
  <desc id="desc">A circle divided into wedge-shaped sectors like pizza slices.</desc>
  <rect width="720" height="360" fill="#f7fafc"/>
  <g transform="translate(225 180)">
    <circle r="122" fill="#fff" stroke="#24313f" stroke-width="4"/>
    <path d="M0 0 L0 -122 A122 122 0 0 1 86.27 -86.27 Z" fill="#8bd3dd"/>
    <path d="M0 0 L86.27 -86.27 A122 122 0 0 1 122 0 Z" fill="#f6c177"/>
    <path d="M0 0 L122 0 A122 122 0 0 1 86.27 86.27 Z" fill="#8bd3dd"/>
    <path d="M0 0 L86.27 86.27 A122 122 0 0 1 0 122 Z" fill="#f6c177"/>
    <path d="M0 0 L0 122 A122 122 0 0 1 -86.27 86.27 Z" fill="#8bd3dd"/>
    <path d="M0 0 L-86.27 86.27 A122 122 0 0 1 -122 0 Z" fill="#f6c177"/>
    <path d="M0 0 L-122 0 A122 122 0 0 1 -86.27 -86.27 Z" fill="#8bd3dd"/>
    <path d="M0 0 L-86.27 -86.27 A122 122 0 0 1 0 -122 Z" fill="#f6c177"/>
    <g stroke="#24313f" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="-122"/>
      <line x1="0" y1="0" x2="86.27" y2="-86.27"/>
      <line x1="0" y1="0" x2="122" y2="0"/>
      <line x1="0" y1="0" x2="86.27" y2="86.27"/>
      <line x1="0" y1="0" x2="0" y2="122"/>
      <line x1="0" y1="0" x2="-86.27" y2="86.27"/>
      <line x1="0" y1="0" x2="-122" y2="0"/>
      <line x1="0" y1="0" x2="-86.27" y2="-86.27"/>
    </g>
    <circle r="5" fill="#24313f"/>
  </g>
  <text x="430" y="124" font-family="Arial" font-size="24" font-weight="700" fill="#24313f">Cut into equal sectors</text>
  <text x="430" y="166" font-family="Arial" font-size="19" fill="#24313f">Each sector holds part of</text>
  <text x="430" y="194" font-family="Arial" font-size="19" fill="#24313f">the original circle area.</text>
  <text x="430" y="240" font-family="Arial" font-size="19" font-weight="700" fill="#087f8c">No area is lost.</text>
</svg>
