<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Formula decision map</title>
  <desc id="desc">A decision chart connecting problem clues to area, circumference, and perimeter formulas.</desc>
  <rect width="900" height="520" fill="#fffdfa"/>
  <text x="450" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Which Formula Fits?</text>
  <g font-family="Arial, sans-serif" font-size="21">
    <rect x="80" y="115" width="210" height="110" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="185" y="154" text-anchor="middle" font-weight="700" fill="#064e3b">Inside Space</text>
    <text x="185" y="188" text-anchor="middle" fill="#064e3b">cover, paint, fill</text>
    <rect x="345" y="115" width="210" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="450" y="154" text-anchor="middle" font-weight="700" fill="#1e3a8a">Circular Edge</text>
    <text x="450" y="188" text-anchor="middle" fill="#1e3a8a">around, border</text>
    <rect x="610" y="115" width="210" height="110" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="715" y="154" text-anchor="middle" font-weight="700" fill="#7c2d12">Straight Edge</text>
    <text x="715" y="188" text-anchor="middle" fill="#7c2d12">side lengths</text>
    <path d="M185 225v55M450 225v55M715 225v55" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="80" y="295" width="210" height="140" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="3"/>
    <text x="185" y="334" text-anchor="middle" font-weight="700" fill="#064e3b">Area</text>
    <text x="185" y="370" text-anchor="middle" fill="#064e3b">A = lw</text>
    <text x="185" y="402" text-anchor="middle" fill="#064e3b">A = πr²</text>
    <rect x="345" y="295" width="210" height="140" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="450" y="334" text-anchor="middle" font-weight="700" fill="#1e3a8a">Circumference</text>
    <text x="450" y="370" text-anchor="middle" fill="#1e3a8a">C = 2πr</text>
    <text x="450" y="402" text-anchor="middle" fill="#1e3a8a">C = πd</text>
    <rect x="610" y="295" width="210" height="140" rx="12" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
    <text x="715" y="334" text-anchor="middle" font-weight="700" fill="#7c2d12">Perimeter</text>
    <text x="715" y="370" text-anchor="middle" fill="#7c2d12">add outside</text>
    <text x="715" y="402" text-anchor="middle" fill="#7c2d12">straight sides</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
