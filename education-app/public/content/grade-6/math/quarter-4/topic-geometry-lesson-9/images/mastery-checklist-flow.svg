<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Mastery checklist flow</title>
  <desc id="desc">A checklist for deciding measurement type, choosing formulas, solving, justifying, and checking units.</desc>
  <rect width="900" height="520" fill="#f9fafb"/>
  <text x="450" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Mastery Flow</text>
  <g font-family="Arial, sans-serif" font-size="22">
    <rect x="145" y="110" width="610" height="62" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="190" y="150" fill="#1e3a8a" font-weight="700">1</text>
    <text x="450" y="150" text-anchor="middle" fill="#1e3a8a">Name the measurement: area or distance around</text>
    <rect x="145" y="190" width="610" height="62" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="190" y="230" fill="#14532d" font-weight="700">2</text>
    <text x="450" y="230" text-anchor="middle" fill="#14532d">Choose formulas before substituting numbers</text>
    <rect x="145" y="270" width="610" height="62" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="190" y="310" fill="#7c2d12" font-weight="700">3</text>
    <text x="450" y="310" text-anchor="middle" fill="#7c2d12">Solve one part at a time</text>
    <rect x="145" y="350" width="610" height="62" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
    <text x="190" y="390" fill="#831843" font-weight="700">4</text>
    <text x="450" y="390" text-anchor="middle" fill="#831843">Justify formulas and check units</text>
  </g>
</svg>
