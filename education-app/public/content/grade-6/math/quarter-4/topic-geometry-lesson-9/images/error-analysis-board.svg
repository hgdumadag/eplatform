<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Error analysis board</title>
  <desc id="desc">Three common errors: using area for border, using circumference for cover, and counting shared sides.</desc>
  <rect width="900" height="520" fill="#fff7ed"/>
  <text x="450" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#7c2d12">Spot the Formula Error</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="120" width="230" height="285" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="4"/>
    <text x="185" y="165" text-anchor="middle" font-size="24" font-weight="700" fill="#991b1b">Border?</text>
    <circle cx="185" cy="235" r="48" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <text x="185" y="330" text-anchor="middle" font-size="20" fill="#991b1b">Use C, not A</text>
    <rect x="335" y="120" width="230" height="285" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
    <text x="450" y="165" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a8a">Cover?</text>
    <circle cx="450" cy="235" r="48" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/>
    <text x="450" y="330" text-anchor="middle" font-size="20" fill="#1e3a8a">Use A, not C</text>
    <rect x="600" y="120" width="230" height="285" rx="14" fill="#ffffff" stroke="#059669" stroke-width="4"/>
    <text x="715" y="165" text-anchor="middle" font-size="24" font-weight="700" fill="#064e3b">Shared side?</text>
    <rect x="665" y="200" width="95" height="90" fill="#dcfce7" stroke="#059669" stroke-width="4"/>
    <path d="M665 200 A45 45 0 0 0 665 290" fill="#dcfce7" stroke="#059669" stroke-width="4"/>
    <line x1="665" y1="200" x2="665" y2="290" stroke="#dc2626" stroke-width="5" stroke-dasharray="8 7"/>
    <text x="715" y="330" text-anchor="middle" font-size="20" fill="#064e3b">Do not count inside</text>
  </g>
</svg>
