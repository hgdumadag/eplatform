<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Circular garden bed with radius 4 meters</title>
  <desc id="desc">A circular garden bed model labeled with radius 4 meters from center to edge.</desc>
  <rect width="640" height="320" fill="#f8fafc"/>
  <text x="320" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Circular Garden Bed</text>
  <circle cx="320" cy="170" r="92" fill="#bbf7d0" stroke="#166534" stroke-width="4"/>
  <circle cx="320" cy="170" r="6" fill="#166534"/>
  <line x1="320" y1="170" x2="412" y2="170" stroke="#166534" stroke-width="4"/>
  <text x="352" y="157" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#14532d">r = 4 m</text>
  <path d="M228 170 A92 92 0 0 1 412 170" fill="none" stroke="#65a30d" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="320" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#374151">Area covered by mulch: A = 3.14(4²)</text>
</svg>
