<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="title desc">
  <title id="title">Circle design modeling checklist</title>
  <desc id="desc">A checklist showing sketch, label, choose formula, calculate, and explain.</desc>
  <rect width="680" height="300" fill="#f8fafc"/>
  <text x="340" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Model First Checklist</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#1f2937">
    <rect x="70" y="70" width="540" height="42" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="92" y="97">1. Sketch the circular design.</text>
    <rect x="70" y="118" width="540" height="42" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="92" y="145">2. Label radius, diameter, and units.</text>
    <rect x="70" y="166" width="540" height="42" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="92" y="193">3. Choose whole circle, semicircle, or ring.</text>
    <rect x="70" y="214" width="540" height="42" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="92" y="241">4. Calculate and explain what the area means.</text>
  </g>
  <g fill="none" stroke="#111827" stroke-width="3">
    <path d="M540 86 l10 10 l22 -24"/>
    <path d="M540 134 l10 10 l22 -24"/>
    <path d="M540 182 l10 10 l22 -24"/>
    <path d="M540 230 l10 10 l22 -24"/>
  </g>
</svg>
