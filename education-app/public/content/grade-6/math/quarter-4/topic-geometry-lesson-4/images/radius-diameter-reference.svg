<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Radius and diameter of a semicircle</title>
  <desc id="desc">A semicircle with the radius from center to arc and the diameter across the flat side.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <path d="M150 260 A210 210 0 0 1 570 260 Z" fill="#dcfce7" stroke="#15803d" stroke-width="5"/>
  <line x1="150" y1="260" x2="570" y2="260" stroke="#14532d" stroke-width="5"/>
  <circle cx="360" cy="260" r="7" fill="#14532d"/>
  <line x1="360" y1="260" x2="500" y2="103" stroke="#dc2626" stroke-width="5"/>
  <line x1="150" y1="292" x2="570" y2="292" stroke="#2563eb" stroke-width="5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="432" y="169" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">radius</text>
  <text x="360" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">diameter = 2 x radius</text>
  <text x="360" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#14532d">center</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
