<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Two semicircles forming one full circle</title>
  <desc id="desc">A top semicircle and a bottom semicircle combine to show that a semicircle is half of a full circle.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <circle cx="230" cy="180" r="105" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <path d="M125 180 A105 105 0 0 1 335 180 Z" fill="#60a5fa" stroke="#1d4ed8" stroke-width="4"/>
  <path d="M125 180 A105 105 0 0 0 335 180 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="125" y1="180" x2="335" y2="180" stroke="#0f172a" stroke-width="4"/>
  <text x="230" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">1 full circle</text>
  <text x="230" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">top half</text>
  <text x="230" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">bottom half</text>
  <path d="M390 180 H455" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M520 250 A105 105 0 0 1 520 40 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="4" transform="rotate(90 520 145)"/>
  <line x1="415" y1="250" x2="625" y2="250" stroke="#0f172a" stroke-width="4"/>
  <text x="520" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">1 semicircle = half</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
