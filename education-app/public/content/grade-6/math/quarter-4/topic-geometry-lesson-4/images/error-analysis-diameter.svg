<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Diameter error analysis</title>
  <desc id="desc">A wrong solution squares diameter 12, while the correct solution first converts to radius 6.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <rect x="50" y="55" width="285" height="245" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
  <text x="75" y="95" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">Common error</text>
  <text x="75" y="140" font-family="Arial, sans-serif" font-size="22" fill="#0f172a">A = (1/2)(3.14)(12^2)</text>
  <text x="75" y="180" font-family="Arial, sans-serif" font-size="22" fill="#0f172a">A = 226.08</text>
  <line x1="75" y1="205" x2="295" y2="205" stroke="#dc2626" stroke-width="5"/>
  <text x="75" y="245" font-family="Arial, sans-serif" font-size="20" fill="#991b1b">12 is the diameter,</text>
  <text x="75" y="275" font-family="Arial, sans-serif" font-size="20" fill="#991b1b">not the radius.</text>
  <rect x="385" y="55" width="285" height="245" rx="8" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/>
  <text x="410" y="95" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">Correct work</text>
  <text x="410" y="135" font-family="Arial, sans-serif" font-size="22" fill="#0f172a">r = 12 / 2 = 6</text>
  <text x="410" y="175" font-family="Arial, sans-serif" font-size="22" fill="#0f172a">A = (1/2)(3.14)(6^2)</text>
  <text x="410" y="215" font-family="Arial, sans-serif" font-size="22" fill="#0f172a">A = 56.52</text>
  <text x="410" y="260" font-family="Arial, sans-serif" font-size="20" fill="#166534">Use radius in the formula.</text>
  <path d="M342 178 H377" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
