<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Semicircle area formula breakdown</title>
  <desc id="desc">The full circle formula pi times radius squared is divided by 2 for a semicircle.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <rect x="58" y="55" width="260" height="210" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
  <circle cx="188" cy="160" r="72" fill="#c7d2fe" stroke="#4338ca" stroke-width="4"/>
  <line x1="188" y1="160" x2="260" y2="160" stroke="#be123c" stroke-width="4"/>
  <text x="224" y="148" font-family="Arial, sans-serif" font-size="18" fill="#9f1239">r</text>
  <text x="188" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#312e81">Full circle</text>
  <text x="188" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#312e81">A = pi r^2</text>
  <path d="M340 165 H400" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="430" y="55" width="235" height="210" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <path d="M475 205 A72 72 0 0 1 619 205 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="4"/>
  <line x1="475" y1="205" x2="619" y2="205" stroke="#14532d" stroke-width="4"/>
  <line x1="547" y1="205" x2="619" y2="205" stroke="#be123c" stroke-width="4"/>
  <text x="583" y="193" font-family="Arial, sans-serif" font-size="18" fill="#9f1239">r</text>
  <text x="548" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d">Semicircle</text>
  <text x="548" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#14532d">A = (1/2) pi r^2</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
