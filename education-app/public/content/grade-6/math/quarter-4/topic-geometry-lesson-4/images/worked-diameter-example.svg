<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Worked diameter example</title>
  <desc id="desc">A semicircle with diameter 10 inches converted to radius 5 inches before calculating area.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <path d="M70 235 A150 150 0 0 1 370 235 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
  <line x1="70" y1="235" x2="370" y2="235" stroke="#7c2d12" stroke-width="5"/>
  <circle cx="220" cy="235" r="6" fill="#7c2d12"/>
  <line x1="70" y1="270" x2="370" y2="270" stroke="#2563eb" stroke-width="5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="220" y1="235" x2="370" y2="235" stroke="#16a34a" stroke-width="5"/>
  <text x="220" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">diameter = 10 in</text>
  <text x="295" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">r = 5 in</text>
  <rect x="430" y="62" width="240" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="455" y="105" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">First: r = d / 2</text>
  <text x="455" y="145" font-family="Arial, sans-serif" font-size="21" fill="#0f172a">r = 10 / 2 = 5</text>
  <text x="455" y="185" font-family="Arial, sans-serif" font-size="21" fill="#0f172a">A = (1/2)(3.14)(5^2)</text>
  <text x="455" y="225" font-family="Arial, sans-serif" font-size="21" fill="#0f172a">A = 39.25 sq in</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
