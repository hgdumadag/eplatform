<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Triangle joined with a circle</title>
  <desc id="desc">A composite badge made of a triangle and a circle, with a dashed line showing the split.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="42" y="50" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2937">Separate first, then add</text>
  <circle cx="290" cy="230" r="70" fill="#fde68a" stroke="#b45309" stroke-width="4"/>
  <polygon points="360,300 520,300 360,120" fill="#bbf7d0" stroke="#15803d" stroke-width="4"/>
  <line x1="360" y1="120" x2="360" y2="300" stroke="#111827" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="218" y="322" font-family="Arial, sans-serif" font-size="17" fill="#92400e">circle: r = 7 cm</text>
  <text x="395" y="322" font-family="Arial, sans-serif" font-size="17" fill="#15803d">triangle: b = 16 cm, h = 18 cm</text>
  <text x="72" y="130" font-family="Arial, sans-serif" font-size="18" fill="#111827">No overlap in the plan:</text>
  <text x="72" y="160" font-family="Arial, sans-serif" font-size="16" fill="#374151">circle area + triangle area</text>
</svg>
