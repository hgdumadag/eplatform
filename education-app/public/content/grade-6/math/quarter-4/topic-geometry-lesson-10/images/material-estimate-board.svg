<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Material estimate board</title>
  <desc id="desc">Board showing area divided by coverage for boxes and boundary length divided by strip length for trim.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <rect x="54" y="50" width="612" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="92" y="96" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Material Estimates</text>
  <rect x="90" y="130" width="238" height="150" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <rect x="392" y="130" width="238" height="150" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="124" y="170" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Floor surface</text>
  <text x="116" y="210" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="20">area ÷ coverage</text>
  <text x="142" y="246" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="20">round up</text>
  <text x="428" y="170" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Border trim</text>
  <text x="420" y="210" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="20">boundary ÷ strip</text>
  <text x="448" y="246" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="20">round up</text>
  <path d="M344 202h30" stroke="#64748b" stroke-width="4"/>
  <path d="M364 190l14 12-14 12" fill="none" stroke="#64748b" stroke-width="4"/>
  <text x="168" y="326" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Use square units for area and linear units for edges.</text>
</svg>
