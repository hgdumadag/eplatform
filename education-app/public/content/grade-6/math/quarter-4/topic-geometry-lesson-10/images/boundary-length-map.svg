<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Boundary length map</title>
  <desc id="desc">Composite floor plan with outside edges highlighted and shared inside diameter crossed out.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <path d="M160 122h300a88 88 0 0 1 0 176H160z" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <path d="M160 122h300a88 88 0 0 1 0 176H160z" fill="none" stroke="#16a34a" stroke-width="9" stroke-linejoin="round"/>
  <line x1="460" y1="122" x2="460" y2="298" stroke="#dc2626" stroke-width="5" stroke-dasharray="10 9"/>
  <line x1="442" y1="192" x2="478" y2="228" stroke="#dc2626" stroke-width="5"/>
  <line x1="478" y1="192" x2="442" y2="228" stroke="#dc2626" stroke-width="5"/>
  <text x="72" y="70" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Boundary Length</text>
  <text x="86" y="352" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Add outside edges only</text>
  <text x="420" y="352" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Skip shared inside edge</text>
  <text x="218" y="110" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="18">straight side</text>
  <text x="526" y="218" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="18">arc</text>
</svg>
