<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc">
  <title id="title">Circular medallion plan</title>
  <desc id="desc">A circle with radius 4 meters used for area and circumference calculations.</desc>
  <rect width="640" height="380" fill="#ffffff"/>
  <circle cx="310" cy="185" r="128" fill="#dbeafe" stroke="#1d4ed8" stroke-width="5"/>
  <circle cx="310" cy="185" r="6" fill="#1d4ed8"/>
  <line x1="310" y1="185" x2="438" y2="185" stroke="#b45309" stroke-width="5"/>
  <path d="M186 95a158 158 0 0 1 248 0" fill="none" stroke="#15803d" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="338" y="168" fill="#92400e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">r = 4 m</text>
  <text x="138" y="48" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Circular Medallion</text>
  <text x="120" y="335" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="20">Area: A = pi r²</text>
  <text x="350" y="335" fill="#15803d" font-family="Arial, Helvetica, sans-serif" font-size="20">Boundary: C = 2 pi r</text>
</svg>
