<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Performance task mastery flow</title>
  <desc id="desc">Flow from sketch to area to boundary to materials to explanation.</desc>
  <rect width="760" height="260" fill="#ffffff"/>
  <text x="42" y="44" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Performance Task Flow</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
    <rect x="42" y="86" width="120" height="74" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="72" y="130" fill="#1d4ed8">Sketch</text>
    <rect x="190" y="86" width="120" height="74" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="226" y="130" fill="#166534">Area</text>
    <rect x="338" y="86" width="120" height="74" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="362" y="130" fill="#92400e">Boundary</text>
    <rect x="486" y="86" width="120" height="74" rx="8" fill="#ffe4e6" stroke="#be123c" stroke-width="3"/>
    <text x="508" y="130" fill="#9f1239">Materials</text>
    <rect x="634" y="86" width="86" height="74" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="652" y="130" fill="#5b21b6">Explain</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none">
    <path d="M164 123h22"/>
    <path d="M312 123h22"/>
    <path d="M460 123h22"/>
    <path d="M608 123h22"/>
  </g>
  <g fill="#64748b">
    <path d="M184 113l12 10-12 10z"/>
    <path d="M332 113l12 10-12 10z"/>
    <path d="M480 113l12 10-12 10z"/>
    <path d="M628 113l12 10-12 10z"/>
  </g>
  <text x="96" y="210" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="20">Label units at each step and check whether the answer should be rounded.</text>
</svg>
