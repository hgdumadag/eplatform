<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Composite hall pattern</title>
  <desc id="desc">A rectangle measuring 12 by 6 meters with a semicircle attached to one short side.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <path d="M150 130h330a90 90 0 0 1 0 180H150z" fill="#e0f2fe" stroke="#0369a1" stroke-width="5"/>
  <line x1="480" y1="130" x2="480" y2="310" stroke="#0f172a" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="150" y1="330" x2="480" y2="330" stroke="#475569" stroke-width="3"/>
  <line x1="130" y1="130" x2="130" y2="310" stroke="#475569" stroke-width="3"/>
  <line x1="480" y1="220" x2="570" y2="220" stroke="#b45309" stroke-width="4"/>
  <text x="288" y="358" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">12 m</text>
  <text x="86" y="225" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">6 m</text>
  <text x="506" y="206" fill="#92400e" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">r = 3 m</text>
  <text x="140" y="70" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Rectangle + Semicircle</text>
  <text x="184" y="222" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">rectangle</text>
  <text x="502" y="292" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">semicircle</text>
</svg>
