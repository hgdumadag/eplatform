<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Circular track circumference example</title>
  <desc id="desc">A circular track with diameter labeled 20 meters.</desc>
  <rect width="720" height="360" fill="#fbfdff"/>
  <circle cx="260" cy="180" r="112" fill="#ffffff" stroke="#217a52" stroke-width="18"/>
  <circle cx="260" cy="180" r="76" fill="#e9f8f0" stroke="#a7d8bb" stroke-width="2"/>
  <line x1="148" y1="180" x2="372" y2="180" stroke="#b83232" stroke-width="5"/>
  <circle cx="148" cy="180" r="6" fill="#b83232"/>
  <circle cx="372" cy="180" r="6" fill="#b83232"/>
  <text x="260" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">d = 20 m</text>
  <rect x="450" y="105" width="210" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="555" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#217a52">One lap</text>
  <text x="555" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">C = πd</text>
  <text x="555" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172033">3.14 x 20</text>
  <text x="555" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">62.8 m</text>
</svg>
