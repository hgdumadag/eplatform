<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Circumference versus area</title>
  <desc id="desc">Two circles compare boundary distance and inside space.</desc>
  <rect width="720" height="360" fill="#fbfdff"/>
  <circle cx="190" cy="160" r="95" fill="#ffffff" stroke="#217a52" stroke-width="10"/>
  <path d="M95 160a95 95 0 0 1 190 0" fill="none" stroke="#9a6700" stroke-width="9" stroke-linecap="round"/>
  <text x="190" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Circumference</text>
  <text x="190" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5b667a">distance around</text>
  <circle cx="530" cy="160" r="95" fill="#dff0ff" stroke="#1f6fb2" stroke-width="5"/>
  <text x="530" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">inside</text>
  <text x="530" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Area</text>
  <text x="530" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5b667a">space covered</text>
</svg>
