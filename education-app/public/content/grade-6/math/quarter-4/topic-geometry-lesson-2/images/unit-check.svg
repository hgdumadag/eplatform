<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Unit check for circle area</title>
  <desc id="desc">Radius uses units and area uses square units.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <rect x="86" y="74" width="236" height="190" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <rect x="398" y="74" width="236" height="190" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <line x1="142" y1="182" x2="266" y2="182" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <text x="144" y="146" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Radius</text>
  <text x="150" y="224" font-family="Arial, sans-serif" font-size="24" fill="#2563eb">8 cm</text>
  <rect x="470" y="136" width="92" height="92" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="462" y="114" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Area</text>
  <text x="448" y="262" font-family="Arial, sans-serif" font-size="24" fill="#16a34a">cm^2</text>
  <text x="92" y="318" font-family="Arial, sans-serif" font-size="22" fill="#334155">Lengths use units. Area uses square units.</text>
</svg>
