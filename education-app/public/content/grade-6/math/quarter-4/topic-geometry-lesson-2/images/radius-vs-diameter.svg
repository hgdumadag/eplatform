<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Radius compared with diameter</title>
  <desc id="desc">A circle showing radius from center to edge and diameter all the way across.</desc>
  <rect width="720" height="360" fill="#fffdf7"/>
  <circle cx="270" cy="180" r="112" fill="#fef3c7" stroke="#b7791f" stroke-width="6"/>
  <line x1="158" y1="180" x2="382" y2="180" stroke="#7c2d12" stroke-width="5" stroke-linecap="round"/>
  <line x1="270" y1="180" x2="270" y2="68" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <circle cx="270" cy="180" r="6" fill="#172033"/>
  <text x="398" y="185" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7c2d12">diameter</text>
  <text x="292" y="92" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2563eb">radius</text>
  <text x="92" y="320" font-family="Arial, sans-serif" font-size="22" fill="#334155">Radius: center to edge</text>
  <text x="390" y="320" font-family="Arial, sans-serif" font-size="22" fill="#334155">Diameter: edge to edge through center</text>
</svg>
