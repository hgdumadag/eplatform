<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Missing units error analysis</title>
  <desc id="desc">A comparison of an incomplete answer with only a number and a complete volume answer with cubic units.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#123047">Error: missing units and context</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="145" width="300" height="180" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/>
    <text x="240" y="210" font-size="30" font-weight="700" fill="#7f1d1d">2400</text>
    <text x="240" y="255" font-size="20" fill="#7f1d1d">Incomplete</text>
    <path d="M135 160l210 150M345 160L135 310" stroke="#b91c1c" stroke-width="7"/>
    <rect x="510" y="145" width="330" height="180" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
    <text x="675" y="205" font-size="24" font-weight="700" fill="#14532d">The toy box has a volume of</text>
    <text x="675" y="250" font-size="32" font-weight="700" fill="#14532d">2400 cm³.</text>
    <text x="675" y="292" font-size="20" fill="#14532d">Complete</text>
    <text x="450" y="430" font-size="26" font-weight="700" fill="#0f766e">A word problem answer needs units and a sentence.</text>
  </g>
</svg>
