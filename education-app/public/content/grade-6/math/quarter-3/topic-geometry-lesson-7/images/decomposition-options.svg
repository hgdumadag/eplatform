<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="title desc">
  <title id="title">Composite area decomposition options</title>
  <desc id="desc">Three examples show decomposition by adding two rectangles, subtracting a missing rectangle, and adding a rectangle and triangle.</desc>
  <rect width="780" height="360" fill="#ffffff"/>
  <text x="130" y="35" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Add rectangles</text>
  <path d="M55 75h170v70h70v125H55z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="55" y1="145" x2="225" y2="145" stroke="#7c2d12" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="390" y="35" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Subtract cut-out</text>
  <rect x="310" y="75" width="170" height="195" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
  <rect x="405" y="75" width="75" height="75" fill="#ffffff" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="650" y="35" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Rectangle + triangle</text>
  <polygon points="555,105 675,105 730,220 555,220" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <line x1="675" y1="105" x2="675" y2="220" stroke="#7c2d12" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="390" y="325" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Choose a split that makes known shapes and no overlap.</text>
</svg>
