<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">Stair-step perimeter example</title>
  <desc id="desc">A stair-step composite figure labeled with outside side lengths 12, 4, 5, 3, 7, and 7 centimeters.</desc>
  <rect width="760" height="380" fill="#ffffff"/>
  <polygon points="180,90 500,90 500,190 365,190 365,270 180,270" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/>
  <polyline points="180,90 500,90 500,190 365,190 365,270 180,270 180,90" fill="none" stroke="#0f172a" stroke-width="3"/>
  <text x="340" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">12 cm</text>
  <text x="528" y="145" font-family="Arial, sans-serif" font-size="22" font-weight="700">4 cm</text>
  <text x="432" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">5 cm</text>
  <text x="342" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" transform="rotate(-90 342 238)">3 cm</text>
  <text x="273" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">7 cm</text>
  <text x="152" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" transform="rotate(-90 152 180)">7 cm</text>
  <text x="380" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#0369a1">P = 12 + 4 + 5 + 3 + 7 + 7 = 38 cm</text>
</svg>
