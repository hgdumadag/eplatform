<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="title desc">
  <title id="title">Composite perimeter routine</title>
  <desc id="desc">A five-step routine: trace, list, find, add, answer.</desc>
  <rect width="820" height="260" fill="#ffffff"/>
  <text x="410" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Composite Perimeter Routine</text>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <rect x="35" y="85" width="130" height="105" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <text x="100" y="122" font-weight="700">1. Trace</text>
    <text x="100" y="152">outside</text>
    <text x="100" y="176">boundary</text>
    <rect x="190" y="85" width="130" height="105" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
    <text x="255" y="122" font-weight="700">2. List</text>
    <text x="255" y="152">outer side</text>
    <text x="255" y="176">lengths</text>
    <rect x="345" y="85" width="130" height="105" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="410" y="122" font-weight="700">3. Find</text>
    <text x="410" y="152">missing</text>
    <text x="410" y="176">sides</text>
    <rect x="500" y="85" width="130" height="105" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="565" y="122" font-weight="700">4. Add</text>
    <text x="565" y="152">outside</text>
    <text x="565" y="176">sides</text>
    <rect x="655" y="85" width="130" height="105" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="720" y="122" font-weight="700">5. Answer</text>
    <text x="720" y="152">linear</text>
    <text x="720" y="176">units</text>
  </g>
  <g stroke="#475569" stroke-width="3" fill="none">
    <path d="M168 138 H187"/>
    <path d="M323 138 H342"/>
    <path d="M478 138 H497"/>
    <path d="M633 138 H652"/>
  </g>
</svg>
