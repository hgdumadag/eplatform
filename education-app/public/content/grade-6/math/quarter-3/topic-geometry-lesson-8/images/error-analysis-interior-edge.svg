<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">Interior edge error analysis</title>
  <desc id="desc">A composite figure with one dashed interior edge incorrectly counted in a perimeter sum.</desc>
  <rect width="760" height="380" fill="#ffffff"/>
  <polygon points="170,85 470,85 470,165 350,165 350,285 170,285" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
  <polyline points="170,85 470,85 470,165 350,165 350,285 170,285 170,85" fill="none" stroke="#0f172a" stroke-width="3"/>
  <line x1="350" y1="85" x2="350" y2="165" stroke="#7c2d12" stroke-width="5" stroke-dasharray="12 8"/>
  <text x="320" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700">10 cm</text>
  <text x="495" y="130" font-family="Arial, sans-serif" font-size="21" font-weight="700">4 cm</text>
  <text x="410" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700">6 cm</text>
  <text x="326" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" transform="rotate(-90 326 230)">5 cm</text>
  <text x="260" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700">4 cm</text>
  <text x="142" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" transform="rotate(-90 142 185)">9 cm</text>
  <text x="390" y="125" font-family="Arial, sans-serif" font-size="20" fill="#7c2d12">inside 5 cm</text>
  <text x="565" y="130" font-family="Arial, sans-serif" font-size="20" fill="#dc2626">Mistake:</text>
  <text x="565" y="158" font-family="Arial, sans-serif" font-size="20" fill="#dc2626">adding the</text>
  <text x="565" y="186" font-family="Arial, sans-serif" font-size="20" fill="#dc2626">dashed side</text>
  <text x="380" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#166534">Correct: add outside sides only</text>
</svg>
