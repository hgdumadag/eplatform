<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Poster area conversion example</title>
  <desc id="desc">A poster labeled zero point seven five square meters converting to seven thousand five hundred square centimeters.</desc>
  <rect width="720" height="320" fill="#ffffff"/>
  <rect x="95" y="55" width="230" height="170" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <text x="210" y="145" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#7c2d12">0.75 m²</text>
  <path d="M350 140h115" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="408" y="115" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">× 10000</text>
  <rect x="490" y="80" width="170" height="120" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <text x="575" y="148" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1e3a8a">7500 cm²</text>
  <text x="360" y="275" text-anchor="middle" font-family="Arial" font-size="21">m² to cm² means multiply by 10000.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
</svg>
