<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Linear conversion versus area conversion</title>
  <desc id="desc">A line shows one meter equals one hundred centimeters. A square shows one square meter equals one hundred centimeters times one hundred centimeters.</desc>
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="190" y="42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Length</text>
  <line x1="70" y1="105" x2="310" y2="105" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <path d="M70 82v46M310 82v46" stroke="#1e40af" stroke-width="4"/>
  <text x="190" y="86" text-anchor="middle" font-family="Arial" font-size="20">1 m</text>
  <text x="190" y="142" text-anchor="middle" font-family="Arial" font-size="20">100 cm</text>
  <text x="190" y="205" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">factor: 100</text>
  <text x="570" y="42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Area</text>
  <rect x="465" y="78" width="210" height="160" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
  <text x="570" y="67" text-anchor="middle" font-family="Arial" font-size="19">100 cm</text>
  <text x="447" y="160" text-anchor="middle" transform="rotate(-90 447 160)" font-family="Arial" font-size="19">100 cm</text>
  <text x="570" y="165" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#14532d">1 m²</text>
  <text x="570" y="285" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">factor: 100 × 100 = 10000</text>
</svg>
