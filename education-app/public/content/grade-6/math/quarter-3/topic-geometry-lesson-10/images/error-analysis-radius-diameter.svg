<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Radius and diameter error analysis</title>
  <desc id="desc">A circle with radius 5 centimeters shows an incorrect setup using radius as diameter and the corrected setup.</desc>
  <rect width="760" height="420" fill="#ffffff"/>
  <circle cx="210" cy="190" r="100" fill="#fee2e2" stroke="#b91c1c" stroke-width="5"/>
  <line x1="210" y1="190" x2="310" y2="190" stroke="#15803d" stroke-width="6"/>
  <circle cx="210" cy="190" r="5" fill="#111827"/>
  <text x="260" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">r = 5 cm</text>
  <rect x="380" y="80" width="300" height="110" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="530" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">Incorrect</text>
  <text x="530" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#991b1b">C = 3.14 x 5</text>
  <text x="530" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#991b1b">radius used as diameter</text>
  <rect x="380" y="230" width="300" height="110" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="530" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">Correct</text>
  <text x="530" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#166534">C = 2 x 3.14 x 5</text>
  <text x="530" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#166534">or C = 3.14 x 10</text>
  <text x="380" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">Always check whether the problem gives radius or diameter.</text>
</svg>
