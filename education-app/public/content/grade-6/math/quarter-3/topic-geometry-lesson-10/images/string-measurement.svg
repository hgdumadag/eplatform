<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Measuring circumference with string</title>
  <desc id="desc">A string wraps around a circle, then is straightened along a ruler to show circumference measurement.</desc>
  <rect width="760" height="420" fill="#ffffff"/>
  <circle cx="230" cy="185" r="105" fill="#ecfeff" stroke="#0891b2" stroke-width="5"/>
  <circle cx="230" cy="185" r="112" fill="none" stroke="#f97316" stroke-width="6" stroke-dasharray="18 10"/>
  <path d="M370 185 C455 105 525 115 570 170" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <line x1="430" y1="300" x2="690" y2="300" stroke="#1f2937" stroke-width="4"/>
  <g stroke="#1f2937" stroke-width="2">
    <line x1="430" y1="286" x2="430" y2="314"/>
    <line x1="482" y1="290" x2="482" y2="310"/>
    <line x1="534" y1="286" x2="534" y2="314"/>
    <line x1="586" y1="290" x2="586" y2="310"/>
    <line x1="638" y1="286" x2="638" y2="314"/>
    <line x1="690" y1="286" x2="690" y2="314"/>
  </g>
  <line x1="430" y1="262" x2="650" y2="262" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <text x="230" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0e7490">Wrap string around the circle</text>
  <text x="560" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9a3412">Straighten it to measure C</text>
  <text x="390" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#334155">circumference is distance around</text>
</svg>
