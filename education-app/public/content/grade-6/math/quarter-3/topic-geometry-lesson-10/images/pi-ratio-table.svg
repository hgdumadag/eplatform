<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Pi ratio table</title>
  <desc id="desc">A table shows circumference divided by diameter is close to 3.14 for several circles.</desc>
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="380" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Circumference divided by diameter</text>
  <rect x="100" y="92" width="560" height="250" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="22" fill="#111827">
    <rect x="100" y="92" width="560" height="50" fill="#dbeafe"/>
    <text x="170" y="125" font-weight="700">Object</text>
    <text x="315" y="125" font-weight="700">C</text>
    <text x="430" y="125" font-weight="700">d</text>
    <text x="550" y="125" font-weight="700">C ÷ d</text>
    <line x1="100" y1="142" x2="660" y2="142" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="260" y1="92" x2="260" y2="342" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="380" y1="92" x2="380" y2="342" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="500" y1="92" x2="500" y2="342" stroke="#cbd5e1" stroke-width="2"/>
    <text x="160" y="182">coin</text><text x="300" y="182">7.85</text><text x="420" y="182">2.5</text><text x="540" y="182">3.14</text>
    <text x="160" y="232">lid</text><text x="300" y="232">31.4</text><text x="420" y="232">10</text><text x="540" y="232">3.14</text>
    <text x="160" y="282">plate</text><text x="300" y="282">62.8</text><text x="420" y="282">20</text><text x="540" y="282">3.14</text>
    <text x="160" y="322">wheel</text><text x="300" y="322">94.2</text><text x="420" y="322">30</text><text x="540" y="322">3.14</text>
  </g>
  <text x="380" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#166534">The ratio stays close to pi.</text>
</svg>
