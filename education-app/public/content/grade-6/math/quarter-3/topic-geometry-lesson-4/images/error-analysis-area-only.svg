<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Base area only error analysis</title>
  <desc id="desc">A comparison showing the incorrect base area only calculation and the correct full prism volume calculation.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#123047">Error: stopping at base area</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="120" width="300" height="250" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/>
    <text x="220" y="165" font-size="24" font-weight="700" fill="#7f1d1d">Only one layer</text>
    <rect x="125" y="205" width="180" height="90" fill="#fecaca" stroke="#b91c1c" stroke-width="4"/>
    <text x="220" y="410" font-size="24" font-weight="700" fill="#b91c1c">8 × 3 = 24 cm²</text>
    <path d="M120 130l205 225M325 130L120 355" stroke="#b91c1c" stroke-width="7"/>
    <rect x="530" y="120" width="300" height="250" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
    <text x="680" y="165" font-size="24" font-weight="700" fill="#14532d">All layers</text>
    <g transform="translate(590 205)" stroke="#166534" stroke-width="3" stroke-linejoin="round">
      <polygon points="0,45 150,45 200,85 50,85" fill="#bbf7d0"/>
      <polygon points="0,45 50,85 50,170 0,130" fill="#86efac"/>
      <polygon points="50,85 200,85 200,170 50,170" fill="#dcfce7"/>
    </g>
    <text x="680" y="410" font-size="24" font-weight="700" fill="#166534">8 × 3 × 5 = 120 cm³</text>
  </g>
</svg>
