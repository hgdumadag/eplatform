<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Square area versus cube volume error</title>
  <desc id="desc">A comparison showing that five squared gives face area while five cubed gives cube volume.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#123047">Do not stop at the square face</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="120" width="300" height="250" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/>
    <text x="220" y="165" font-size="24" font-weight="700" fill="#7f1d1d">Face area only</text>
    <rect x="150" y="200" width="120" height="120" fill="#fecaca" stroke="#b91c1c" stroke-width="4"/>
    <text x="220" y="410" font-size="24" font-weight="700" fill="#b91c1c">5² = 25 cm²</text>
    <path d="M120 130l205 225M325 130L120 355" stroke="#b91c1c" stroke-width="7"/>
    <rect x="530" y="120" width="300" height="250" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
    <text x="680" y="165" font-size="24" font-weight="700" fill="#14532d">Whole cube volume</text>
    <g transform="translate(605 205)" stroke="#166534" stroke-width="3" stroke-linejoin="round">
      <polygon points="0,35 110,35 145,70 35,70" fill="#bbf7d0"/>
      <polygon points="0,35 35,70 35,180 0,145" fill="#86efac"/>
      <polygon points="35,70 145,70 145,180 35,180" fill="#dcfce7"/>
    </g>
    <text x="680" y="410" font-size="24" font-weight="700" fill="#166534">5³ = 125 cm³</text>
  </g>
</svg>
