<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">One unit cube</title>
  <desc id="desc">A single cube labeled one cubic unit.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#123047">A unit cube measures volume</text>
  <g transform="translate(240 100)" stroke="#1e40af" stroke-width="4" stroke-linejoin="round">
    <polygon points="70,30 210,30 260,80 120,80" fill="#bfdbfe"/>
    <polygon points="70,30 120,80 120,220 70,170" fill="#93c5fd"/>
    <polygon points="120,80 260,80 260,220 120,220" fill="#dbeafe"/>
  </g>
  <text x="360" y="365" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#0f766e">1 cubic unit</text>
</svg>
