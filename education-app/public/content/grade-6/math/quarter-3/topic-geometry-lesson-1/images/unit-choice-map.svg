<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Unit choice decision map</title>
  <desc id="desc">A flowchart for choosing between cubic units for volume and liquid units for capacity.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#123047">How do I choose a unit?</text>
  <g font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
    <rect x="300" y="88" width="300" height="72" rx="8" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <text x="450" y="117" font-weight="700" fill="#0f172a">What are you measuring?</text>
    <text x="450" y="145" fill="#475569">Look at the object and question.</text>
    <path d="M450 160v54" stroke="#334155" stroke-width="3"/>
    <path d="M450 214H220v48M450 214h230v48" stroke="#334155" stroke-width="3" fill="none"/>
    <rect x="70" y="262" width="300" height="86" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
    <text x="220" y="294" font-weight="700" fill="#1e3a8a">3D solid space</text>
    <text x="220" y="324" fill="#1e3a8a">Use cm³ or m³</text>
    <rect x="530" y="262" width="300" height="86" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
    <text x="680" y="294" font-weight="700" fill="#14532d">Liquid a container holds</text>
    <text x="680" y="324" fill="#14532d">Use mL or L</text>
    <path d="M220 348v48M680 348v48" stroke="#334155" stroke-width="3"/>
    <rect x="70" y="396" width="300" height="68" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="220" y="424" fill="#0f172a">Box, cube, room</text>
    <text x="220" y="448" fill="#64748b">volume units</text>
    <rect x="530" y="396" width="300" height="68" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="680" y="424" fill="#0f172a">Cup, bottle, tank</text>
    <text x="680" y="448" fill="#64748b">capacity units</text>
  </g>
</svg>
