<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-labelledby="title desc">
  <title id="title">Unit mix-up error analysis</title>
  <desc id="desc">A shoebox diagram showing that square centimeters are wrong for volume and cubic centimeters are correct.</desc>
  <rect width="820" height="460" fill="#f8fafc"/>
  <text x="38" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#123047">Error: area unit used for volume</text>
  <g transform="translate(140 120)" stroke="#334155" stroke-width="3" stroke-linejoin="round">
    <polygon points="0,65 280,65 360,125 80,125" fill="#fed7aa"/>
    <polygon points="0,65 80,125 80,250 0,180" fill="#fdba74"/>
    <polygon points="80,125 360,125 360,250 80,250" fill="#ffedd5"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="28" font-weight="700">
    <text x="535" y="190" fill="#b91c1c">cm²</text>
    <path d="M526 164l75 42M601 164l-75 42" stroke="#b91c1c" stroke-width="6"/>
    <text x="535" y="282" fill="#0f766e">cm³</text>
    <path d="M520 275l22 22 64-76" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="128" y="398" font-family="Arial, sans-serif" font-size="22" fill="#0f172a">A shoebox is 3D, so its volume needs cubic units.</text>
</svg>
