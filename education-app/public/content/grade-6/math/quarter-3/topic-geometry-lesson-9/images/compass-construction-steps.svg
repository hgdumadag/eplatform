<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Compass construction steps</title>
  <desc id="desc">Three panels showing mark the center, set the compass radius, and rotate to draw the circle.</desc>
  <rect width="900" height="360" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="30" y="42" font-size="26" font-weight="700" fill="#0f172a">Draw a circle with a compass</text>
    <g transform="translate(35 75)">
      <rect width="250" height="235" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="20" y="35" font-size="20" font-weight="700">1. Mark center</text>
      <circle cx="125" cy="125" r="7" fill="#111827"/>
      <text x="137" y="132" font-size="20">O</text>
      <line x1="125" y1="125" x2="125" y2="125" stroke="#111827"/>
    </g>
    <g transform="translate(325 75)">
      <rect width="250" height="235" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="20" y="35" font-size="20" font-weight="700">2. Set radius</text>
      <line x1="70" y1="170" x2="190" y2="170" stroke="#64748b" stroke-width="5"/>
      <line x1="70" y1="170" x2="132" y2="80" stroke="#2563eb" stroke-width="5"/>
      <line x1="190" y1="170" x2="132" y2="80" stroke="#2563eb" stroke-width="5"/>
      <circle cx="132" cy="80" r="8" fill="#1d4ed8"/>
      <text x="82" y="203" font-size="18">opening = radius</text>
    </g>
    <g transform="translate(615 75)">
      <rect width="250" height="235" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="20" y="35" font-size="20" font-weight="700">3. Rotate</text>
      <circle cx="125" cy="132" r="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
      <circle cx="125" cy="132" r="6" fill="#111827"/>
      <line x1="125" y1="132" x2="197" y2="132" stroke="#16a34a" stroke-width="4"/>
      <path d="M197 132 A72 72 0 0 0 155 67" fill="none" stroke="#f59e0b" stroke-width="5"/>
      <path d="M155 67 l20 4 l-12 16 z" fill="#f59e0b"/>
      <text x="80" y="224" font-size="18">fixed center</text>
    </g>
  </g>
</svg>
