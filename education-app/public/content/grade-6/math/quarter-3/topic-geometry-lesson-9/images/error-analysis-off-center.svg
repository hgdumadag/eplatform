<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
  <title id="title">Off-center diameter error analysis</title>
  <desc id="desc">A circle with an off-center segment incorrectly labeled as diameter and a correct diameter through the center.</desc>
  <rect width="820" height="430" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="35" y="44" font-size="27" font-weight="700" fill="#0f172a">Error analysis: Is this a diameter?</text>
    <circle cx="405" cy="225" r="135" fill="#fff7ed" stroke="#ea580c" stroke-width="5"/>
    <circle cx="405" cy="225" r="7" fill="#111827"/>
    <text x="418" y="232" font-size="22" font-weight="700">O</text>
    <line x1="291" y1="152" x2="519" y2="152" stroke="#dc2626" stroke-width="6"/>
    <circle cx="291" cy="152" r="6" fill="#dc2626"/>
    <circle cx="519" cy="152" r="6" fill="#dc2626"/>
    <text x="270" y="145" font-size="22" font-weight="700">A</text>
    <text x="529" y="145" font-size="22" font-weight="700">B</text>
    <text x="300" y="126" font-size="21" font-weight="700" fill="#991b1b">incorrect: not a diameter</text>
    <line x1="270" y1="225" x2="540" y2="225" stroke="#16a34a" stroke-width="5" stroke-dasharray="10 8"/>
    <text x="286" y="262" font-size="21" font-weight="700" fill="#166534">correct path passes through O</text>
    <rect x="42" y="314" width="735" height="62" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="64" y="352" font-size="22" font-weight="700" fill="#991b1b">Mistake: the red segment has endpoints on the circle, but it misses the center.</text>
  </g>
</svg>
