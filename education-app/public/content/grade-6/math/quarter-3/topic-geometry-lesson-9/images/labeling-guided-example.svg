<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc">
  <title id="title">Guided circle labeling example</title>
  <desc id="desc">A labeled circle with center O, radius OA, diameter BC, and a pointer to circumference.</desc>
  <rect width="820" height="450" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="35" y="45" font-size="28" font-weight="700" fill="#0f172a">Labeling example</text>
    <circle cx="390" cy="230" r="135" fill="#f8fafc" stroke="#2563eb" stroke-width="5"/>
    <line x1="255" y1="230" x2="525" y2="230" stroke="#dc2626" stroke-width="5"/>
    <line x1="390" y1="230" x2="476" y2="126" stroke="#16a34a" stroke-width="5"/>
    <circle cx="390" cy="230" r="7" fill="#111827"/>
    <circle cx="476" cy="126" r="6" fill="#16a34a"/>
    <circle cx="255" cy="230" r="6" fill="#dc2626"/>
    <circle cx="525" cy="230" r="6" fill="#dc2626"/>
    <text x="405" y="255" font-size="22" font-weight="700">O</text>
    <text x="486" y="120" font-size="22" font-weight="700">A</text>
    <text x="235" y="223" font-size="22" font-weight="700">B</text>
    <text x="535" y="223" font-size="22" font-weight="700">C</text>
    <rect x="52" y="92" width="172" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="68" y="123" font-size="21" font-weight="700">O = center</text>
    <line x1="224" y1="116" x2="383" y2="224" stroke="#0284c7" stroke-width="3"/>
    <rect x="580" y="94" width="190" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="596" y="125" font-size="21" font-weight="700">OA = radius</text>
    <line x1="580" y1="118" x2="467" y2="139" stroke="#16a34a" stroke-width="3"/>
    <rect x="60" y="320" width="205" height="48" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="77" y="351" font-size="21" font-weight="700">BC = diameter</text>
    <line x1="265" y1="344" x2="300" y2="232" stroke="#dc2626" stroke-width="3"/>
    <rect x="520" y="322" width="240" height="48" rx="8" fill="#f3e8ff" stroke="#7c3aed"/>
    <text x="537" y="353" font-size="21" font-weight="700">edge = circumference</text>
    <line x1="520" y1="346" x2="504" y2="310" stroke="#7c3aed" stroke-width="3"/>
  </g>
</svg>
