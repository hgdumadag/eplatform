<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc">
  <title id="title">Circle parts identification practice</title>
  <desc id="desc">A circle diagram with labeled points O, P, R, S and a circumference pointer.</desc>
  <rect width="820" height="450" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="35" y="45" font-size="28" font-weight="700" fill="#0f172a">Identify the circle parts</text>
    <circle cx="405" cy="230" r="135" fill="#eef2ff" stroke="#4f46e5" stroke-width="5"/>
    <line x1="405" y1="230" x2="498" y2="132" stroke="#16a34a" stroke-width="5"/>
    <line x1="270" y1="230" x2="540" y2="230" stroke="#dc2626" stroke-width="5"/>
    <circle cx="405" cy="230" r="7" fill="#111827"/>
    <circle cx="498" cy="132" r="6" fill="#16a34a"/>
    <circle cx="270" cy="230" r="6" fill="#dc2626"/>
    <circle cx="540" cy="230" r="6" fill="#dc2626"/>
    <text x="418" y="255" font-size="23" font-weight="700">O</text>
    <text x="509" y="126" font-size="23" font-weight="700">P</text>
    <text x="249" y="222" font-size="23" font-weight="700">R</text>
    <text x="550" y="222" font-size="23" font-weight="700">S</text>
    <path d="M524 107 C586 149 601 238 562 306" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="9 7"/>
    <path d="M562 306 l-17 -12 l22 -10 z" fill="#7c3aed"/>
    <text x="590" y="332" font-size="22" font-weight="700" fill="#5b21b6">boundary</text>
    <rect x="55" y="345" width="345" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="75" y="378" font-size="21">Use O, OP, RS, and the boundary.</text>
  </g>
</svg>
