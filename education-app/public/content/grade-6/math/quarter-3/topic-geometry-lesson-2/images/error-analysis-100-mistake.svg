<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Error using one hundred instead of one thousand</title>
  <desc id="desc">A diagram showing that area uses ten times ten equals one hundred, but volume uses ten times ten times ten equals one thousand.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#123047">Mistake: using area thinking for volume</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="120" width="300" height="220" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/>
    <text x="220" y="165" font-size="24" font-weight="700" fill="#7f1d1d">Area thinking</text>
    <rect x="145" y="195" width="110" height="110" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/>
    <text x="220" y="374" font-size="24" font-weight="700" fill="#b91c1c">10 × 10 = 100</text>
    <path d="M135 126l170 205M305 126L135 331" stroke="#b91c1c" stroke-width="7"/>
    <rect x="530" y="120" width="300" height="220" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
    <text x="680" y="165" font-size="24" font-weight="700" fill="#14532d">Volume thinking</text>
    <g transform="translate(598 190)" stroke="#166534" stroke-width="3" stroke-linejoin="round">
      <polygon points="0,30 90,30 120,60 30,60" fill="#bbf7d0"/>
      <polygon points="0,30 30,60 30,150 0,120" fill="#86efac"/>
      <polygon points="30,60 120,60 120,150 30,150" fill="#dcfce7"/>
    </g>
    <text x="680" y="374" font-size="24" font-weight="700" fill="#166534">10 × 10 × 10 = 1000</text>
    <text x="450" y="450" font-size="28" font-weight="700" fill="#0f172a">Use 1000 for liters and cm³.</text>
  </g>
</svg>
