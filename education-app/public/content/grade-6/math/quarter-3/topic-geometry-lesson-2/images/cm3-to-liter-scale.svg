<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Cubic centimeters to liter scale</title>
  <desc id="desc">A balance scale showing that one thousand cubic centimeters equals one liter.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#123047">1000 cm³ balances with 1 L</text>
  <g transform="translate(140 110)" stroke="#334155" stroke-width="5" fill="none">
    <line x1="310" y1="70" x2="310" y2="285"/>
    <line x1="120" y1="110" x2="500" y2="110"/>
    <line x1="120" y1="110" x2="70" y2="230"/>
    <line x1="120" y1="110" x2="170" y2="230"/>
    <line x1="500" y1="110" x2="450" y2="230"/>
    <line x1="500" y1="110" x2="550" y2="230"/>
    <path d="M40 230h160c-14 52-146 52-160 0Z" fill="#dbeafe"/>
    <path d="M420 230h160c-14 52-146 52-160 0Z" fill="#dcfce7"/>
    <line x1="245" y1="285" x2="375" y2="285"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="260" y="288" font-size="25" font-weight="700" fill="#1e3a8a">1000 cm³</text>
    <text x="640" y="288" font-size="25" font-weight="700" fill="#166534">1 L</text>
    <text x="450" y="430" font-size="28" font-weight="700" fill="#0f766e">Equivalent measurements</text>
  </g>
</svg>
