<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Tank conversion example</title>
  <desc id="desc">A tank labeled six thousand cubic centimeters converting to six liters.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#123047">6000 cm³ converts to 6 L</text>
  <g transform="translate(120 130)" stroke="#1e40af" stroke-width="4">
    <rect x="0" y="70" width="320" height="180" rx="12" fill="#dbeafe"/>
    <path d="M10 150h300v90H10Z" fill="#60a5fa" opacity="0.75"/>
    <rect x="80" y="20" width="160" height="54" rx="16" fill="none"/>
    <text x="160" y="177" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1e3a8a">6000 cm³</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="520" y="228" font-size="42" font-weight="700" fill="#0f766e">÷ 1000</text>
    <path d="M455 260h150" stroke="#0f766e" stroke-width="6"/>
    <path d="M605 260l-24-15v30Z" fill="#0f766e"/>
    <rect x="650" y="166" width="150" height="110" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
    <text x="725" y="233" font-size="38" font-weight="700" fill="#14532d">6 L</text>
  </g>
</svg>
