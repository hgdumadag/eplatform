<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">One liter cube connection</title>
  <desc id="desc">A ten centimeter by ten centimeter by ten centimeter cube connected to a one liter container.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#123047">1 liter is the same amount as 1000 cm³</text>
  <g transform="translate(110 130)" stroke="#1e40af" stroke-width="4" stroke-linejoin="round">
    <polygon points="80,40 240,40 300,100 140,100" fill="#bfdbfe"/>
    <polygon points="80,40 140,100 140,260 80,200" fill="#93c5fd"/>
    <polygon points="140,100 300,100 300,260 140,260" fill="#dbeafe"/>
    <line x1="80" y1="200" x2="240" y2="200"/>
    <line x1="240" y1="40" x2="300" y2="100"/>
    <line x1="240" y1="40" x2="240" y2="200"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="196" y="430" font-size="24" font-weight="700">10 cm × 10 cm × 10 cm = 1000 cm³</text>
    <text x="440" y="245" font-size="54" font-weight="700" fill="#0f766e">=</text>
  </g>
  <g transform="translate(570 112)">
    <path d="M60 0h82v44c0 18 42 40 42 96v172c0 28-22 50-50 50H68c-28 0-50-22-50-50V140c0-56 42-78 42-96Z" fill="#dbeafe" stroke="#1e40af" stroke-width="4"/>
    <path d="M20 204h162v108c0 24-20 44-44 44H64c-24 0-44-20-44-44Z" fill="#60a5fa" opacity="0.75"/>
    <rect x="54" y="122" width="94" height="74" rx="6" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
    <text x="80" y="151" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">1 L</text>
    <text x="65" y="176" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">capacity</text>
  </g>
</svg>
