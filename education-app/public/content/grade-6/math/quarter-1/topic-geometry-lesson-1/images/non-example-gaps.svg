<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Repeated circles with gaps</title>
  <desc id="desc">A repeated circle pattern with empty curved spaces between the circles, showing a non-example of a tessellation.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#123047">Repeating circles leave gaps</text>
  <g transform="translate(70 88)">
    <rect width="560" height="280" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <g fill="#fde68a" stroke="#92400e" stroke-width="3">
      <circle cx="70" cy="70" r="50"/>
      <circle cx="180" cy="70" r="50"/>
      <circle cx="290" cy="70" r="50"/>
      <circle cx="400" cy="70" r="50"/>
      <circle cx="510" cy="70" r="50"/>
      <circle cx="125" cy="170" r="50"/>
      <circle cx="235" cy="170" r="50"/>
      <circle cx="345" cy="170" r="50"/>
      <circle cx="455" cy="170" r="50"/>
    </g>
    <g fill="#ef4444" font-family="Arial, sans-serif" font-size="18" font-weight="700">
      <text x="124" y="118">gap</text>
      <text x="234" y="118">gap</text>
      <text x="344" y="118">gap</text>
      <text x="454" y="118">gap</text>
    </g>
  </g>
  <text x="145" y="396" font-family="Arial, sans-serif" font-size="20" fill="#991b1b">Not a tessellation: the surface is not fully covered.</text>
</svg>
