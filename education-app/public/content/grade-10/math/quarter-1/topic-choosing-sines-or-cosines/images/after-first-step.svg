<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
  <title id="title">Either law after a first step</title>
  <desc id="desc">A diagram compares a SAS start using Law of Cosines and an AAS start using Law of Sines, then shows both paths can have enough information to continue with either law.</desc>
  <rect width="820" height="430" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#111827">
    <text x="410" y="42" text-anchor="middle" font-size="24" font-weight="700">After the First Step</text>
    <rect x="70" y="82" width="275" height="92" rx="8" fill="#fff4e6" stroke="#d97706" stroke-width="2"/>
    <text x="208" y="113" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">SAS start</text>
    <text x="208" y="140" text-anchor="middle" font-size="15">Use Law of Cosines</text>
    <text x="208" y="160" text-anchor="middle" font-size="15">to find the third side.</text>
    <rect x="475" y="82" width="275" height="92" rx="8" fill="#e8f3ff" stroke="#2563eb" stroke-width="2"/>
    <text x="613" y="113" text-anchor="middle" font-size="18" font-weight="700" fill="#1e40af">AAS or ASA start</text>
    <text x="613" y="140" text-anchor="middle" font-size="15">Use Law of Sines</text>
    <text x="613" y="160" text-anchor="middle" font-size="15">after finding the third angle.</text>
    <line x1="208" y1="174" x2="342" y2="250" stroke="#334155" stroke-width="2"/>
    <line x1="613" y1="174" x2="478" y2="250" stroke="#334155" stroke-width="2"/>
    <rect x="275" y="250" width="270" height="92" rx="8" fill="#edf7ed" stroke="#15803d" stroke-width="2"/>
    <text x="410" y="281" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">More parts are now known</text>
    <text x="410" y="309" text-anchor="middle" font-size="15">A complete pair may be available.</text>
    <text x="410" y="329" text-anchor="middle" font-size="15">Side lengths may also be available.</text>
    <line x1="345" y1="342" x2="250" y2="382" stroke="#334155" stroke-width="2"/>
    <line x1="475" y1="342" x2="570" y2="382" stroke="#334155" stroke-width="2"/>
    <rect x="110" y="370" width="280" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="250" y="397" text-anchor="middle" font-size="15" font-weight="700">Law of Sines can continue</text>
    <rect x="430" y="370" width="280" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="570" y="397" text-anchor="middle" font-size="15" font-weight="700">Law of Cosines can continue</text>
  </g>
</svg>
