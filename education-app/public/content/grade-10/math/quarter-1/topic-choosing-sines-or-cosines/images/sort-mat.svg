<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Sorting mat for trigonometry law choices</title>
  <desc id="desc">Three columns labeled Law of Sines first, Law of Cosines first, and Either after a first step. Case cards for AAS, ASA, SSA, SAS, and SSS are shown below.</desc>
  <rect width="760" height="420" fill="#f7fafc"/>
  <text x="380" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Sort the Case Cards</text>
  <g font-family="Arial, sans-serif">
    <rect x="42" y="78" width="205" height="210" rx="8" fill="#e8f3ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="277" y="78" width="205" height="210" rx="8" fill="#fff4e6" stroke="#d97706" stroke-width="2"/>
    <rect x="512" y="78" width="205" height="210" rx="8" fill="#edf7ed" stroke="#15803d" stroke-width="2"/>
    <text x="145" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#1e40af">Law of Sines</text>
    <text x="145" y="136" text-anchor="middle" font-size="16" fill="#1e40af">first</text>
    <text x="380" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">Law of Cosines</text>
    <text x="380" y="136" text-anchor="middle" font-size="16" fill="#92400e">first</text>
    <text x="615" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Either law</text>
    <text x="615" y="136" text-anchor="middle" font-size="16" fill="#166534">after a first step</text>
    <line x1="68" y1="160" x2="221" y2="160" stroke="#93c5fd" stroke-width="2"/>
    <line x1="303" y1="160" x2="456" y2="160" stroke="#fdba74" stroke-width="2"/>
    <line x1="538" y1="160" x2="691" y2="160" stroke="#86efac" stroke-width="2"/>
    <g font-size="19" font-weight="700" text-anchor="middle">
      <rect x="72" y="325" width="92" height="48" rx="6" fill="#ffffff" stroke="#475569"/>
      <text x="118" y="356" fill="#111827">AAS</text>
      <rect x="190" y="325" width="92" height="48" rx="6" fill="#ffffff" stroke="#475569"/>
      <text x="236" y="356" fill="#111827">ASA</text>
      <rect x="308" y="325" width="92" height="48" rx="6" fill="#ffffff" stroke="#475569"/>
      <text x="354" y="356" fill="#111827">SSA</text>
      <rect x="426" y="325" width="92" height="48" rx="6" fill="#ffffff" stroke="#475569"/>
      <text x="472" y="356" fill="#111827">SAS</text>
      <rect x="544" y="325" width="92" height="48" rx="6" fill="#ffffff" stroke="#475569"/>
      <text x="590" y="356" fill="#111827">SSS</text>
    </g>
  </g>
</svg>
