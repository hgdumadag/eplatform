<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Right and oblique triangle comparison</title>
<desc id="desc">Right triangle versus oblique triangle.</desc>
<rect width="720" height="420" fill="#f8fafc"/>
<rect x="18" y="18" width="684" height="384" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<polygon points="95,310 265,310 95,130" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><path d="M95 275 L130 275 L130 310" fill="none" stroke="#dc2626" stroke-width="4"/><text x="138" y="286" font-family="Arial, sans-serif" font-size="20" fill="#dc2626">90 deg</text><text x="108" y="350" font-family="Arial, sans-serif" font-size="24" fill="#0f172a">Right triangle</text><polygon points="430,310 625,310 505,115" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="450" y="295" font-family="Arial, sans-serif" font-size="18" fill="#16a34a">58 deg</text><text x="575" y="295" font-family="Arial, sans-serif" font-size="18" fill="#16a34a">49 deg</text><text x="496" y="145" font-family="Arial, sans-serif" font-size="18" fill="#16a34a">73 deg</text><text x="438" y="350" font-family="Arial, sans-serif" font-size="24" fill="#0f172a">Oblique triangle</text>
