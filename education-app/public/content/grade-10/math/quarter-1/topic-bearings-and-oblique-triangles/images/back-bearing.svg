<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Back bearing</title>
<desc id="desc">Reverse directions differ by 180 degrees.</desc>
<rect width="720" height="420" fill="#f8fafc"/>
<rect x="18" y="18" width="684" height="384" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<defs><marker id="arrow-130-260" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><line x1="130" y1="260" x2="560" y2="160" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-130-260)"/><defs><marker id="arrow-560-190" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker></defs><line x1="560" y1="190" x2="130" y2="290" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-560-190)"/><text x="190" y="215" font-family="Arial, sans-serif" font-size="24" fill="#2563eb">forward bearing</text><text x="280" y="320" font-family="Arial, sans-serif" font-size="23" fill="#dc2626">back bearing = forward + 180</text>
</svg>
