<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">SAS and SSS triangle cases</title>
  <desc id="desc">Two triangle diagrams show SAS with two known sides and the included angle, and SSS with all three sides known.</desc>
  <rect width="920" height="360" fill="#f8fafc"/>
  <g transform="translate(105 40)">
    <text x="130" y="0" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#14532d">SAS</text>
    <polygon points="45,245 315,245 128,70" fill="#ecfdf5" stroke="#16a34a" stroke-width="4"/>
    <line x1="45" y1="245" x2="128" y2="70" stroke="#ef4444" stroke-width="7"/>
    <line x1="128" y1="70" x2="315" y2="245" stroke="#ef4444" stroke-width="7"/>
    <path d="M121 99 A34 34 0 0 1 151 92" fill="none" stroke="#7c3aed" stroke-width="5"/>
    <text x="65" y="292" font-family="Arial, sans-serif" font-size="18" fill="#334155">two sides and included angle</text>
  </g>
  <g transform="translate(520 40)">
    <text x="130" y="0" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#78350f">SSS</text>
    <polygon points="45,245 315,245 128,70" fill="#fffbeb" stroke="#d97706" stroke-width="4"/>
    <line x1="45" y1="245" x2="128" y2="70" stroke="#ef4444" stroke-width="7"/>
    <line x1="128" y1="70" x2="315" y2="245" stroke="#ef4444" stroke-width="7"/>
    <line x1="45" y1="245" x2="315" y2="245" stroke="#ef4444" stroke-width="7"/>
    <text x="113" y="292" font-family="Arial, sans-serif" font-size="18" fill="#334155">all three sides</text>
  </g>
</svg>
