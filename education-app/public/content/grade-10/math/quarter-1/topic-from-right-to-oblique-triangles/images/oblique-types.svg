<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
  <title id="title">Acute and obtuse oblique triangles</title>
  <desc id="desc">Two oblique triangles are labeled. The acute triangle has all angles less than 90 degrees. The obtuse triangle has one angle greater than 90 degrees.</desc>
  <rect width="920" height="340" fill="#fffdf7"/>
  <text x="130" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Acute oblique</text>
  <text x="585" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Obtuse oblique</text>
  <polygon points="125,255 365,255 245,85" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
  <text x="158" y="282" font-family="Arial, sans-serif" font-size="18" fill="#334155">all angles &lt; 90 deg</text>
  <text x="128" y="244" font-family="Arial, sans-serif" font-size="17" fill="#075985">55 deg</text>
  <text x="321" y="244" font-family="Arial, sans-serif" font-size="17" fill="#075985">55 deg</text>
  <text x="228" y="116" font-family="Arial, sans-serif" font-size="17" fill="#075985">70 deg</text>
  <polygon points="545,255 835,255 645,95" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
  <text x="594" y="282" font-family="Arial, sans-serif" font-size="18" fill="#334155">one angle &gt; 90 deg</text>
  <text x="553" y="243" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">130 deg</text>
  <text x="800" y="243" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">22 deg</text>
  <text x="642" y="126" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">28 deg</text>
</svg>
