<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Right triangle compared with oblique triangle</title>
  <desc id="desc">A right triangle with a marked 90 degree angle is shown beside a non-right oblique triangle with no 90 degree angle.</desc>
  <rect width="920" height="360" fill="#f7fafc"/>
  <text x="150" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Right-triangle trig</text>
  <text x="575" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Oblique triangle</text>
  <line x1="460" y1="24" x2="460" y2="336" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="105,275 365,275 105,95" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <path d="M105 245 L135 245 L135 275" fill="none" stroke="#1d4ed8" stroke-width="4"/>
  <text x="148" y="296" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">base</text>
  <text x="84" y="188" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">height</text>
  <text x="132" y="238" font-family="Arial, sans-serif" font-size="17" fill="#1d4ed8">90 deg</text>
  <text x="120" y="325" font-family="Arial, sans-serif" font-size="19" fill="#334155">SOH-CAH-TOA can start here</text>
  <polygon points="548,270 807,250 688,88" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <circle cx="548" cy="270" r="6" fill="#16a34a"/>
  <circle cx="807" cy="250" r="6" fill="#16a34a"/>
  <circle cx="688" cy="88" r="6" fill="#16a34a"/>
  <text x="545" y="298" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">A</text>
  <text x="813" y="257" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">B</text>
  <text x="690" y="80" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">C</text>
  <text x="565" y="325" font-family="Arial, sans-serif" font-size="19" fill="#334155">No right angle: name the case first</text>
</svg>
