<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Map of common triangle given cases</title>
  <desc id="desc">A flow map asks what information is known and connects two angles and one side to ASA or AAS, two sides and one angle to SAS or SSA, and three sides to SSS.</desc>
  <rect width="920" height="420" fill="#f8fafc"/>
  <text x="260" y="44" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Name the given information first</text>
  <rect x="350" y="78" width="220" height="58" rx="8" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="382" y="114" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">What is known?</text>
  <line x1="460" y1="136" x2="170" y2="190" stroke="#64748b" stroke-width="3"/>
  <line x1="460" y1="136" x2="460" y2="190" stroke="#64748b" stroke-width="3"/>
  <line x1="460" y1="136" x2="750" y2="190" stroke="#64748b" stroke-width="3"/>
  <rect x="55" y="190" width="230" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="87" y="218" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Two angles + side</text>
  <text x="88" y="243" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">ASA or AAS</text>
  <rect x="345" y="190" width="230" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="374" y="218" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Two sides + angle</text>
  <text x="394" y="243" font-family="Arial, sans-serif" font-size="16" fill="#14532d">SAS or SSA</text>
  <rect x="635" y="190" width="230" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="680" y="218" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#78350f">Three sides</text>
  <text x="714" y="243" font-family="Arial, sans-serif" font-size="16" fill="#78350f">SSS</text>
  <rect x="48" y="310" width="112" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="83" y="345" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">ASA</text>
  <rect x="180" y="310" width="112" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="216" y="345" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">AAS</text>
  <rect x="338" y="310" width="112" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="374" y="345" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#14532d">SAS</text>
  <rect x="470" y="310" width="112" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="506" y="345" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#14532d">SSA</text>
  <rect x="694" y="310" width="112" height="56" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="730" y="345" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#78350f">SSS</text>
  <line x1="170" y1="260" x2="104" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="170" y1="260" x2="236" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="460" y1="260" x2="394" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="460" y1="260" x2="526" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="750" y1="260" x2="750" y2="310" stroke="#64748b" stroke-width="2"/>
</svg>
