<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Two leg route with local north lines</title>
  <desc id="desc">A route goes from A to B on bearing 070 degrees, then from B to C on bearing 145 degrees. Separate north lines are drawn at A and B, and AC completes the triangle.</desc>
  <rect width="800" height="520" fill="#f8fafc"/>
  <line x1="145" y1="375" x2="145" y2="135" stroke="#0f172a" stroke-width="3"/>
  <line x1="470" y1="260" x2="470" y2="60" stroke="#0f172a" stroke-width="3"/>
  <path d="M145 375 L470 260" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
  <path d="M470 260 L590 430" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
  <line x1="145" y1="375" x2="590" y2="430" stroke="#64748b" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M145 295 A80 80 0 0 1 220 347" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M470 190 A74 74 0 0 1 514 320" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <text x="126" y="400" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">A</text>
  <text x="462" y="252" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">B</text>
  <text x="601" y="448" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">C</text>
  <text x="132" y="120" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">N</text>
  <text x="457" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">N</text>
  <text x="215" y="285" font-family="Arial, sans-serif" font-size="21" fill="#166534">AB: 6 km, 070°</text>
  <text x="542" y="328" font-family="Arial, sans-serif" font-size="21" fill="#991b1b">BC: 4 km, 145°</text>
  <text x="330" y="450" font-family="Arial, sans-serif" font-size="21" fill="#475569">AC direct side</text>
  <text x="92" y="485" font-family="Arial, sans-serif" font-size="21" fill="#0f172a">The second bearing is measured from a new north line at B.</text>
</svg>
