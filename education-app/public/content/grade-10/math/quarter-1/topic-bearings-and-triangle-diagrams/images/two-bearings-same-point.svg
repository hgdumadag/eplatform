<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Two bearings from the same point</title>
  <desc id="desc">Point P has a north line. Segment PQ is on bearing 025 degrees and segment PR is on bearing 105 degrees, forming an 80 degree included angle at P.</desc>
  <rect width="760" height="500" fill="#f8fafc"/>
  <line x1="250" y1="390" x2="250" y2="80" stroke="#0f172a" stroke-width="3"/>
  <path d="M250 390 L330 175" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <path d="M250 390 L520 462" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <line x1="330" y1="175" x2="520" y2="462" stroke="#64748b" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M305 244 A155 155 0 0 1 400 430" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="237" y="410" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">P</text>
  <text x="320" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">Q</text>
  <text x="530" y="474" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">R</text>
  <text x="235" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">N</text>
  <text x="288" y="250" font-family="Arial, sans-serif" font-size="20" fill="#166534">025°</text>
  <text x="407" y="408" font-family="Arial, sans-serif" font-size="20" fill="#991b1b">105°</text>
  <text x="382" y="327" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2563eb">80°</text>
  <text x="96" y="455" font-family="Arial, sans-serif" font-size="21" fill="#0f172a">Both bearings start at P, so the included angle is at P.</text>
</svg>
