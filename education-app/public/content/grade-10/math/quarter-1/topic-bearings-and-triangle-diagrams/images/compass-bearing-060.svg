<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Bearing 060 degrees measured clockwise from north</title>
  <desc id="desc">A compass diagram with a vertical north line and a ray 60 degrees clockwise from north pointing northeast.</desc>
  <rect width="720" height="460" fill="#f8fafc"/>
  <circle cx="360" cy="235" r="150" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <line x1="360" y1="235" x2="360" y2="70" stroke="#0f172a" stroke-width="4"/>
  <line x1="360" y1="235" x2="503" y2="152" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <path d="M503 152 L483 151 L493 169 Z" fill="#dc2626"/>
  <path d="M360 110 A125 125 0 0 1 468 172" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="350" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">N</text>
  <text x="535" y="157" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#dc2626">Path</text>
  <text x="428" y="113" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2563eb">060°</text>
  <text x="325" y="255" font-family="Arial, sans-serif" font-size="20" fill="#475569">Start</text>
  <text x="80" y="410" font-family="Arial, sans-serif" font-size="22" fill="#0f172a">Start at north, then turn clockwise 60 degrees.</text>
</svg>
