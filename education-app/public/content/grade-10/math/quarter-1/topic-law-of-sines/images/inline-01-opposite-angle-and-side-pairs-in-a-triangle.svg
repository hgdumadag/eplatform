<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="opposite-pairs-title opposite-pairs-desc" style="max-width:100%;height:auto;border:1px solid #d9e2ec;border-radius:8px;background:#ffffff">
  <title id="opposite-pairs-title">Opposite angle and side pairs in a triangle</title>
  <desc id="opposite-pairs-desc">Angle A is opposite side a, angle B is opposite side b, and angle C is opposite side c.</desc>
