<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Plotting a point</title>
<desc id="desc">Move along x then y to plot a point.</desc>
<rect width="720" height="420" fill="#f8fafc"/>
<rect x="18" y="18" width="684" height="384" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<line x1="190" y1="70" x2="470" y2="70" stroke="#e2e8f0"/><line x1="190" y1="70" x2="190" y2="350" stroke="#e2e8f0"/><line x1="190" y1="105" x2="470" y2="105" stroke="#e2e8f0"/><line x1="225" y1="70" x2="225" y2="350" stroke="#e2e8f0"/><line x1="190" y1="140" x2="470" y2="140" stroke="#e2e8f0"/><line x1="260" y1="70" x2="260" y2="350" stroke="#e2e8f0"/><line x1="190" y1="175" x2="470" y2="175" stroke="#e2e8f0"/><line x1="295" y1="70" x2="295" y2="350" stroke="#e2e8f0"/><line x1="190" y1="210" x2="470" y2="210" stroke="#e2e8f0"/><line x1="330" y1="70" x2="330" y2="350" stroke="#e2e8f0"/><line x1="190" y1="245" x2="470" y2="245" stroke="#e2e8f0"/><line x1="365" y1="70" x2="365" y2="350" stroke="#e2e8f0"/><line x1="190" y1="280" x2="470" y2="280" stroke="#e2e8f0"/><line x1="400" y1="70" x2="400" y2="350" stroke="#e2e8f0"/><line x1="190" y1="315" x2="470" y2="315" stroke="#e2e8f0"/><line x1="435" y1="70" x2="435" y2="350" stroke="#e2e8f0"/><line x1="190" y1="350" x2="470" y2="350" stroke="#e2e8f0"/><line x1="470" y1="70" x2="470" y2="350" stroke="#e2e8f0"/><line x1="190" y1="210" x2="470" y2="210" stroke="#334155" stroke-width="2"/><line x1="330" y1="70" x2="330" y2="350" stroke="#334155" stroke-width="2"/><defs><marker id="arrow-330-210" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><line x1="330" y1="210" x2="435" y2="210" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-330-210)"/><defs><marker id="arrow-435-210" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker></defs><line x1="435" y1="210" x2="435" y2="105" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-435-210)"/><circle cx="435" cy="105" r="8" fill="#dc2626"/><text x="445" y="100" font-family="Arial, sans-serif" font-size="22" fill="#dc2626">P(3, 3)</text><text x="365" y="198" font-family="Arial, sans-serif" font-size="20" fill="#2563eb">x first</text><text x="445" y="155" font-family="Arial, sans-serif" font-size="20" fill="#dc2626">y second</text>
</svg>
