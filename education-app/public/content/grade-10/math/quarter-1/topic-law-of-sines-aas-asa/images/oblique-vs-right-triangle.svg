<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Right triangle and oblique triangle comparison</title>
  <desc id="desc">A right triangle has a marked ninety degree angle and a hypotenuse. An oblique triangle has no right angle, so the Law of Sines is used to connect angles and opposite sides.</desc>
  <rect width="760" height="300" fill="#f8fafc"/>
  <text x="170" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Right triangle</text>
  <text x="570" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Oblique triangle</text>
  <path d="M70 230 L290 230 L70 90 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="4" stroke-linejoin="round"/>
  <path d="M70 205 L95 205 L95 230" fill="none" stroke="#1e40af" stroke-width="3"/>
  <text x="180" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">leg</text>
  <text x="48" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">leg</text>
  <text x="195" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">hypotenuse</text>
  <text x="86" y="198" font-family="Arial, sans-serif" font-size="15" fill="#1e40af">90°</text>
  <path d="M450 230 L690 210 L520 75 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="4" stroke-linejoin="round"/>
  <text x="450" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#166534">A</text>
  <text x="690" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#166534">B</text>
  <text x="520" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#166534">C</text>
  <text x="570" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#166534">no 90° angle</text>
  <line x1="365" y1="35" x2="365" y2="270" stroke="#cbd5e1" stroke-width="2"/>
</svg>
