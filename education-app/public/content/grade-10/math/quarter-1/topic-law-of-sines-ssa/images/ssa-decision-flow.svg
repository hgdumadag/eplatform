<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">SSA decision flow</title>
  <desc id="desc">A flowchart for solving SSA cases with the Law of Sines, including checking impossible sine values and supplementary angles.</desc>
  <rect width="760" height="420" fill="#f7fee7"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="74" y="34" width="248" height="62" rx="8" fill="#ffffff" stroke="#65a30d" stroke-width="3"/>
  <text x="96" y="72" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">1. Compute sin B</text>
  <rect x="438" y="34" width="248" height="62" rx="8" fill="#ffffff" stroke="#65a30d" stroke-width="3"/>
  <text x="460" y="62" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">2. Is sin B &gt; 1?</text>
  <text x="460" y="84" font-family="Arial, sans-serif" font-size="15" fill="#475569">If yes, no triangle.</text>
  <rect x="438" y="150" width="248" height="62" rx="8" fill="#ffffff" stroke="#65a30d" stroke-width="3"/>
  <text x="460" y="178" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">3. Find B₁</text>
  <text x="460" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Use inverse sine.</text>
  <rect x="74" y="150" width="248" height="62" rx="8" fill="#ffffff" stroke="#65a30d" stroke-width="3"/>
  <text x="96" y="178" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">4. Check B₂</text>
  <text x="96" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">B₂ = 180° - B₁</text>
  <rect x="74" y="266" width="248" height="78" rx="8" fill="#ffffff" stroke="#65a30d" stroke-width="3"/>
  <text x="96" y="294" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">5. Test angle sums</text>
  <text x="96" y="318" font-family="Arial, sans-serif" font-size="15" fill="#475569">Keep each B only when</text>
  <text x="96" y="338" font-family="Arial, sans-serif" font-size="15" fill="#475569">A + B &lt; 180°.</text>
  <rect x="438" y="266" width="248" height="78" rx="8" fill="#ffffff" stroke="#65a30d" stroke-width="3"/>
  <text x="460" y="294" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">6. Count solutions</text>
  <text x="460" y="318" font-family="Arial, sans-serif" font-size="15" fill="#475569">One valid B means one triangle.</text>
  <text x="460" y="338" font-family="Arial, sans-serif" font-size="15" fill="#475569">Two valid B values means two.</text>
  <line x1="322" y1="65" x2="438" y2="65" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="562" y1="96" x2="562" y2="150" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="438" y1="181" x2="322" y2="181" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="198" y1="212" x2="198" y2="266" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="322" y1="305" x2="438" y2="305" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
