<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Law of Cosines labels for an SAS triangle</title>
  <desc id="desc">Triangle with sides a and b meeting at angle C. The missing side c is opposite angle C, matching the formula c squared equals a squared plus b squared minus 2ab cosine C.</desc>
  <rect width="760" height="430" fill="#fbf7ff"/>
  <path d="M165 330 L595 330 L390 95 Z" fill="#ffffff" stroke="#312e81" stroke-width="4" stroke-linejoin="round"/>
  <path d="M356 135 L390 95 L425 135" fill="none" stroke="#be123c" stroke-width="5" stroke-linecap="round"/>
  <circle cx="390" cy="95" r="7" fill="#312e81"/>
  <circle cx="165" cy="330" r="7" fill="#312e81"/>
  <circle cx="595" cy="330" r="7" fill="#312e81"/>
  <text x="382" y="75" font-family="Arial, sans-serif" font-size="25" fill="#312e81" font-weight="700">C</text>
  <text x="139" y="360" font-family="Arial, sans-serif" font-size="25" fill="#312e81" font-weight="700">A</text>
  <text x="606" y="360" font-family="Arial, sans-serif" font-size="25" fill="#312e81" font-weight="700">B</text>
  <text x="257" y="206" font-family="Arial, sans-serif" font-size="24" fill="#0f766e" transform="rotate(-47 257 206)">b</text>
  <text x="505" y="207" font-family="Arial, sans-serif" font-size="24" fill="#0f766e" transform="rotate(49 505 207)">a</text>
  <text x="365" y="364" font-family="Arial, sans-serif" font-size="24" fill="#7c2d12">c = ?</text>
  <text x="430" y="118" font-family="Arial, sans-serif" font-size="22" fill="#be123c">angle C</text>
  <rect x="95" y="35" width="230" height="92" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="116" y="70" font-family="Arial, sans-serif" font-size="18" fill="#155e75" font-weight="700">Use matching labels</text>
  <text x="116" y="99" font-family="Arial, sans-serif" font-size="18" fill="#155e75">Find c with cos C.</text>
  <rect x="472" y="35" width="215" height="82" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="491" y="68" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12" font-weight="700">Formula</text>
  <text x="491" y="97" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12">c^2 = a^2 + b^2 - 2ab cos C</text>
</svg>
