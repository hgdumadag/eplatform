<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">SAS information without an opposite side-angle pair</title>
  <desc id="desc">Triangle ABC shows sides AB and AC known, angle A included between them, and side BC unknown. The diagram highlights that no complete opposite side-angle pair is known for starting the Law of Sines.</desc>
  <rect width="760" height="430" fill="#f7fbff"/>
  <path d="M130 335 L520 335 L250 90 Z" fill="#fff8e7" stroke="#18324a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M171 335 A58 58 0 0 1 165 302" fill="none" stroke="#c2410c" stroke-width="5"/>
  <circle cx="130" cy="335" r="6" fill="#18324a"/>
  <circle cx="520" cy="335" r="6" fill="#18324a"/>
  <circle cx="250" cy="90" r="6" fill="#18324a"/>
  <text x="104" y="365" font-family="Arial, sans-serif" font-size="24" fill="#18324a" font-weight="700">A</text>
  <text x="531" y="365" font-family="Arial, sans-serif" font-size="24" fill="#18324a" font-weight="700">B</text>
  <text x="245" y="72" font-family="Arial, sans-serif" font-size="24" fill="#18324a" font-weight="700">C</text>
  <text x="300" y="366" font-family="Arial, sans-serif" font-size="22" fill="#0f766e">AB = 11</text>
  <text x="145" y="197" font-family="Arial, sans-serif" font-size="22" fill="#0f766e" transform="rotate(-61 145 197)">AC = 8</text>
  <text x="185" y="317" font-family="Arial, sans-serif" font-size="22" fill="#c2410c">included angle A</text>
  <text x="378" y="196" font-family="Arial, sans-serif" font-size="22" fill="#7c2d12" transform="rotate(42 378 196)">BC = ?</text>
  <rect x="552" y="72" width="160" height="118" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="572" y="108" font-family="Arial, sans-serif" font-size="20" fill="#0c4a6e" font-weight="700">SAS is known</text>
  <text x="572" y="140" font-family="Arial, sans-serif" font-size="17" fill="#0c4a6e">2 sides</text>
  <text x="572" y="166" font-family="Arial, sans-serif" font-size="17" fill="#0c4a6e">included angle</text>
  <rect x="552" y="224" width="160" height="96" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="572" y="258" font-family="Arial, sans-serif" font-size="18" fill="#7f1d1d" font-weight="700">Missing first:</text>
  <text x="572" y="286" font-family="Arial, sans-serif" font-size="17" fill="#7f1d1d">known opposite</text>
  <text x="572" y="310" font-family="Arial, sans-serif" font-size="17" fill="#7f1d1d">side-angle pair</text>
</svg>
