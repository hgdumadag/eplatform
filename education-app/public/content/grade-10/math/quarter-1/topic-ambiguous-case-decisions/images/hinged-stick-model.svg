<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Hinged-stick model for an SSA triangle</title>
  <desc id="desc">A fixed side from A to C and a swinging side of length a show two possible contact points on the base ray.</desc>
  <rect width="720" height="420" fill="#f7fbff"/>
  <line x1="95" y1="330" x2="650" y2="330" stroke="#243b53" stroke-width="5" stroke-linecap="round"/>
  <line x1="95" y1="330" x2="360" y2="120" stroke="#2f80ed" stroke-width="8" stroke-linecap="round"/>
  <line x1="360" y1="120" x2="245" y2="330" stroke="#f2994a" stroke-width="7" stroke-linecap="round"/>
  <line x1="360" y1="120" x2="520" y2="330" stroke="#f2994a" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 12"/>
  <path d="M145 330 A70 70 0 0 1 150 286" fill="none" stroke="#27ae60" stroke-width="4"/>
  <circle cx="95" cy="330" r="8" fill="#243b53"/>
  <circle cx="360" cy="120" r="8" fill="#2f80ed"/>
  <circle cx="245" cy="330" r="7" fill="#f2994a"/>
  <circle cx="520" cy="330" r="7" fill="#f2994a"/>
  <text x="82" y="360" font-family="Arial, sans-serif" font-size="24" fill="#17212b">A</text>
  <text x="365" y="105" font-family="Arial, sans-serif" font-size="24" fill="#17212b">C</text>
  <text x="226" y="365" font-family="Arial, sans-serif" font-size="22" fill="#17212b">B1</text>
  <text x="505" y="365" font-family="Arial, sans-serif" font-size="22" fill="#17212b">B2</text>
  <text x="216" y="203" font-family="Arial, sans-serif" font-size="24" fill="#0f5fb8">b fixed</text>
  <text x="392" y="246" font-family="Arial, sans-serif" font-size="24" fill="#a65613">a swings</text>
  <text x="150" y="306" font-family="Arial, sans-serif" font-size="22" fill="#1f7a3f">angle A</text>
  <text x="128" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17212b">One set of SSA data can land in two places</text>
</svg>
