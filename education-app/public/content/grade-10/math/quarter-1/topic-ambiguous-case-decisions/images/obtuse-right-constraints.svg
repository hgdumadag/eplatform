<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="title desc">
  <title id="title">Right and obtuse SSA constraints</title>
  <desc id="desc">A right or obtuse known angle requires side a opposite the angle to be longer than side b, otherwise no triangle is possible.</desc>
  <rect width="820" height="420" fill="#f7fff8"/>
  <text x="50" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17212b">Right or obtuse A: compare a and b</text>
  <g transform="translate(70,95)">
    <rect width="310" height="260" rx="6" fill="#ffffff" stroke="#badbcc" stroke-width="2"/>
    <text x="24" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f7a3f">a &gt; b</text>
    <text x="24" y="70" font-family="Arial, sans-serif" font-size="21" fill="#111827">1 triangle</text>
    <line x1="55" y1="205" x2="250" y2="205" stroke="#263238" stroke-width="5"/>
    <line x1="55" y1="205" x2="115" y2="105" stroke="#2f80ed" stroke-width="7"/>
    <line x1="115" y1="105" x2="250" y2="205" stroke="#f2994a" stroke-width="7"/>
    <path d="M93 205 A48 48 0 0 1 80 168" fill="none" stroke="#27ae60" stroke-width="4"/>
    <text x="63" y="168" font-family="Arial, sans-serif" font-size="20" fill="#1f7a3f">A</text>
    <text x="80" y="154" font-family="Arial, sans-serif" font-size="22" fill="#0f5fb8">b</text>
    <text x="188" y="146" font-family="Arial, sans-serif" font-size="22" fill="#a65613">a</text>
  </g>
  <g transform="translate(440,95)">
    <rect width="310" height="260" rx="6" fill="#ffffff" stroke="#f2c5c5" stroke-width="2"/>
    <text x="24" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#b42318">a &lt;= b</text>
    <text x="24" y="70" font-family="Arial, sans-serif" font-size="21" fill="#111827">0 triangles</text>
    <line x1="55" y1="205" x2="250" y2="205" stroke="#263238" stroke-width="5"/>
    <line x1="55" y1="205" x2="115" y2="105" stroke="#2f80ed" stroke-width="7"/>
    <line x1="115" y1="105" x2="182" y2="172" stroke="#f2994a" stroke-width="7"/>
    <line x1="182" y1="172" x2="226" y2="216" stroke="#b42318" stroke-width="4"/>
    <line x1="226" y1="172" x2="182" y2="216" stroke="#b42318" stroke-width="4"/>
    <path d="M93 205 A48 48 0 0 1 80 168" fill="none" stroke="#27ae60" stroke-width="4"/>
    <text x="63" y="168" font-family="Arial, sans-serif" font-size="20" fill="#1f7a3f">A</text>
    <text x="80" y="154" font-family="Arial, sans-serif" font-size="22" fill="#0f5fb8">b</text>
    <text x="158" y="146" font-family="Arial, sans-serif" font-size="22" fill="#a65613">a</text>
  </g>
  <text x="102" y="392" font-family="Arial, sans-serif" font-size="21" fill="#374151">For A = 90 degrees or A &gt; 90 degrees, side a must be longer than b.</text>
</svg>
