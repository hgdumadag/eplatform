<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Navigation route</title>
<desc id="desc">Bearings create a route triangle.</desc>
<rect width="720" height="420" fill="#f8fafc"/>
<rect x="18" y="18" width="684" height="384" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="120" cy="110" r="45" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><line x1="120" y1="65" x2="120" y2="155" stroke="#334155"/><line x1="75" y1="110" x2="165" y2="110" stroke="#334155"/><text x="112" y="55" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">N</text><defs><marker id="arrow-160-310" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><line x1="160" y1="310" x2="360" y2="150" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-160-310)"/><defs><marker id="arrow-360-150" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker></defs><line x1="360" y1="150" x2="590" y2="295" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-360-150)"/><line x1="160" y1="310" x2="590" y2="295" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 8"/><text x="180" y="90" font-family="Arial, sans-serif" font-size="24" fill="#0f172a">Use bearings to draw the route first.</text>
</svg>
