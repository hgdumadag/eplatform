<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Rubric summary for a navigation solution</title>
  <desc id="desc">A four-part rubric showing diagram accuracy, mathematical method, answer precision, and explanation as equal parts of a complete navigation solution.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#111827">Complete Navigation Solution</text>
  <g font-family="Arial, sans-serif">
    <rect x="62" y="88" width="270" height="120" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <text x="197" y="124" font-size="20" font-weight="700" text-anchor="middle" fill="#155e75">1. Diagram Accuracy</text>
    <text x="197" y="154" font-size="15" text-anchor="middle" fill="#164e63">Landmarks, local north lines,</text>
    <text x="197" y="177" font-size="15" text-anchor="middle" fill="#164e63">bearings, distances, and labels</text>
    <rect x="388" y="88" width="270" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="523" y="124" font-size="20" font-weight="700" text-anchor="middle" fill="#166534">2. Method Choice</text>
    <text x="523" y="154" font-size="15" text-anchor="middle" fill="#14532d">Law of Cosines or Sines</text>
    <text x="523" y="177" font-size="15" text-anchor="middle" fill="#14532d">matched to triangle evidence</text>
    <rect x="62" y="248" width="270" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="197" y="284" font-size="20" font-weight="700" text-anchor="middle" fill="#9a3412">3. Precision</text>
    <text x="197" y="314" font-size="15" text-anchor="middle" fill="#7c2d12">Substitution, calculator work,</text>
    <text x="197" y="337" font-size="15" text-anchor="middle" fill="#7c2d12">units, and sensible rounding</text>
    <rect x="388" y="248" width="270" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="523" y="284" font-size="20" font-weight="700" text-anchor="middle" fill="#5b21b6">4. Explanation</text>
    <text x="523" y="314" font-size="15" text-anchor="middle" fill="#4c1d95">Final distance and bearing</text>
    <text x="523" y="337" font-size="15" text-anchor="middle" fill="#4c1d95">interpreted as a route choice</text>
  </g>
</svg>
