<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title>Sector Area Workflow</title>
  <desc>Sector Area Workflow diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Sector area workflow</title>
  <desc id="desc">A four-step workflow: identify central angle, write fraction, find full circle area, multiply.</desc>
  <rect width="900" height="360" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Sector Area Workflow</text>
  <g transform="translate(40 95)">
    <rect width="180" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="90" cy="58" r="35" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <path d="M90 58 L125 58 A35 35 0 0 1 107.5 27.7 Z" fill="#93c5fd"/>
    <text x="28" y="116" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">1. Identify θ</text>
    <text x="42" y="140" font-family="Arial, sans-serif" font-size="17" fill="#334155">central angle</text>
  </g>
  <path d="M235 170 H285" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(300 95)">
    <rect width="180" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <text x="43" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16a34a">θ</text>
    <line x1="36" y1="76" x2="78" y2="76" stroke="#16a34a" stroke-width="3"/>
    <text x="28" y="110" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16a34a">360</text>
    <text x="24" y="140" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">2. Write fraction</text>
  </g>
  <path d="M495 170 H545" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(560 95)">
    <rect width="180" height="150" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
    <text x="44" y="72" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ea580c">πr²</text>
    <text x="27" y="116" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">3. Full circle</text>
    <text x="62" y="140" font-family="Arial, sans-serif" font-size="17" fill="#334155">area</text>
  </g>
  <path d="M755 170 H805" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(720 270)">
    <rect x="-420" y="0" width="380" height="58" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="-392" y="37" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#9a3412">sector area = (θ/360)πr²</text>
  </g>
  <g transform="translate(820 95)">
    <rect width="60" height="150" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="3"/>
    <text x="18" y="62" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#be123c">×</text>
    <text x="13" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">4</text>
    <text x="8" y="140" font-family="Arial, sans-serif" font-size="14" fill="#334155">multiply</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
