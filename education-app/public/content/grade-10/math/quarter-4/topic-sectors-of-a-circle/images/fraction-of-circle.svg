<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
  <title>Fraction Of Circle</title>
  <desc>Fraction Of Circle diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Sectors as fractions of a circle</title>
  <desc id="desc">Four circles showing 90, 120, 180, and 270 degree sectors as common fractions.</desc>
  <rect width="840" height="420" fill="#f8fafc"/>
  <text x="42" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Central angle gives the fraction of the circle</text>
  <g transform="translate(105 205)">
    <circle r="70" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <path d="M0 0 L70 0 A70 70 0 0 1 0 70 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
    <line x1="0" y1="0" x2="70" y2="0" stroke="#2563eb" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="70" stroke="#2563eb" stroke-width="3"/>
    <text x="-35" y="112" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">90°</text>
    <text x="-48" y="142" font-family="Arial, sans-serif" font-size="20" fill="#334155">1/4</text>
  </g>
  <g transform="translate(315 205)">
    <circle r="70" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <path d="M0 0 L70 0 A70 70 0 0 1 -35 60.6 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <line x1="0" y1="0" x2="70" y2="0" stroke="#16a34a" stroke-width="3"/>
    <line x1="0" y1="0" x2="-35" y2="60.6" stroke="#16a34a" stroke-width="3"/>
    <text x="-42" y="112" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">120°</text>
    <text x="-48" y="142" font-family="Arial, sans-serif" font-size="20" fill="#334155">1/3</text>
  </g>
  <g transform="translate(525 205)">
    <circle r="70" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <path d="M0 0 L70 0 A70 70 0 0 1 -70 0 Z" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
    <line x1="0" y1="0" x2="70" y2="0" stroke="#ea580c" stroke-width="3"/>
    <line x1="0" y1="0" x2="-70" y2="0" stroke="#ea580c" stroke-width="3"/>
    <text x="-42" y="112" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">180°</text>
    <text x="-48" y="142" font-family="Arial, sans-serif" font-size="20" fill="#334155">1/2</text>
  </g>
  <g transform="translate(735 205)">
    <circle r="70" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <path d="M0 0 L70 0 A70 70 0 1 1 0 -70 Z" fill="#fecdd3" stroke="#e11d48" stroke-width="3"/>
    <line x1="0" y1="0" x2="70" y2="0" stroke="#e11d48" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#e11d48" stroke-width="3"/>
    <text x="-42" y="112" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">270°</text>
    <text x="-48" y="142" font-family="Arial, sans-serif" font-size="20" fill="#334155">3/4</text>
  </g>
  <text x="255" y="385" font-family="Arial, sans-serif" font-size="23" fill="#0f172a">fraction = central angle / 360°</text>
</svg>
