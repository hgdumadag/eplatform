<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title>Segment Area Worked Example</title>
  <desc>Segment Area Worked Example diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Worked example for segment area</title>
  <desc id="desc">A 90 degree sector of radius 8 shows a triangle with area 32 and a segment with area 16 pi minus 32.</desc>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Worked Example: 90 Degree Segment</text>

  <g transform="translate(60 30)">
    <circle cx="180" cy="210" r="130" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <path d="M180 210 L180 80 A130 130 0 0 1 310 210 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
    <polygon points="180,210 180,80 310,210" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
    <path d="M180 80 A130 130 0 0 1 310 210 L180 80 Z" fill="#bbf7d0" fill-opacity="0.85" stroke="#16a34a" stroke-width="3"/>
    <line x1="180" y1="210" x2="180" y2="80" stroke="#1d4ed8" stroke-width="4"/>
    <line x1="180" y1="210" x2="310" y2="210" stroke="#1d4ed8" stroke-width="4"/>
    <line x1="180" y1="80" x2="310" y2="210" stroke="#15803d" stroke-width="4"/>
    <path d="M180 184 L206 184 L206 210" fill="none" stroke="#111827" stroke-width="2"/>
    <text x="166" y="148" text-anchor="end" font-family="Arial, sans-serif" font-size="16" fill="#1e40af">r = 8</text>
    <text x="245" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e40af">r = 8</text>
    <text x="213" y="191" font-family="Arial, sans-serif" font-size="15" fill="#9a3412">triangle area = 32</text>
    <text x="250" y="123" font-family="Arial, sans-serif" font-size="15" fill="#166534">segment</text>
  </g>

  <g transform="translate(430 96)">
    <rect x="0" y="0" width="280" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="24" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Step 1</text>
    <text x="24" y="68" font-family="Arial, sans-serif" font-size="17" fill="#334155">Sector area = 1/4 of circle</text>
    <text x="24" y="99" font-family="Arial, sans-serif" font-size="18" fill="#1e40af">= 16pi</text>
    <text x="24" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Step 2</text>
    <text x="24" y="168" font-family="Arial, sans-serif" font-size="17" fill="#334155">Triangle area = 1/2(8)(8)</text>
    <text x="24" y="199" font-family="Arial, sans-serif" font-size="18" fill="#c2410c">= 32</text>
    <text x="24" y="226" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">Segment = 16pi - 32</text>
  </g>
</svg>
