<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title>Inscribed Angle Arc</title>
  <desc>Inscribed Angle Arc diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Inscribed angle and intercepted arc</title>
  <desc id="desc">A circle with an inscribed angle ACB that intercepts arc AB. The arc measures 110 degrees and the inscribed angle measures 55 degrees.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <circle cx="270" cy="210" r="132" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
  <path d="M 270 342 L 370 124" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M 270 342 L 390 270" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M 370 124 A 132 132 0 0 1 390 270" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/>
  <path d="M 292 330 A 34 34 0 0 1 286 307" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="270" cy="342" r="7" fill="#2563eb"/>
  <circle cx="370" cy="124" r="7" fill="#ef4444"/>
  <circle cx="390" cy="270" r="7" fill="#ef4444"/>
  <circle cx="270" cy="210" r="5" fill="#94a3b8"/>
  <text x="258" y="374" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">C</text>
  <text x="382" y="119" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">A</text>
  <text x="402" y="286" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">B</text>
  <text x="296" y="320" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f766e">55&#176;</text>
  <text x="430" y="112" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#111827">Inscribed angle</text>
  <text x="430" y="152" font-family="Inter, Arial, sans-serif" font-size="22" fill="#374151">vertex on the circle</text>
  <line x1="430" y1="170" x2="295" y2="333" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="430" y="248" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#ef4444">Intercepted arc AB</text>
  <text x="430" y="288" font-family="Inter, Arial, sans-serif" font-size="22" fill="#374151">arc = 110&#176;, angle = 55&#176;</text>
  <line x1="430" y1="262" x2="390" y2="205" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowRed)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
  </defs>
</svg>
