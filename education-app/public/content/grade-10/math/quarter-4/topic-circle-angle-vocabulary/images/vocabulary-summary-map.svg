<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title>Vocabulary Summary Map</title>
  <desc>Vocabulary Summary Map diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Circle vocabulary summary map</title>
  <desc id="desc">A summary map linking circle vocabulary terms to their recognition clues.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Circle vocabulary map</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="96" width="250" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="92" y="124" font-size="21" font-weight="700" fill="#1e3a8a">central angle</text>
    <text x="92" y="148" font-size="17" fill="#1e40af">vertex at the center</text>
    <rect x="400" y="96" width="250" height="66" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <text x="422" y="124" font-size="21" font-weight="700" fill="#9a3412">arc</text>
    <text x="422" y="148" font-size="17" fill="#9a3412">curved part of circle</text>
    <rect x="70" y="190" width="250" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="92" y="218" font-size="21" font-weight="700" fill="#166534">chord</text>
    <text x="92" y="242" font-size="17" fill="#166534">segment, endpoints on circle</text>
    <rect x="400" y="190" width="250" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="422" y="218" font-size="21" font-weight="700" fill="#991b1b">secant</text>
    <text x="422" y="242" font-size="17" fill="#991b1b">line crosses at 2 points</text>
    <rect x="235" y="292" width="250" height="66" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="257" y="320" font-size="21" font-weight="700" fill="#854d0e">tangent</text>
    <text x="257" y="344" font-size="17" fill="#854d0e">line touches at 1 point</text>
  </g>
  <path d="M 320 130 C 350 130 370 130 400 130" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 320 223 C 350 223 370 223 400 223" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 195 256 C 235 300 260 315 235 325" stroke="#64748b" stroke-width="3" fill="none"/>
  <path d="M 525 256 C 485 300 460 315 485 325" stroke="#64748b" stroke-width="3" fill="none"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
