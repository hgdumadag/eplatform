<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title>Tangent Secant Relationship</title>
  <desc>Tangent Secant Relationship diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Tangent-secant relationship</title>
  <desc id="desc">A tangent and a secant from external point P show tangent squared equals external times whole secant.</desc>
  <rect width="760" height="430" fill="#f8fafc"/>
  <circle cx="470" cy="214" r="126" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
  <line x1="105" y1="320" x2="589" y2="102" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <line x1="105" y1="320" x2="544" y2="333" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <circle cx="105" cy="320" r="8" fill="#dc2626"/>
  <circle cx="357" cy="207" r="7" fill="#0f766e"/>
  <circle cx="570" cy="111" r="7" fill="#0f766e"/>
  <circle cx="544" cy="333" r="7" fill="#ea580c"/>
  <text x="78" y="350" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">P</text>
  <path d="M130 342 C245 382, 420 385, 538 356" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="255" y="405" font-family="Arial, sans-serif" font-size="22" fill="#ea580c">tangent t</text>
  <path d="M119 292 C180 251, 255 211, 345 184" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="178" y="234" font-family="Arial, sans-serif" font-size="22" fill="#0f766e">external e</text>
  <path d="M365 181 C438 139, 504 105, 568 84" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="432" y="72" font-family="Arial, sans-serif" font-size="22" fill="#15803d">inside f</text>
  <rect x="170" y="22" width="420" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="229" y="56" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">t² = e(e + f)</text>
  <text x="492" y="214" font-family="Arial, sans-serif" font-size="18" fill="#166534">circle</text>
</svg>
