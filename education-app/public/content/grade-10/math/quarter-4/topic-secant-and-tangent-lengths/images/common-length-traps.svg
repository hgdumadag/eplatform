<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title>Common Length Traps</title>
  <desc>Common Length Traps diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Common length traps</title>
  <desc id="desc">Diagram showing that whole secant is outside plus inside, not inside alone.</desc>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Common trap: inside is not whole</text>
  <circle cx="465" cy="220" r="124" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/>
  <line x1="110" y1="165" x2="620" y2="280" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <circle cx="110" cy="165" r="8" fill="#dc2626"/>
  <circle cx="343" cy="218" r="7" fill="#2563eb"/>
  <circle cx="586" cy="272" r="7" fill="#2563eb"/>
  <text x="87" y="144" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">P</text>
  <path d="M118 195 C178 232, 251 251, 333 245" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="165" y="282" font-family="Arial, sans-serif" font-size="22" fill="#0f766e">outside</text>
  <path d="M349 247 C423 286, 508 306, 584 298" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="438" y="330" font-family="Arial, sans-serif" font-size="22" fill="#b91c1c">inside only</text>
  <path d="M112 118 C260 55, 452 56, 607 118" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <text x="270" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7c3aed">whole secant = outside + inside</text>
  <rect x="80" y="350" width="600" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="116" y="381" font-family="Arial, sans-serif" font-size="22" fill="#111827">Use external x whole, never external x inside only.</text>
</svg>
