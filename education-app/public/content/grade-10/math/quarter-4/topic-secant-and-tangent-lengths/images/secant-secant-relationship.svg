<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title>Secant Secant Relationship</title>
  <desc>Secant Secant Relationship diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Secant-secant relationship</title>
  <desc id="desc">Two secants from external point P show external and whole secant products.</desc>
  <rect width="760" height="430" fill="#f8fafc"/>
  <circle cx="455" cy="218" r="130" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/>
  <line x1="92" y1="124" x2="620" y2="286" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <line x1="92" y1="124" x2="605" y2="124" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <circle cx="92" cy="124" r="8" fill="#dc2626"/>
  <circle cx="335" cy="199" r="7" fill="#0f766e"/>
  <circle cx="579" cy="274" r="7" fill="#0f766e"/>
  <circle cx="330" cy="124" r="7" fill="#7c3aed"/>
  <circle cx="585" cy="124" r="7" fill="#7c3aed"/>
  <text x="68" y="105" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">P</text>
  <path d="M105 152 C160 182, 235 204, 320 221" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="150" y="208" font-family="Arial, sans-serif" font-size="22" fill="#0f766e">external a</text>
  <path d="M335 224 C415 257, 493 278, 574 297" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="402" y="323" font-family="Arial, sans-serif" font-size="22" fill="#0369a1">inside b</text>
  <path d="M105 92 C180 70, 250 70, 320 92" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="176" y="66" font-family="Arial, sans-serif" font-size="22" fill="#7c3aed">external c</text>
  <path d="M332 92 C420 60, 505 60, 586 92" fill="none" stroke="#4338ca" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="416" y="50" font-family="Arial, sans-serif" font-size="22" fill="#4338ca">inside d</text>
  <rect x="140" y="345" width="480" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="185" y="379" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">a(a + b) = c(c + d)</text>
  <text x="382" y="158" font-family="Arial, sans-serif" font-size="18" fill="#075985">circle</text>
</svg>
