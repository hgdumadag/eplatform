<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title>Intersecting Chords Product</title>
  <desc>Intersecting Chords Product diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Intersecting chords product theorem</title>
  <desc id="desc">A circle with two chords AB and CD crossing at point P. The products AP times PB and CP times PD are labeled equal.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <circle cx="360" cy="200" r="145" fill="#e0f2fe" stroke="#0f172a" stroke-width="4"/>
  <line x1="228" y1="140" x2="492" y2="260" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <line x1="248" y1="290" x2="472" y2="110" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  <circle cx="360" cy="200" r="8" fill="#0f172a"/>
  <circle cx="228" cy="140" r="7" fill="#2563eb"/>
  <circle cx="492" cy="260" r="7" fill="#2563eb"/>
  <circle cx="248" cy="290" r="7" fill="#dc2626"/>
  <circle cx="472" cy="110" r="7" fill="#dc2626"/>
  <text x="206" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">A</text>
  <text x="504" y="283" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">B</text>
  <text x="229" y="319" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">C</text>
  <text x="480" y="100" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">D</text>
  <text x="371" y="193" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">P</text>
  <rect x="70" y="336" width="580" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="105" y="371" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">AP x PB = CP x PD</text>
  <text x="111" y="54" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Intersecting chords theorem</text>
  <text x="111" y="83" font-family="Arial, sans-serif" font-size="18" fill="#334155">Multiply the two pieces on each chord.</text>
</svg>
