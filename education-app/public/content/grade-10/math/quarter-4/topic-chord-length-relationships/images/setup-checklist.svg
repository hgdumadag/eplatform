<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title>Setup Checklist</title>
  <desc>Setup Checklist diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Intersecting chord setup checklist</title>
  <desc id="desc">A checklist showing the steps for solving intersecting chord segment length problems.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <rect x="70" y="54" width="580" height="312" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="105" y="102" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Setup Checklist</text>
  <g font-family="Arial, sans-serif" font-size="21" fill="#1e293b">
    <circle cx="115" cy="148" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="156" font-size="18" font-weight="700" fill="#2563eb">1</text>
    <text x="145" y="155">Mark the intersection point.</text>
    <circle cx="115" cy="193" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="110" y="201" font-size="18" font-weight="700" fill="#15803d">2</text>
    <text x="145" y="200">Pair the two pieces on chord 1.</text>
    <circle cx="115" cy="238" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="110" y="246" font-size="18" font-weight="700" fill="#dc2626">3</text>
    <text x="145" y="245">Pair the two pieces on chord 2.</text>
    <circle cx="115" cy="283" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="110" y="291" font-size="18" font-weight="700" fill="#b45309">4</text>
    <text x="145" y="290">Write product = product, then solve.</text>
  </g>
  <rect x="406" y="121" width="196" height="168" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <line x1="445" y1="170" x2="562" y2="238" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  <line x1="450" y1="244" x2="557" y2="164" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
  <circle cx="504" cy="204" r="7" fill="#0f172a"/>
  <text x="452" y="149" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">a</text>
  <text x="541" y="251" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">b</text>
  <text x="454" y="266" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#dc2626">c</text>
  <text x="548" y="157" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#dc2626">d</text>
  <text x="416" y="323" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">a x b = c x d</text>
</svg>
