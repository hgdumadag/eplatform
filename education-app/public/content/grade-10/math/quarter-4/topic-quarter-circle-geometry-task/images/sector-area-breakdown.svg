<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title>Sector Area Breakdown</title>
  <desc>Sector Area Breakdown diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Sector area breakdown</title>
  <desc id="desc">A quarter-circle sector split into a right triangle and the curved segment between the chord and arc.</desc>
  <rect width="760" height="500" fill="#f0fdf4"/>
  <path d="M190 390 L190 120 A270 270 0 0 1 460 390 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="4"/>
  <path d="M190 120 A270 270 0 0 1 460 390 L190 120 Z" fill="#dcfce7" opacity="0.9"/>
  <path d="M190 390 L190 120 L460 390 Z" fill="#bfdbfe" opacity="0.85" stroke="#2563eb" stroke-width="3"/>
  <path d="M190 120 A270 270 0 0 1 460 390 L190 120 Z" fill="none" stroke="#15803d" stroke-width="5"/>
  <line x1="190" y1="390" x2="190" y2="120" stroke="#0f172a" stroke-width="4"/>
  <line x1="190" y1="390" x2="460" y2="390" stroke="#0f172a" stroke-width="4"/>
  <line x1="190" y1="120" x2="460" y2="390" stroke="#1d4ed8" stroke-width="4"/>
  <circle cx="190" cy="390" r="6" fill="#0f172a"/>
  <circle cx="190" cy="120" r="6" fill="#0f172a"/>
  <circle cx="460" cy="390" r="6" fill="#0f172a"/>
  <text x="167" y="416" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">O</text>
  <text x="166" y="106" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">A</text>
  <text x="473" y="399" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">B</text>
  <text x="223" y="305" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">triangle area</text>
  <text x="243" y="334" font-family="Arial, sans-serif" font-size="20" fill="#1e40af">1/2 r^2</text>
  <text x="368" y="217" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#15803d">curved segment</text>
  <text x="395" y="246" font-family="Arial, sans-serif" font-size="20" fill="#166534">sector - triangle</text>
  <rect x="525" y="116" width="190" height="214" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="545" y="153" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">For radius 8</text>
  <text x="545" y="193" font-family="Arial, sans-serif" font-size="18" fill="#334155">sector = 16pi</text>
  <text x="545" y="227" font-family="Arial, sans-serif" font-size="18" fill="#334155">triangle = 32</text>
  <text x="545" y="261" font-family="Arial, sans-serif" font-size="18" fill="#334155">segment = 16pi - 32</text>
  <text x="545" y="295" font-family="Arial, sans-serif" font-size="18" fill="#334155">units are square cm</text>
</svg>
