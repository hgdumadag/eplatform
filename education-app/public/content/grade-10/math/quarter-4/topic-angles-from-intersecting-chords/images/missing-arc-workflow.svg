<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title>Missing Arc Workflow</title>
  <desc>Missing Arc Workflow diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Missing arc workflow</title>
  <desc id="desc">Steps for finding a missing intercepted arc from an interior chord angle.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="48" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Finding a Missing Intercepted Arc</text>
  <rect x="52" y="94" width="160" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="78" y="130" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e40af">1. Start</text>
  <text x="78" y="160" font-family="Arial, sans-serif" font-size="17" fill="#111827">angle = 65</text>
  <text x="78" y="184" font-family="Arial, sans-serif" font-size="17" fill="#111827">known arc = 50</text>
  <path d="M220 144 H285" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M285 144 L272 134 M285 144 L272 154" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <rect x="298" y="94" width="160" height="100" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="324" y="130" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#166534">2. Double</text>
  <text x="324" y="160" font-family="Arial, sans-serif" font-size="17" fill="#111827">arc sum = 2(65)</text>
  <text x="324" y="184" font-family="Arial, sans-serif" font-size="17" fill="#111827">arc sum = 130</text>
  <path d="M466 144 H531" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M531 144 L518 134 M531 144 L518 154" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <rect x="544" y="94" width="160" height="100" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <text x="570" y="130" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#991b1b">3. Subtract</text>
  <text x="570" y="160" font-family="Arial, sans-serif" font-size="17" fill="#111827">x = 130 - 50</text>
  <text x="570" y="184" font-family="Arial, sans-serif" font-size="17" fill="#111827">x = 80</text>
  <rect x="94" y="248" width="532" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="124" y="287" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Equation pattern</text>
  <text x="124" y="323" font-family="Arial, sans-serif" font-size="23" fill="#111827">65 = 1/2(50 + x)  ->  130 = 50 + x  ->  x = 80</text>
  <text x="124" y="370" font-family="Arial, sans-serif" font-size="18" fill="#475569">Double the angle first because the angle is half of the arc sum.</text>
</svg>
