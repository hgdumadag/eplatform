<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title>Vertical Angles Arc Pairs</title>
  <desc>Vertical Angles Arc Pairs diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Vertical angles and arc pairs</title>
  <desc id="desc">Two intersecting chords make vertical angles that share the same intercepted arc pair.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <circle cx="250" cy="210" r="145" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
  <path d="M138 118 A145 145 0 0 1 379 141" fill="none" stroke="#7c3aed" stroke-width="10" stroke-linecap="round"/>
  <path d="M119 272 A145 145 0 0 0 344 326" fill="none" stroke="#0f766e" stroke-width="10" stroke-linecap="round"/>
  <path d="M138 118 A145 145 0 0 0 119 272" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M379 141 A145 145 0 0 1 344 326" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="138" y1="118" x2="344" y2="326" stroke="#111827" stroke-width="4"/>
  <line x1="119" y1="272" x2="379" y2="141" stroke="#111827" stroke-width="4"/>
  <circle cx="250" cy="210" r="5" fill="#111827"/>
  <path d="M224 184 Q250 210 284 193" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M276 236 Q250 210 216 227" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <text x="123" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">A</text>
  <text x="385" y="140" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">C</text>
  <text x="96" y="286" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">D</text>
  <text x="347" y="351" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">B</text>
  <text x="259" y="224" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">P</text>
  <rect x="455" y="78" width="218" height="246" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="478" y="118" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#111827">Vertical angles</text>
  <circle cx="486" cy="158" r="7" fill="#2563eb"/>
  <text x="506" y="165" font-family="Arial, sans-serif" font-size="18" fill="#111827">angle APC and angle BPD</text>
  <text x="506" y="192" font-family="Arial, sans-serif" font-size="18" fill="#111827">use arcs AC and DB</text>
  <circle cx="486" cy="235" r="7" fill="#f59e0b"/>
  <text x="506" y="242" font-family="Arial, sans-serif" font-size="18" fill="#111827">adjacent angles use</text>
  <text x="506" y="269" font-family="Arial, sans-serif" font-size="18" fill="#111827">the other arc pair</text>
  <text x="478" y="304" font-family="Arial, sans-serif" font-size="17" fill="#475569">Choose arcs across from</text>
  <text x="478" y="327" font-family="Arial, sans-serif" font-size="17" fill="#475569">the angle and its vertical angle.</text>
</svg>
