<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title>Intersecting Chords Angle Rule</title>
  <desc>Intersecting Chords Angle Rule diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Intersecting chords angle rule</title>
  <desc id="desc">Two chords intersect inside a circle. The interior angle equals half the sum of the opposite intercepted arcs.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <circle cx="260" cy="210" r="145" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
  <path d="M192 82 A145 145 0 0 1 405 194" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
  <path d="M120 251 A145 145 0 0 0 327 338" fill="none" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
  <line x1="192" y1="82" x2="327" y2="338" stroke="#111827" stroke-width="4"/>
  <line x1="120" y1="251" x2="405" y2="194" stroke="#111827" stroke-width="4"/>
  <circle cx="260" cy="210" r="5" fill="#111827"/>
  <path d="M243 177 Q260 210 299 202" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <text x="178" y="69" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">A</text>
  <text x="414" y="199" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">C</text>
  <text x="97" y="260" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">D</text>
  <text x="329" y="363" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">B</text>
  <text x="269" y="230" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">P</text>
  <text x="267" y="96" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2563eb">arc AC</text>
  <text x="176" y="348" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#dc2626">arc DB</text>
  <rect x="468" y="116" width="206" height="168" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="492" y="155" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Interior angle</text>
  <text x="492" y="198" font-family="Arial, sans-serif" font-size="22" fill="#111827">m angle APC =</text>
  <text x="520" y="236" font-family="Arial, sans-serif" font-size="22" fill="#111827">1/2(arc AC + arc DB)</text>
  <text x="492" y="270" font-family="Arial, sans-serif" font-size="18" fill="#475569">Use the opposite arc pair.</text>
</svg>
