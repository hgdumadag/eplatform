<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Solution Organizer</title>
  <desc>Solution Organizer diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Organizer for shaded region solutions</title>
  <desc id="desc">A five-step flowchart for solving shaded region area problems: given, plan, formulas, compute, conclude.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="360" y="52" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#0f172a">Organize Before You Calculate</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(42 102)">
      <rect width="118" height="88" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
      <text x="59" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#7f1d1d">1. Given</text>
      <text x="59" y="64" font-size="17" text-anchor="middle" fill="#7f1d1d">r, side, θ</text>
    </g>
    <path d="M168 146 H214" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(222 102)">
      <rect width="118" height="88" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
      <text x="59" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#7c2d12">2. Plan</text>
      <text x="59" y="64" font-size="17" text-anchor="middle" fill="#7c2d12">add/subtract</text>
    </g>
    <path d="M348 146 H394" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(402 102)">
      <rect width="118" height="88" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
      <text x="59" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#14532d">3. Formula</text>
      <text x="59" y="64" font-size="17" text-anchor="middle" fill="#14532d">A = ...</text>
    </g>
    <path d="M528 146 H574" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(582 102)">
      <rect width="118" height="88" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
      <text x="59" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3a8a">4. Compute</text>
      <text x="59" y="64" font-size="17" text-anchor="middle" fill="#1e3a8a">substitute</text>
    </g>
    <path d="M641 200 V248 H360" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(228 264)">
      <rect width="264" height="92" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="3"/>
      <text x="132" y="36" font-size="24" font-weight="700" text-anchor="middle" fill="#581c87">5. Conclude</text>
      <text x="132" y="68" font-size="18" text-anchor="middle" fill="#581c87">shaded area with square units</text>
    </g>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
