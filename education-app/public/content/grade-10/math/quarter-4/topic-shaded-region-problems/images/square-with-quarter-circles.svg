<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Square With Quarter Circles</title>
  <desc>Square With Quarter Circles diagram for a Grade 10 circle geometry lesson.</desc>
  <title id="title">Square with four quarter circles removed</title>
  <desc id="desc">A square of side 10 has quarter circles of radius 5 drawn from each corner. The central remaining region is shaded.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <g transform="translate(78 58)">
    <rect x="0" y="0" width="300" height="300" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
    <path d="M0 150 A150 150 0 0 1 150 0 L0 0 Z" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
    <path d="M150 0 A150 150 0 0 1 300 150 L300 0 Z" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
    <path d="M300 150 A150 150 0 0 1 150 300 L300 300 Z" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
    <path d="M150 300 A150 150 0 0 1 0 150 L0 300 Z" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
    <path d="M0 150 A150 150 0 0 1 150 0 A150 150 0 0 1 300 150 A150 150 0 0 1 150 300 A150 150 0 0 1 0 150 Z" fill="#2dd4bf" opacity="0.75" stroke="#0f766e" stroke-width="4"/>
    <line x1="0" y1="322" x2="300" y2="322" stroke="#334155" stroke-width="3"/>
    <line x1="0" y1="314" x2="0" y2="330" stroke="#334155" stroke-width="3"/>
    <line x1="300" y1="314" x2="300" y2="330" stroke="#334155" stroke-width="3"/>
    <text x="150" y="356" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#0f172a">side 10</text>
    <text x="46" y="82" font-family="Arial, sans-serif" font-size="21" fill="#0f172a">r = 5</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="430" y="110" font-size="30" font-weight="700">Combine pieces</text>
    <text x="430" y="156" font-size="25">4 quarter circles</text>
    <text x="430" y="194" font-size="25">= 1 full circle</text>
    <text x="430" y="250" font-size="25">A = square - circle</text>
    <text x="430" y="288" font-size="25">A = 100 - 25pi</text>
  </g>
</svg>
