<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Spread comparison with narrow and wide boxes</title>
  <desc id="desc">Two box plots compare a narrow IQR with a wide IQR.</desc>
  <rect width="900" height="360" fill="#f8fafc"/>
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">IQR Compares the Middle 50%</text>
  <line x1="120" y1="285" x2="800" y2="285" stroke="#475569" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#475569">
    <text x="120" y="312" text-anchor="middle">0</text>
    <text x="290" y="312" text-anchor="middle">25</text>
    <text x="460" y="312" text-anchor="middle">50</text>
    <text x="630" y="312" text-anchor="middle">75</text>
    <text x="800" y="312" text-anchor="middle">100</text>
  </g>
  <text x="100" y="140" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#15803d">Consistent</text>
  <line x1="290" y1="135" x2="630" y2="135" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
  <rect x="409" y="100" width="102" height="70" fill="#dcfce7" stroke="#15803d" stroke-width="4" rx="4"/>
  <line x1="460" y1="100" x2="460" y2="170" stroke="#15803d" stroke-width="5"/>
  <line x1="290" y1="112" x2="290" y2="158" stroke="#15803d" stroke-width="4"/>
  <line x1="630" y1="112" x2="630" y2="158" stroke="#15803d" stroke-width="4"/>
  <text x="460" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#166534">small IQR</text>
  <text x="100" y="230" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309">Variable</text>
  <line x1="205" y1="225" x2="715" y2="225" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
  <rect x="324" y="190" width="306" height="70" fill="#ffedd5" stroke="#b45309" stroke-width="4" rx="4"/>
  <line x1="460" y1="190" x2="460" y2="260" stroke="#b45309" stroke-width="5"/>
  <line x1="205" y1="202" x2="205" y2="248" stroke="#b45309" stroke-width="4"/>
  <line x1="715" y1="202" x2="715" y2="248" stroke="#b45309" stroke-width="4"/>
  <text x="477" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#92400e">large IQR</text>
</svg>
