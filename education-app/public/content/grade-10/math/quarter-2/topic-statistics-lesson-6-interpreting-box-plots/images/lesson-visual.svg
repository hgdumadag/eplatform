<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Side-by-side box plots comparing quiz scores</title>
  <desc id="desc">Section A has a higher median and narrower spread than Section B on a 0 to 20 quiz scale.</desc>
  <rect width="900" height="430" fill="#f8fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">Compare Center and Spread</text>
  <text x="450" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Grade 10 statistics check, scores out of 20</text>
  <line x1="120" y1="340" x2="800" y2="340" stroke="#334155" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155">
    <text x="120" y="370" text-anchor="middle">0</text>
    <text x="290" y="370" text-anchor="middle">5</text>
    <text x="460" y="370" text-anchor="middle">10</text>
    <text x="630" y="370" text-anchor="middle">15</text>
    <text x="800" y="370" text-anchor="middle">20</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="120" y1="330" x2="120" y2="350"/>
    <line x1="290" y1="330" x2="290" y2="350"/>
    <line x1="460" y1="330" x2="460" y2="350"/>
    <line x1="630" y1="330" x2="630" y2="350"/>
    <line x1="800" y1="330" x2="800" y2="350"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="86" y="165" text-anchor="end" font-size="18" font-weight="700" fill="#0f766e">Section A</text>
    <line x1="426" y1="160" x2="698" y2="160" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
    <line x1="426" y1="135" x2="426" y2="185" stroke="#0f766e" stroke-width="4"/>
    <line x1="698" y1="135" x2="698" y2="185" stroke="#0f766e" stroke-width="4"/>
    <rect x="528" y="125" width="136" height="70" fill="#ccfbf1" stroke="#0f766e" stroke-width="4" rx="4"/>
    <line x1="630" y1="125" x2="630" y2="195" stroke="#0f766e" stroke-width="5"/>
    <text x="630" y="113" text-anchor="middle" font-size="14" fill="#0f766e">median 15</text>
    <text x="596" y="215" text-anchor="middle" font-size="14" fill="#0f766e">middle 50%: 12 to 16</text>
    <text x="86" y="275" text-anchor="end" font-size="18" font-weight="700" fill="#7c3aed">Section B</text>
    <line x1="324" y1="270" x2="766" y2="270" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
    <line x1="324" y1="245" x2="324" y2="295" stroke="#7c3aed" stroke-width="4"/>
    <line x1="766" y1="245" x2="766" y2="295" stroke="#7c3aed" stroke-width="4"/>
    <rect x="426" y="235" width="238" height="70" fill="#ede9fe" stroke="#7c3aed" stroke-width="4" rx="4"/>
    <line x1="562" y1="235" x2="562" y2="305" stroke="#7c3aed" stroke-width="5"/>
    <text x="562" y="223" text-anchor="middle" font-size="14" fill="#7c3aed">median 13</text>
    <text x="545" y="325" text-anchor="middle" font-size="14" fill="#7c3aed">middle 50%: 9 to 16</text>
  </g>
</svg>
