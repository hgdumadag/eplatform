<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">Box plot with possible outlier</title>
  <desc id="desc">A box plot marks a high outlier as a separate point beyond the right whisker.</desc>
  <rect width="900" height="350" fill="#fefce8"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">Check the Far-Away Value</text>
  <line x1="120" y1="250" x2="790" y2="250" stroke="#57534e" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#57534e">
    <text x="120" y="278" text-anchor="middle">0</text>
    <text x="254" y="278" text-anchor="middle">20</text>
    <text x="388" y="278" text-anchor="middle">40</text>
    <text x="522" y="278" text-anchor="middle">60</text>
    <text x="656" y="278" text-anchor="middle">80</text>
    <text x="790" y="278" text-anchor="middle">100</text>
  </g>
  <line x1="254" y1="160" x2="589" y2="160" stroke="#a16207" stroke-width="5" stroke-linecap="round"/>
  <line x1="254" y1="132" x2="254" y2="188" stroke="#a16207" stroke-width="4"/>
  <line x1="589" y1="132" x2="589" y2="188" stroke="#a16207" stroke-width="4"/>
  <rect x="321" y="120" width="134" height="80" fill="#fef3c7" stroke="#a16207" stroke-width="4" rx="4"/>
  <line x1="388" y1="120" x2="388" y2="200" stroke="#a16207" stroke-width="5"/>
  <circle cx="750" cy="160" r="11" fill="#dc2626"/>
  <text x="750" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">possible outlier</text>
  <line x1="750" y1="124" x2="750" y2="146" stroke="#991b1b" stroke-width="2"/>
  <text x="388" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#713f12">middle scores stay clustered</text>
  <text x="750" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#991b1b">do not let one value tell the whole story</text>
</svg>
