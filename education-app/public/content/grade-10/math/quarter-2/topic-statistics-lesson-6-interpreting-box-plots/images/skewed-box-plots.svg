<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Skew clues in box plots</title>
  <desc id="desc">Three box plots show left skew, roughly symmetric spread, and right skew.</desc>
  <rect width="900" height="420" fill="#f0f9ff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Whiskers Give Shape Clues</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="140" y="120" fill="#be123c">Left-skew clue</text>
    <text x="140" y="215" fill="#0369a1">Roughly symmetric</text>
    <text x="140" y="310" fill="#7c2d12">Right-skew clue</text>
  </g>
  <g stroke-width="5" stroke-linecap="round">
    <line x1="250" y1="115" x2="690" y2="115" stroke="#be123c"/>
    <line x1="250" y1="90" x2="250" y2="140" stroke="#be123c"/>
    <line x1="690" y1="90" x2="690" y2="140" stroke="#be123c"/>
    <rect x="545" y="82" width="100" height="66" fill="#ffe4e6" stroke="#be123c" stroke-width="4" rx="4"/>
    <line x1="610" y1="82" x2="610" y2="148" stroke="#be123c" stroke-width="5"/>
    <line x1="320" y1="210" x2="680" y2="210" stroke="#0369a1"/>
    <line x1="320" y1="185" x2="320" y2="235" stroke="#0369a1"/>
    <line x1="680" y1="185" x2="680" y2="235" stroke="#0369a1"/>
    <rect x="420" y="177" width="160" height="66" fill="#e0f2fe" stroke="#0369a1" stroke-width="4" rx="4"/>
    <line x1="500" y1="177" x2="500" y2="243" stroke="#0369a1" stroke-width="5"/>
    <line x1="250" y1="305" x2="690" y2="305" stroke="#7c2d12"/>
    <line x1="250" y1="280" x2="250" y2="330" stroke="#7c2d12"/>
    <line x1="690" y1="280" x2="690" y2="330" stroke="#7c2d12"/>
    <rect x="300" y="272" width="120" height="66" fill="#ffedd5" stroke="#7c2d12" stroke-width="4" rx="4"/>
    <line x1="355" y1="272" x2="355" y2="338" stroke="#7c2d12" stroke-width="5"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#334155">
    <text x="710" y="119">longer left tail</text>
    <text x="710" y="214">balanced sides</text>
    <text x="710" y="309">longer right tail</text>
  </g>
</svg>
