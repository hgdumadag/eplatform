<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Decision guide for interpreting box plots</title>
  <desc id="desc">A flowchart connects box plot questions to median, IQR, range, whiskers, and context.</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Box Plot Interpretation Flow</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" font-size="16" fill="#111827">
    <rect x="345" y="75" width="210" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="450" y="108" text-anchor="middle" font-weight="700">What is being compared?</text>
    <line x1="450" y1="130" x2="450" y2="158" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="65" y="165" width="150" height="64" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <text x="140" y="192" text-anchor="middle" font-weight="700">Typical value?</text>
    <text x="140" y="214" text-anchor="middle">Use median</text>
    <rect x="240" y="165" width="150" height="64" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="315" y="192" text-anchor="middle" font-weight="700">Consistency?</text>
    <text x="315" y="214" text-anchor="middle">Use IQR</text>
    <rect x="415" y="165" width="150" height="64" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="490" y="192" text-anchor="middle" font-weight="700">Full spread?</text>
    <text x="490" y="214" text-anchor="middle">Use range</text>
    <rect x="590" y="165" width="150" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="665" y="192" text-anchor="middle" font-weight="700">Shape?</text>
    <text x="665" y="214" text-anchor="middle">Use whiskers</text>
    <rect x="345" y="285" width="210" height="64" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="3"/>
    <text x="450" y="312" text-anchor="middle" font-weight="700">Then write context</text>
    <text x="450" y="334" text-anchor="middle">What does it mean?</text>
  </g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
    <line x1="450" y1="158" x2="140" y2="165"/>
    <line x1="450" y1="158" x2="315" y2="165"/>
    <line x1="450" y1="158" x2="490" y2="165"/>
    <line x1="450" y1="158" x2="665" y2="165"/>
    <line x1="140" y1="230" x2="410" y2="285"/>
    <line x1="315" y1="230" x2="430" y2="285"/>
    <line x1="490" y1="230" x2="470" y2="285"/>
    <line x1="665" y1="230" x2="500" y2="285"/>
  </g>
</svg>
