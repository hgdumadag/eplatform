<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Five-number summary map</title>
  <desc id="desc">A labeled box plot showing minimum, first quartile, median, third quartile, and maximum.</desc>
  <rect width="900" height="360" fill="#fff7ed"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">Five Landmarks in One Picture</text>
  <line x1="130" y1="245" x2="770" y2="245" stroke="#374151" stroke-width="3"/>
  <g stroke="#9ca3af" stroke-width="2" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">
    <line x1="130" y1="236" x2="130" y2="254"/>
    <line x1="290" y1="236" x2="290" y2="254"/>
    <line x1="450" y1="236" x2="450" y2="254"/>
    <line x1="610" y1="236" x2="610" y2="254"/>
    <line x1="770" y1="236" x2="770" y2="254"/>
    <text x="130" y="278" text-anchor="middle">10</text>
    <text x="290" y="278" text-anchor="middle">20</text>
    <text x="450" y="278" text-anchor="middle">30</text>
    <text x="610" y="278" text-anchor="middle">40</text>
    <text x="770" y="278" text-anchor="middle">50</text>
  </g>
  <line x1="210" y1="175" x2="690" y2="175" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <line x1="210" y1="140" x2="210" y2="210" stroke="#2563eb" stroke-width="4"/>
  <line x1="690" y1="140" x2="690" y2="210" stroke="#2563eb" stroke-width="4"/>
  <rect x="338" y="125" width="240" height="100" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <line x1="466" y1="125" x2="466" y2="225" stroke="#1d4ed8" stroke-width="6"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="700">
    <text x="210" y="102" text-anchor="middle">Minimum</text>
    <text x="338" y="102" text-anchor="middle">Q1</text>
    <text x="466" y="102" text-anchor="middle">Median</text>
    <text x="578" y="102" text-anchor="middle">Q3</text>
    <text x="690" y="102" text-anchor="middle">Maximum</text>
  </g>
  <g stroke="#64748b" stroke-width="2">
    <line x1="210" y1="108" x2="210" y2="138"/>
    <line x1="338" y1="108" x2="338" y2="125"/>
    <line x1="466" y1="108" x2="466" y2="125"/>
    <line x1="578" y1="108" x2="578" y2="125"/>
    <line x1="690" y1="108" x2="690" y2="138"/>
  </g>
  <text x="458" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">IQR = Q3 - Q1</text>
</svg>
