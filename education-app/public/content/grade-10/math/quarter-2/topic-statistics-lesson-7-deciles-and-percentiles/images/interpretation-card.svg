<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Percentile interpretation card</title>
  <desc id="desc">A card showing how to turn P80 equals 72 into a context sentence.</desc>
  <rect width="760" height="300" fill="#fdf2f8"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">A statistic needs a sentence</text>
  <text x="40" y="72" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Complete answers connect the position measure back to the data context.</text>
  <g transform="translate(80 112)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="600" height="130" rx="10" fill="#ffffff" stroke="#be185d" stroke-width="3"/>
    <text x="30" y="38" font-size="26" font-weight="700" fill="#9d174d">P80 = 72</text>
    <path d="M170 32H250" stroke="#be185d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="275" y="31" font-size="15" fill="#374151">score cut point</text>
    <text x="30" y="82" font-size="17" fill="#1f2937">In this test-score data set, about 80% of the ordered</text>
    <text x="30" y="108" font-size="17" fill="#1f2937">score positions are at or below 72.</text>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#be185d"/>
      </marker>
    </defs>
  </g>
</svg>
