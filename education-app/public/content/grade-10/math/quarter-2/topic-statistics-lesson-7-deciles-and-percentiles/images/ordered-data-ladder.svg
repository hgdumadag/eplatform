<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Ordered data ladder</title>
  <desc id="desc">Ten student scores arranged from lowest to highest with position labels.</desc>
  <rect width="760" height="300" fill="#f7fafc"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Order first, then read position</text>
  <text x="40" y="72" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Percentiles and deciles depend on where values sit in the ordered list.</text>
  <line x1="80" y1="165" x2="680" y2="165" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#0f766e">
      <circle cx="80" cy="165" r="18"/><circle cx="147" cy="165" r="18"/><circle cx="213" cy="165" r="18"/><circle cx="280" cy="165" r="18"/><circle cx="347" cy="165" r="18"/>
      <circle cx="413" cy="165" r="18"/><circle cx="480" cy="165" r="18"/><circle cx="547" cy="165" r="18"/><circle cx="613" cy="165" r="18"/><circle cx="680" cy="165" r="18"/>
    </g>
    <g fill="#ffffff" font-size="15" font-weight="700">
      <text x="80" y="170">42</text><text x="147" y="170">55</text><text x="213" y="170">61</text><text x="280" y="170">66</text><text x="347" y="170">70</text>
      <text x="413" y="170">74</text><text x="480" y="170">79</text><text x="547" y="170">85</text><text x="613" y="170">91</text><text x="680" y="170">96</text>
    </g>
    <g fill="#64748b" font-size="13">
      <text x="80" y="210">1st</text><text x="147" y="210">2nd</text><text x="213" y="210">3rd</text><text x="280" y="210">4th</text><text x="347" y="210">5th</text>
      <text x="413" y="210">6th</text><text x="480" y="210">7th</text><text x="547" y="210">8th</text><text x="613" y="210">9th</text><text x="680" y="210">10th</text>
    </g>
  </g>
  <path d="M80 235H680" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="260" font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">lowest</text>
  <text x="680" y="260" font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">highest</text>
</svg>
