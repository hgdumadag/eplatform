<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">Box plot showing IQR and outlier</title>
  <desc id="desc">A box plot labels Q1, median, Q3, IQR, whiskers, and a possible high outlier.</desc>
  <rect width="920" height="320" fill="#ffffff"/>
  <text x="46" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Box plot view of an outlier</text>
  <text x="46" y="78" font-family="Arial, sans-serif" font-size="16" fill="#475569">The box is the IQR: the middle half of the data.</text>
  <line x1="80" y1="230" x2="840" y2="230" stroke="#334155" stroke-width="3"/>
  <g stroke="#334155" stroke-width="2" font-family="Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">
    <line x1="100" y1="222" x2="100" y2="238"/><text x="100" y="260">10</text>
    <line x1="250" y1="222" x2="250" y2="238"/><text x="250" y="260">20</text>
    <line x1="400" y1="222" x2="400" y2="238"/><text x="400" y="260">30</text>
    <line x1="550" y1="222" x2="550" y2="238"/><text x="550" y="260">40</text>
    <line x1="700" y1="222" x2="700" y2="238"/><text x="700" y="260">50</text>
    <line x1="850" y1="222" x2="850" y2="238"/><text x="850" y="260">60</text>
  </g>
  <line x1="220" y1="160" x2="310" y2="160" stroke="#0f766e" stroke-width="4"/>
  <line x1="460" y1="160" x2="610" y2="160" stroke="#0f766e" stroke-width="4"/>
  <line x1="220" y1="135" x2="220" y2="185" stroke="#0f766e" stroke-width="4"/>
  <line x1="610" y1="135" x2="610" y2="185" stroke="#0f766e" stroke-width="4"/>
  <rect x="310" y="120" width="150" height="80" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>
  <line x1="385" y1="120" x2="385" y2="200" stroke="#0f766e" stroke-width="4"/>
  <circle cx="805" cy="160" r="11" fill="#dc2626"/>
  <text x="310" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">Q1</text>
  <text x="385" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">Median</text>
  <text x="460" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">Q3</text>
  <text x="385" y="222" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f766e" text-anchor="middle">IQR = Q3 - Q1</text>
  <text x="805" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">possible outlier</text>
</svg>
