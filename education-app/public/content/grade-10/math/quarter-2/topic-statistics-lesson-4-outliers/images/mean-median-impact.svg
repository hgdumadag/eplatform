<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Mean and median impact comparison</title>
  <desc id="desc">Two bar charts compare mean and median with and without a high outlier.</desc>
  <rect width="920" height="360" fill="#ffffff"/>
  <text x="46" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Outliers often pull the mean</text>
  <text x="46" y="78" font-family="Arial, sans-serif" font-size="16" fill="#475569">A high outlier changes the mean more than the median in this data set.</text>
  <line x1="90" y1="295" x2="830" y2="295" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="120" x2="90" y2="295" stroke="#334155" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="end">
    <text x="80" y="300">0</text>
    <text x="80" y="242">10</text>
    <text x="80" y="184">20</text>
    <text x="80" y="126">30</text>
  </g>
  <rect x="170" y="142" width="95" height="153" fill="#2563eb"/>
  <rect x="285" y="166" width="95" height="129" fill="#38bdf8"/>
  <rect x="535" y="161" width="95" height="134" fill="#2563eb"/>
  <rect x="650" y="167" width="95" height="128" fill="#38bdf8"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="217" y="132" font-size="15" font-weight="700" fill="#1e40af">26.4</text>
    <text x="332" y="156" font-size="15" font-weight="700" fill="#0369a1">22.3</text>
    <text x="582" y="151" font-size="15" font-weight="700" fill="#1e40af">23</text>
    <text x="697" y="157" font-size="15" font-weight="700" fill="#0369a1">22</text>
    <text x="275" y="326" font-size="17" font-weight="700" fill="#0f172a">Mean</text>
    <text x="640" y="326" font-size="17" font-weight="700" fill="#0f172a">Median</text>
    <text x="217" y="314" font-size="13" fill="#334155">with 55</text>
    <text x="332" y="314" font-size="13" fill="#334155">without 55</text>
    <text x="582" y="314" font-size="13" fill="#334155">with 55</text>
    <text x="697" y="314" font-size="13" fill="#334155">without 55</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#334155">
    <rect x="745" y="110" width="18" height="18" fill="#2563eb"/><text x="772" y="124">Includes outlier</text>
    <rect x="745" y="140" width="18" height="18" fill="#38bdf8"/><text x="772" y="154">Outlier removed</text>
  </g>
</svg>
