<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Outlier decision flow</title>
  <desc id="desc">A five-step flowchart for identifying and interpreting possible outliers.</desc>
  <rect width="920" height="360" fill="#f8fafc"/>
  <text x="46" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Outlier decision flow</text>
  <text x="46" y="78" font-family="Arial, sans-serif" font-size="16" fill="#475569">Follow the same routine so the conclusion is based on evidence.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="48" y="132" width="142" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="119" y="166" font-size="16" font-weight="700" fill="#1e3a8a">1. Order</text>
    <text x="119" y="191" font-size="13" fill="#1e3a8a">least to greatest</text>
    <rect x="220" y="132" width="142" height="92" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="291" y="161" font-size="16" font-weight="700" fill="#075985">2. Quartiles</text>
    <text x="291" y="186" font-size="13" fill="#075985">find Q1 and Q3</text>
    <rect x="392" y="132" width="142" height="92" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <text x="463" y="161" font-size="16" font-weight="700" fill="#115e59">3. IQR</text>
    <text x="463" y="186" font-size="13" fill="#115e59">Q3 - Q1</text>
    <rect x="564" y="132" width="142" height="92" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="635" y="161" font-size="16" font-weight="700" fill="#92400e">4. Fences</text>
    <text x="635" y="186" font-size="13" fill="#92400e">lower and upper</text>
    <rect x="736" y="132" width="142" height="92" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="807" y="161" font-size="16" font-weight="700" fill="#991b1b">5. Interpret</text>
    <text x="807" y="186" font-size="13" fill="#991b1b">what changed?</text>
  </g>
  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="178" x2="214" y2="178"/>
    <line x1="362" y1="178" x2="386" y2="178"/>
    <line x1="534" y1="178" x2="558" y2="178"/>
    <line x1="706" y1="178" x2="730" y2="178"/>
  </g>
  <text x="460" y="286" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Flagged values are starting points for questions, not automatic deletions.</text>
</svg>
