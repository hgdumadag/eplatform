<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">Dot plot with one unusually long delivery time</title>
  <desc id="desc">Delivery times cluster from 18 to 26 minutes, with one separated value at 55 minutes.</desc>
  <rect width="920" height="320" fill="#f8fafc"/>
  <text x="46" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Delivery times, in minutes</text>
  <text x="46" y="78" font-family="Arial, sans-serif" font-size="16" fill="#475569">Most values form a cluster. One value sits far away and deserves investigation.</text>
  <line x1="70" y1="220" x2="830" y2="220" stroke="#334155" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">
    <line x1="90" y1="212" x2="90" y2="228" stroke="#334155" stroke-width="2"/><text x="90" y="250">15</text>
    <line x1="190" y1="212" x2="190" y2="228" stroke="#334155" stroke-width="2"/><text x="190" y="250">20</text>
    <line x1="290" y1="212" x2="290" y2="228" stroke="#334155" stroke-width="2"/><text x="290" y="250">25</text>
    <line x1="390" y1="212" x2="390" y2="228" stroke="#334155" stroke-width="2"/><text x="390" y="250">30</text>
    <line x1="490" y1="212" x2="490" y2="228" stroke="#334155" stroke-width="2"/><text x="490" y="250">35</text>
    <line x1="590" y1="212" x2="590" y2="228" stroke="#334155" stroke-width="2"/><text x="590" y="250">40</text>
    <line x1="690" y1="212" x2="690" y2="228" stroke="#334155" stroke-width="2"/><text x="690" y="250">45</text>
    <line x1="790" y1="212" x2="790" y2="228" stroke="#334155" stroke-width="2"/><text x="790" y="250">50</text>
    <line x1="850" y1="212" x2="850" y2="228" stroke="#334155" stroke-width="2"/><text x="850" y="250">55</text>
  </g>
  <g fill="#2563eb" stroke="#1e40af" stroke-width="3">
    <circle cx="150" cy="185" r="12"/>
    <circle cx="190" cy="185" r="12"/>
    <circle cx="210" cy="185" r="12"/>
    <circle cx="230" cy="185" r="12"/>
    <circle cx="270" cy="185" r="12"/>
    <circle cx="290" cy="185" r="12"/>
    <circle cx="310" cy="185" r="12"/>
  </g>
  <circle cx="850" cy="185" r="14" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
  <path d="M332 168 C450 106, 640 106, 816 168" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="230" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e40af" text-anchor="middle">main cluster</text>
  <text x="850" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#991b1b" text-anchor="middle">55</text>
  <text x="850" y="278" font-family="Arial, sans-serif" font-size="15" fill="#991b1b" text-anchor="middle">possible outlier</text>
</svg>
