<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Box-and-whisker plot for reading minutes</title>
  <desc id="desc">A scaled box plot with minimum 10, Q1 13.5, median 20, Q3 25, and maximum 30.</desc>
  <rect width="900" height="360" fill="#f8fafc"/>
  <rect x="42" y="34" width="816" height="292" rx="18" fill="#ffffff" stroke="#d8dee9"/>
  <text x="72" y="78" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243447">Daily reading minutes</text>
  <text x="72" y="108" font-family="Arial, sans-serif" font-size="15" fill="#52616f">Five-number summary: 10, 13.5, 20, 25, 30</text>
  <line x1="120" y1="250" x2="780" y2="250" stroke="#2f3a45" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#2f3a45" text-anchor="middle">
    <g>
      <line x1="120" y1="242" x2="120" y2="258" stroke="#2f3a45" stroke-width="2"/>
      <text x="120" y="283">10</text>
    </g>
    <g>
      <line x1="285" y1="242" x2="285" y2="258" stroke="#2f3a45" stroke-width="2"/>
      <text x="285" y="283">15</text>
    </g>
    <g>
      <line x1="450" y1="242" x2="450" y2="258" stroke="#2f3a45" stroke-width="2"/>
      <text x="450" y="283">20</text>
    </g>
    <g>
      <line x1="615" y1="242" x2="615" y2="258" stroke="#2f3a45" stroke-width="2"/>
      <text x="615" y="283">25</text>
    </g>
    <g>
      <line x1="780" y1="242" x2="780" y2="258" stroke="#2f3a45" stroke-width="2"/>
      <text x="780" y="283">30</text>
    </g>
  </g>
  <line x1="120" y1="174" x2="236" y2="174" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
  <line x1="615" y1="174" x2="780" y2="174" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
  <rect x="236" y="132" width="379" height="84" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <line x1="450" y1="124" x2="450" y2="224" stroke="#ef4444" stroke-width="5"/>
  <line x1="120" y1="144" x2="120" y2="204" stroke="#2563eb" stroke-width="5"/>
  <line x1="780" y1="144" x2="780" y2="204" stroke="#2563eb" stroke-width="5"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">
    <text x="120" y="132">min 10</text>
    <text x="236" y="118">Q1 13.5</text>
    <text x="450" y="112">median 20</text>
    <text x="615" y="118">Q3 25</text>
    <text x="780" y="132">max 30</text>
  </g>
</svg>
