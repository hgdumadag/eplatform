<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">Box plot shape comparison</title>
  <desc id="desc">Two box plots compare balanced spread with right-skewed spread.</desc>
  <rect width="900" height="400" fill="#fafaf9"/>
  <text x="48" y="55" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2937">Read spread from the shape</text>
  <g font-family="Arial, sans-serif">
    <rect x="58" y="86" width="784" height="116" rx="14" fill="#ffffff" stroke="#d6d3d1"/>
    <text x="82" y="120" font-size="18" font-weight="700" fill="#334155">Balanced spread</text>
    <line x1="250" y1="156" x2="760" y2="156" stroke="#334155" stroke-width="2"/>
    <line x1="250" y1="146" x2="250" y2="166" stroke="#334155" stroke-width="2"/>
    <line x1="760" y1="146" x2="760" y2="166" stroke="#334155" stroke-width="2"/>
    <line x1="250" y1="156" x2="360" y2="156" stroke="#0891b2" stroke-width="5" stroke-linecap="round"/>
    <line x1="640" y1="156" x2="760" y2="156" stroke="#0891b2" stroke-width="5" stroke-linecap="round"/>
    <rect x="360" y="132" width="280" height="48" rx="5" fill="#cffafe" stroke="#0891b2" stroke-width="4"/>
    <line x1="500" y1="126" x2="500" y2="186" stroke="#dc2626" stroke-width="4"/>
    <text x="82" y="177" font-size="15" fill="#475569">Median is near the center and whiskers are similar.</text>
    <rect x="58" y="226" width="784" height="116" rx="14" fill="#ffffff" stroke="#d6d3d1"/>
    <text x="82" y="260" font-size="18" font-weight="700" fill="#334155">Right-skewed spread</text>
    <line x1="250" y1="296" x2="760" y2="296" stroke="#334155" stroke-width="2"/>
    <line x1="250" y1="286" x2="250" y2="306" stroke="#334155" stroke-width="2"/>
    <line x1="760" y1="286" x2="760" y2="306" stroke="#334155" stroke-width="2"/>
    <line x1="250" y1="296" x2="330" y2="296" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
    <line x1="520" y1="296" x2="760" y2="296" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
    <rect x="330" y="272" width="190" height="48" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
    <line x1="405" y1="266" x2="405" y2="326" stroke="#dc2626" stroke-width="4"/>
    <text x="82" y="317" font-size="15" fill="#475569">Long right side means high values are more spread out.</text>
  </g>
</svg>
