<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Box plot construction steps</title>
  <desc id="desc">Three panels showing a number line, marked five-number summary, and completed box plot.</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="46" y="54" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2937">Build the plot in three moves</text>
  <g font-family="Arial, sans-serif">
    <rect x="48" y="86" width="804" height="82" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <text x="72" y="116" font-size="17" font-weight="700" fill="#334155">1. Draw a scale</text>
    <line x1="250" y1="130" x2="790" y2="130" stroke="#334155" stroke-width="3"/>
    <g font-size="13" fill="#334155" text-anchor="middle">
      <line x1="250" y1="122" x2="250" y2="138" stroke="#334155" stroke-width="2"/><text x="250" y="156">10</text>
      <line x1="385" y1="122" x2="385" y2="138" stroke="#334155" stroke-width="2"/><text x="385" y="156">15</text>
      <line x1="520" y1="122" x2="520" y2="138" stroke="#334155" stroke-width="2"/><text x="520" y="156">20</text>
      <line x1="655" y1="122" x2="655" y2="138" stroke="#334155" stroke-width="2"/><text x="655" y="156">25</text>
      <line x1="790" y1="122" x2="790" y2="138" stroke="#334155" stroke-width="2"/><text x="790" y="156">30</text>
    </g>
    <rect x="48" y="188" width="804" height="82" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <text x="72" y="218" font-size="17" font-weight="700" fill="#334155">2. Mark the five values</text>
    <line x1="250" y1="232" x2="790" y2="232" stroke="#334155" stroke-width="3"/>
    <g fill="#7c3aed">
      <circle cx="250" cy="232" r="7"/>
      <circle cx="344.5" cy="232" r="7"/>
      <circle cx="520" cy="232" r="7"/>
      <circle cx="655" cy="232" r="7"/>
      <circle cx="790" cy="232" r="7"/>
    </g>
    <g font-size="13" fill="#334155" text-anchor="middle">
      <text x="250" y="257">min</text><text x="344.5" y="257">Q1</text><text x="520" y="257">median</text><text x="655" y="257">Q3</text><text x="790" y="257">max</text>
    </g>
    <rect x="48" y="290" width="804" height="82" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <text x="72" y="320" font-size="17" font-weight="700" fill="#334155">3. Draw box, median, and whiskers</text>
    <line x1="250" y1="334" x2="344.5" y2="334" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
    <line x1="655" y1="334" x2="790" y2="334" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
    <rect x="344.5" y="312" width="310.5" height="44" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
    <line x1="520" y1="308" x2="520" y2="360" stroke="#ef4444" stroke-width="4"/>
    <line x1="250" y1="314" x2="250" y2="354" stroke="#7c3aed" stroke-width="4"/>
    <line x1="790" y1="314" x2="790" y2="354" stroke="#7c3aed" stroke-width="4"/>
  </g>
</svg>
