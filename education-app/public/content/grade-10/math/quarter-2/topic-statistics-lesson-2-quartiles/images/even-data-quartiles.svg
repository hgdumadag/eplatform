<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
  <title id="title">Even data quartiles</title>
  <desc id="desc">Eight ordered data values show Q2 halfway between 18 and 21, with Q1 and Q3 found from each half.</desc>
  <rect width="920" height="340" fill="#ffffff"/>
  <text x="50" y="44" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Even number of values</text>
  <text x="50" y="74" font-family="Arial, sans-serif" font-size="16" fill="#475569">Average the two middle values for Q2, then use each half.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="18">
    <g transform="translate(95 125)"><rect width="78" height="54" rx="8" fill="#dbeafe"/><text x="39" y="35">10</text></g>
    <g transform="translate(185 125)"><rect width="78" height="54" rx="8" fill="#bfdbfe"/><text x="39" y="35">14</text></g>
    <g transform="translate(275 125)"><rect width="78" height="54" rx="8" fill="#bfdbfe"/><text x="39" y="35">15</text></g>
    <g transform="translate(365 125)"><rect width="78" height="54" rx="8" fill="#dbeafe"/><text x="39" y="35">18</text></g>
    <g transform="translate(477 125)"><rect width="78" height="54" rx="8" fill="#fef3c7"/><text x="39" y="35">21</text></g>
    <g transform="translate(567 125)"><rect width="78" height="54" rx="8" fill="#fde68a"/><text x="39" y="35">25</text></g>
    <g transform="translate(657 125)"><rect width="78" height="54" rx="8" fill="#fde68a"/><text x="39" y="35">27</text></g>
    <g transform="translate(747 125)"><rect width="78" height="54" rx="8" fill="#fef3c7"/><text x="39" y="35">32</text></g>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <line x1="454" y1="104" x2="454" y2="260" stroke="#047857" stroke-width="4" stroke-dasharray="8 8"/>
    <text x="454" y="290" font-size="18" font-weight="700" fill="#047857">Q2 = (18 + 21) / 2 = 19.5</text>
    <path d="M224 195 L314 195" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <text x="269" y="226" font-size="17" font-weight="700" fill="#1d4ed8">Q1 = 14.5</text>
    <path d="M606 195 L696 195" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
    <text x="651" y="226" font-size="17" font-weight="700" fill="#b45309">Q3 = 26</text>
  </g>
</svg>
