<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">Ordered scores divided into quartile regions</title>
  <desc id="desc">A horizontal ordered data strip showing Q1, Q2, and Q3 as boundaries that divide data into four parts.</desc>
  <rect width="920" height="320" fill="#f8fafc"/>
  <text x="52" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Quartiles split ordered data into four parts</text>
  <text x="52" y="78" font-family="Arial, sans-serif" font-size="16" fill="#475569">Order first, then mark Q1, Q2, and Q3.</text>
  <g transform="translate(70 126)">
    <rect x="0" y="48" width="780" height="28" rx="14" fill="#dbeafe"/>
    <rect x="0" y="48" width="195" height="28" rx="14" fill="#bfdbfe"/>
    <rect x="195" y="48" width="195" height="28" fill="#a7f3d0"/>
    <rect x="390" y="48" width="195" height="28" fill="#fde68a"/>
    <rect x="585" y="48" width="195" height="28" rx="14" fill="#fecaca"/>
    <line x1="195" y1="25" x2="195" y2="110" stroke="#1e40af" stroke-width="4"/>
    <line x1="390" y1="25" x2="390" y2="110" stroke="#047857" stroke-width="4"/>
    <line x1="585" y1="25" x2="585" y2="110" stroke="#b45309" stroke-width="4"/>
    <text x="183" y="18" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e40af">Q1</text>
    <text x="378" y="18" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#047857">Q2</text>
    <text x="573" y="18" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309">Q3</text>
    <text x="68" y="102" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">lowest 25%</text>
    <text x="258" y="102" font-family="Arial, sans-serif" font-size="15" fill="#065f46">next 25%</text>
    <text x="454" y="102" font-family="Arial, sans-serif" font-size="15" fill="#92400e">next 25%</text>
    <text x="646" y="102" font-family="Arial, sans-serif" font-size="15" fill="#991b1b">highest 25%</text>
    <text x="0" y="145" font-family="Arial, sans-serif" font-size="16" fill="#334155">minimum</text>
    <text x="720" y="145" font-family="Arial, sans-serif" font-size="16" fill="#334155">maximum</text>
  </g>
</svg>
