<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">IQR fences and possible outliers</title>
  <desc id="desc">A number line showing lower and upper fences around Q1 and Q3, with one possible outlier beyond the upper fence.</desc>
  <rect width="960" height="420" fill="#f8fafc"/>
  <text x="58" y="62" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">IQR can help flag unusual values</text>
  <text x="58" y="98" font-family="Arial, sans-serif" font-size="18" fill="#475569">Later, outlier fences are built from 1.5 x IQR.</text>
  <line x1="110" y1="235" x2="850" y2="235" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <rect x="360" y="190" width="190" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <line x1="455" y1="190" x2="455" y2="280" stroke="#475569" stroke-width="4"/>
  <line x1="230" y1="155" x2="230" y2="315" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 9"/>
  <line x1="720" y1="155" x2="720" y2="315" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 9"/>
  <circle cx="805" cy="235" r="13" fill="#dc2626"/>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <text x="230" y="140" fill="#b45309">lower fence</text>
    <text x="360" y="174" fill="#15803d">Q1</text>
    <text x="550" y="174" fill="#15803d">Q3</text>
    <text x="720" y="140" fill="#b45309">upper fence</text>
    <text x="805" y="205" fill="#b91c1c">possible outlier</text>
  </g>
  <path d="M360 326 C400 348 510 348 550 326" fill="none" stroke="#16a34a" stroke-width="4"/>
  <text x="455" y="370" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#166534">IQR</text>
</svg>
