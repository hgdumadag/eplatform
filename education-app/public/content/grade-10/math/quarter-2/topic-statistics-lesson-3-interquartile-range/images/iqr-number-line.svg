<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">IQR on a number line</title>
  <desc id="desc">A number line from 8 to 30 with Q1 at 12, median at 18, Q3 at 23.5, and the IQR distance highlighted.</desc>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="56" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">IQR is the distance from Q1 to Q3</text>
  <line x1="96" y1="190" x2="864" y2="190" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#94a3b8" stroke-width="2" font-family="Arial, sans-serif" font-size="16" fill="#475569" text-anchor="middle">
    <line x1="160" y1="178" x2="160" y2="202"/>
    <text x="160" y="230">10</text>
    <line x1="300" y1="178" x2="300" y2="202"/>
    <text x="300" y="230">14</text>
    <line x1="440" y1="178" x2="440" y2="202"/>
    <text x="440" y="230">18</text>
    <line x1="580" y1="178" x2="580" y2="202"/>
    <text x="580" y="230">22</text>
    <line x1="720" y1="178" x2="720" y2="202"/>
    <text x="720" y="230">26</text>
  </g>
  <line x1="230" y1="118" x2="633" y2="118" stroke="#16a34a" stroke-width="12" stroke-linecap="round"/>
  <circle cx="230" cy="190" r="11" fill="#2563eb"/>
  <line x1="230" y1="108" x2="230" y2="204" stroke="#2563eb" stroke-width="4"/>
  <text x="230" y="92" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1d4ed8">Q1 = 12</text>
  <circle cx="440" cy="190" r="9" fill="#64748b"/>
  <line x1="440" y1="142" x2="440" y2="204" stroke="#64748b" stroke-width="3" stroke-dasharray="7 7"/>
  <text x="440" y="270" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#475569">median = 18</text>
  <circle cx="633" cy="190" r="11" fill="#2563eb"/>
  <line x1="633" y1="108" x2="633" y2="204" stroke="#2563eb" stroke-width="4"/>
  <text x="633" y="92" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1d4ed8">Q3 = 23.5</text>
  <text x="432" y="150" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#166534">IQR = 23.5 - 12 = 11.5</text>
</svg>
