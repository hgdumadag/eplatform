<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">IQR outlier fence diagram</title>
  <desc id="desc">A number line showing lower and upper fences with a possible outlier beyond the upper fence.</desc>
  <rect width="900" height="360" fill="#f8fafc"/>
  <rect x="42" y="34" width="816" height="292" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="76" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Use IQR fences to check unusual values</text>
  <text x="72" y="108" font-family="Arial, sans-serif" font-size="16" fill="#475569">Values outside the fences are possible outliers and need attention.</text>
  <line x1="110" y1="210" x2="790" y2="210" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#94a3b8" stroke-width="2" font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">
    <line x1="140" y1="196" x2="140" y2="224"/>
    <text x="140" y="248">0</text>
    <line x1="310" y1="196" x2="310" y2="224"/>
    <text x="310" y="248">50</text>
    <line x1="480" y1="196" x2="480" y2="224"/>
    <text x="480" y="248">100</text>
    <line x1="650" y1="196" x2="650" y2="224"/>
    <text x="650" y="248">150</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <line x1="184" y1="170" x2="184" y2="235" stroke="#f97316" stroke-width="4"/>
    <rect x="123" y="132" width="122" height="34" rx="6" fill="#ffedd5" stroke="#f97316"/>
    <text x="184" y="155" font-size="16" font-weight="700" fill="#9a3412">lower fence 13</text>
    <line x1="538" y1="170" x2="538" y2="235" stroke="#f97316" stroke-width="4"/>
    <rect x="477" y="132" width="122" height="34" rx="6" fill="#ffedd5" stroke="#f97316"/>
    <text x="538" y="155" font-size="16" font-weight="700" fill="#9a3412">upper fence 117</text>
    <circle cx="548" cy="210" r="12" fill="#22c55e" stroke="#166534" stroke-width="3"/>
    <text x="548" y="288" font-size="15" fill="#166534">inside fence</text>
    <circle cx="820" cy="210" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="798" y="288" font-size="15" fill="#991b1b">120: possible outlier</text>
    <path d="M710 210 H804" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 7"/>
  </g>
</svg>
