<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Percentile rank model</title>
  <desc id="desc">A bar model showing values below or equal to a score and values above it.</desc>
  <rect width="900" height="360" fill="#f8fafc"/>
  <rect x="42" y="36" width="816" height="288" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="78" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Percentile rank compares a score with the group</text>
  <text x="72" y="112" font-family="Arial, sans-serif" font-size="16" fill="#475569">Example: 9 of 11 scores are at or below 74.</text>
  <g transform="translate(92 160)">
    <rect x="0" y="0" width="648" height="58" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <rect x="648" y="0" width="144" height="58" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <line x1="648" y1="-12" x2="648" y2="70" stroke="#111827" stroke-width="3"/>
    <text x="324" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1e3a8a">9 scores at or below 74</text>
    <text x="720" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#991b1b">2 above</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="416" y="260" font-size="24" font-weight="700" fill="#0f172a">9 / 11 x 100 = about 82</text>
    <text x="416" y="292" font-size="18" fill="#475569">The score 74 is at about the 82nd percentile.</text>
  </g>
  <g transform="translate(702 78)">
    <circle cx="42" cy="42" r="42" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="42" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#166534">Score</text>
    <text x="42" y="60" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#166534">74</text>
  </g>
</svg>
