<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Ordered scores with quartile positions</title>
  <desc id="desc">An ordered list of class scores with Q1, median, and Q3 highlighted.</desc>
  <rect width="900" height="360" fill="#f8fafc"/>
  <rect x="40" y="34" width="820" height="292" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Ordered scores reveal position</text>
  <text x="70" y="111" font-family="Arial, sans-serif" font-size="16" fill="#475569">Quartiles split the ordered data into lower, middle, and upper parts.</text>
  <line x1="95" y1="205" x2="805" y2="205" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#e0f2fe" stroke="#0284c7" stroke-width="2">
      <circle cx="95" cy="205" r="24"/>
      <circle cx="166" cy="205" r="24"/>
      <circle cx="237" cy="205" r="24"/>
      <circle cx="308" cy="205" r="24"/>
      <circle cx="379" cy="205" r="24"/>
      <circle cx="450" cy="205" r="24"/>
      <circle cx="521" cy="205" r="24"/>
      <circle cx="592" cy="205" r="24"/>
      <circle cx="663" cy="205" r="24"/>
      <circle cx="734" cy="205" r="24"/>
      <circle cx="805" cy="205" r="24"/>
    </g>
    <g fill="#0f172a" font-size="18" font-weight="700">
      <text x="95" y="212">42</text>
      <text x="166" y="212">48</text>
      <text x="237" y="212">52</text>
      <text x="308" y="212">55</text>
      <text x="379" y="212">60</text>
      <text x="450" y="212">64</text>
      <text x="521" y="212">68</text>
      <text x="592" y="212">70</text>
      <text x="663" y="212">74</text>
      <text x="734" y="212">78</text>
      <text x="805" y="212">82</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <path d="M237 175 L237 137" stroke="#f59e0b" stroke-width="3"/>
    <rect x="197" y="104" width="80" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="237" y="127" font-size="17" font-weight="700" fill="#92400e">Q1 = 52</text>
    <path d="M450 175 L450 137" stroke="#16a34a" stroke-width="3"/>
    <rect x="394" y="104" width="112" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="450" y="127" font-size="17" font-weight="700" fill="#166534">Median = 64</text>
    <path d="M734 175 L734 137" stroke="#7c3aed" stroke-width="3"/>
    <rect x="694" y="104" width="80" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="734" y="127" font-size="17" font-weight="700" fill="#5b21b6">Q3 = 78</text>
  </g>
  <path d="M237 260 H734" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
  <text x="486" y="296" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#991b1b">IQR = 78 - 52 = 26 points</text>
</svg>
