<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Ordered data line for measures of position</title>
  <desc id="desc">A horizontal line of twelve ordered scores from 42 to 92 with low, middle, and high position zones labeled.</desc>
  <rect width="960" height="360" fill="#f8fafc"/>
  <text x="48" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Measures of position start with ordered data</text>
  <text x="48" y="88" font-family="Arial, sans-serif" font-size="16" fill="#475569">Read positions from least to greatest before naming quartiles, deciles, or percentiles.</text>
  <line x1="92" y1="185" x2="868" y2="185" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <polygon points="872,185 850,174 850,196" fill="#334155"/>
  <rect x="86" y="136" width="208" height="98" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="376" y="136" width="208" height="98" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <rect x="666" y="136" width="208" height="98" rx="8" fill="#fee2e2" stroke="#f87171"/>
  <text x="156" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">lower positions</text>
  <text x="452" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#15803d">middle positions</text>
  <text x="735" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">higher positions</text>
  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#0f172a">
    <circle cx="110" cy="185" r="17" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="110" y="191">42</text>
    <circle cx="178" cy="185" r="17" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="178" y="191">48</text>
    <circle cx="246" cy="185" r="17" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="246" y="191">55</text>
    <circle cx="314" cy="185" r="17" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="314" y="191">61</text>
    <circle cx="382" cy="185" r="17" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="382" y="191">64</text>
    <circle cx="450" cy="185" r="17" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="450" y="191">68</text>
    <circle cx="518" cy="185" r="17" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="518" y="191">72</text>
    <circle cx="586" cy="185" r="17" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="586" y="191">75</text>
    <circle cx="654" cy="185" r="17" fill="#ffffff" stroke="#c2410c" stroke-width="3"/><text x="654" y="191">80</text>
    <circle cx="722" cy="185" r="17" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><text x="722" y="191">84</text>
    <circle cx="790" cy="185" r="17" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><text x="790" y="191">88</text>
    <circle cx="858" cy="185" r="17" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><text x="858" y="191">92</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#475569">
    <text x="110" y="255">1st</text><text x="178" y="255">2nd</text><text x="246" y="255">3rd</text><text x="314" y="255">4th</text>
    <text x="382" y="255">5th</text><text x="450" y="255">6th</text><text x="518" y="255">7th</text><text x="586" y="255">8th</text>
    <text x="654" y="255">9th</text><text x="722" y="255">10th</text><text x="790" y="255">11th</text><text x="858" y="255">12th</text>
  </g>
  <text x="480" y="318" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Position tells where a value stands inside the ordered group.</text>
</svg>
