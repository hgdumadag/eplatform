<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Quartile map</title>
  <desc id="desc">A bar divided into four equal sections with Q1, Q2, and Q3 marked as cut points.</desc>
  <rect width="960" height="360" fill="#fff7ed"/>
  <text x="48" y="56" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#7c2d12">Quartiles divide ordered data into four parts</text>
  <text x="48" y="91" font-family="Arial, sans-serif" font-size="16" fill="#9a3412">The cut points are Q1, Q2, and Q3. Q2 is the median.</text>
  <g transform="translate(90 150)">
    <rect x="0" y="0" width="780" height="92" rx="10" fill="#ffffff" stroke="#9a3412" stroke-width="3"/>
    <rect x="0" y="0" width="195" height="92" rx="10" fill="#fed7aa"/>
    <rect x="195" y="0" width="195" height="92" fill="#fdba74"/>
    <rect x="390" y="0" width="195" height="92" fill="#fb923c"/>
    <rect x="585" y="0" width="195" height="92" rx="10" fill="#f97316"/>
    <g stroke="#7c2d12" stroke-width="4">
      <line x1="195" y1="-25" x2="195" y2="122"/>
      <line x1="390" y1="-25" x2="390" y2="122"/>
      <line x1="585" y1="-25" x2="585" y2="122"/>
    </g>
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <text x="97.5" y="54" font-size="18" font-weight="700" fill="#7c2d12">lowest 25%</text>
      <text x="292.5" y="54" font-size="18" font-weight="700" fill="#7c2d12">next 25%</text>
      <text x="487.5" y="54" font-size="18" font-weight="700" fill="#7c2d12">next 25%</text>
      <text x="682.5" y="54" font-size="18" font-weight="700" fill="#ffffff">highest 25%</text>
      <text x="195" y="-40" font-size="22" font-weight="700" fill="#7c2d12">Q1 = P25</text>
      <text x="390" y="-40" font-size="22" font-weight="700" fill="#7c2d12">Q2 = P50</text>
      <text x="585" y="-40" font-size="22" font-weight="700" fill="#7c2d12">Q3 = P75</text>
    </g>
  </g>
  <text x="480" y="314" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#7c2d12">Quartiles help describe lower, middle, and upper positions quickly.</text>
</svg>
