<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Locator formula flow</title>
  <desc id="desc">A three-step flowchart for choosing a measure, computing the locator, and interpreting the neighboring values.</desc>
  <rect width="960" height="360" fill="#f8fafc"/>
  <text x="48" y="56" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Locator formulas turn a measure into a position</text>
  <text x="48" y="91" font-family="Arial, sans-serif" font-size="16" fill="#475569">Use the locator to find where to look in the ordered list.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <rect x="62" y="138" width="235" height="124" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <text x="179.5" y="174" text-anchor="middle" font-size="21" font-weight="700" fill="#134e4a">1. Choose</text>
    <text x="179.5" y="205" text-anchor="middle" font-size="16" fill="#134e4a">Quartile, decile,</text>
    <text x="179.5" y="228" text-anchor="middle" font-size="16" fill="#134e4a">or percentile?</text>
    <line x1="312" y1="200" x2="374" y2="200" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="390" y="138" width="235" height="124" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="507.5" y="174" text-anchor="middle" font-size="21" font-weight="700" fill="#312e81">2. Compute L</text>
    <text x="507.5" y="204" text-anchor="middle" font-size="16" fill="#312e81">Example:</text>
    <text x="507.5" y="229" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81">P_k: L = k(n+1)/100</text>
    <line x1="640" y1="200" x2="702" y2="200" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="718" y="138" width="190" height="124" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="813" y="174" text-anchor="middle" font-size="21" font-weight="700" fill="#78350f">3. Interpret</text>
    <text x="813" y="205" text-anchor="middle" font-size="16" fill="#78350f">Whole number:</text>
    <text x="813" y="227" text-anchor="middle" font-size="16" fill="#78350f">use that position</text>
    <text x="813" y="249" text-anchor="middle" font-size="16" fill="#78350f">Decimal: between two</text>
  </g>
  <text x="480" y="318" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">A locator is a position instruction, not a final explanation.</text>
</svg>
