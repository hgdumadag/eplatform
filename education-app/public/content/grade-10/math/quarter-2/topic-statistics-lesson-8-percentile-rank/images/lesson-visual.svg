<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Percentile rank overview</title>
  <desc id="desc">A four-step overview: order scores, count below the target, calculate the percentile rank, and interpret the result.</desc>
  <rect width="960" height="420" fill="#f8fafc"/>
  <rect x="40" y="38" width="880" height="344" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="88" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827">Statistics - Lesson 8: Percentile Rank</text>
  <text x="70" y="124" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">How a score stands compared with the rest of the data set</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="166" width="180" height="138" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="160" y="198" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">1. Order</text>
    <text x="160" y="230" text-anchor="middle" font-size="15" fill="#0f172a">60 64 68 70</text>
    <text x="160" y="255" text-anchor="middle" font-size="15" fill="#0f172a">75 78 82 86</text>
    <text x="160" y="280" text-anchor="middle" font-size="15" fill="#0f172a">90 94</text>
    <rect x="285" y="166" width="180" height="138" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="375" y="198" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">2. Count Below</text>
    <text x="375" y="238" text-anchor="middle" font-size="32" font-weight="700" fill="#14532d">6</text>
    <text x="375" y="270" text-anchor="middle" font-size="15" fill="#0f172a">scores below 82</text>
    <rect x="500" y="166" width="180" height="138" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="590" y="198" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">3. Calculate</text>
    <text x="590" y="238" text-anchor="middle" font-size="24" font-weight="700" fill="#78350f">6/10 x 100</text>
    <text x="590" y="270" text-anchor="middle" font-size="24" font-weight="700" fill="#78350f">= 60</text>
    <rect x="715" y="166" width="160" height="138" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="795" y="198" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">4. Explain</text>
    <text x="795" y="234" text-anchor="middle" font-size="15" fill="#0f172a">82 is higher</text>
    <text x="795" y="257" text-anchor="middle" font-size="15" fill="#0f172a">than 60% of</text>
    <text x="795" y="280" text-anchor="middle" font-size="15" fill="#0f172a">the scores.</text>
    <path d="M255 235 H280" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M470 235 H495" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M685 235 H710" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
