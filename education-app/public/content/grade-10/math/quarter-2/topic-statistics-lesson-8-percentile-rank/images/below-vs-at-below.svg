<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Below-score versus at-or-below conventions</title>
  <desc id="desc">Two side-by-side panels compare counting scores below 82 with counting scores at or below 82.</desc>
  <rect width="960" height="420" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">Two counting conventions can give different ranks</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="92" width="400" height="266" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="260" y="130" font-size="22" font-weight="700" text-anchor="middle" fill="#155e75">Below-score convention</text>
    <text x="260" y="162" font-size="16" text-anchor="middle" fill="#334155">Count values strictly less than 82</text>
    <g font-size="15" text-anchor="middle">
      <rect x="98" y="198" width="42" height="34" rx="5" fill="#06b6d4"/><text x="119" y="220" fill="#fff">60</text>
      <rect x="145" y="198" width="42" height="34" rx="5" fill="#06b6d4"/><text x="166" y="220" fill="#fff">64</text>
      <rect x="192" y="198" width="42" height="34" rx="5" fill="#06b6d4"/><text x="213" y="220" fill="#fff">68</text>
      <rect x="239" y="198" width="42" height="34" rx="5" fill="#06b6d4"/><text x="260" y="220" fill="#fff">70</text>
      <rect x="286" y="198" width="42" height="34" rx="5" fill="#06b6d4"/><text x="307" y="220" fill="#fff">75</text>
      <rect x="333" y="198" width="42" height="34" rx="5" fill="#06b6d4"/><text x="354" y="220" fill="#fff">78</text>
      <rect x="380" y="198" width="42" height="34" rx="5" fill="#fca5a5" stroke="#dc2626"/><text x="401" y="220" fill="#7f1d1d">82</text>
    </g>
    <text x="260" y="278" font-size="26" font-weight="700" text-anchor="middle" fill="#164e63">6/10 x 100 = 60</text>
    <text x="260" y="316" font-size="20" text-anchor="middle" fill="#164e63">60th percentile</text>
    <rect x="500" y="92" width="400" height="266" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="700" y="130" font-size="22" font-weight="700" text-anchor="middle" fill="#9a3412">At-or-below convention</text>
    <text x="700" y="162" font-size="16" text-anchor="middle" fill="#334155">Count values less than or equal to 82</text>
    <g font-size="15" text-anchor="middle">
      <rect x="538" y="198" width="42" height="34" rx="5" fill="#f97316"/><text x="559" y="220" fill="#fff">60</text>
      <rect x="585" y="198" width="42" height="34" rx="5" fill="#f97316"/><text x="606" y="220" fill="#fff">64</text>
      <rect x="632" y="198" width="42" height="34" rx="5" fill="#f97316"/><text x="653" y="220" fill="#fff">68</text>
      <rect x="679" y="198" width="42" height="34" rx="5" fill="#f97316"/><text x="700" y="220" fill="#fff">70</text>
      <rect x="726" y="198" width="42" height="34" rx="5" fill="#f97316"/><text x="747" y="220" fill="#fff">75</text>
      <rect x="773" y="198" width="42" height="34" rx="5" fill="#f97316"/><text x="794" y="220" fill="#fff">78</text>
      <rect x="820" y="198" width="42" height="34" rx="5" fill="#f97316" stroke="#9a3412"/><text x="841" y="220" fill="#fff">82</text>
    </g>
    <text x="700" y="278" font-size="26" font-weight="700" text-anchor="middle" fill="#9a3412">7/10 x 100 = 70</text>
    <text x="700" y="316" font-size="20" text-anchor="middle" fill="#9a3412">70th percentile</text>
  </g>
</svg>
