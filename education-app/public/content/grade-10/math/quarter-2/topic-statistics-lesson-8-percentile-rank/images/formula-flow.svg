<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Percentile rank formula flow</title>
  <desc id="desc">A flow diagram shows count below divided by total, then multiplied by 100, then written as a percentile rank.</desc>
  <rect width="960" height="360" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">Formula flow</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="70" y="110" width="180" height="104" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="160" y="146" font-size="18" font-weight="700" fill="#166534">Count below</text>
    <text x="160" y="184" font-size="34" font-weight="700" fill="#14532d">6</text>
    <rect x="310" y="110" width="180" height="104" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="400" y="146" font-size="18" font-weight="700" fill="#075985">Total values</text>
    <text x="400" y="184" font-size="34" font-weight="700" fill="#0c4a6e">10</text>
    <rect x="550" y="110" width="180" height="104" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="640" y="146" font-size="18" font-weight="700" fill="#92400e">Multiply</text>
    <text x="640" y="184" font-size="34" font-weight="700" fill="#78350f">x 100</text>
    <rect x="790" y="110" width="110" height="104" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="845" y="146" font-size="18" font-weight="700" fill="#5b21b6">Rank</text>
    <text x="845" y="184" font-size="30" font-weight="700" fill="#4c1d95">60</text>
    <path d="M256 162 H302" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="279" y="150" font-size="26" font-weight="700" fill="#334155">/</text>
    <path d="M496 162 H542" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M736 162 H782" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="234" y="260" width="492" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="480" y="295" font-size="22" font-weight="700" fill="#111827">6 / 10 x 100 = 60th percentile</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
