<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Percentile rank number line</title>
  <desc id="desc">An ordered number line highlights the six scores below 82 and marks 82 as the target score.</desc>
  <rect width="960" height="360" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">Count the values below the target score</text>
  <line x1="88" y1="180" x2="872" y2="180" stroke="#334155" stroke-width="4"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle">
    <g fill="#0f766e">
      <circle cx="120" cy="180" r="15"/><text x="120" y="222" fill="#0f172a">60</text>
      <circle cx="200" cy="180" r="15"/><text x="200" y="222" fill="#0f172a">64</text>
      <circle cx="280" cy="180" r="15"/><text x="280" y="222" fill="#0f172a">68</text>
      <circle cx="360" cy="180" r="15"/><text x="360" y="222" fill="#0f172a">70</text>
      <circle cx="440" cy="180" r="15"/><text x="440" y="222" fill="#0f172a">75</text>
      <circle cx="520" cy="180" r="15"/><text x="520" y="222" fill="#0f172a">78</text>
    </g>
    <circle cx="600" cy="180" r="22" fill="#dc2626"/>
    <text x="600" y="225" fill="#0f172a" font-weight="700">82</text>
    <g fill="#94a3b8">
      <circle cx="680" cy="180" r="15"/><text x="680" y="222" fill="#0f172a">86</text>
      <circle cx="760" cy="180" r="15"/><text x="760" y="222" fill="#0f172a">90</text>
      <circle cx="840" cy="180" r="15"/><text x="840" y="222" fill="#0f172a">94</text>
    </g>
  </g>
  <path d="M110 142 C220 102, 410 102, 528 142" fill="none" stroke="#0f766e" stroke-width="4"/>
  <text x="320" y="102" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0f766e">6 scores below 82</text>
  <path d="M600 146 V92" stroke="#dc2626" stroke-width="4"/>
  <text x="600" y="82" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#991b1b">target score</text>
  <rect x="278" y="270" width="404" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="480" y="301" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111827">Percentile rank = 6/10 x 100 = 60</text>
</svg>
