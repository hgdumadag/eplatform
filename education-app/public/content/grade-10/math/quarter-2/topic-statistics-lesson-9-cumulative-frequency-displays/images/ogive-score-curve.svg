<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Less-than ogive for quiz scores</title>
  <desc id="desc">An ogive showing cumulative frequencies plotted against upper class boundaries.</desc>
  <rect width="960" height="520" fill="#f8fafc"/>
  <rect x="52" y="36" width="856" height="448" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="82" y="82" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Less-than Ogive</text>
  <text x="82" y="112" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Plot upper class boundary on x, cumulative frequency on y.</text>

  <line x1="145" y1="410" x2="835" y2="410" stroke="#334155" stroke-width="3"/>
  <line x1="145" y1="410" x2="145" y2="145" stroke="#334155" stroke-width="3"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="145" y1="365" x2="835" y2="365"/>
    <line x1="145" y1="321" x2="835" y2="321"/>
    <line x1="145" y1="276" x2="835" y2="276"/>
    <line x1="145" y1="232" x2="835" y2="232"/>
    <line x1="145" y1="187" x2="835" y2="187"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">
    <text x="128" y="415" text-anchor="end">0</text>
    <text x="128" y="370" text-anchor="end">5</text>
    <text x="128" y="326" text-anchor="end">10</text>
    <text x="128" y="281" text-anchor="end">15</text>
    <text x="128" y="237" text-anchor="end">20</text>
    <text x="128" y="192" text-anchor="end">25</text>
    <text x="128" y="148" text-anchor="end">30</text>
    <text x="194" y="438" text-anchor="middle">49.5</text>
    <text x="310" y="438" text-anchor="middle">59.5</text>
    <text x="426" y="438" text-anchor="middle">69.5</text>
    <text x="542" y="438" text-anchor="middle">79.5</text>
    <text x="658" y="438" text-anchor="middle">89.5</text>
    <text x="774" y="438" text-anchor="middle">99.5</text>
  </g>
  <polyline points="194,392 310,356 426,303 542,214 658,161 774,143" fill="none" stroke="#dc2626" stroke-width="5"/>
  <g fill="#ffffff" stroke="#dc2626" stroke-width="4">
    <circle cx="194" cy="392" r="7"/>
    <circle cx="310" cy="356" r="7"/>
    <circle cx="426" cy="303" r="7"/>
    <circle cx="542" cy="214" r="7"/>
    <circle cx="658" cy="161" r="7"/>
    <circle cx="774" cy="143" r="7"/>
  </g>
  <text x="490" y="474" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Upper class boundary</text>
  <text x="86" y="286" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a" transform="rotate(-90 86 286)">Cumulative frequency</text>
  <rect x="620" y="248" width="205" height="70" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="642" y="276" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#9a3412">Reading point</text>
  <text x="642" y="300" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#431407">At 79.5, cumulative</text>
  <text x="642" y="319" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#431407">frequency is 22.</text>
</svg>
