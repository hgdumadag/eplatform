<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Running total cumulative frequency table</title>
  <desc id="desc">A table for quiz score intervals showing frequencies and less-than cumulative frequencies.</desc>
  <rect width="960" height="520" fill="#f8fafc"/>
  <rect x="45" y="36" width="870" height="448" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="75" y="82" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Build the Running Total</text>
  <text x="75" y="112" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Each cumulative value equals the previous cumulative value plus the next frequency.</text>

  <rect x="85" y="150" width="790" height="46" fill="#1d4ed8"/>
  <text x="115" y="180" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Score interval</text>
  <text x="370" y="180" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Frequency</text>
  <text x="615" y="180" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Less-than cumulative frequency</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a">
    <rect x="85" y="196" width="790" height="42" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="120" y="223">40-49</text><text x="415" y="223">2</text><text x="690" y="223">2</text>
    <rect x="85" y="238" width="790" height="42" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="120" y="265">50-59</text><text x="415" y="265">4</text><text x="657" y="265">2 + 4 = 6</text>
    <rect x="85" y="280" width="790" height="42" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="120" y="307">60-69</text><text x="415" y="307">6</text><text x="648" y="307">6 + 6 = 12</text>
    <rect x="85" y="322" width="790" height="42" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="120" y="349">70-79</text><text x="410" y="349">10</text><text x="636" y="349">12 + 10 = 22</text>
    <rect x="85" y="364" width="790" height="42" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="120" y="391">80-89</text><text x="415" y="391">6</text><text x="647" y="391">22 + 6 = 28</text>
    <rect x="85" y="406" width="790" height="42" fill="#ecfdf5" stroke="#10b981"/>
    <text x="120" y="433">90-99</text><text x="415" y="433">2</text><text x="647" y="433">28 + 2 = 30</text>
  </g>
  <path d="M598 420 C548 438, 494 438, 445 420" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="325" y="466" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#065f46">Final cumulative frequency = total learners = 30</text>
</svg>
