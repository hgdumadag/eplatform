<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Reading median from an ogive</title>
  <desc id="desc">An ogive with a horizontal line at cumulative frequency 15 and a vertical estimate in the 70 to 79 score class.</desc>
  <rect width="960" height="520" fill="#f8fafc"/>
  <rect x="52" y="36" width="856" height="448" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="82" y="82" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Estimate the Median Class</text>
  <text x="82" y="112" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">For 30 learners, the median position is near cumulative frequency 15.</text>
  <line x1="145" y1="410" x2="835" y2="410" stroke="#334155" stroke-width="3"/>
  <line x1="145" y1="410" x2="145" y2="145" stroke="#334155" stroke-width="3"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="145" y1="365" x2="835" y2="365"/>
    <line x1="145" y1="321" x2="835" y2="321"/>
    <line x1="145" y1="276" x2="835" y2="276"/>
    <line x1="145" y1="232" x2="835" y2="232"/>
    <line x1="145" y1="187" x2="835" y2="187"/>
  </g>
  <polyline points="194,392 310,356 426,303 542,214 658,161 774,143" fill="none" stroke="#2563eb" stroke-width="5"/>
  <g fill="#ffffff" stroke="#2563eb" stroke-width="4">
    <circle cx="194" cy="392" r="7"/>
    <circle cx="310" cy="356" r="7"/>
    <circle cx="426" cy="303" r="7"/>
    <circle cx="542" cy="214" r="7"/>
    <circle cx="658" cy="161" r="7"/>
    <circle cx="774" cy="143" r="7"/>
  </g>
  <line x1="145" y1="276" x2="462" y2="276" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="462" y1="276" x2="462" y2="410" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="462" cy="276" r="8" fill="#dc2626"/>
  <rect x="505" y="266" width="270" height="86" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="526" y="294" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#991b1b">Median position</text>
  <text x="526" y="320" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#450a0a">30 learners means the middle</text>
  <text x="526" y="340" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#450a0a">is near the 15th value.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">
    <text x="128" y="415" text-anchor="end">0</text>
    <text x="128" y="281" text-anchor="end">15</text>
    <text x="128" y="148" text-anchor="end">30</text>
    <text x="194" y="438" text-anchor="middle">49.5</text>
    <text x="310" y="438" text-anchor="middle">59.5</text>
    <text x="426" y="438" text-anchor="middle">69.5</text>
    <text x="542" y="438" text-anchor="middle">79.5</text>
    <text x="658" y="438" text-anchor="middle">89.5</text>
    <text x="774" y="438" text-anchor="middle">99.5</text>
  </g>
  <rect x="426" y="452" width="116" height="24" rx="4" fill="#ffedd5" stroke="#fb923c"/>
  <text x="484" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#9a3412">70-79 class</text>
</svg>
