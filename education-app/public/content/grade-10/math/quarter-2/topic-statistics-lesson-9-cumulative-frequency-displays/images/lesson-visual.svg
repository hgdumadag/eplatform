<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Cumulative frequency display overview</title>
  <desc id="desc">A frequency table becomes running totals and then an ogive.</desc>
  <rect width="960" height="420" fill="#f8fafc"/>
  <rect x="34" y="30" width="892" height="360" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="76" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Statistics - Lesson 9</text>
  <text x="64" y="108" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#334155">Cumulative Frequency Displays</text>

  <rect x="65" y="142" width="220" height="196" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="86" y="174" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">Frequency table</text>
  <text x="92" y="211" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0f172a">40-49</text>
  <text x="220" y="211" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0f172a">2</text>
  <text x="92" y="243" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0f172a">50-59</text>
  <text x="220" y="243" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0f172a">4</text>
  <text x="92" y="275" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0f172a">60-69</text>
  <text x="220" y="275" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0f172a">6</text>
  <text x="92" y="307" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0f172a">70-79</text>
  <text x="213" y="307" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0f172a">10</text>

  <path d="M305 238 H380" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="400" y="142" width="190" height="196" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="422" y="174" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#065f46">Running totals</text>
  <text x="442" y="215" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a">2</text>
  <text x="442" y="247" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a">2 + 4 = 6</text>
  <text x="442" y="279" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a">6 + 6 = 12</text>
  <text x="442" y="311" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a">12 + 10 = 22</text>

  <path d="M610 238 H680" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="700" y="142" width="185" height="196" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="724" y="174" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#9a3412">Ogive</text>
  <line x1="735" y1="300" x2="850" y2="300" stroke="#334155" stroke-width="2"/>
  <line x1="735" y1="300" x2="735" y2="200" stroke="#334155" stroke-width="2"/>
  <polyline points="744,290 774,278 804,260 836,230" fill="none" stroke="#dc2626" stroke-width="4"/>
  <circle cx="744" cy="290" r="5" fill="#dc2626"/>
  <circle cx="774" cy="278" r="5" fill="#dc2626"/>
  <circle cx="804" cy="260" r="5" fill="#dc2626"/>
  <circle cx="836" cy="230" r="5" fill="#dc2626"/>
  <text x="728" y="326" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">score boundary</text>
  <text x="712" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">cum.</text>

  <text x="64" y="368" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Frequency counts one class. Cumulative frequency counts up to a boundary.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
