<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">Graph choice guide</title>
  <desc id="desc">A guide showing graph types matched to claims about categories, change over time, parts of a whole, and numerical distribution.</desc>
  <rect width="760" height="320" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Choose the Display That Matches the Claim</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(35 70)">
      <rect width="155" height="190" rx="8" fill="#eff6ff" stroke="#2563eb"/>
      <text x="78" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Categories</text>
      <rect x="36" y="118" width="20" height="38" fill="#2563eb"/>
      <rect x="68" y="84" width="20" height="72" fill="#2563eb"/>
      <rect x="100" y="104" width="20" height="52" fill="#2563eb"/>
      <line x1="25" y1="156" x2="132" y2="156" stroke="#334155" stroke-width="2"/>
      <line x1="25" y1="58" x2="25" y2="156" stroke="#334155" stroke-width="2"/>
      <text x="78" y="178" text-anchor="middle" font-size="13" fill="#1f2937">Use a bar graph</text>
    </g>
    <g transform="translate(215 70)">
      <rect width="155" height="190" rx="8" fill="#ecfdf5" stroke="#059669"/>
      <text x="78" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">Over Time</text>
      <polyline points="28,140 55,118 82,126 109,88 132,72" fill="none" stroke="#059669" stroke-width="4"/>
      <g fill="#059669"><circle cx="28" cy="140" r="4"/><circle cx="55" cy="118" r="4"/><circle cx="82" cy="126" r="4"/><circle cx="109" cy="88" r="4"/><circle cx="132" cy="72" r="4"/></g>
      <line x1="25" y1="156" x2="132" y2="156" stroke="#334155" stroke-width="2"/>
      <line x1="25" y1="58" x2="25" y2="156" stroke="#334155" stroke-width="2"/>
      <text x="78" y="178" text-anchor="middle" font-size="13" fill="#1f2937">Use a line graph</text>
    </g>
    <g transform="translate(395 70)">
      <rect width="155" height="190" rx="8" fill="#fff7ed" stroke="#ea580c"/>
      <text x="78" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">Parts of Whole</text>
      <circle cx="78" cy="104" r="48" fill="#fed7aa"/>
      <path d="M78 104 L78 56 A48 48 0 0 1 123 121 Z" fill="#ea580c"/>
      <path d="M78 104 L123 121 A48 48 0 0 1 52 145 Z" fill="#f97316"/>
      <text x="78" y="178" text-anchor="middle" font-size="13" fill="#1f2937">Use pie or percent bar</text>
    </g>
    <g transform="translate(575 70)">
      <rect width="155" height="190" rx="8" fill="#fdf2f8" stroke="#db2777"/>
      <text x="78" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#831843">Distribution</text>
      <line x1="25" y1="150" x2="132" y2="150" stroke="#334155" stroke-width="2"/>
      <g fill="#db2777">
        <circle cx="36" cy="138" r="5"/><circle cx="54" cy="126" r="5"/><circle cx="69" cy="114" r="5"/>
        <circle cx="84" cy="126" r="5"/><circle cx="99" cy="138" r="5"/><circle cx="114" cy="138" r="5"/>
      </g>
      <text x="78" y="178" text-anchor="middle" font-size="13" fill="#1f2937">Use dot plot or box plot</text>
    </g>
  </g>
  <text x="380" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">The right display depends on what the claim is trying to prove.</text>
</svg>
