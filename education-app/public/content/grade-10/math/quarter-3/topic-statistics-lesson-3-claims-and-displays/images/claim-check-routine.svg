<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Claim checking routine</title>
  <desc id="desc">A four step routine: name the claim, read the display, match evidence, and limit the conclusion.</desc>
  <rect width="760" height="260" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Claim-Checking Routine</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <g transform="translate(35 80)">
      <rect width="145" height="105" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <circle cx="24" cy="24" r="14" fill="#2563eb"/><text x="24" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
      <text x="72" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Name Claim</text>
      <text x="72" y="72" text-anchor="middle" font-size="13" fill="#1f2937">What is being</text>
      <text x="72" y="91" text-anchor="middle" font-size="13" fill="#1f2937">said?</text>
    </g>
    <line x1="190" y1="132" x2="230" y2="132" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(240 80)">
      <rect width="145" height="105" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <circle cx="24" cy="24" r="14" fill="#16a34a"/><text x="24" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
      <text x="72" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Read Display</text>
      <text x="72" y="72" text-anchor="middle" font-size="13" fill="#1f2937">Labels, scale,</text>
      <text x="72" y="91" text-anchor="middle" font-size="13" fill="#1f2937">source, values</text>
    </g>
    <line x1="395" y1="132" x2="435" y2="132" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(445 80)">
      <rect width="145" height="105" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <circle cx="24" cy="24" r="14" fill="#d97706"/><text x="24" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
      <text x="72" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Match Evidence</text>
      <text x="72" y="72" text-anchor="middle" font-size="13" fill="#1f2937">Which number</text>
      <text x="72" y="91" text-anchor="middle" font-size="13" fill="#1f2937">answers it?</text>
    </g>
    <line x1="600" y1="132" x2="640" y2="132" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(650 80)">
      <rect width="80" height="105" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
      <circle cx="20" cy="24" r="14" fill="#db2777"/><text x="20" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
      <text x="40" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">Limit</text>
      <text x="40" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">Claim</text>
      <text x="40" y="94" text-anchor="middle" font-size="12" fill="#1f2937">Do not</text>
      <text x="40" y="110" text-anchor="middle" font-size="12" fill="#1f2937">overstate</text>
    </g>
  </g>
  <text x="380" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">Strong conclusions say exactly what the data support.</text>
</svg>
