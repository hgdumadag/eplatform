<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310" role="img" aria-labelledby="title desc">
  <title id="title">Truncated axis warning</title>
  <desc id="desc">A bar chart with a y-axis from 82 to 90 showing Group A at 84 percent and Group B at 88 percent, with a warning about visual exaggeration.</desc>
  <rect width="700" height="310" fill="#f8fafc"/>
  <text x="350" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Shortened Axis Warning</text>
  <g transform="translate(90 65)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="360" height="205" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <line x1="62" y1="170" x2="310" y2="170" stroke="#334155" stroke-width="2"/>
    <line x1="62" y1="30" x2="62" y2="170" stroke="#334155" stroke-width="2"/>
    <g font-size="12" fill="#4b5563">
      <text x="34" y="174">82</text><text x="34" y="139">84</text><text x="34" y="104">86</text><text x="34" y="69">88</text><text x="34" y="34">90</text>
    </g>
    <g stroke="#e5e7eb">
      <line x1="58" y1="135" x2="310" y2="135"/><line x1="58" y1="100" x2="310" y2="100"/>
      <line x1="58" y1="65" x2="310" y2="65"/><line x1="58" y1="30" x2="310" y2="30"/>
    </g>
    <rect x="118" y="135" width="54" height="35" fill="#2563eb"/>
    <rect x="220" y="65" width="54" height="105" fill="#dc2626"/>
    <text x="145" y="127" text-anchor="middle" font-size="14" fill="#1f2937">84%</text>
    <text x="247" y="57" text-anchor="middle" font-size="14" fill="#1f2937">88%</text>
    <text x="145" y="194" text-anchor="middle" font-size="14" fill="#374151">Group A</text>
    <text x="247" y="194" text-anchor="middle" font-size="14" fill="#374151">Group B</text>
  </g>
  <g transform="translate(485 96)" font-family="Arial, sans-serif">
    <rect width="155" height="120" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="78" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">Check scale</text>
    <text x="78" y="58" text-anchor="middle" font-size="14" fill="#1f2937">The difference is</text>
    <text x="78" y="79" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">4 points</text>
    <text x="78" y="103" text-anchor="middle" font-size="13" fill="#1f2937">not a huge gap.</text>
  </g>
  <text x="350" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">A careful reader separates the real difference from the visual impression.</text>
</svg>
