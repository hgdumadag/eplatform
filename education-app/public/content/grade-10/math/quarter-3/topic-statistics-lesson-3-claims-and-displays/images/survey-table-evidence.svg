<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" role="img" aria-labelledby="title desc">
  <title id="title">Survey table evidence</title>
  <desc id="desc">A table and bar display showing printed modules with 18 students, online review with 16, and group review with 6.</desc>
  <rect width="700" height="300" fill="#f8fafc"/>
  <text x="350" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Preferred Review Format, n = 40</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(45 70)">
      <rect width="260" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <rect width="260" height="42" rx="8" fill="#0f766e"/>
      <text x="24" y="27" font-size="15" font-weight="700" fill="#ffffff">Format</text>
      <text x="205" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Count</text>
      <g font-size="15" fill="#1f2937">
        <text x="24" y="72">Printed modules</text><text x="205" y="72" text-anchor="middle">18</text>
        <text x="24" y="108">Online review</text><text x="205" y="108" text-anchor="middle">16</text>
        <text x="24" y="144">Group review</text><text x="205" y="144" text-anchor="middle">6</text>
      </g>
      <line x1="0" y1="88" x2="260" y2="88" stroke="#e2e8f0"/>
      <line x1="0" y1="124" x2="260" y2="124" stroke="#e2e8f0"/>
      <line x1="160" y1="42" x2="160" y2="170" stroke="#e2e8f0"/>
    </g>
    <g transform="translate(370 76)">
      <line x1="0" y1="158" x2="260" y2="158" stroke="#334155" stroke-width="2"/>
      <line x1="0" y1="20" x2="0" y2="158" stroke="#334155" stroke-width="2"/>
      <rect x="35" y="32" width="45" height="126" fill="#0f766e"/>
      <rect x="112" y="46" width="45" height="112" fill="#2563eb"/>
      <rect x="189" y="116" width="45" height="42" fill="#d97706"/>
      <text x="58" y="24" text-anchor="middle" font-size="14" fill="#1f2937">18</text>
      <text x="135" y="38" text-anchor="middle" font-size="14" fill="#1f2937">16</text>
      <text x="212" y="108" text-anchor="middle" font-size="14" fill="#1f2937">6</text>
      <text x="58" y="184" text-anchor="middle" font-size="12" fill="#374151">Printed</text>
      <text x="135" y="184" text-anchor="middle" font-size="12" fill="#374151">Online</text>
      <text x="212" y="184" text-anchor="middle" font-size="12" fill="#374151">Group</text>
    </g>
  </g>
  <text x="350" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">Printed modules lead, but only by 2 students over online review.</text>
</svg>
