<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Same data with different scales</title>
  <desc id="desc">Two bar charts compare 72 percent and 76 percent. The full scale chart shows a small difference while the shortened scale chart exaggerates it.</desc>
  <rect width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Same Data, Different Visual Impact</text>
  <g transform="translate(60 70)">
    <text x="125" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#374151">Full 0-100 Scale</text>
    <line x1="35" y1="230" x2="250" y2="230" stroke="#374151" stroke-width="2"/>
    <line x1="35" y1="30" x2="35" y2="230" stroke="#374151" stroke-width="2"/>
    <g font-family="Arial, sans-serif" font-size="12" fill="#4b5563">
      <text x="8" y="234">0</text><text x="3" y="134">50</text><text x="-4" y="34">100</text>
    </g>
    <line x1="31" y1="130" x2="250" y2="130" stroke="#d1d5db" stroke-dasharray="4 4"/>
    <line x1="31" y1="30" x2="250" y2="30" stroke="#d1d5db" stroke-dasharray="4 4"/>
    <rect x="80" y="86" width="48" height="144" fill="#2563eb"/>
    <rect x="160" y="78" width="48" height="152" fill="#0f766e"/>
    <text x="104" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">72%</text>
    <text x="184" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">76%</text>
    <text x="104" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">A</text>
    <text x="184" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">B</text>
  </g>
  <g transform="translate(435 70)">
    <text x="125" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#374151">Shortened 70-80 Scale</text>
    <line x1="35" y1="230" x2="250" y2="230" stroke="#374151" stroke-width="2"/>
    <line x1="35" y1="30" x2="35" y2="230" stroke="#374151" stroke-width="2"/>
    <g font-family="Arial, sans-serif" font-size="12" fill="#4b5563">
      <text x="3" y="234">70</text><text x="3" y="134">75</text><text x="3" y="34">80</text>
    </g>
    <line x1="31" y1="130" x2="250" y2="130" stroke="#d1d5db" stroke-dasharray="4 4"/>
    <line x1="31" y1="30" x2="250" y2="30" stroke="#d1d5db" stroke-dasharray="4 4"/>
    <rect x="80" y="190" width="48" height="40" fill="#2563eb"/>
    <rect x="160" y="110" width="48" height="120" fill="#0f766e"/>
    <text x="104" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">72%</text>
    <text x="184" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">76%</text>
    <text x="104" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">A</text>
    <text x="184" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">B</text>
  </g>
  <text x="380" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">The values differ by 4 percentage points in both displays.</text>
</svg>
