<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Venn diagram for conditional probability</title>
  <desc id="desc">A Venn diagram with art club, honor roll, and overlap counts.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="82" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Venn diagram: use the condition circle</text>
  <rect x="98" y="114" width="764" height="330" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="390" cy="280" r="135" fill="#60a5fa" fill-opacity="0.55" stroke="#1d4ed8" stroke-width="4"/>
  <circle cx="570" cy="280" r="135" fill="#f472b6" fill-opacity="0.55" stroke="#be185d" stroke-width="4"/>
  <text x="320" y="178" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1e3a8a">Art club</text>
  <text x="640" y="178" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#831843">Honor roll</text>
  <text x="330" y="292" font-family="Arial, sans-serif" font-size="40" font-weight="700" text-anchor="middle" fill="#111827">10</text>
  <text x="480" y="292" font-family="Arial, sans-serif" font-size="40" font-weight="700" text-anchor="middle" fill="#111827">8</text>
  <text x="630" y="292" font-family="Arial, sans-serif" font-size="40" font-weight="700" text-anchor="middle" fill="#111827">12</text>
  <text x="740" y="390" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#475569">20</text>
  <text x="740" y="420" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#475569">neither</text>
  <path d="M285 438h390" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="480" y="482" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#111827">P(honor roll | art club) = overlap / art total = 8 / 18</text>
</svg>
