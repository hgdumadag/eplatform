<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Two-way table for review and passing</title>
  <desc id="desc">A contingency table with review attendance and quiz passing counts.</desc>
  <rect width="960" height="540" fill="#fffdf7"/>
  <text x="82" y="74" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Two-way table: review and quiz result</text>
  <g font-family="Arial, sans-serif" font-size="22" text-anchor="middle">
    <rect x="100" y="120" width="760" height="300" rx="12" fill="#ffffff" stroke="#374151" stroke-width="3"/>
    <path d="M100 190h760M100 260h760M100 330h760M260 120v300M440 120v300M620 120v300" stroke="#374151" stroke-width="2"/>
    <rect x="260" y="120" width="180" height="70" fill="#dbeafe"/>
    <rect x="440" y="120" width="180" height="70" fill="#fee2e2"/>
    <rect x="620" y="120" width="240" height="70" fill="#e5e7eb"/>
    <rect x="100" y="190" width="160" height="70" fill="#ecfeff"/>
    <rect x="100" y="260" width="160" height="70" fill="#f8fafc"/>
    <rect x="100" y="330" width="160" height="90" fill="#e5e7eb"/>
    <text x="350" y="164" font-weight="700" fill="#1e3a8a">Passed</text>
    <text x="530" y="154" font-weight="700" fill="#7f1d1d">Did not</text>
    <text x="530" y="181" font-weight="700" fill="#7f1d1d">pass</text>
    <text x="740" y="164" font-weight="700" fill="#374151">Row total</text>
    <text x="180" y="232" font-weight="700" fill="#155e75">Review</text>
    <text x="180" y="302" font-weight="700" fill="#475569">No review</text>
    <text x="180" y="382" font-weight="700" fill="#374151">Column total</text>
    <text x="350" y="235" font-size="30" font-weight="700" fill="#111827">18</text>
    <text x="530" y="235" font-size="30" font-weight="700" fill="#111827">6</text>
    <text x="740" y="235" font-size="30" font-weight="700" fill="#111827">24</text>
    <text x="350" y="305" font-size="30" font-weight="700" fill="#111827">8</text>
    <text x="530" y="305" font-size="30" font-weight="700" fill="#111827">8</text>
    <text x="740" y="305" font-size="30" font-weight="700" fill="#111827">16</text>
    <text x="350" y="386" font-size="30" font-weight="700" fill="#111827">26</text>
    <text x="530" y="386" font-size="30" font-weight="700" fill="#111827">14</text>
    <text x="740" y="386" font-size="30" font-weight="700" fill="#111827">40</text>
  </g>
  <rect x="160" y="450" width="640" height="48" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="480" y="481" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#155e75">For P(passed | review), use 18 over the review total 24.</text>
</svg>
