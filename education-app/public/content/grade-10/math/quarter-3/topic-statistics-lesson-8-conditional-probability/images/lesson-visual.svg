<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Conditional probability denominator shift</title>
  <desc id="desc">A diagram showing the denominator changing from all students to only the review group.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="72" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Conditional Probability: shrink the sample space</text>
  <rect x="72" y="112" width="360" height="300" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="112" y="158" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#334155">All learners</text>
  <text x="112" y="192" font-family="Arial, sans-serif" font-size="18" fill="#475569">Grand total = 30</text>
  <g fill="#cbd5e1">
    <circle cx="125" cy="242" r="12"/><circle cx="165" cy="242" r="12"/><circle cx="205" cy="242" r="12"/><circle cx="245" cy="242" r="12"/><circle cx="285" cy="242" r="12"/>
    <circle cx="325" cy="242" r="12"/><circle cx="365" cy="242" r="12"/><circle cx="125" cy="282" r="12"/><circle cx="165" cy="282" r="12"/><circle cx="205" cy="282" r="12"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="245" cy="282" r="12"/><circle cx="285" cy="282" r="12"/><circle cx="325" cy="282" r="12"/><circle cx="365" cy="282" r="12"/>
    <circle cx="125" cy="322" r="12"/><circle cx="165" cy="322" r="12"/><circle cx="205" cy="322" r="12"/><circle cx="245" cy="322" r="12"/><circle cx="285" cy="322" r="12"/><circle cx="325" cy="322" r="12"/>
    <circle cx="365" cy="322" r="12"/><circle cx="125" cy="362" r="12"/><circle cx="165" cy="362" r="12"/><circle cx="205" cy="362" r="12"/><circle cx="245" cy="362" r="12"/><circle cx="285" cy="362" r="12"/><circle cx="325" cy="362" r="12"/><circle cx="365" cy="362" r="12"/>
  </g>
  <path d="M462 260h96" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M558 260l-26-18v36z" fill="#64748b"/>
  <rect x="590" y="112" width="298" height="300" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
  <text x="630" y="158" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#155e75">Given: attended review</text>
  <text x="630" y="192" font-family="Arial, sans-serif" font-size="18" fill="#155e75">Restricted denominator = 20</text>
  <g fill="#38bdf8">
    <circle cx="645" cy="246" r="13"/><circle cx="685" cy="246" r="13"/><circle cx="725" cy="246" r="13"/><circle cx="765" cy="246" r="13"/><circle cx="805" cy="246" r="13"/>
    <circle cx="645" cy="286" r="13"/><circle cx="685" cy="286" r="13"/><circle cx="725" cy="286" r="13"/><circle cx="765" cy="286" r="13"/><circle cx="805" cy="286" r="13"/>
    <circle cx="645" cy="326" r="13"/><circle cx="685" cy="326" r="13"/><circle cx="725" cy="326" r="13"/><circle cx="765" cy="326" r="13"/><circle cx="805" cy="326" r="13"/>
    <circle cx="645" cy="366" r="13"/><circle cx="685" cy="366" r="13"/><circle cx="725" cy="366" r="13"/><circle cx="765" cy="366" r="13"/><circle cx="805" cy="366" r="13"/>
