<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Decision map for independent and dependent events</title>
  <desc id="desc">A flowchart asks whether the first event changes the second probability, then points to independent or dependent events.</desc>
  <rect width="960" height="420" fill="#f8fafc"/>
  <rect x="40" y="36" width="880" height="348" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="480" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Does Event A change P(Event B)?</text>
  <rect x="320" y="122" width="320" height="86" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="480" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#075985">Ask after Event A</text>
  <text x="480" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#075985">Does the sample space reset?</text>
  <path d="M405 208 L255 270" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M555 208 L705 270" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="315" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">No change</text>
  <text x="645" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#991b1b">Changes</text>
  <rect x="90" y="270" width="330" height="78" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="255" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">Independent</text>
  <text x="255" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#166534">Use P(A) x P(B)</text>
  <rect x="540" y="270" width="330" height="78" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="705" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">Dependent</text>
  <text x="705" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">Update before multiplying</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
