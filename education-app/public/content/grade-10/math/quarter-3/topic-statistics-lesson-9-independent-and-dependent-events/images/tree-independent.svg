<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Tree diagram for independent events</title>
  <desc id="desc">A probability tree for drawing red or blue with replacement where the second-stage probabilities repeat.</desc>
  <rect width="960" height="420" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Independent Tree: Second Branches Repeat</text>
  <circle cx="120" cy="210" r="12" fill="#334155"/>
  <line x1="132" y1="210" x2="340" y2="125" stroke="#334155" stroke-width="4"/>
  <line x1="132" y1="210" x2="340" y2="295" stroke="#334155" stroke-width="4"/>
  <rect x="340" y="92" width="150" height="66" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="415" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#991b1b">Red</text>
  <text x="415" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">5/8</text>
  <rect x="340" y="262" width="150" height="66" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="415" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">Blue</text>
  <text x="415" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1e3a8a">3/8</text>
  <line x1="490" y1="125" x2="710" y2="88" stroke="#334155" stroke-width="4"/>
  <line x1="490" y1="125" x2="710" y2="168" stroke="#334155" stroke-width="4"/>
  <line x1="490" y1="295" x2="710" y2="252" stroke="#334155" stroke-width="4"/>
  <line x1="490" y1="295" x2="710" y2="332" stroke="#334155" stroke-width="4"/>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="710" y="60" width="150" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="785" y="94" text-anchor="middle" fill="#991b1b">Red 5/8</text>
    <rect x="710" y="140" width="150" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="785" y="174" text-anchor="middle" fill="#1e3a8a">Blue 3/8</text>
    <rect x="710" y="224" width="150" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="785" y="258" text-anchor="middle" fill="#991b1b">Red 5/8</text>
    <rect x="710" y="304" width="150" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="785" y="338" text-anchor="middle" fill="#1e3a8a">Blue 3/8</text>
  </g>
  <text x="480" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#334155">With replacement: the second draw still has 5 red and 3 blue out of 8.</text>
</svg>
