<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Union Error Analysis</title>
  <desc id="desc">An incorrect union calculation omits subtracting the intersection, then a corrected calculation shows the overlap removed once.</desc>
  <rect width="760" height="360" fill="#f8fafc"/>
  <rect x="36" y="30" width="688" height="300" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Error Analysis: Missing the Overlap</text>
  <g font-family="Arial, sans-serif">
    <rect x="82" y="105" width="270" height="150" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <text x="217" y="143" text-anchor="middle" font-size="21" font-weight="700" fill="#991b1b">Incorrect</text>
    <text x="217" y="184" text-anchor="middle" font-size="24" fill="#7f1d1d">0.48 + 0.37 = 0.85</text>
    <text x="217" y="222" text-anchor="middle" font-size="18" fill="#7f1d1d">Overlap counted twice</text>
    <rect x="408" y="105" width="270" height="150" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    <text x="543" y="143" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">Correct</text>
    <text x="543" y="184" text-anchor="middle" font-size="24" fill="#14532d">0.48 + 0.37 - 0.20</text>
    <text x="543" y="222" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">= 0.65</text>
    <path d="M360 180h40" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M392 170l12 10-12 10" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="380" y="294" text-anchor="middle" font-size="20" fill="#334155">Subtract the intersection once so shared outcomes are counted once.</text>
  </g>
</svg>
