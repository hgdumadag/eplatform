<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Union of Events Venn Diagram</title>
  <desc id="desc">Two overlapping circles show that A union B includes A only, both, and B only.</desc>
  <rect width="760" height="360" fill="#f8fafc"/>
  <rect x="34" y="28" width="692" height="304" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">A union B means A or B or both</text>
  <circle cx="310" cy="190" r="92" fill="#60a5fa" fill-opacity="0.55" stroke="#2563eb" stroke-width="4"/>
  <circle cx="450" cy="190" r="92" fill="#f59e0b" fill-opacity="0.55" stroke="#d97706" stroke-width="4"/>
  <path d="M380 112a92 92 0 0 1 0 156a92 92 0 0 1 0-156z" fill="#34d399" fill-opacity="0.55" stroke="#059669" stroke-width="3"/>
  <text x="270" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">A only</text>
  <text x="380" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#065f46">Both</text>
  <text x="493" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#92400e">B only</text>
  <text x="380" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">Everything inside either circle is included once.</text>
</svg>
