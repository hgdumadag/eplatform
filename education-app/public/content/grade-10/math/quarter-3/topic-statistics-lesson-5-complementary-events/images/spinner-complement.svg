<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Spinner complement diagram</title>
  <desc id="desc">An eight-section spinner where three blue sections represent event A and five gray sections represent not A.</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Spinner: blue or not blue</text>
  <g transform="translate(290 220)">
    <circle r="145" fill="#ffffff" stroke="#172033" stroke-width="4"/>
    <path d="M0 0 L0 -145 A145 145 0 0 1 102.53 -102.53 Z" fill="#2f80ed"/>
    <path d="M0 0 L102.53 -102.53 A145 145 0 0 1 145 0 Z" fill="#2f80ed"/>
    <path d="M0 0 L145 0 A145 145 0 0 1 102.53 102.53 Z" fill="#2f80ed"/>
    <path d="M0 0 L102.53 102.53 A145 145 0 0 1 0 145 Z" fill="#d8dee9"/>
    <path d="M0 0 L0 145 A145 145 0 0 1 -102.53 102.53 Z" fill="#d8dee9"/>
    <path d="M0 0 L-102.53 102.53 A145 145 0 0 1 -145 0 Z" fill="#d8dee9"/>
    <path d="M0 0 L-145 0 A145 145 0 0 1 -102.53 -102.53 Z" fill="#d8dee9"/>
    <path d="M0 0 L-102.53 -102.53 A145 145 0 0 1 0 -145 Z" fill="#d8dee9"/>
    <g stroke="#172033" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="-145"/>
      <line x1="0" y1="0" x2="102.53" y2="-102.53"/>
      <line x1="0" y1="0" x2="145" y2="0"/>
      <line x1="0" y1="0" x2="102.53" y2="102.53"/>
      <line x1="0" y1="0" x2="0" y2="145"/>
      <line x1="0" y1="0" x2="-102.53" y2="102.53"/>
      <line x1="0" y1="0" x2="-145" y2="0"/>
      <line x1="0" y1="0" x2="-102.53" y2="-102.53"/>
    </g>
    <circle r="16" fill="#172033"/>
    <path d="M0 -168 L-13 -135 L13 -135 Z" fill="#ef4444" stroke="#172033" stroke-width="2"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="545" y="128" width="270" height="46" rx="8" fill="#2f80ed"/>
    <text x="680" y="158" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">A: lands on blue</text>
    <rect x="545" y="194" width="270" height="46" rx="8" fill="#d8dee9" stroke="#94a3b8"/>
    <text x="680" y="224" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">not A: not blue</text>
    <text x="680" y="284" text-anchor="middle" font-size="24" fill="#172033">P(blue) = 3/8</text>
    <text x="680" y="322" text-anchor="middle" font-size="24" fill="#172033">P(not blue) = 5/8</text>
  </g>
</svg>
