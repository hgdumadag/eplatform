<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">Pass and not pass complement table</title>
  <desc id="desc">A table showing pass probability 0.72 and not pass probability 0.28, with the total probability equal to 1.</desc>
  <rect width="900" height="380" fill="#f8fafc"/>
  <text x="450" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Pass and not pass are complements</text>
  <g font-family="Arial, sans-serif">
    <rect x="150" y="100" width="600" height="180" rx="10" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <rect x="150" y="100" width="600" height="56" rx="10" fill="#172033"/>
    <text x="300" y="136" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Outcome</text>
    <text x="600" y="136" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Probability</text>
    <line x1="450" y1="100" x2="450" y2="280" stroke="#334155" stroke-width="3"/>
    <line x1="150" y1="156" x2="750" y2="156" stroke="#334155" stroke-width="3"/>
    <line x1="150" y1="218" x2="750" y2="218" stroke="#cbd5e1" stroke-width="2"/>
    <text x="300" y="195" text-anchor="middle" font-size="24" fill="#172033">Pass</text>
    <text x="600" y="195" text-anchor="middle" font-size="24" fill="#172033">0.72</text>
    <text x="300" y="257" text-anchor="middle" font-size="24" fill="#172033">Not pass</text>
    <text x="600" y="257" text-anchor="middle" font-size="24" fill="#172033">0.28</text>
    <text x="450" y="330" text-anchor="middle" font-size="25" font-weight="700" fill="#0f766e">0.72 + 0.28 = 1.00</text>
  </g>
</svg>
