<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Center-radius form expanding into general form</title>
  <desc id="desc">A coordinate grid circle with center at three negative two and radius four is linked to the expansion from center-radius form to general form.</desc>
  <rect width="760" height="430" fill="#f8fafc"/>
  <rect x="36" y="36" width="300" height="330" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <g transform="translate(186 202)">
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#94a3b8"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#94a3b8"/>
    <g stroke="#e2e8f0">
      <line x1="-100" y1="-120" x2="-100" y2="120"/><line x1="-80" y1="-120" x2="-80" y2="120"/><line x1="-60" y1="-120" x2="-60" y2="120"/><line x1="-40" y1="-120" x2="-40" y2="120"/><line x1="-20" y1="-120" x2="-20" y2="120"/><line x1="20" y1="-120" x2="20" y2="120"/><line x1="40" y1="-120" x2="40" y2="120"/><line x1="60" y1="-120" x2="60" y2="120"/><line x1="80" y1="-120" x2="80" y2="120"/><line x1="100" y1="-120" x2="100" y2="120"/>
      <line x1="-120" y1="-100" x2="120" y2="-100"/><line x1="-120" y1="-80" x2="120" y2="-80"/><line x1="-120" y1="-60" x2="120" y2="-60"/><line x1="-120" y1="-40" x2="120" y2="-40"/><line x1="-120" y1="-20" x2="120" y2="-20"/><line x1="-120" y1="20" x2="120" y2="20"/><line x1="-120" y1="40" x2="120" y2="40"/><line x1="-120" y1="60" x2="120" y2="60"/><line x1="-120" y1="80" x2="120" y2="80"/><line x1="-120" y1="100" x2="120" y2="100"/>
    </g>
    <circle cx="60" cy="40" r="80" fill="#dbeafe" fill-opacity=".6" stroke="#2563eb" stroke-width="4"/>
    <circle cx="60" cy="40" r="5" fill="#dc2626"/>
    <line x1="60" y1="40" x2="140" y2="40" stroke="#dc2626" stroke-width="3"/>
    <text x="66" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">(3, -2)</text>
    <text x="92" y="32" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">r = 4</text>
  </g>
  <rect x="374" y="54" width="330" height="286" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="539" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Same circle, expanded</text>
  <text x="404" y="138" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">(x - 3)<tspan baseline-shift="super" font-size="12">2</tspan> + (y + 2)<tspan baseline-shift="super" font-size="12">2</tspan> = 16</text>
  <path d="M532 154v34" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="404" y="216" font-family="Arial, sans-serif" font-size="19" fill="#1e293b">x<tspan baseline-shift="super" font-size="12">2</tspan> - 6x + 9 + y<tspan baseline-shift="super" font-size="12">2</tspan> + 4y + 4 = 16</text>
  <path d="M532 232v34" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="404" y="294" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">x<tspan baseline-shift="super" font-size="12">2</tspan> + y<tspan baseline-shift="super" font-size="12">2</tspan> - 6x + 4y - 3 = 0</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="380" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">Expanded form can hide the center and radius, but the circle structure remains visible.</text>
</svg>
