<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Circle graph showing center and radius</title>
  <desc id="desc">A coordinate grid with a circle centered at three negative two and radius five.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <g transform="translate(450 260)">
    <g stroke="#e2e8f0" stroke-width="1">
      <path d="M-360 -200H360 M-360 -160H360 M-360 -120H360 M-360 -80H360 M-360 -40H360 M-360 0H360 M-360 40H360 M-360 80H360 M-360 120H360 M-360 160H360 M-360 200H360"/>
      <path d="M-360 -200V200 M-320 -200V200 M-280 -200V200 M-240 -200V200 M-200 -200V200 M-160 -200V200 M-120 -200V200 M-80 -200V200 M-40 -200V200 M0 -200V200 M40 -200V200 M80 -200V200 M120 -200V200 M160 -200V200 M200 -200V200 M240 -200V200 M280 -200V200 M320 -200V200 M360 -200V200"/>
    </g>
    <line x1="-380" y1="0" x2="380" y2="0" stroke="#334155" stroke-width="3"/>
    <line x1="0" y1="220" x2="0" y2="-220" stroke="#334155" stroke-width="3"/>
    <text x="388" y="8" font-family="Arial" font-size="18" fill="#334155">x</text>
    <text x="8" y="-226" font-family="Arial" font-size="18" fill="#334155">y</text>

    <circle cx="120" cy="80" r="200" fill="#bfdbfe" fill-opacity="0.35" stroke="#2563eb" stroke-width="5"/>
    <circle cx="120" cy="80" r="7" fill="#dc2626"/>
    <line x1="120" y1="80" x2="320" y2="80" stroke="#dc2626" stroke-width="4"/>
    <circle cx="320" cy="80" r="6" fill="#dc2626"/>
    <text x="132" y="68" font-family="Arial" font-size="20" font-weight="700" fill="#7f1d1d">center (3, -2)</text>
    <text x="208" y="110" font-family="Arial" font-size="20" font-weight="700" fill="#7f1d1d">radius = 5</text>
    <text x="122" y="-155" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1e3a8a">(x - 3)² + (y + 2)² = 25</text>
  </g>
</svg>
