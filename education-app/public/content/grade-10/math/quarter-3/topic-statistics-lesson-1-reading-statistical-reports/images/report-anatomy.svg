<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a statistical report</title>
  <desc id="desc">A sample report page with callouts for claim, data source, display, statistic, and conclusion.</desc>
  <rect width="760" height="360" fill="#f7fafc"/>
  <rect x="70" y="34" width="420" height="292" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <rect x="96" y="62" width="250" height="22" rx="4" fill="#0f766e"/>
  <text x="106" y="78" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Most surveyed learners prefer videos</text>
  <rect x="96" y="105" width="170" height="14" rx="3" fill="#cbd5e1"/>
  <rect x="96" y="127" width="310" height="14" rx="3" fill="#e2e8f0"/>
  <rect x="96" y="149" width="280" height="14" rx="3" fill="#e2e8f0"/>
  <line x1="116" y1="278" x2="410" y2="278" stroke="#64748b" stroke-width="2"/>
  <line x1="116" y1="188" x2="116" y2="278" stroke="#64748b" stroke-width="2"/>
  <rect x="154" y="212" width="46" height="66" fill="#14b8a6"/>
  <rect x="238" y="244" width="46" height="34" fill="#f97316"/>
  <rect x="322" y="256" width="46" height="22" fill="#6366f1"/>
  <text x="150" y="299" font-family="Arial, sans-serif" font-size="12" fill="#334155">Video</text>
  <text x="228" y="299" font-family="Arial, sans-serif" font-size="12" fill="#334155">Print</text>
  <text x="308" y="299" font-family="Arial, sans-serif" font-size="12" fill="#334155">Group</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#0f172a">
    <rect x="538" y="48" width="148" height="34" rx="17" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="564" y="70">Claim</text>
    <line x1="538" y1="65" x2="346" y2="72" stroke="#0f766e" stroke-width="2"/>
    <rect x="538" y="105" width="148" height="34" rx="17" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="565" y="127">Source</text>
    <line x1="538" y1="122" x2="265" y2="112" stroke="#0369a1" stroke-width="2"/>
    <rect x="538" y="162" width="148" height="34" rx="17" fill="#ffedd5" stroke="#c2410c"/>
    <text x="558" y="184">Display</text>
    <line x1="538" y1="179" x2="410" y2="235" stroke="#c2410c" stroke-width="2"/>
    <rect x="538" y="219" width="148" height="34" rx="17" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="555" y="241">Statistic</text>
    <line x1="538" y1="236" x2="200" y2="212" stroke="#6d28d9" stroke-width="2"/>
    <rect x="538" y="276" width="148" height="34" rx="17" fill="#fef9c3" stroke="#a16207"/>
    <text x="548" y="298">Conclusion</text>
    <line x1="538" y1="293" x2="380" y2="310" stroke="#a16207" stroke-width="2"/>
  </g>
</svg>
