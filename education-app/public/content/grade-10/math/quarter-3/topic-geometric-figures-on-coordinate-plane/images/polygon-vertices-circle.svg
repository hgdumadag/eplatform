<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Triangle vertices checked against a circle equation</title>
  <desc id="desc">A circle centered at the origin with a triangle whose three vertices lie on the circle.</desc>
  <rect width="720" height="460" fill="#fff7ed"/>
  <g transform="translate(360 240)">
    <g stroke="#fed7aa" stroke-width="1">
      <path d="M-270 -180H270 M-270 -120H270 M-270 -60H270 M-270 60H270 M-270 120H270 M-270 180H270"/>
      <path d="M-270 -180V180 M-210 -180V180 M-150 -180V180 M-90 -180V180 M-30 -180V180 M30 -180V180 M90 -180V180 M150 -180V180 M210 -180V180 M270 -180V180"/>
    </g>
    <path d="M-290 0H290" stroke="#9a3412" stroke-width="2"/>
    <path d="M0 -195V195" stroke="#9a3412" stroke-width="2"/>
    <circle cx="0" cy="0" r="150" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
    <polygon points="150,0 0,-150 -150,0" fill="#bfdbfe" opacity="0.6" stroke="#2563eb" stroke-width="4"/>
    <circle cx="150" cy="0" r="7" fill="#1d4ed8"/>
    <circle cx="0" cy="-150" r="7" fill="#1d4ed8"/>
    <circle cx="-150" cy="0" r="7" fill="#1d4ed8"/>
    <text x="160" y="-10" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">A(5,0)</text>
    <text x="12" y="-158" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">B(0,5)</text>
    <text x="-245" y="-10" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">C(-5,0)</text>
    <text x="-68" y="176" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">x^2 + y^2 = 25</text>
  </g>
  <text x="36" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7c2d12">An inscribed polygon has vertices on the circle</text>
</svg>
