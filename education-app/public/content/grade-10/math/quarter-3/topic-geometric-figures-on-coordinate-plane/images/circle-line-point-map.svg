<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Circle with a line and labeled points on a coordinate plane</title>
  <desc id="desc">A coordinate grid showing a circle centered at the origin, a horizontal line crossing it, and points inside, on, and outside the circle.</desc>
  <rect width="720" height="460" fill="#f8fafc"/>
  <g transform="translate(360 230)">
    <g stroke="#dbe4f0" stroke-width="1">
      <path d="M-300 -180H300 M-300 -120H300 M-300 -60H300 M-300 60H300 M-300 120H300 M-300 180H300"/>
      <path d="M-300 -180V180 M-240 -180V180 M-180 -180V180 M-120 -180V180 M-60 -180V180 M60 -180V180 M120 -180V180 M180 -180V180 M240 -180V180 M300 -180V180"/>
    </g>
    <path d="M-320 0H320" stroke="#334155" stroke-width="2"/>
    <path d="M0 -200V200" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="150" fill="#dbeafe" opacity="0.45" stroke="#2563eb" stroke-width="4"/>
    <path d="M-280 -90H280" stroke="#f97316" stroke-width="5"/>
    <circle cx="0" cy="0" r="6" fill="#0f172a"/>
    <circle cx="90" cy="-120" r="8" fill="#16a34a"/>
    <circle cx="-120" cy="-90" r="8" fill="#dc2626"/>
    <circle cx="210" cy="-90" r="8" fill="#9333ea"/>
    <text x="10" y="-10" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">center</text>
    <text x="102" y="-126" font-family="Arial, sans-serif" font-size="18" fill="#166534">on circle</text>
    <text x="-215" y="-96" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">line point</text>
    <text x="222" y="-96" font-family="Arial, sans-serif" font-size="18" fill="#6b21a8">outside</text>
    <text x="220" y="28" font-family="Arial, sans-serif" font-size="16" fill="#334155">x</text>
    <text x="12" y="-172" font-family="Arial, sans-serif" font-size="16" fill="#334155">y</text>
  </g>
  <text x="36" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Coordinate figures can share points</text>
</svg>
