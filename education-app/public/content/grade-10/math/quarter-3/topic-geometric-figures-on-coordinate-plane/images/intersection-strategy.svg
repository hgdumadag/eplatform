<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Line and circle intersection strategy</title>
  <desc id="desc">A flow diagram showing that line-circle intersections must satisfy the line equation and the circle equation.</desc>
  <rect width="720" height="460" rx="0" fill="#f0fdf4"/>
  <text x="42" y="52" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#14532d">Intersection strategy</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#14532d">
    <rect x="52" y="105" width="190" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="82" y="142">Circle equation</text>
    <text x="82" y="170">x^2 + y^2 = 25</text>
    <rect x="478" y="105" width="190" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="530" y="142">Line equation</text>
    <text x="552" y="170">y = 3</text>
    <rect x="265" y="235" width="190" height="88" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
    <text x="303" y="272">Substitute</text>
    <text x="298" y="300">x^2 + 3^2 = 25</text>
    <rect x="235" y="355" width="250" height="66" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/>
    <text x="262" y="396">Points: (-4, 3), (4, 3)</text>
  </g>
  <g stroke="#15803d" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M242 166 C288 184 301 206 324 235"/>
    <path d="M478 166 C432 184 419 206 396 235"/>
    <path d="M360 323V355"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#15803d"/>
    </marker>
  </defs>
</svg>
