<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Center and radius parts of center-radius form</title>
  <desc id="desc">The equation (x minus h) squared plus (y minus k) squared equals r squared is connected to center h comma k and radius r.</desc>
  <rect width="760" height="420" fill="#f7fbff"/>
  <rect x="38" y="42" width="684" height="336" rx="10" fill="#ffffff" stroke="#9db7d5" stroke-width="2"/>
  <text x="380" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d3557">Center-radius form</text>
  <text x="380" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#1f2937">
    (x - h)<tspan baseline-shift="super" font-size="20">2</tspan> + (y - k)<tspan baseline-shift="super" font-size="20">2</tspan> = r<tspan baseline-shift="super" font-size="20">2</tspan>
  </text>
  <line x1="290" y1="170" x2="230" y2="238" stroke="#2a9d8f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="470" y1="170" x2="530" y2="238" stroke="#e76f51" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="570" y1="154" x2="610" y2="238" stroke="#6d59a8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="126" y="246" width="208" height="72" rx="8" fill="#e7f6f3" stroke="#2a9d8f"/>
  <text x="230" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">Center x-coordinate</text>
  <text x="230" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1f2937">h</text>
  <rect x="426" y="246" width="208" height="72" rx="8" fill="#fff0eb" stroke="#e76f51"/>
  <text x="530" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b44b34">Center y-coordinate</text>
  <text x="530" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1f2937">k</text>
  <rect x="514" y="330" width="144" height="32" rx="8" fill="#eeeafd" stroke="#6d59a8"/>
  <text x="586" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#46328c">radius uses sqrt(r squared)</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
