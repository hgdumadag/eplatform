<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
  <title id="title">Complete circle graph from an equation</title>
  <desc id="desc">The equation x minus one squared plus y plus two squared equals nine is graphed with center one comma negative two and radius three.</desc>
  <rect width="760" height="540" fill="#fbfbf7"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">(x - 1)<tspan baseline-shift="super" font-size="14">2</tspan> + (y + 2)<tspan baseline-shift="super" font-size="14">2</tspan> = 9</text>
  <g transform="translate(380,280)">
    <g stroke="#e2e8f0" stroke-width="1">
      <path d="M-320 -240 H320 M-320 -200 H320 M-320 -160 H320 M-320 -120 H320 M-320 -80 H320 M-320 -40 H320 M-320 0 H320 M-320 40 H320 M-320 80 H320 M-320 120 H320 M-320 160 H320 M-320 200 H320 M-320 240 H320"/>
      <path d="M-320 -240 V240 M-280 -240 V240 M-240 -240 V240 M-200 -240 V240 M-160 -240 V240 M-120 -240 V240 M-80 -240 V240 M-40 -240 V240 M0 -240 V240 M40 -240 V240 M80 -240 V240 M120 -240 V240 M160 -240 V240 M200 -240 V240 M240 -240 V240 M280 -240 V240 M320 -240 V240"/>
    </g>
    <line x1="-330" y1="0" x2="330" y2="0" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="250" x2="0" y2="-250" stroke="#475569" stroke-width="2"/>
    <circle cx="40" cy="80" r="120" fill="#bae6fd" fill-opacity="0.35" stroke="#0284c7" stroke-width="4"/>
    <circle cx="40" cy="80" r="6" fill="#1d4ed8"/>
    <g fill="#be123c">
      <circle cx="160" cy="80" r="5"/>
      <circle cx="-80" cy="80" r="5"/>
      <circle cx="40" cy="-40" r="5"/>
      <circle cx="40" cy="200" r="5"/>
    </g>
    <line x1="40" y1="80" x2="160" y2="80" stroke="#be123c" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="52" y="70" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">center (1, -2)</text>
    <text x="92" y="68" font-family="Arial, sans-serif" font-size="15" fill="#be123c">r = 3</text>
    <text x="170" y="86" font-family="Arial, sans-serif" font-size="13" fill="#7f1d1d">(4, -2)</text>
    <text x="-154" y="86" font-family="Arial, sans-serif" font-size="13" fill="#7f1d1d">(-2, -2)</text>
    <text x="50" y="-46" font-family="Arial, sans-serif" font-size="13" fill="#7f1d1d">(1, 1)</text>
    <text x="50" y="206" font-family="Arial, sans-serif" font-size="13" fill="#7f1d1d">(1, -5)</text>
  </g>
  <rect x="84" y="452" width="592" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="380" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">Plot center (1, -2), mark radius 3 in four directions, then sketch the circle.</text>
</svg>
