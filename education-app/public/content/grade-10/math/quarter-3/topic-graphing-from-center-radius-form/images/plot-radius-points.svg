<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Plotting four radius points from a center</title>
  <desc id="desc">A coordinate grid shows center one comma negative two with radius three. Four radius points are marked right, left, up, and down from the center.</desc>
  <rect width="760" height="520" fill="#f8fafc"/>
  <g transform="translate(380,260)">
    <g stroke="#d5dee9" stroke-width="1">
      <path d="M-300 -220 H300 M-300 -180 H300 M-300 -140 H300 M-300 -100 H300 M-300 -60 H300 M-300 -20 H300 M-300 20 H300 M-300 60 H300 M-300 100 H300 M-300 140 H300 M-300 180 H300 M-300 220 H300"/>
      <path d="M-300 -220 V220 M-260 -220 V220 M-220 -220 V220 M-180 -220 V220 M-140 -220 V220 M-100 -220 V220 M-60 -220 V220 M-20 -220 V220 M20 -220 V220 M60 -220 V220 M100 -220 V220 M140 -220 V220 M180 -220 V220 M220 -220 V220 M260 -220 V220 M300 -220 V220"/>
    </g>
    <line x1="-320" y1="0" x2="320" y2="0" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="230" x2="0" y2="-230" stroke="#334155" stroke-width="2"/>
    <text x="310" y="-10" font-family="Arial, sans-serif" font-size="16" fill="#334155">x</text>
    <text x="10" y="-214" font-family="Arial, sans-serif" font-size="16" fill="#334155">y</text>
    <circle cx="40" cy="80" r="6" fill="#1d4ed8"/>
    <text x="52" y="74" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">center (1, -2)</text>
    <line x1="40" y1="80" x2="160" y2="80" stroke="#ef4444" stroke-width="4"/>
    <line x1="40" y1="80" x2="-80" y2="80" stroke="#ef4444" stroke-width="4"/>
    <line x1="40" y1="80" x2="40" y2="-40" stroke="#ef4444" stroke-width="4"/>
    <line x1="40" y1="80" x2="40" y2="200" stroke="#ef4444" stroke-width="4"/>
    <g fill="#dc2626">
      <circle cx="160" cy="80" r="6"/>
      <circle cx="-80" cy="80" r="6"/>
      <circle cx="40" cy="-40" r="6"/>
      <circle cx="40" cy="200" r="6"/>
    </g>
    <text x="172" y="86" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">(4, -2)</text>
    <text x="-152" y="86" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">(-2, -2)</text>
    <text x="50" y="-46" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">(1, 1)</text>
    <text x="50" y="206" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">(1, -5)</text>
  </g>
  <text x="380" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Move the radius 3 units in four directions</text>
</svg>
