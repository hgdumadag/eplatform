<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Spinner model for overlapping events</title>
  <desc id="desc">A six-section spinner shows that blue and greater than four overlap on section six.</desc>
  <rect width="920" height="520" fill="#f8fafc"/>
  <rect x="54" y="48" width="812" height="424" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="460" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Spinner: Color and Number Events</text>
  <g transform="translate(260 265)">
    <path d="M0 0 L0 -145 A145 145 0 0 1 125.6 -72.5 Z" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
    <path d="M0 0 L125.6 -72.5 A145 145 0 0 1 125.6 72.5 Z" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
    <path d="M0 0 L125.6 72.5 A145 145 0 0 1 0 145 Z" fill="#22c55e" stroke="#ffffff" stroke-width="3"/>
    <path d="M0 0 L0 145 A145 145 0 0 1 -125.6 72.5 Z" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
    <path d="M0 0 L-125.6 72.5 A145 145 0 0 1 -125.6 -72.5 Z" fill="#22c55e" stroke="#ffffff" stroke-width="3"/>
    <path d="M0 0 L-125.6 -72.5 A145 145 0 0 1 0 -145 Z" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="0" r="18" fill="#111827"/>
    <line x1="0" y1="-12" x2="0" y2="-170" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
    <polygon points="0,-186 -12,-162 12,-162" fill="#111827"/>
    <text x="62" y="-82" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">1</text>
    <text x="98" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">2</text>
    <text x="46" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">3</text>
    <text x="-46" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">4</text>
    <text x="-98" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">5</text>
    <text x="-62" y="-82" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">6</text>
  </g>
  <g transform="translate(520 160)">
    <rect x="0" y="0" width="286" height="58" rx="14" fill="#dbeafe" stroke="#2563eb"/>
    <text x="143" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">A = blue sections: {2, 6}</text>
    <rect x="0" y="84" width="286" height="58" rx="14" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="143" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#92400e">B = greater than 4: {5, 6}</text>
    <rect x="0" y="168" width="286" height="74" rx="14" fill="#dcfce7" stroke="#16a34a"/>
    <text x="143" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#14532d">Overlap: {6}</text>
    <text x="143" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#14532d">Not mutually exclusive</text>
  </g>
</svg>
