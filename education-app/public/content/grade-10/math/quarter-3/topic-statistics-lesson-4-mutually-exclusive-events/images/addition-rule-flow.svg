<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Addition rule decision flow</title>
  <desc id="desc">A flowchart helps choose between the mutually exclusive addition rule and the general addition rule.</desc>
  <rect width="920" height="520" fill="#f8fafc"/>
  <rect x="42" y="42" width="836" height="436" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Choosing the Rule for P(A or B)</text>
  <g font-family="Arial, sans-serif">
    <rect x="310" y="120" width="300" height="58" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="460" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">Can A and B happen together?</text>
    <line x1="460" y1="178" x2="460" y2="216" stroke="#64748b" stroke-width="3"/>
    <polygon points="460,226 450,210 470,210" fill="#64748b"/>

    <rect x="148" y="226" width="272" height="80" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="284" y="258" text-anchor="middle" font-size="21" font-weight="800" fill="#991b1b">No overlap</text>
    <text x="284" y="286" text-anchor="middle" font-size="17" fill="#991b1b">Mutually exclusive</text>

    <rect x="500" y="226" width="272" height="80" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="636" y="258" text-anchor="middle" font-size="21" font-weight="800" fill="#14532d">Yes, overlap</text>
    <text x="636" y="286" text-anchor="middle" font-size="17" fill="#14532d">Non-mutually exclusive</text>

    <line x1="420" y1="244" x2="500" y2="244" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="460" y="236" text-anchor="middle" font-size="15" fill="#475569">check</text>

    <line x1="284" y1="306" x2="284" y2="350" stroke="#64748b" stroke-width="3"/>
    <polygon points="284,360 274,344 294,344" fill="#64748b"/>
    <rect x="98" y="360" width="372" height="72" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="284" y="392" text-anchor="middle" font-size="21" font-weight="800" fill="#9a3412">P(A or B) = P(A) + P(B)</text>
    <text x="284" y="418" text-anchor="middle" font-size="16" fill="#9a3412">No double-counting is possible.</text>

    <line x1="636" y1="306" x2="636" y2="350" stroke="#64748b" stroke-width="3"/>
    <polygon points="636,360 626,344 646,344" fill="#64748b"/>
    <rect x="488" y="360" width="334" height="72" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="655" y="392" text-anchor="middle" font-size="20" font-weight="800" fill="#312e81">P(A or B) = P(A) + P(B) - P(A and B)</text>
    <text x="655" y="418" text-anchor="middle" font-size="16" fill="#312e81">Subtract the shared outcomes once.</text>
  </g>
</svg>
