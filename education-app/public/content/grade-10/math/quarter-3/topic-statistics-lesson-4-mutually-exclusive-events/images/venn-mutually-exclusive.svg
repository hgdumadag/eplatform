<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Venn diagram for mutually exclusive events</title>
  <desc id="desc">Two separate circles inside the sample space show events with no overlap.</desc>
  <rect width="920" height="520" fill="#f8fafc"/>
  <rect x="72" y="72" width="776" height="360" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="104" y="122" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Sample space: one number cube roll</text>
  <circle cx="310" cy="260" r="116" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <circle cx="610" cy="260" r="116" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
  <text x="310" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">A</text>
  <text x="310" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1e40af">Even</text>
  <text x="310" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e40af">{2, 4, 6}</text>
  <text x="610" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#991b1b">B</text>
  <text x="610" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#b91c1c">Odd</text>
  <text x="610" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">{1, 3, 5}</text>
  <line x1="436" y1="260" x2="484" y2="260" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <text x="460" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#334155">No overlap</text>
  <text x="460" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">P(A and B) = 0</text>
</svg>
