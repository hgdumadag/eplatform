<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Red and black card events are mutually exclusive</title>
  <desc id="desc">A single-card draw compares red cards and black cards with no overlap.</desc>
  <rect width="920" height="520" fill="#f8fafc"/>
  <rect x="42" y="42" width="836" height="436" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">One Card Draw</text>
  <text x="460" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Can one card be red and black at the same time?</text>

  <g transform="translate(140 170)">
    <rect x="0" y="0" width="150" height="210" rx="14" fill="#fff1f2" stroke="#dc2626" stroke-width="4"/>
    <text x="22" y="44" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#dc2626">A</text>
    <path d="M75 76 C35 38 -16 96 75 162 C166 96 115 38 75 76Z" fill="#dc2626"/>
    <text x="75" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#991b1b">Red card</text>
    <text x="75" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">hearts or diamonds</text>
  </g>

  <g transform="translate(630 170)">
    <rect x="0" y="0" width="150" height="210" rx="14" fill="#f8fafc" stroke="#111827" stroke-width="4"/>
    <text x="22" y="44" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">A</text>
    <path d="M75 72 C118 32 168 92 78 160 C-14 92 32 32 75 72Z" fill="#111827"/>
    <path d="M75 142 L52 184 H98 Z" fill="#111827"/>
    <text x="75" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">Black card</text>
    <text x="75" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">spades or clubs</text>
  </g>

  <g>
    <line x1="333" y1="260" x2="587" y2="260" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 10"/>
    <circle cx="460" cy="260" r="58" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="460" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#312e81">No shared</text>
    <text x="460" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#312e81">outcome</text>
  </g>

  <rect x="286" y="405" width="348" height="48" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="460" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#92400e">P(red and black) = 0</text>
</svg>
