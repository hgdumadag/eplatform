<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Venn diagram for overlapping events</title>
  <desc id="desc">Two overlapping circles show students who joined math club, science club, or both.</desc>
  <rect width="920" height="520" fill="#f8fafc"/>
  <rect x="70" y="70" width="780" height="370" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="104" y="120" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Sample space: 40 surveyed learners</text>
  <circle cx="380" cy="270" r="138" fill="#bfdbfe" fill-opacity="0.82" stroke="#2563eb" stroke-width="4"/>
  <circle cx="540" cy="270" r="138" fill="#bbf7d0" fill-opacity="0.82" stroke="#16a34a" stroke-width="4"/>
  <text x="322" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">Math</text>
  <text x="322" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e40af">12</text>
  <text x="460" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#14532d">Both</text>
  <text x="460" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#14532d">6</text>
  <text x="600" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#14532d">Science</text>
  <text x="600" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#15803d">9</text>
  <text x="460" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">The shared region is the intersection.</text>
  <text x="460" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">P(A or B) uses A + B - both.</text>
</svg>
