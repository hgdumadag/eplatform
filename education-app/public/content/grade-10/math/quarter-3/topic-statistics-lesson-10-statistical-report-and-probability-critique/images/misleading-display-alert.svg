<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Misleading display with truncated scale</title>
  <desc id="desc">Two bars at 76 percent and 80 percent drawn on a scale starting at 70 percent, with an alert that the difference is only 4 percentage points.</desc>
  <rect width="960" height="540" fill="#fffafa"/>
  <text x="58" y="72" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1f2937">Display alert: check the scale</text>
  <text x="58" y="106" font-family="Arial, sans-serif" font-size="18" fill="#475569">The bars look far apart because the axis starts at 70%, not 0%.</text>
  <rect x="72" y="140" width="560" height="324" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="150" y1="402" x2="570" y2="402" stroke="#334155" stroke-width="3"/>
  <line x1="150" y1="178" x2="150" y2="402" stroke="#334155" stroke-width="3"/>
  <g font-family="Arial, sans-serif" fill="#475569" font-size="15">
    <text x="104" y="407">70%</text><text x="104" y="332">75%</text><text x="104" y="257">80%</text><text x="104" y="182">85%</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="2">
    <line x1="150" y1="327" x2="570" y2="327"/><line x1="150" y1="252" x2="570" y2="252"/><line x1="150" y1="177" x2="570" y2="177"/>
  </g>
  <rect x="245" y="312" width="92" height="90" fill="#60a5fa"/>
  <rect x="420" y="252" width="92" height="150" fill="#f97316"/>
  <text x="262" y="430" font-family="Arial, sans-serif" font-size="18" fill="#334155">76%</text>
  <text x="438" y="430" font-family="Arial, sans-serif" font-size="18" fill="#334155">80%</text>
  <text x="230" y="460" font-family="Arial, sans-serif" font-size="16" fill="#334155">Section A</text>
  <text x="406" y="460" font-family="Arial, sans-serif" font-size="16" fill="#334155">Section B</text>
  <rect x="682" y="188" width="218" height="208" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="722" y="236" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#991b1b">Caution</text>
  <text x="714" y="280" font-family="Arial, sans-serif" font-size="19" fill="#7f1d1d">Real difference:</text>
  <text x="738" y="326" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#991b1b">4 pts</text>
  <text x="713" y="366" font-family="Arial, sans-serif" font-size="17" fill="#7f1d1d">Ask if the visual</text>
  <text x="713" y="389" font-family="Arial, sans-serif" font-size="17" fill="#7f1d1d">matches the data.</text>
</svg>
