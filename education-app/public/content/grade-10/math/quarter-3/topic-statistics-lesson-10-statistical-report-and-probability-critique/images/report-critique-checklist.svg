<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Critique checklist for a statistical report</title>
  <desc id="desc">A six-step flow for checking a report claim, source, sample, display, probability, and conclusion.</desc>
  <rect width="960" height="540" fill="#f7fafc"/>
  <rect x="48" y="42" width="864" height="456" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="92" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">R.E.P.O.R.T. critique routine</text>
  <text x="80" y="126" font-family="Arial, sans-serif" font-size="18" fill="#475569">Follow the evidence before accepting the conclusion.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(80 172)">
      <rect width="230" height="92" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <circle cx="34" cy="46" r="20" fill="#2563eb"/><text x="27" y="54" font-size="24" font-weight="700" fill="#fff">1</text>
      <text x="70" y="38" font-size="22" font-weight="700" fill="#1e3a8a">Read claim</text>
      <text x="70" y="65" font-size="16" fill="#334155">What is being proved?</text>
    </g>
    <g transform="translate(365 172)">
      <rect width="230" height="92" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <circle cx="34" cy="46" r="20" fill="#16a34a"/><text x="27" y="54" font-size="24" font-weight="700" fill="#fff">2</text>
      <text x="70" y="38" font-size="22" font-weight="700" fill="#14532d">Examine source</text>
      <text x="70" y="65" font-size="16" fill="#334155">Where did data come from?</text>
    </g>
    <g transform="translate(650 172)">
      <rect width="230" height="92" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <circle cx="34" cy="46" r="20" fill="#d97706"/><text x="27" y="54" font-size="24" font-weight="700" fill="#fff">3</text>
      <text x="70" y="38" font-size="22" font-weight="700" fill="#78350f">Pin sample</text>
      <text x="70" y="65" font-size="16" fill="#334155">Who was measured?</text>
    </g>
    <g transform="translate(80 322)">
      <rect width="230" height="92" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <circle cx="34" cy="46" r="20" fill="#7c3aed"/><text x="27" y="54" font-size="24" font-weight="700" fill="#fff">4</text>
      <text x="70" y="38" font-size="22" font-weight="700" fill="#4c1d95">Observe display</text>
      <text x="70" y="65" font-size="16" fill="#334155">Scale, labels, categories?</text>
    </g>
    <g transform="translate(365 322)">
      <rect width="230" height="92" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
      <circle cx="34" cy="46" r="20" fill="#0891b2"/><text x="27" y="54" font-size="24" font-weight="700" fill="#fff">5</text>
      <text x="70" y="38" font-size="22" font-weight="700" fill="#164e63">Recalculate</text>
      <text x="70" y="65" font-size="16" fill="#334155">Correct denominator?</text>
    </g>
    <g transform="translate(650 322)">
      <rect width="230" height="92" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <circle cx="34" cy="46" r="20" fill="#dc2626"/><text x="27" y="54" font-size="24" font-weight="700" fill="#fff">6</text>
      <text x="70" y="38" font-size="22" font-weight="700" fill="#7f1d1d">Tie conclusion</text>
      <text x="70" y="65" font-size="16" fill="#334155">What is fairly supported?</text>
    </g>
  </g>
  <path d="M315 218h42M600 218h42M195 270v44M480 270v44M765 270v44" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8"/>
</svg>
