<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Probability denominator decision tree</title>
  <desc id="desc">A decision tree for choosing the denominator based on total group, among language, or complement language.</desc>
  <rect width="960" height="540" fill="#f7fafc"/>
  <text x="60" y="74" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1f2937">Choose the denominator</text>
  <text x="60" y="106" font-family="Arial, sans-serif" font-size="18" fill="#475569">Read the event language before calculating.</text>
  <g font-family="Arial, sans-serif">
    <rect x="330" y="142" width="300" height="76" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="382" y="174" font-size="21" font-weight="700" fill="#1e3a8a">What group is named?</text>
    <text x="392" y="199" font-size="16" fill="#334155">Look for among, given, not</text>
    <path d="M480 218v54M480 272H188M480 272h292M188 272v58M480 272v58M772 272v58" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <rect x="58" y="330" width="260" height="116" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="94" y="363" font-size="21" font-weight="700" fill="#14532d">No condition</text>
    <text x="89" y="392" font-size="17" fill="#334155">Use the grand total.</text>
    <text x="88" y="421" font-size="18" font-weight="700" fill="#14532d">Example: 30/60</text>
    <rect x="350" y="330" width="260" height="116" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="399" y="363" font-size="21" font-weight="700" fill="#78350f">Among / given</text>
    <text x="381" y="392" font-size="17" fill="#334155">Use the restricted group.</text>
    <text x="398" y="421" font-size="18" font-weight="700" fill="#78350f">Example: 18/28</text>
    <rect x="642" y="330" width="260" height="116" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="724" y="363" font-size="21" font-weight="700" fill="#4c1d95">Not / complement</text>
    <text x="681" y="392" font-size="17" fill="#334155">Subtract from the total.</text>
    <text x="700" y="421" font-size="18" font-weight="700" fill="#4c1d95">Example: 1 - P(A)</text>
  </g>
</svg>
