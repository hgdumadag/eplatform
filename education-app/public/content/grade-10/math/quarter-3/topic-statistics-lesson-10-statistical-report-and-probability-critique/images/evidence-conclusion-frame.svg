<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Evidence to conclusion writing frame</title>
  <desc id="desc">A writing frame that moves from evidence, group, calculation, caution, and conclusion.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="58" y="76" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1f2937">From evidence to conclusion</text>
  <text x="58" y="108" font-family="Arial, sans-serif" font-size="18" fill="#475569">A complete answer gives the value and the meaning.</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="154" width="800" height="64" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="112" y="194" font-size="22" font-weight="700" fill="#1e3a8a">Evidence:</text>
    <text x="225" y="194" font-size="20" fill="#334155">The data show 21 of 30 students preferred group review.</text>
    <rect x="80" y="230" width="800" height="64" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="112" y="270" font-size="22" font-weight="700" fill="#14532d">Group:</text>
    <text x="200" y="270" font-size="20" fill="#334155">In this surveyed section...</text>
    <rect x="80" y="306" width="800" height="64" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="112" y="346" font-size="22" font-weight="700" fill="#78350f">Calculation:</text>
    <text x="245" y="346" font-size="20" fill="#334155">21/30 = 70%</text>
    <rect x="80" y="382" width="800" height="64" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="112" y="422" font-size="22" font-weight="700" fill="#7f1d1d">Caution:</text>
    <text x="215" y="422" font-size="20" fill="#334155">This does not automatically prove the same result for all Grade 10 students.</text>
  </g>
  <path d="M480 446v36" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M458 466l22 22 22-22" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="160" y="482" width="640" height="42" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="192" y="510" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#334155">Fair conclusion: 70% of this surveyed section preferred group review.</text>
</svg>
