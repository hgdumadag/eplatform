<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Survey sample compared with population</title>
  <desc id="desc">A large population circle with a smaller sampled section, showing the question of whether the sample represents the population.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="58" y="72" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1f2937">Population vs. sample</text>
  <text x="58" y="106" font-family="Arial, sans-serif" font-size="18" fill="#475569">A claim about everyone needs a sample that fairly reflects everyone.</text>
  <circle cx="330" cy="300" r="165" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
  <text x="240" y="304" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#075985">Population</text>
  <text x="222" y="336" font-family="Arial, sans-serif" font-size="17" fill="#075985">All Grade 10 students</text>
  <g fill="#0284c7">
    <circle cx="238" cy="210" r="7"/><circle cx="291" cy="190" r="7"/><circle cx="376" cy="200" r="7"/><circle cx="438" cy="260" r="7"/>
    <circle cx="210" cy="315" r="7"/><circle cx="294" cy="386" r="7"/><circle cx="395" cy="382" r="7"/><circle cx="445" cy="330" r="7"/>
    <circle cx="335" cy="250" r="7"/><circle cx="280" cy="286" r="7"/><circle cx="366" cy="324" r="7"/>
  </g>
  <path d="M530 300h118" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M635 276l38 24-38 24" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="690" y="164" width="210" height="270" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/>
  <text x="734" y="214" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#9a3412">Sample</text>
  <text x="720" y="247" font-family="Arial, sans-serif" font-size="17" fill="#7c2d12">Students actually surveyed</text>
  <g fill="#ea580c">
    <circle cx="752" cy="298" r="9"/><circle cx="804" cy="282" r="9"/><circle cx="852" cy="313" r="9"/>
    <circle cx="772" cy="354" r="9"/><circle cx="835" cy="370" r="9"/>
  </g>
  <rect x="78" y="448" width="806" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="104" y="477" font-family="Arial, sans-serif" font-size="20" fill="#334155">Critique question: Who might be missing from the sample?</text>
</svg>
