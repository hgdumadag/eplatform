<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Biased sample compared with representative sample</title>
  <desc id="desc">A hallway-only sample is compared to a balanced sample from several groups.</desc>
  <rect width="900" height="430" fill="#fbfbf7"/>
  <text x="450" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#253040">Biased vs. More Representative</text>
  <rect x="60" y="90" width="360" height="285" rx="16" fill="#fff1f0" stroke="#c0392b" stroke-width="3"/>
  <rect x="480" y="90" width="360" height="285" rx="16" fill="#eefaf1" stroke="#2e7d32" stroke-width="3"/>
  <text x="240" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#922b21">Weak Sample</text>
  <text x="660" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e6b2d">Stronger Sample</text>
  <rect x="112" y="165" width="255" height="55" rx="8" fill="#ffffff" stroke="#c0392b"/>
  <text x="240" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5f241d">Only hallway at 7:00 a.m.</text>
  <g fill="#e74c3c">
    <circle cx="145" cy="268" r="12"/><circle cx="180" cy="268" r="12"/><circle cx="215" cy="268" r="12"/><circle cx="250" cy="268" r="12"/><circle cx="285" cy="268" r="12"/><circle cx="320" cy="268" r="12"/>
  </g>
  <text x="240" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5f241d">Easy to reach, but many groups missing</text>
  <rect x="525" y="165" width="270" height="55" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="660" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#20542a">Students selected from each section</text>
  <g>
    <circle cx="560" cy="260" r="12" fill="#2e7d32"/><circle cx="600" cy="260" r="12" fill="#1976d2"/><circle cx="640" cy="260" r="12" fill="#f9a825"/><circle cx="680" cy="260" r="12" fill="#8e44ad"/><circle cx="720" cy="260" r="12" fill="#00897b"/><circle cx="760" cy="260" r="12" fill="#d35400"/>
    <circle cx="580" cy="302" r="12" fill="#1976d2"/><circle cx="620" cy="302" r="12" fill="#2e7d32"/><circle cx="660" cy="302" r="12" fill="#00897b"/><circle cx="700" cy="302" r="12" fill="#8e44ad"/><circle cx="740" cy="302" r="12" fill="#f9a825"/>
  </g>
  <text x="660" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#20542a">Different groups have a fair chance</text>
</svg>
