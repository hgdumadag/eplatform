<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Claim support scale</title>
  <desc id="desc">A horizontal scale from weak evidence to strong evidence.</desc>
  <rect width="900" height="360" fill="#f8fafc"/>
  <text x="450" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">How Strong Is the Evidence?</text>
  <defs>
    <linearGradient id="scale" x1="0" x2="1">
      <stop offset="0" stop-color="#c0392b"/>
      <stop offset="0.35" stop-color="#f39c12"/>
      <stop offset="0.7" stop-color="#2e86c1"/>
      <stop offset="1" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect x="110" y="150" width="680" height="42" rx="21" fill="url(#scale)"/>
  <g font-family="Arial, sans-serif">
    <line x1="140" y1="132" x2="140" y2="212" stroke="#334155" stroke-width="3"/>
    <line x1="340" y1="132" x2="340" y2="212" stroke="#334155" stroke-width="3"/>
    <line x1="560" y1="132" x2="560" y2="212" stroke="#334155" stroke-width="3"/>
    <line x1="760" y1="132" x2="760" y2="212" stroke="#334155" stroke-width="3"/>
    <text x="140" y="244" text-anchor="middle" font-size="20" font-weight="700" fill="#7b241c">Weak</text>
    <text x="340" y="244" text-anchor="middle" font-size="20" font-weight="700" fill="#8a5a00">Limited</text>
    <text x="560" y="244" text-anchor="middle" font-size="20" font-weight="700" fill="#155c8a">Reasonable</text>
    <text x="760" y="244" text-anchor="middle" font-size="20" font-weight="700" fill="#1e6b2d">Strong</text>
    <text x="140" y="277" text-anchor="middle" font-size="15" fill="#475569">biased or unclear</text>
    <text x="340" y="277" text-anchor="middle" font-size="15" fill="#475569">some missing details</text>
    <text x="560" y="277" text-anchor="middle" font-size="15" fill="#475569">mostly matches</text>
    <text x="760" y="277" text-anchor="middle" font-size="15" fill="#475569">fair and well described</text>
  </g>
</svg>
