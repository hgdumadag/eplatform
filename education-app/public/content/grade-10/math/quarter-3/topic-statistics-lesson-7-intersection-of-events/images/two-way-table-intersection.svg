<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Two-way table highlighting an intersection cell</title>
  <desc id="desc">A table for studied and passed with the studied and passed cell highlighted as 18.</desc>
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="70" y="72" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Find the joint frequency</text>
  <text x="70" y="106" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">The intersection is the cell where the two conditions meet.</text>
  <g transform="translate(125 145)">
    <rect width="710" height="270" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="0" y="0" width="710" height="68" rx="8" fill="#e2e8f0"/>
    <rect x="0" y="68" width="185" height="202" fill="#f1f5f9"/>
    <rect x="185" y="68" width="175" height="67" fill="#fef3c7" stroke="#ca8a04" stroke-width="4"/>
    <g stroke="#cbd5e1" stroke-width="2">
      <line x1="185" y1="0" x2="185" y2="270"/>
      <line x1="360" y1="0" x2="360" y2="270"/>
      <line x1="545" y1="0" x2="545" y2="270"/>
      <line x1="0" y1="68" x2="710" y2="68"/>
      <line x1="0" y1="135" x2="710" y2="135"/>
      <line x1="0" y1="202" x2="710" y2="202"/>
    </g>
    <text x="272" y="43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Passed</text>
    <text x="452" y="43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Did not pass</text>
    <text x="628" y="43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Total</text>
    <text x="92" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Studied</text>
    <text x="92" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Did not study</text>
    <text x="92" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Total</text>
    <text x="272" y="113" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#92400e">18</text>
    <text x="452" y="113" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#334155">6</text>
    <text x="628" y="113" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#334155">24</text>
    <text x="272" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#334155">7</text>
    <text x="452" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#334155">9</text>
    <text x="628" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#334155">16</text>
    <text x="272" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#334155">25</text>
    <text x="452" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#334155">15</text>
    <text x="628" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">40</text>
  </g>
  <path d="M397 283 C315 322 273 356 241 419" fill="none" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
  <text x="70" y="462" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#92400e">18 is the count for studied and passed.</text>
</svg>
