<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Union versus intersection comparison</title>
  <desc id="desc">Two Venn diagrams comparing union shading with intersection shading.</desc>
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="70" y="72" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Do not mix up union and intersection</text>
  <text x="70" y="106" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">The same events have different shaded regions depending on the symbol.</text>
  <g transform="translate(88 150)">
    <rect width="360" height="255" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="180" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Union: A or B</text>
    <circle cx="145" cy="139" r="78" fill="#93c5fd" fill-opacity="0.8" stroke="#2563eb" stroke-width="3"/>
    <circle cx="215" cy="139" r="78" fill="#86efac" fill-opacity="0.8" stroke="#16a34a" stroke-width="3"/>
    <text x="180" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155">A union B</text>
  </g>
  <g transform="translate(512 150)">
    <rect width="360" height="255" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="180" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Intersection: A and B</text>
    <circle cx="145" cy="139" r="78" fill="#dbeafe" fill-opacity="0.6" stroke="#2563eb" stroke-width="3"/>
    <circle cx="215" cy="139" r="78" fill="#dcfce7" fill-opacity="0.6" stroke="#16a34a" stroke-width="3"/>
    <path d="M180 77 A78 78 0 0 1 180 201 A78 78 0 0 1 180 77" fill="#facc15" fill-opacity="0.9" stroke="#ca8a04" stroke-width="2"/>
    <text x="180" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#854d0e">A intersect B</text>
  </g>
  <text x="480" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">This lesson uses the right diagram: only the shared middle.</text>
</svg>
