<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Venn diagram for the intersection of studied and passed</title>
  <desc id="desc">A Venn diagram with 6 studied only, 18 studied and passed, 7 passed only, and 9 neither out of 40 learners.</desc>
  <rect width="960" height="520" fill="#f8fafc"/>
  <rect x="56" y="54" width="848" height="390" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="86" y="105" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#0f172a">Intersection means "both"</text>
  <text x="86" y="143" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Class survey: 40 learners</text>
  <circle cx="405" cy="270" r="132" fill="#60a5fa" fill-opacity="0.45" stroke="#2563eb" stroke-width="4"/>
  <circle cx="555" cy="270" r="132" fill="#34d399" fill-opacity="0.45" stroke="#059669" stroke-width="4"/>
  <path d="M480 161 A132 132 0 0 1 480 379 A132 132 0 0 1 480 161" fill="#facc15" fill-opacity="0.65" stroke="#ca8a04" stroke-width="2"/>
  <text x="349" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Studied</text>
  <text x="611" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#047857">Passed</text>
  <text x="351" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">6</text>
  <text x="480" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#854d0e">18</text>
  <text x="609" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#064e3b">7</text>
  <text x="480" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#854d0e">studied and passed</text>
  <rect x="733" y="335" width="78" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="772" y="367" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#334155">9</text>
  <text x="772" y="411" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">neither</text>
  <rect x="92" y="372" width="235" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="210" y="403" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">P(S and P) = 18/40</text>
  <text x="86" y="486" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#64748b">The overlap is the numerator for the intersection probability.</text>
</svg>
