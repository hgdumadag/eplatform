<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Distance formula for radius squared</title>
  <desc id="desc">A right triangle between a circle center and a point on the circle shows horizontal change, vertical change, and the squared-radius formula.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <g stroke="#d1d5db" stroke-width="1">
    <path d="M80 40 V340"/>
    <path d="M140 40 V340"/>
    <path d="M200 40 V340"/>
    <path d="M260 40 V340"/>
    <path d="M320 40 V340"/>
    <path d="M380 40 V340"/>
    <path d="M440 40 V340"/>
    <path d="M500 40 V340"/>
    <path d="M560 40 V340"/>
    <path d="M60 80 H600"/>
    <path d="M60 140 H600"/>
    <path d="M60 200 H600"/>
    <path d="M60 260 H600"/>
    <path d="M60 320 H600"/>
  </g>
  <circle cx="260" cy="250" r="6" fill="#111827"/>
  <circle cx="440" cy="130" r="8" fill="#dc2626"/>
  <line x1="260" y1="250" x2="440" y2="250" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <line x1="440" y1="250" x2="440" y2="130" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <line x1="260" y1="250" x2="440" y2="130" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <path d="M420 250 V230 H440" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="210" y="282" font-family="Arial, sans-serif" font-size="21" fill="#111827">C(h, k)</text>
  <text x="452" y="124" font-family="Arial, sans-serif" font-size="21" fill="#991b1b">P(a, b)</text>
  <text x="318" y="277" font-family="Arial, sans-serif" font-size="20" fill="#1d4ed8">a - h</text>
  <text x="454" y="197" font-family="Arial, sans-serif" font-size="20" fill="#15803d">b - k</text>
  <text x="315" y="176" font-family="Arial, sans-serif" font-size="20" fill="#b91c1c">r</text>
  <rect x="88" y="34" width="520" height="58" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="112" y="70" font-family="Arial, sans-serif" font-size="24" fill="#111827">
    r<tspan baseline-shift="super" font-size="15">2</tspan> = (a - h)<tspan baseline-shift="super" font-size="15">2</tspan> + (b - k)<tspan baseline-shift="super" font-size="15">2</tspan>
  </text>
</svg>
