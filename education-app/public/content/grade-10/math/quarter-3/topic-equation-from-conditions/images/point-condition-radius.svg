<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Point-on-circle condition determines radius</title>
  <desc id="desc">A coordinate plane shows a circle centered at C with a point P on the circle. The segment from C to P is labeled radius.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <g stroke="#d1d5db" stroke-width="1">
    <path d="M80 40 V360"/>
    <path d="M140 40 V360"/>
    <path d="M200 40 V360"/>
    <path d="M260 40 V360"/>
    <path d="M320 40 V360"/>
    <path d="M380 40 V360"/>
    <path d="M440 40 V360"/>
    <path d="M500 40 V360"/>
    <path d="M560 40 V360"/>
    <path d="M620 40 V360"/>
    <path d="M60 80 H640"/>
    <path d="M60 140 H640"/>
    <path d="M60 200 H640"/>
    <path d="M60 260 H640"/>
    <path d="M60 320 H640"/>
  </g>
  <g stroke="#111827" stroke-width="2">
    <path d="M60 200 H650"/>
    <path d="M320 365 V45"/>
  </g>
  <circle cx="320" cy="200" r="150" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <line x1="320" y1="200" x2="440" y2="110" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="200" r="7" fill="#111827"/>
  <circle cx="440" cy="110" r="8" fill="#dc2626"/>
  <text x="296" y="227" font-family="Arial, sans-serif" font-size="22" fill="#111827">C(h, k)</text>
  <text x="450" y="104" font-family="Arial, sans-serif" font-size="22" fill="#991b1b">P(a, b)</text>
  <text x="383" y="147" font-family="Arial, sans-serif" font-size="22" fill="#991b1b">radius</text>
  <rect x="72" y="24" width="420" height="42" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="92" y="52" font-family="Arial, sans-serif" font-size="20" fill="#1e3a8a">Point P is on the circle, so CP is the radius.</text>
</svg>
