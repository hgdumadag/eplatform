<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Workflow for writing circle equations from conditions</title>
  <desc id="desc">A four-step flowchart: identify center, use point condition, compute radius squared, and write the equation.</desc>
  <rect width="760" height="360" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <rect x="34" y="88" width="150" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="58" y="125" font-size="21" fill="#1e3a8a">1. Center</text>
    <text x="54" y="158" font-size="17" fill="#111827">Use (h, k)</text>
    <text x="54" y="183" font-size="17" fill="#111827">for binomials</text>

    <rect x="218" y="88" width="150" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="239" y="125" font-size="21" fill="#166534">2. Point</text>
    <text x="238" y="158" font-size="17" fill="#111827">Use (a, b)</text>
    <text x="238" y="183" font-size="17" fill="#111827">on circle</text>

    <rect x="402" y="88" width="150" height="120" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="424" y="125" font-size="21" fill="#9a3412">3. Compute</text>
    <text x="422" y="158" font-size="17" fill="#111827">Find r<tspan baseline-shift="super" font-size="11">2</tspan></text>
    <text x="422" y="183" font-size="17" fill="#111827">with distance</text>

    <rect x="586" y="88" width="150" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="609" y="125" font-size="21" fill="#991b1b">4. Equation</text>
    <text x="606" y="158" font-size="17" fill="#111827">Write final</text>
    <text x="606" y="183" font-size="17" fill="#111827">circle form</text>

    <line x1="184" y1="148" x2="214" y2="148" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="368" y1="148" x2="398" y2="148" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="552" y1="148" x2="582" y2="148" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="94" y="256" width="572" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="118" y="289" font-size="21" fill="#111827">(x - h)<tspan baseline-shift="super" font-size="13">2</tspan> + (y - k)<tspan baseline-shift="super" font-size="13">2</tspan> = (a - h)<tspan baseline-shift="super" font-size="13">2</tspan> + (b - k)<tspan baseline-shift="super" font-size="13">2</tspan></text>
  </g>
</svg>
