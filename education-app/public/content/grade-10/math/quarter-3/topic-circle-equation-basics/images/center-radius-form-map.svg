<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Center-radius form map</title>
  <desc id="desc">A diagram mapping the equation x minus h squared plus y minus k squared equals r squared to center h comma k and radius r.</desc>
  <rect width="720" height="420" fill="#f7fee7"/>
  <text x="56" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Center-Radius Form</text>
  <rect x="70" y="105" width="580" height="88" rx="12" fill="#ffffff" stroke="#84cc16" stroke-width="4"/>
  <text x="115" y="160" font-family="Arial, sans-serif" font-size="34" fill="#111827">(x - h)² + (y - k)² = r²</text>
  <g font-family="Arial, sans-serif" font-size="21" fill="#111827">
    <path d="M210 196C190 238 160 244 135 268" fill="none" stroke="#2563eb" stroke-width="4"/>
    <path d="M377 196C397 238 430 244 458 268" fill="none" stroke="#7c3aed" stroke-width="4"/>
    <path d="M578 196C602 234 603 248 590 276" fill="none" stroke="#dc2626" stroke-width="4"/>
    <rect x="72" y="276" width="190" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="96" y="307" font-weight="700">h and k</text>
    <text x="96" y="335">center (h, k)</text>
    <rect x="332" y="276" width="190" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="356" y="307" font-weight="700">subtractions</text>
    <text x="356" y="335">watch signs</text>
    <rect x="548" y="276" width="126" height="76" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="574" y="307" font-weight="700">r²</text>
    <text x="574" y="335">radius r</text>
  </g>
  <text x="86" y="388" font-family="Arial, sans-serif" font-size="19" fill="#475569">Example: (x - 3)² + (y + 2)² = 25 has center (3, -2) and radius 5.</text>
</svg>
