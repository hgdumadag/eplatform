<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Flow from center-radius form to general form</title>
  <desc id="desc">A three-step visual showing expansion, simplification, and moving all terms to one side.</desc>
  <rect width="760" height="360" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="35" y="70" width="205" height="190" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="278" y="70" width="205" height="190" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <rect x="520" y="70" width="205" height="190" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <line x1="250" y1="165" x2="268" y2="165" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="493" y1="165" x2="511" y2="165" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="137" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">Start</text>
  <text x="137" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111827">(x - h)² + (y - k)² = r²</text>
  <text x="137" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">Center-radius form</text>
  <text x="380" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#14532d">Expand</text>
  <text x="380" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#111827">x² - 2hx + h²</text>
  <text x="380" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#111827">+ y² - 2ky + k² = r²</text>
  <text x="380" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">Use binomial patterns</text>
  <text x="622" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7c2d12">General Form</text>
  <text x="622" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111827">x² + y² + Dx + Ey + F = 0</text>
  <text x="622" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">Combine and set equal to 0</text>
  <text x="380" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Every term must be accounted for before the final = 0.</text>
</svg>
