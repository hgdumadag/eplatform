<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Sign check for center-radius form expansion</title>
  <desc id="desc">A comparison showing that x minus 3 squared expands to x squared minus 6x plus 9, while y plus 5 squared expands to y squared plus 10y plus 25.</desc>
  <rect width="760" height="360" fill="#f8fafc"/>
  <rect x="50" y="58" width="300" height="230" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="410" y="58" width="300" height="230" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">(x - 3)²</text>
  <text x="200" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111827">(x - 3)(x - 3)</text>
  <text x="200" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111827">x² - 3x - 3x + 9</text>
  <text x="200" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">x² - 6x + 9</text>
  <text x="560" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">(y + 5)²</text>
  <text x="560" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111827">(y + 5)(y + 5)</text>
  <text x="560" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111827">y² + 5y + 5y + 25</text>
  <text x="560" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">y² + 10y + 25</text>
  <text x="380" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">The sign inside the parentheses controls the sign of the middle term.</text>
</svg>
