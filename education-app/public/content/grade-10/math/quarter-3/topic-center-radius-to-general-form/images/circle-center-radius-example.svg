<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Circle with center at 2 negative 3 and radius 4</title>
  <desc id="desc">A coordinate grid showing a circle centered at 2 comma negative 3 with radius 4, connected to the equation x minus 2 squared plus y plus 3 squared equals 16.</desc>
  <rect width="760" height="430" fill="#f8fafc"/>
  <g transform="translate(80,35)">
    <rect x="0" y="0" width="360" height="360" fill="#ffffff" stroke="#cbd5e1"/>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="0" y1="20" x2="360" y2="20"/><line x1="0" y1="60" x2="360" y2="60"/><line x1="0" y1="100" x2="360" y2="100"/><line x1="0" y1="140" x2="360" y2="140"/><line x1="0" y1="180" x2="360" y2="180"/><line x1="0" y1="220" x2="360" y2="220"/><line x1="0" y1="260" x2="360" y2="260"/><line x1="0" y1="300" x2="360" y2="300"/><line x1="0" y1="340" x2="360" y2="340"/>
      <line x1="20" y1="0" x2="20" y2="360"/><line x1="60" y1="0" x2="60" y2="360"/><line x1="100" y1="0" x2="100" y2="360"/><line x1="140" y1="0" x2="140" y2="360"/><line x1="180" y1="0" x2="180" y2="360"/><line x1="220" y1="0" x2="220" y2="360"/><line x1="260" y1="0" x2="260" y2="360"/><line x1="300" y1="0" x2="300" y2="360"/><line x1="340" y1="0" x2="340" y2="360"/>
    </g>
    <line x1="0" y1="180" x2="360" y2="180" stroke="#334155" stroke-width="2"/>
    <line x1="180" y1="0" x2="180" y2="360" stroke="#334155" stroke-width="2"/>
    <circle cx="260" cy="300" r="160" fill="#dbeafe" fill-opacity="0.45" stroke="#2563eb" stroke-width="4"/>
    <circle cx="260" cy="300" r="6" fill="#dc2626"/>
    <line x1="260" y1="300" x2="420" y2="300" stroke="#dc2626" stroke-width="3"/>
    <text x="275" y="292" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">center (2, -3)</text>
    <text x="326" y="292" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">r = 4</text>
    <text x="342" y="174" font-family="Arial, sans-serif" font-size="14" fill="#334155">x</text>
    <text x="188" y="15" font-family="Arial, sans-serif" font-size="14" fill="#334155">y</text>
  </g>
  <g transform="translate(500,92)">
    <rect x="0" y="0" width="220" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="110" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Example Link</text>
    <text x="24" y="82" font-family="Arial, sans-serif" font-size="18" fill="#111827">(x - 2)² + (y + 3)² = 16</text>
    <text x="24" y="124" font-family="Arial, sans-serif" font-size="16" fill="#334155">Center: (2, -3)</text>
    <text x="24" y="154" font-family="Arial, sans-serif" font-size="16" fill="#334155">Radius: 4</text>
    <text x="24" y="194" font-family="Arial, sans-serif" font-size="16" fill="#334155">General form comes</text>
    <text x="24" y="220" font-family="Arial, sans-serif" font-size="16" fill="#334155">from expansion.</text>
  </g>
</svg>
