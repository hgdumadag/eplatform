<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Center-radius equation template</title>
  <desc id="desc">The formula x minus h squared plus y minus k squared equals r squared, with labels for center and radius.</desc>
  <rect width="760" height="300" rx="16" fill="#f8fafc"/>
  <rect x="50" y="44" width="660" height="116" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="92" y="118" font-family="Arial, sans-serif" font-size="40" fill="#111827">(x - h)<tspan baseline-shift="super" font-size="24">2</tspan> + (y - k)<tspan baseline-shift="super" font-size="24">2</tspan> = r<tspan baseline-shift="super" font-size="24">2</tspan></text>
  <path d="M194 150C194 190 252 190 252 150" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M417 150C417 190 475 190 475 150" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M603 150V204" stroke="#dc2626" stroke-width="4"/>
  <text x="154" y="232" font-family="Arial, sans-serif" font-size="22" fill="#1d4ed8">h and k come from center (h, k)</text>
  <text x="542" y="232" font-family="Arial, sans-serif" font-size="22" fill="#991b1b">right side is radius squared</text>
  <circle cx="216" cy="184" r="5" fill="#2563eb"/>
  <circle cx="442" cy="184" r="5" fill="#2563eb"/>
</svg>
