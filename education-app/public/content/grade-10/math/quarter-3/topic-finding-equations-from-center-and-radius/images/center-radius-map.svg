    <path d="M360 40V380"/>
    <g opacity="0.75">
      <path d="M110 40V380"/><path d="M160 40V380"/><path d="M210 40V380"/><path d="M260 40V380"/><path d="M310 40V380"/><path d="M410 40V380"/><path d="M460 40V380"/><path d="M510 40V380"/><path d="M560 40V380"/><path d="M610 40V380"/>
      <path d="M60 60H660"/><path d="M60 110H660"/><path d="M60 160H660"/><path d="M60 260H660"/><path d="M60 310H660"/><path d="M60 360H660"/>
    </g>
  </g>
