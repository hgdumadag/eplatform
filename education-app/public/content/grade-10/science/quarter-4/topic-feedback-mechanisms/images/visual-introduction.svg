<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Feedback Mechanisms: Positive and Negative concept flow" viewBox="0 0 820 280" width="100%" height="280" style="max-width:820px">
  <rect width="820" height="280" rx="20" fill="#f8fafc"/>
  <text x="32" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Feedback Mechanisms: Positive and Negative</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <g font-family="Arial, sans-serif">
    <rect x="40" y="88" width="210" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="145" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Step 1</text>
    <text x="145" y="158" text-anchor="middle" font-size="13" fill="#1e3a8a">Stimulus detected</text>
    <path d="M265 148 H320" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="335" y="88" width="210" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="440" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Step 2</text>
    <text x="440" y="149" text-anchor="middle" font-size="13" fill="#14532d">Control center signals</text>
    <text x="440" y="167" text-anchor="middle" font-size="13" fill="#14532d">response</text>
    <path d="M560 148 H615" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="630" y="88" width="150" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="705" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Result</text>
    <text x="705" y="140" text-anchor="middle" font-size="13" fill="#78350f">Condition returns</text>
    <text x="705" y="158" text-anchor="middle" font-size="13" fill="#78350f">or process</text>
    <text x="705" y="176" text-anchor="middle" font-size="13" fill="#78350f">completes</text>
