    <path d="M630 167 H680" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="700" y="92" width="160" height="150" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="780" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">Product</text>
    <text x="780" y="158" text-anchor="middle" font-size="13" fill="#78350f">Food changes in texture, flavor, or acidity</text>
