<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Traditional Biotechnology: Fermentation visual overview" viewBox="0 0 900 320" width="100%" height="320" style="max-width:900px">
  <rect width="900" height="320" rx="20" fill="#f8fafc"/>
  <text x="36" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Traditional Biotechnology: Fermentation</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <rect x="40" y="92" width="240" height="150" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Ingredients</text>
    <text x="160" y="164" text-anchor="middle" font-size="14" fill="#1e3a8a">Sugar-rich material such as dough or coconut water</text>
