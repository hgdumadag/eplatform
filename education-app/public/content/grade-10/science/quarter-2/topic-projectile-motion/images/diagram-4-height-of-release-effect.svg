<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
<title id="title">Height of release effect</title><desc id="desc">Launching from higher ground gives more time to fall, so range can increase</desc>
<rect width="920" height="500" rx="28" fill="#f8fafc"/>
<rect x="22" y="22" width="876" height="456" rx="24" fill="#fce7f3" stroke="#0f172a" stroke-width="2"/>
<text x="460" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#0f172a">Height of release effect</text>
<text x="460" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Launching from higher ground gives more time to fall, so range can</text>
<text x="460" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">increase</text>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/></marker></defs>
<line x1="116" y1="330" x2="790" y2="330" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="116" y1="330" x2="116" y2="155" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M125 320 C280 130, 560 145, 760 320" fill="none" stroke="#2563eb" stroke-width="7"/>
<circle cx="125" cy="320" r="15" fill="#ef4444"/>
<circle cx="760" cy="320" r="15" fill="#22c55e"/>
<text x="385" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">range</text>
<text x="150" y="185" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">height</text>
<rect x="95" y="250" width="90" height="80" fill="#94a3b8" opacity="0.45"/>
<text x="143" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">release height</text>
<rect x="38" y="104" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="50" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">higher release point</text>
<rect x="648" y="104" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="660" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">longer time in air</text>
<rect x="38" y="372" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="50" y="396" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">farther landing point</text>
<rect x="342" y="372" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="354" y="396" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">same launch speed</text>
</svg>