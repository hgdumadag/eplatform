<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
<title id="title">Momentum bar chart</title><desc id="desc">Bar height can compare relative momentum values</desc>
<rect width="920" height="500" rx="28" fill="#f8fafc"/>
<rect x="22" y="22" width="876" height="456" rx="24" fill="#fce7f3" stroke="#0f172a" stroke-width="2"/>
<text x="460" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#0f172a">Momentum bar chart</text>
<text x="460" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Bar height can compare relative momentum values</text>
<line x1="150" y1="330" x2="780" y2="330" stroke="#334155" stroke-width="3"/>
<rect x="180" y="275" width="88" height="55" rx="9" fill="#38bdf8" stroke="#0f172a"/>
<text x="224" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">light slow</text>
<rect x="325" y="220" width="88" height="110" rx="9" fill="#34d399" stroke="#0f172a"/>
<text x="369" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">light fast</text>
<rect x="470" y="160" width="88" height="170" rx="9" fill="#f59e0b" stroke="#0f172a"/>
<text x="514" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">heavy slow</text>
<rect x="615" y="70" width="88" height="260" rx="9" fill="#fb7185" stroke="#0f172a"/>
<text x="659" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">heavy fast</text>
<rect x="38" y="104" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="50" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">light + slow</text>
<rect x="648" y="104" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="660" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">light + fast</text>
<rect x="38" y="372" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="50" y="396" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">heavy + slow</text>
<rect x="342" y="372" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="354" y="396" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">heavy + fast</text>
</svg>