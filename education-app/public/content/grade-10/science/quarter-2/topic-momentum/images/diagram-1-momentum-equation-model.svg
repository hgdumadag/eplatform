<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
<title id="title">Momentum equation model</title><desc id="desc">Momentum increases when mass or velocity increases</desc>
<rect width="920" height="500" rx="28" fill="#f8fafc"/>
<rect x="22" y="22" width="876" height="456" rx="24" fill="#e0f2fe" stroke="#0f172a" stroke-width="2"/>
<text x="460" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#0f172a">Momentum equation model</text>
<text x="460" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Momentum increases when mass or velocity increases</text>
<rect x="185" y="158" width="550" height="150" rx="24" fill="#ffffff" stroke="#334155" stroke-width="3"/>
<text x="460" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#2563eb">relationship model</text>
<rect x="38" y="104" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="50" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">p = m × v</text>
<rect x="648" y="104" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="660" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">mass in kilograms</text>
<rect x="38" y="372" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="50" y="396" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">velocity in m/s</text>
<rect x="342" y="372" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="354" y="396" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">momentum in kg·m/s</text>
</svg>