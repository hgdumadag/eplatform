<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="540" viewBox="0 0 960 540" role="img" aria-label="Momentum Equation Model">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/></filter>
</defs>
<rect width="960" height="540" fill="#f5f3ff"/>
<rect x="28" y="24" width="904" height="72" rx="22" fill="white" filter="url(#shadow)"/>
<text x="52" y="56" font-size="26" font-weight="800" fill="#0f172a">Momentum Equation Model</text>
<text x="52" y="82" font-size="15" font-weight="500" fill="#475569">Momentum depends on both mass and velocity: p = m × v</text>
<rect x="256" y="145" width="448" height="96" rx="24" fill="white" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
<text x="480" y="205" font-size="38" font-weight="800" fill="#7c3aed" text-anchor="middle">m × v</text>
<rect x="70" y="300" width="180" height="108" rx="18" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="160" y="338" text-anchor="middle" font-size="30" font-weight="800" fill="#7c3aed">p</text>
<text x="160" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">momentum</text>
<text x="160" y="390" text-anchor="middle" font-size="14" fill="#475569">kg·m/s</text>
<rect x="275" y="300" width="180" height="108" rx="18" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="365" y="338" text-anchor="middle" font-size="30" font-weight="800" fill="#7c3aed">m</text>
<text x="365" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">mass</text>
<text x="365" y="390" text-anchor="middle" font-size="14" fill="#475569">kg</text>
<rect x="480" y="300" width="180" height="108" rx="18" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="570" y="338" text-anchor="middle" font-size="30" font-weight="800" fill="#7c3aed">v</text>
<text x="570" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">velocity</text>
<text x="570" y="390" text-anchor="middle" font-size="14" fill="#475569">m/s</text>
<rect x="685" y="300" width="180" height="108" rx="18" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="775" y="338" text-anchor="middle" font-size="30" font-weight="800" fill="#7c3aed">Direction</text>
<text x="775" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">same as velocity</text>
<text x="775" y="390" text-anchor="middle" font-size="14" fill="#475569">vector</text>
<text x="480" y="518" text-anchor="middle" font-size="13" fill="#64748b">Read the labels, follow the arrows, then explain the relationship in your own words.</text>
</svg>
