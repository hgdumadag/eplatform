<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="540" viewBox="0 0 960 540" role="img" aria-label="Step-Up and Step-Down Voltage">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#ca8a04"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/></filter>
</defs>
<rect width="960" height="540" fill="#fffbeb"/>
<rect x="28" y="24" width="904" height="72" rx="22" fill="white" filter="url(#shadow)"/>
<text x="52" y="56" font-size="26" font-weight="800" fill="#0f172a">Step-Up and Step-Down Voltage</text>
<text x="52" y="82" font-size="15" font-weight="500" fill="#475569">High voltage reduces energy loss on long transmission lines; voltage is lowered near users</text>
<line x1="480" y1="128" x2="480" y2="455" stroke="#ca8a04" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="68" y="150" width="354" height="120" rx="18" fill="white" stroke="#ca8a04" stroke-width="2"/>
<circle cx="92" cy="178" r="10" fill="#ca8a04" opacity="0.9"/>
<text x="112" y="182" font-size="18" fill="#111827" font-weight="700" text-anchor="start">At plant</text>
<text x="90" y="216" font-size="15" fill="#334155" font-weight="500" text-anchor="start">generator output • moderate</text>
<text x="90" y="235" font-size="15" fill="#334155" font-weight="500" text-anchor="start">voltage</text>
<rect x="538" y="150" width="354" height="120" rx="18" fill="white" stroke="#ca8a04" stroke-width="2"/>
<circle cx="562" cy="178" r="10" fill="#ca8a04" opacity="0.9"/>
<text x="582" y="182" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Step up</text>
<text x="560" y="216" font-size="15" fill="#334155" font-weight="500" text-anchor="start">higher voltage • lower current</text>
<text x="560" y="235" font-size="15" fill="#334155" font-weight="500" text-anchor="start">for same power</text>
<rect x="68" y="320" width="354" height="120" rx="18" fill="white" stroke="#ca8a04" stroke-width="2"/>
<circle cx="92" cy="348" r="10" fill="#ca8a04" opacity="0.9"/>
<text x="112" y="352" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Long lines</text>
<text x="90" y="386" font-size="15" fill="#334155" font-weight="500" text-anchor="start">less heating loss • efficient</text>
<text x="90" y="405" font-size="15" fill="#334155" font-weight="500" text-anchor="start">transfer</text>
<rect x="538" y="320" width="354" height="120" rx="18" fill="white" stroke="#ca8a04" stroke-width="2"/>
<circle cx="562" cy="348" r="10" fill="#ca8a04" opacity="0.9"/>
<text x="582" y="352" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Step down</text>
<text x="560" y="386" font-size="15" fill="#334155" font-weight="500" text-anchor="start">safer voltage • homes and</text>
<text x="560" y="405" font-size="15" fill="#334155" font-weight="500" text-anchor="start">schools</text>
<text x="480" y="518" text-anchor="middle" font-size="13" fill="#64748b">Read the labels, follow the arrows, then explain the relationship in your own words.</text>
</svg>
