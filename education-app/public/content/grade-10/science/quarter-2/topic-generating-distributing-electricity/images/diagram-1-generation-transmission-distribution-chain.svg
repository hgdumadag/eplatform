<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="540" viewBox="0 0 960 540" role="img" aria-label="Generation to Home Chain">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#ca8a04"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/></filter>
</defs>
<rect width="960" height="540" fill="#fffbeb"/>
<rect x="28" y="24" width="904" height="72" rx="22" fill="white" filter="url(#shadow)"/>
<text x="52" y="56" font-size="26" font-weight="800" fill="#0f172a">Generation to Home Chain</text>
<text x="52" y="82" font-size="15" font-weight="500" fill="#475569">Electricity passes through generation, transmission, distribution, and household circuits</text>
<rect x="58" y="188" width="196" height="150" rx="18" fill="white" stroke="#ca8a04" stroke-width="2"/>
<circle cx="82" cy="216" r="10" fill="#ca8a04" opacity="0.9"/>
<text x="102" y="220" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Power plant</text>
<text x="80" y="254" font-size="15" fill="#334155" font-weight="500" text-anchor="start">generator converts motion to</text>
<text x="80" y="273" font-size="15" fill="#334155" font-weight="500" text-anchor="start">electricity</text>
<line x1="254" y1="263" x2="258" y2="263" stroke="#ca8a04" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="274" y="188" width="196" height="150" rx="18" fill="white" stroke="#ca8a04" stroke-width="2"/>
<circle cx="298" cy="216" r="10" fill="#ca8a04" opacity="0.9"/>
<text x="318" y="220" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Step-up transformer</text>
<text x="296" y="254" font-size="15" fill="#334155" font-weight="500" text-anchor="start">raises voltage for long</text>
<text x="296" y="273" font-size="15" fill="#334155" font-weight="500" text-anchor="start">distance</text>
<line x1="470" y1="263" x2="474" y2="263" stroke="#ca8a04" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="490" y="188" width="196" height="150" rx="18" fill="white" stroke="#ca8a04" stroke-width="2"/>
<circle cx="514" cy="216" r="10" fill="#ca8a04" opacity="0.9"/>
<text x="534" y="220" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Transmission lines</text>
<text x="512" y="254" font-size="15" fill="#334155" font-weight="500" text-anchor="start">carry energy across regions</text>
<line x1="686" y1="263" x2="690" y2="263" stroke="#ca8a04" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="706" y="188" width="196" height="150" rx="18" fill="white" stroke="#ca8a04" stroke-width="2"/>
<circle cx="730" cy="216" r="10" fill="#ca8a04" opacity="0.9"/>
<text x="750" y="220" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Distribution + home</text>
<text x="728" y="254" font-size="15" fill="#334155" font-weight="500" text-anchor="start">voltage lowered for safe use</text>
<text x="480" y="518" text-anchor="middle" font-size="13" fill="#64748b">Read the labels, follow the arrows, then explain the relationship in your own words.</text>
</svg>
