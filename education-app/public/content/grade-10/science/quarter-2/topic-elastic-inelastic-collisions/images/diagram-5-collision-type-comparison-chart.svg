<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="540" viewBox="0 0 960 540" role="img" aria-label="Elastic vs Inelastic Collision">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#1d4ed8"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/></filter>
</defs>
<rect width="960" height="540" fill="#eff6ff"/>
<rect x="28" y="24" width="904" height="72" rx="22" fill="white" filter="url(#shadow)"/>
<text x="52" y="56" font-size="26" font-weight="800" fill="#0f172a">Elastic vs Inelastic Collision</text>
<text x="52" y="82" font-size="15" font-weight="500" fill="#475569">Use observable evidence to classify a collision</text>
<rect x="70" y="130" width="820" height="330" rx="18" fill="white" stroke="#1d4ed8" stroke-width="2"/>
<rect x="70" y="130" width="820" height="54" rx="18" fill="#1d4ed8" opacity="0.92"/>
<text x="105" y="165" font-size="18" font-weight="800" fill="white">Feature</text>
<text x="505" y="165" font-size="18" font-weight="800" fill="white">Type A / Renewable</text>
<text x="700" y="165" font-size="18" font-weight="800" fill="white">Type B / Non-renewable</text>
<line x1="90" y1="194" x2="870" y2="194" stroke="#e2e8f0"/>
<text x="105" y="218" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">Bounce apart</text>
<text x="505" y="218" font-size="16" fill="#334155" font-weight="600" text-anchor="start">High</text>
<text x="700" y="218" font-size="16" fill="#334155" font-weight="600" text-anchor="start">Low</text>
<line x1="90" y1="262" x2="870" y2="262" stroke="#e2e8f0"/>
<text x="105" y="286" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">Stick/deform</text>
<text x="505" y="286" font-size="16" fill="#334155" font-weight="600" text-anchor="start">Low</text>
<text x="700" y="286" font-size="16" fill="#334155" font-weight="600" text-anchor="start">High</text>
<line x1="90" y1="330" x2="870" y2="330" stroke="#e2e8f0"/>
<text x="105" y="354" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">Kinetic energy retained</text>
<text x="505" y="354" font-size="16" fill="#334155" font-weight="600" text-anchor="start">High</text>
<text x="700" y="354" font-size="16" fill="#334155" font-weight="600" text-anchor="start">Lower</text>
<line x1="90" y1="398" x2="870" y2="398" stroke="#e2e8f0"/>
<text x="105" y="422" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">Momentum conserved</text>
<text x="505" y="422" font-size="16" fill="#334155" font-weight="600" text-anchor="start">Yes</text>
<text x="700" y="422" font-size="16" fill="#334155" font-weight="600" text-anchor="start">Yes if isolated</text>
<text x="480" y="518" text-anchor="middle" font-size="13" fill="#64748b">Read the labels, follow the arrows, then explain the relationship in your own words.</text>
</svg>
