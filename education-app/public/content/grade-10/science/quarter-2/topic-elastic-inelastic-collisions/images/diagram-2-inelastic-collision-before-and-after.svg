<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
<title id="title">Inelastic collision before and after</title><desc id="desc">Objects stick or deform; some kinetic energy becomes heat, sound, and shape change</desc>
<rect width="920" height="500" rx="28" fill="#f8fafc"/>
<rect x="22" y="22" width="876" height="456" rx="24" fill="#dcfce7" stroke="#0f172a" stroke-width="2"/>
<text x="460" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#0f172a">Inelastic collision before and after</text>
<text x="460" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Objects stick or deform; some kinetic energy becomes heat, sound, and</text>
<text x="460" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">shape change</text>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#16a34a"/></marker></defs>
<rect x="105" y="175" width="280" height="140" rx="18" fill="#ffffff" stroke="#64748b"/>
<rect x="535" y="175" width="280" height="140" rx="18" fill="#ffffff" stroke="#64748b"/>
<path d="M405 245 L510 245" stroke="#16a34a" stroke-width="8" marker-end="url(#arrow)"/>
<text x="245" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">before</text>
<text x="675" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">after</text>
<circle cx="210" cy="245" r="32" fill="#93c5fd"/><rect x="620" y="220" width="88" height="50" rx="18" fill="#fca5a5"/>
<rect x="38" y="104" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="50" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">before: cart hits clay</text>
<rect x="648" y="104" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="660" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">during: deformation</text>
<rect x="38" y="372" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="50" y="396" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">after: objects move</text>
<text x="50" y="413" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">together</text>
<rect x="342" y="372" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="354" y="396" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">kinetic energy decreases</text>
</svg>