<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="540" viewBox="0 0 960 540" role="img" aria-label="Force Pairs During Collision">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#1d4ed8"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/></filter>
</defs>
<rect width="960" height="540" fill="#eff6ff"/>
<rect x="28" y="24" width="904" height="72" rx="22" fill="white" filter="url(#shadow)"/>
<text x="52" y="56" font-size="26" font-weight="800" fill="#0f172a">Force Pairs During Collision</text>
<text x="52" y="82" font-size="15" font-weight="500" fill="#475569">Each object pushes the other with equal-size opposite-direction forces</text>
<line x1="480" y1="128" x2="480" y2="455" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="68" y="150" width="354" height="120" rx="18" fill="white" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="92" cy="178" r="10" fill="#1d4ed8" opacity="0.9"/>
<text x="112" y="182" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Force on A</text>
<text x="90" y="216" font-size="15" fill="#334155" font-weight="500" text-anchor="start">Points left • Caused by object</text>
<text x="90" y="235" font-size="15" fill="#334155" font-weight="500" text-anchor="start">B</text>
<rect x="538" y="150" width="354" height="120" rx="18" fill="white" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="562" cy="178" r="10" fill="#1d4ed8" opacity="0.9"/>
<text x="582" y="182" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Force on B</text>
<text x="560" y="216" font-size="15" fill="#334155" font-weight="500" text-anchor="start">Points right • Caused by</text>
<text x="560" y="235" font-size="15" fill="#334155" font-weight="500" text-anchor="start">object A</text>
<rect x="68" y="320" width="354" height="120" rx="18" fill="white" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="92" cy="348" r="10" fill="#1d4ed8" opacity="0.9"/>
<text x="112" y="352" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Same interaction</text>
<text x="90" y="386" font-size="15" fill="#334155" font-weight="500" text-anchor="start">Equal magnitude • Same contact</text>
<text x="90" y="405" font-size="15" fill="#334155" font-weight="500" text-anchor="start">time</text>
<rect x="538" y="320" width="354" height="120" rx="18" fill="white" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="562" cy="348" r="10" fill="#1d4ed8" opacity="0.9"/>
<text x="582" y="352" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Different objects</text>
<text x="560" y="386" font-size="15" fill="#334155" font-weight="500" text-anchor="start">Do not cancel • Each object</text>
<text x="560" y="405" font-size="15" fill="#334155" font-weight="500" text-anchor="start">accelerates</text>
<text x="480" y="518" text-anchor="middle" font-size="13" fill="#64748b">Read the labels, follow the arrows, then explain the relationship in your own words.</text>
</svg>
