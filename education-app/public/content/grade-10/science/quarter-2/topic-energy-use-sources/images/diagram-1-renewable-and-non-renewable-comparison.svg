<text x="460" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">supply</text>
<rect x="110" y="170" width="310" height="170" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
