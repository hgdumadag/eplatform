<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="540" viewBox="0 0 960 540" role="img" aria-label="Equal and Opposite Recoil">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/></filter>
</defs>
<rect width="960" height="540" fill="#eff6ff"/>
<rect x="28" y="24" width="904" height="72" rx="22" fill="white" filter="url(#shadow)"/>
<text x="52" y="56" font-size="26" font-weight="800" fill="#0f172a">Equal and Opposite Recoil</text>
<text x="52" y="82" font-size="15" font-weight="500" fill="#475569">When two objects push apart, their momenta can balance in opposite directions</text>
<line x1="480" y1="128" x2="480" y2="455" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="68" y="150" width="354" height="120" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/>
<circle cx="92" cy="178" r="10" fill="#2563eb" opacity="0.9"/>
<text x="112" y="182" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Skater A</text>
<text x="90" y="216" font-size="15" fill="#334155" font-weight="500" text-anchor="start">moves left • momentum left</text>
<rect x="538" y="150" width="354" height="120" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/>
<circle cx="562" cy="178" r="10" fill="#2563eb" opacity="0.9"/>
<text x="582" y="182" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Skater B</text>
<text x="560" y="216" font-size="15" fill="#334155" font-weight="500" text-anchor="start">moves right • momentum right</text>
<rect x="68" y="320" width="354" height="120" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/>
<circle cx="92" cy="348" r="10" fill="#2563eb" opacity="0.9"/>
<text x="112" y="352" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Total system</text>
<text x="90" y="386" font-size="15" fill="#334155" font-weight="500" text-anchor="start">left p + right p • can equal</text>
<text x="90" y="405" font-size="15" fill="#334155" font-weight="500" text-anchor="start">zero</text>
<rect x="538" y="320" width="354" height="120" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/>
<circle cx="562" cy="348" r="10" fill="#2563eb" opacity="0.9"/>
<text x="582" y="352" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Evidence</text>
<text x="560" y="386" font-size="15" fill="#334155" font-weight="500" text-anchor="start">both move after push •</text>
<text x="560" y="405" font-size="15" fill="#334155" font-weight="500" text-anchor="start">internal forces created motion</text>
<text x="480" y="518" text-anchor="middle" font-size="13" fill="#64748b">Read the labels, follow the arrows, then explain the relationship in your own words.</text>
</svg>
