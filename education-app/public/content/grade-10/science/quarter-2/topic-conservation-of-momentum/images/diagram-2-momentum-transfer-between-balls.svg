<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="540" viewBox="0 0 960 540" role="img" aria-label="Momentum Transfer Between Balls">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/></filter>
</defs>
<rect width="960" height="540" fill="#eff6ff"/>
<rect x="28" y="24" width="904" height="72" rx="22" fill="white" filter="url(#shadow)"/>
<text x="52" y="56" font-size="26" font-weight="800" fill="#0f172a">Momentum Transfer Between Balls</text>
<text x="52" y="82" font-size="15" font-weight="500" fill="#475569">One object can lose momentum while another gains it</text>
<rect x="58" y="188" width="196" height="150" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/>
<circle cx="82" cy="216" r="10" fill="#2563eb" opacity="0.9"/>
<text x="102" y="220" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Ball A moving</text>
<text x="80" y="254" font-size="15" fill="#334155" font-weight="500" text-anchor="start">has momentum to the right</text>
<line x1="254" y1="263" x2="258" y2="263" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="274" y="188" width="196" height="150" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/>
<circle cx="298" cy="216" r="10" fill="#2563eb" opacity="0.9"/>
<text x="318" y="220" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Ball A hits Ball B</text>
<text x="296" y="254" font-size="15" fill="#334155" font-weight="500" text-anchor="start">contact force acts on both</text>
<text x="296" y="273" font-size="15" fill="#334155" font-weight="500" text-anchor="start">balls</text>
<line x1="470" y1="263" x2="474" y2="263" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="490" y="188" width="196" height="150" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/>
<circle cx="514" cy="216" r="10" fill="#2563eb" opacity="0.9"/>
<text x="534" y="220" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Ball A slows</text>
<text x="512" y="254" font-size="15" fill="#334155" font-weight="500" text-anchor="start">loses some momentum</text>
<line x1="686" y1="263" x2="690" y2="263" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="706" y="188" width="196" height="150" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/>
<circle cx="730" cy="216" r="10" fill="#2563eb" opacity="0.9"/>
<text x="750" y="220" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Ball B moves</text>
<text x="728" y="254" font-size="15" fill="#334155" font-weight="500" text-anchor="start">gains momentum in same</text>
<text x="728" y="273" font-size="15" fill="#334155" font-weight="500" text-anchor="start">direction</text>
<text x="480" y="518" text-anchor="middle" font-size="13" fill="#64748b">Read the labels, follow the arrows, then explain the relationship in your own words.</text>
</svg>
