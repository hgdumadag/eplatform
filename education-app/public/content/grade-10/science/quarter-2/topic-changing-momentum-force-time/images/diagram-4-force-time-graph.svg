<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="540" viewBox="0 0 960 540" role="img" aria-label="Force–Time Graph">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/></filter>
</defs>
<rect width="960" height="540" fill="#f0fdfa"/>
<rect x="28" y="24" width="904" height="72" rx="22" fill="white" filter="url(#shadow)"/>
<text x="52" y="56" font-size="26" font-weight="800" fill="#0f172a">Force–Time Graph</text>
<text x="52" y="82" font-size="15" font-weight="500" fill="#475569">Area under the graph is impulse; wide low peaks are safer than narrow high peaks</text>
<line x1="120" y1="410" x2="830" y2="410" stroke="#334155" stroke-width="3"/>
<line x1="120" y1="410" x2="120" y2="145" stroke="#334155" stroke-width="3"/>
<text x="465" y="452" font-size="16" font-weight="700" fill="#334155">time</text>
<text x="66" y="158" font-size="16" font-weight="700" fill="#334155">force</text>
<path d="M180 410 C215 155, 260 155, 300 410" fill="#0f766e" opacity="0.45" stroke="#0f766e" stroke-width="3"/>
<path d="M455 410 C530 280, 650 280, 725 410" fill="#0f766e" opacity="0.25" stroke="#0f766e" stroke-width="3"/>
<text x="235" y="135" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">short stop: high peak</text>
<text x="235" y="155" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">force</text>
<text x="590" y="265" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">long stop: lower peak</text>
<text x="590" y="285" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">force</text>
<text x="480" y="500" font-size="15" fill="#475569" font-weight="600" text-anchor="middle">Impulse is graph area. Safety devices try to spread the same momentum change</text>
<text x="480" y="518" font-size="15" fill="#475569" font-weight="600" text-anchor="middle">over more time.</text>
<text x="480" y="518" text-anchor="middle" font-size="13" fill="#64748b">Read the labels, follow the arrows, then explain the relationship in your own words.</text>
</svg>
