<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
<title id="title">Changing momentum flowchart</title><desc id="desc">Analyze changes by identifying initial momentum, force-time interaction, and final momentum</desc>
<rect width="920" height="500" rx="28" fill="#f8fafc"/>
<rect x="22" y="22" width="876" height="456" rx="24" fill="#ede9fe" stroke="#0f172a" stroke-width="2"/>
<text x="460" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#0f172a">Changing momentum flowchart</text>
<text x="460" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">Analyze changes by identifying initial momentum, force-time</text>
<text x="460" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">interaction, and final momentum</text>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/></marker></defs>
<rect x="120" y="198" width="130" height="82" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<path d="M255 239 L298 239" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
<rect x="305" y="198" width="130" height="82" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<path d="M440 239 L483 239" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
<rect x="490" y="198" width="130" height="82" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<path d="M625 239 L668 239" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
<rect x="675" y="198" width="130" height="82" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<rect x="38" y="104" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="50" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">initial p</text>
<rect x="648" y="104" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="660" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">force over time</text>
<rect x="38" y="372" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="50" y="396" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">change in p</text>
<rect x="342" y="372" width="235" height="58" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="354" y="396" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">final p</text>
</svg>