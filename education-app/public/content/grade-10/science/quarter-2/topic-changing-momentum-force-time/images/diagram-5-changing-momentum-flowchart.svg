<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="540" viewBox="0 0 960 540" role="img" aria-label="Changing Momentum Flowchart">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/></filter>
</defs>
<rect width="960" height="540" fill="#f0fdfa"/>
<rect x="28" y="24" width="904" height="72" rx="22" fill="white" filter="url(#shadow)"/>
<text x="52" y="56" font-size="26" font-weight="800" fill="#0f172a">Changing Momentum Flowchart</text>
<text x="52" y="82" font-size="15" font-weight="500" fill="#475569">Analyze any momentum-change problem in four steps</text>
<rect x="58" y="188" width="196" height="150" rx="18" fill="white" stroke="#0f766e" stroke-width="2"/>
<circle cx="82" cy="216" r="10" fill="#0f766e" opacity="0.9"/>
<text x="102" y="220" font-size="18" fill="#111827" font-weight="700" text-anchor="start">1. Initial p</text>
<text x="80" y="254" font-size="15" fill="#334155" font-weight="500" text-anchor="start">mass × starting velocity</text>
<line x1="254" y1="263" x2="258" y2="263" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="274" y="188" width="196" height="150" rx="18" fill="white" stroke="#0f766e" stroke-width="2"/>
<circle cx="298" cy="216" r="10" fill="#0f766e" opacity="0.9"/>
<text x="318" y="220" font-size="18" fill="#111827" font-weight="700" text-anchor="start">2. Interaction</text>
<text x="296" y="254" font-size="15" fill="#334155" font-weight="500" text-anchor="start">force acts during time</text>
<line x1="470" y1="263" x2="474" y2="263" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="490" y="188" width="196" height="150" rx="18" fill="white" stroke="#0f766e" stroke-width="2"/>
<circle cx="514" cy="216" r="10" fill="#0f766e" opacity="0.9"/>
<text x="534" y="220" font-size="18" fill="#111827" font-weight="700" text-anchor="start">3. Δp</text>
<text x="512" y="254" font-size="15" fill="#334155" font-weight="500" text-anchor="start">momentum increases, decreases,</text>
<text x="512" y="273" font-size="15" fill="#334155" font-weight="500" text-anchor="start">or reverses</text>
<line x1="686" y1="263" x2="690" y2="263" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="706" y="188" width="196" height="150" rx="18" fill="white" stroke="#0f766e" stroke-width="2"/>
<circle cx="730" cy="216" r="10" fill="#0f766e" opacity="0.9"/>
<text x="750" y="220" font-size="18" fill="#111827" font-weight="700" text-anchor="start">4. Final p</text>
<text x="728" y="254" font-size="15" fill="#334155" font-weight="500" text-anchor="start">predict new motion</text>
<text x="480" y="518" text-anchor="middle" font-size="13" fill="#64748b">Read the labels, follow the arrows, then explain the relationship in your own words.</text>
</svg>
