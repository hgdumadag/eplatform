<text x="591" y="190" font-size="19" fill="#111827" font-weight="800" text-anchor="start">Coil and magnet move</text>
<text x="562" y="228" font-size="15" fill="#334155" font-weight="600" text-anchor="start">magnetic field changes</text>
<rect x="64" y="325" width="360" height="128" rx="20" fill="white" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
<circle cx="94" cy="359" r="14" fill="#0891b2"/>
<text x="94" y="365" font-size="15" fill="white" font-weight="800" text-anchor="middle">3</text>
<text x="119" y="365" font-size="19" fill="#111827" font-weight="800" text-anchor="start">Voltage induced</text>
<text x="90" y="403" font-size="15" fill="#334155" font-weight="600" text-anchor="start">charges are pushed</text>
<line x1="424" y1="389" x2="518" y2="389" stroke="#0891b2" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="536" y="325" width="360" height="128" rx="20" fill="white" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
