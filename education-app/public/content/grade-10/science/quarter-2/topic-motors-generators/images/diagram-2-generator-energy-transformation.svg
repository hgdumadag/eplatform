<text x="119" y="190" font-size="19" fill="#111827" font-weight="800" text-anchor="start">Mechanical input</text>
<text x="90" y="228" font-size="15" fill="#334155" font-weight="600" text-anchor="start">turbine, crank, or wheel turns</text>
<line x1="424" y1="214" x2="518" y2="214" stroke="#0891b2" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="536" y="150" width="360" height="128" rx="20" fill="white" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
<circle cx="566" cy="184" r="14" fill="#0891b2"/>
