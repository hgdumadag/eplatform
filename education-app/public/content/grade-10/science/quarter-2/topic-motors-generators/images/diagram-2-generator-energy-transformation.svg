<text x="52" y="56" font-size="26" font-weight="800" fill="#0f172a">Generator Energy Transformation</text>
<text x="52" y="82" font-size="15" fill="#475569" font-weight="500">A generator converts mechanical motion into electrical energy</text>
<rect x="64" y="150" width="360" height="128" rx="20" fill="white" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
<circle cx="94" cy="184" r="14" fill="#0891b2"/>
