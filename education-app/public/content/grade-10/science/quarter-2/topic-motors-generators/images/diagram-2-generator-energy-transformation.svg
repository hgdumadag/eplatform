<text x="566" y="365" font-size="15" fill="white" font-weight="800" text-anchor="middle">4</text>
<text x="591" y="365" font-size="19" fill="#111827" font-weight="800" text-anchor="start">Electrical output</text>
<text x="562" y="403" font-size="15" fill="#334155" font-weight="600" text-anchor="start">current powers a circuit</text>
<text x="480" y="525" text-anchor="middle" font-size="13" fill="#64748b">Use the labels to explain the cause, evidence, and safer or more efficient decision.</text></svg>
