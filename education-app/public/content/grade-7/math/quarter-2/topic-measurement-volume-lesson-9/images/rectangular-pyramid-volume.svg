<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Rectangular pyramid volume</title>
  <desc id="desc">A rectangular pyramid labeled with length, width, and height.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <polygon points="200,255 500,255 585,190 285,190" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
  <line x1="390" y1="55" x2="200" y2="255" stroke="#15803d" stroke-width="4"/><line x1="390" y1="55" x2="500" y2="255" stroke="#15803d" stroke-width="4"/><line x1="390" y1="55" x2="585" y2="190" stroke="#15803d" stroke-width="4"/><line x1="390" y1="55" x2="390" y2="222" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 8"/>
  <text x="340" y="285" font-family="Arial" font-size="20">length</text><text x="520" y="235" font-family="Arial" font-size="20">width</text><text x="402" y="145" font-family="Arial" font-size="20" fill="#b91c1c">height</text>
  <text x="200" y="330" font-family="Arial" font-size="24" font-weight="700">V = 1/3 × l × w × h</text>
</svg>
