<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Square pyramid volume</title>
  <desc id="desc">A square pyramid with side length s and vertical height h labeled.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <polygon points="260,250 450,250 540,180 350,180" fill="#fde68a" stroke="#d97706" stroke-width="4"/>
  <line x1="350" y1="60" x2="260" y2="250" stroke="#d97706" stroke-width="4"/><line x1="350" y1="60" x2="450" y2="250" stroke="#d97706" stroke-width="4"/><line x1="350" y1="60" x2="540" y2="180" stroke="#d97706" stroke-width="4"/><line x1="350" y1="60" x2="350" y2="180" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 8"/>
  <text x="360" y="130" font-family="Arial" font-size="20" fill="#b91c1c">h</text><text x="330" y="275" font-family="Arial" font-size="20">s</text>
  <text x="200" y="325" font-family="Arial" font-size="24" font-weight="700">V = 1/3 × s² × h</text>
</svg>
