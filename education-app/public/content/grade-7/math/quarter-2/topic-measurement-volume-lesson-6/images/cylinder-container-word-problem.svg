<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Cylinder container word problem</title>
  <desc id="desc">A cylindrical water tank with radius and height labels.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <ellipse cx="350" cy="85" rx="130" ry="42" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="4"/>
  <path d="M220 85 V260 C220 287 480 287 480 260 V85" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <ellipse cx="350" cy="260" rx="130" ry="42" fill="#93c5fd" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="350" y1="85" x2="480" y2="85" stroke="#dc2626" stroke-width="4"/><text x="395" y="72" font-family="Arial" font-size="20">r = 0.5 m</text>
  <line x1="520" y1="85" x2="520" y2="260" stroke="#16a34a" stroke-width="5"/><text x="536" y="178" font-family="Arial" font-size="20">h = 1.2 m</text>
  <text x="150" y="330" font-family="Arial" font-size="24" font-weight="700">Capacity ≈ volume inside the tank</text>
</svg>
