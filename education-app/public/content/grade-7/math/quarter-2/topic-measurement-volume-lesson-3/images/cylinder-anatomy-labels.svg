<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Cylinder anatomy labels</title>
  <desc id="desc">A cylinder with labeled circular bases, height, radius, diameter, and curved surface.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <ellipse cx="330" cy="95" rx="120" ry="42" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <path d="M210 95 V250 C210 273 450 273 450 250 V95" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="4"/>
  <ellipse cx="330" cy="250" rx="120" ry="42" fill="none" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="330" y1="95" x2="390" y2="95" stroke="#dc2626" stroke-width="4"/><line x1="270" y1="95" x2="390" y2="95" stroke="#f97316" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="490" y1="95" x2="490" y2="250" stroke="#16a34a" stroke-width="4"/>
  <g font-family="Arial" font-size="18" fill="#0f172a"><text x="398" y="88">radius</text><text x="254" y="70">diameter</text><text x="505" y="180">height</text><text x="205" y="322">curved surface</text><text x="98" y="96">base</text></g>
</svg>
