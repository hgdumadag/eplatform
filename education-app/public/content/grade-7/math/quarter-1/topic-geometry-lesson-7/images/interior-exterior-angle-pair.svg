<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Interior and exterior angle pair</title>
  <desc id="desc">A polygon side extended to show an exterior angle adjacent to an interior angle.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <polygon points="170,95 360,75 500,190 410,300 210,260" fill="#e0f2fe" stroke="#0369a1" stroke-width="5"/>
  <line x1="500" y1="190" x2="650" y2="220" stroke="#111827" stroke-width="5"/>
  <path d="M500 190 A70 70 0 0 1 446 236" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M500 190 A70 70 0 0 0 568 203" fill="none" stroke="#dc2626" stroke-width="5"/>
  <text x="382" y="228" font-family="Arial" font-size="20" fill="#1d4ed8">interior</text>
  <text x="548" y="183" font-family="Arial" font-size="20" fill="#b91c1c">exterior</text>
  <text x="250" y="335" font-family="Arial" font-size="24" font-weight="700">interior + exterior = 180°</text>
</svg>
