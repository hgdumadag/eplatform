<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Polygon challenge diagram</title>
  <desc id="desc">A pentagon with one side extended, an exterior angle of 64 degrees, and unknown adjacent interior angle x.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <polygon points="170,95 370,70 510,190 420,300 210,260" fill="#dcfce7" stroke="#15803d" stroke-width="5"/>
  <line x1="510" y1="190" x2="655" y2="225" stroke="#111827" stroke-width="5"/>
  <path d="M510 190 A75 75 0 0 1 452 242" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M510 190 A75 75 0 0 0 583 207" fill="none" stroke="#f97316" stroke-width="5"/>
  <text x="450" y="225" font-family="Arial" font-size="24" fill="#1d4ed8">x</text>
  <text x="585" y="195" font-family="Arial" font-size="24" fill="#c2410c">64°</text>
  <text x="215" y="335" font-family="Arial" font-size="24" font-weight="700">x + 64 = 180</text>
</svg>
