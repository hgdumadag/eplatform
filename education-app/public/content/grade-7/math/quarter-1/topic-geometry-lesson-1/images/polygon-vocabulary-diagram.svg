<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Polygon vocabulary diagram</title>
  <desc id="desc">A pentagon with labeled vertices, sides, and diagonals.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <polygon points="230,60 390,90 450,230 320,310 170,220" fill="#dbeafe" stroke="#1d4ed8" stroke-width="5"/>
  <line x1="230" y1="60" x2="450" y2="230" stroke="#f97316" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="390" y1="90" x2="170" y2="220" stroke="#f97316" stroke-width="4" stroke-dasharray="10 8"/>
  <g fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="700">
    <text x="208" y="45">A</text><text x="400" y="88">B</text><text x="462" y="238">C</text><text x="316" y="340">D</text><text x="136" y="225">E</text>
  </g>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="18">
    <text x="286" y="68">side</text><text x="462" y="160">side</text><text x="482" y="250">vertex</text>
    <text x="272" y="170" fill="#c2410c">diagonal</text><text x="76" y="122">closed figure</text>
  </g>
</svg>
