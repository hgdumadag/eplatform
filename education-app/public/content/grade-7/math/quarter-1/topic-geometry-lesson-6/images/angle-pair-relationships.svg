<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Angle pair relationships</title>
  <desc id="desc">Examples of complementary, supplementary, vertical, and adjacent angles.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <g stroke="#111827" stroke-width="4" fill="none">
    <line x1="80" y1="150" x2="170" y2="150"/><line x1="80" y1="150" x2="80" y2="60"/><line x1="80" y1="150" x2="145" y2="85"/>
    <line x1="250" y1="150" x2="390" y2="150"/><line x1="320" y1="150" x2="260" y2="85"/>
    <line x1="470" y1="75" x2="610" y2="215"/><line x1="610" y1="75" x2="470" y2="215"/>
    <line x1="90" y1="290" x2="230" y2="290"/><line x1="90" y1="290" x2="160" y2="230"/><line x1="90" y1="290" x2="140" y2="210"/>
  </g>
  <g font-family="Arial" font-size="18" fill="#0f172a"><text x="52" y="190">Complementary</text><text x="245" y="190">Supplementary</text><text x="493" y="245">Vertical</text><text x="80" y="330">Adjacent</text></g>
</svg>
