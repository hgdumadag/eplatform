<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Convex and non-convex polygons</title>
  <desc id="desc">A convex pentagon and a non-convex polygon with an inward dent.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <polygon points="120,95 270,70 340,185 250,290 95,250" fill="#dbeafe" stroke="#1d4ed8" stroke-width="5"/>
  <line x1="120" y1="95" x2="250" y2="290" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="130" y="330" font-family="Arial" font-size="24" font-weight="700">Convex</text>
  <polygon points="440,80 625,100 520,180 620,280 425,260 370,165" fill="#fef3c7" stroke="#b45309" stroke-width="5"/>
  <path d="M520 180 A45 45 0 0 1 555 203" fill="none" stroke="#dc2626" stroke-width="5"/>
  <text x="468" y="174" font-family="Arial" font-size="18" fill="#991b1b">inward corner</text>
  <text x="420" y="330" font-family="Arial" font-size="24" font-weight="700">Non-convex</text>
</svg>
