<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Compare ionic covalent metallic structures" viewBox="0 0 760 270" width="100%" height="270" style="max-width:780px"><rect width="760" height="270" rx="18" fill="#f8fafc"/><text x="35" y="35" font-size="18" font-family="Arial">Bonding type explains properties</text><g transform="translate(70 80)"><text x="20" y="-10" font-size="16">Ionic</text><rect x="0" y="0" width="120" height="100" rx="10" fill="#eff6ff" stroke="#2563eb"/><text x="18" y="35" font-size="22">+ − +</text><text x="18" y="70" font-size="22">− + −</text><text x="0" y="135" font-size="13">hard, brittle lattice</text></g><g transform="translate(315 80)"><text x="5" y="-10" font-size="16">Covalent</text><rect x="0" y="0" width="120" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a"/><circle cx="42" cy="50" r="18" fill="#86efac"/><circle cx="78" cy="50" r="18" fill="#bbf7d0"/><line x1="57" y1="50" x2="63" y2="50" stroke="#166534" stroke-width="4"/><text x="-10" y="135" font-size="13">individual molecules</text></g><g transform="translate(560 80)"><text x="20" y="-10" font-size="16">Metallic</text><rect x="0" y="0" width="120" height="100" rx="10" fill="#fffbeb" stroke="#d97706"/><text x="12" y="35" font-size="20">+ + +</text><text x="12" y="70" font-size="20">e⁻ e⁻ e⁻</text><text x="-5" y="135" font-size="13">mobile electrons</text></g></svg>
