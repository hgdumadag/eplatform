<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" aria-label="Electron loss and gain form ions" viewBox="0 0 700 240" width="100%" style="max-width:720px"><rect width="700" height="240" rx="18" fill="#f8fafc"/><text x="35" y="35" font-size="18" font-family="Arial">Ions form by losing or gaining electrons</text><g transform="translate(70 75)"><circle cx="55" cy="55" r="35" fill="#60a5fa"/><text x="38" y="61" font-size="18">Na</text><circle cx="105" cy="20" r="8" fill="#1d4ed8"/><text x="0" y="125" font-size="14">loses 1 electron → Na⁺</text></g><text x="235" y="130" font-size="30">→</text><g transform="translate(300 75)"><circle cx="55" cy="55" r="35" fill="#f97316"/><text x="42" y="61" font-size="18">Cl</text><circle cx="12" cy="20" r="8" fill="#1d4ed8"/><text x="0" y="125" font-size="14">gains 1 electron → Cl⁻</text></g><text x="500" y="140" font-size="15" fill="#334155">Metals often lose e⁻; nonmetals often gain e⁻.</text></svg>
