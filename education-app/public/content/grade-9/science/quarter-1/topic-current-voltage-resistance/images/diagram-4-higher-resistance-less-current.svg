<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">Higher resistance less current</title>
  <desc id="desc">A labeled Grade 9 Physics diagram for Current, Voltage, and Resistance.</desc>
  <rect width="920" height="470" fill="#f8fafc"/>
  <rect x="35" y="30" width="850" height="410" rx="28" fill="#fce7f3" stroke="#0f172a" stroke-width="3"/>
  <text x="460" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Current, Voltage, and Resistance</text>
  <text x="460" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#334155">Diagram 4: Higher resistance less current</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker>
  </defs>
  <circle cx="190" cy="245" r="64" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
  <rect x="368" y="185" width="184" height="120" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="5"/>
  <polygon points="710,180 790,245 710,310 630,245" fill="#ffffff" stroke="#db2777" stroke-width="5"/>
  <line x1="255" y1="245" x2="360" y2="245" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="555" y1="245" x2="625" y2="245" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="190" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Observe</text>
  <text x="190" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">evidence</text>
  <text x="460" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Compare</text>
  <text x="460" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">variables</text>
  <text x="710" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Explain</text>
  <text x="710" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">cause → effect</text>
  <text x="460" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Read arrows, labels, and shapes to connect the model to the lesson idea.</text>
  <text x="460" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Prompt: What changes? What stays the same? What force, wave, or circuit idea explains it?</text>
</svg>