<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title desc">
  <title id="title">Worked SAS congruence proof diagram</title>
  <desc id="desc">Two triangles ABE and CDE formed by crossing segments. AE and CE are marked congruent, BE and DE are marked congruent, and vertical angles at E are highlighted for a SAS proof.</desc>
  <rect width="800" height="470" fill="#f8fafc"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Worked proof: use SAS first, then CPCTC</text>
  <line x1="130" y1="100" x2="420" y2="340" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="420" y1="100" x2="130" y2="340" stroke="#7c3aed" stroke-width="4"/>
  <line x1="130" y1="100" x2="420" y2="100" stroke="#334155" stroke-width="4"/>
  <line x1="130" y1="340" x2="420" y2="340" stroke="#334155" stroke-width="4"/>
  <circle cx="275" cy="220" r="6" fill="#dc2626"/>
  <text x="112" y="92" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">A</text>
  <text x="427" y="95" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">B</text>
  <text x="112" y="365" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">D</text>
  <text x="428" y="365" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">C</text>
  <text x="285" y="214" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">E</text>
  <path d="M196 152 l18 -22 M211 165 l18 -22" stroke="#f97316" stroke-width="4"/>
  <path d="M336 288 l18 -22 M351 301 l18 -22" stroke="#f97316" stroke-width="4"/>
  <path d="M350 152 l-18 -22" stroke="#059669" stroke-width="4"/>
  <path d="M211 300 l-18 -22" stroke="#059669" stroke-width="4"/>
  <path d="M248 198 A42 42 0 0 1 303 198" fill="none" stroke="#eab308" stroke-width="5"/>
  <path d="M303 242 A42 42 0 0 1 248 242" fill="none" stroke="#eab308" stroke-width="5"/>
  <rect x="500" y="85" width="250" height="285" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155">
    <text x="520" y="118" font-weight="700" fill="#0f172a">Proof skeleton</text>
    <text x="520" y="150">1. AE congruent CE - Given</text>
    <text x="520" y="182">2. BE congruent DE - Given</text>
    <text x="520" y="214">3. Angle AEB congruent CED</text>
    <text x="542" y="235">Vertical Angles Theorem</text>
    <text x="520" y="268">4. Triangle ABE congruent CDE</text>
    <text x="542" y="289">SAS Congruence</text>
    <text x="520" y="322">5. AB congruent CD</text>
    <text x="542" y="343">CPCTC</text>
  </g>
</svg>
