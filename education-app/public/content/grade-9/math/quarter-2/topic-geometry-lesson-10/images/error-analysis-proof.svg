<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Error analysis diagram for an invalid congruence proof</title>
  <desc id="desc">A diagram and proof note showing that SSA is not a valid triangle congruence shortcut, with a warning label that the included angle is missing.</desc>
  <rect width="760" height="430" fill="#fff7ed"/>
  <text x="40" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7c2d12">Error analysis: do not use SSA</text>
  <polygon points="120,320 320,320 205,105" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
  <polygon points="450,320 650,320 570,105" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
  <text x="106" y="344" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">A</text>
  <text x="324" y="344" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">B</text>
  <text x="195" y="94" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">C</text>
  <text x="436" y="344" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">D</text>
  <text x="656" y="344" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">E</text>
  <text x="560" y="94" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">F</text>
  <path d="M156 228 l22 -12 M164 242 l22 -12" stroke="#0f766e" stroke-width="4"/>
  <path d="M507 215 l22 -12 M515 229 l22 -12" stroke="#0f766e" stroke-width="4"/>
  <path d="M218 320 v-18" stroke="#2563eb" stroke-width="4"/>
  <path d="M550 320 v-18" stroke="#2563eb" stroke-width="4"/>
  <path d="M130 304 A30 30 0 0 1 159 320" fill="none" stroke="#dc2626" stroke-width="5"/>
  <path d="M460 304 A30 30 0 0 1 489 320" fill="none" stroke="#dc2626" stroke-width="5"/>
  <rect x="60" y="60" width="220" height="64" rx="8" fill="#ffffff" stroke="#fb923c"/>
  <text x="78" y="88" font-family="Arial, sans-serif" font-size="15" fill="#9a3412">Known: two sides and a</text>
  <text x="78" y="110" font-family="Arial, sans-serif" font-size="15" fill="#9a3412">non-included angle</text>
  <rect x="445" y="62" width="250" height="78" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="466" y="91" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">Invalid shortcut: SSA</text>
  <text x="466" y="116" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">The marked angle is not between the two marked sides.</text>
  <text x="72" y="390" font-family="Arial, sans-serif" font-size="17" fill="#7c2d12">Fix: look for SSS, SAS, ASA, AAS, or HL. Do not invent a shortcut.</text>
</svg>
