<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Congruence evidence map</title>
  <desc id="desc">A flow map showing how givens, shared parts, vertical angles, and definitions combine to choose SSS, SAS, ASA, AAS, or HL before using CPCTC.</desc>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Evidence map for triangle congruence proofs</text>
  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="45" y="85" width="150" height="70" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="70" y="116" font-weight="700" fill="#1e3a8a">Givens</text>
    <text x="66" y="140" fill="#1e40af">marked or stated facts</text>
    <rect x="45" y="180" width="150" height="70" rx="8" fill="#dcfce7" stroke="#4ade80"/>
    <text x="72" y="211" font-weight="700" fill="#14532d">Shared parts</text>
    <text x="62" y="235" fill="#166534">reflexive property</text>
    <rect x="45" y="275" width="150" height="70" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="70" y="306" font-weight="700" fill="#78350f">Angle facts</text>
    <text x="65" y="330" fill="#92400e">vertical, parallel lines</text>
    <rect x="300" y="120" width="155" height="185" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="330" y="155" font-weight="700" fill="#0f172a">Choose a test</text>
    <text x="344" y="188" fill="#334155">SSS</text>
    <text x="344" y="216" fill="#334155">SAS</text>
    <text x="344" y="244" fill="#334155">ASA</text>
    <text x="344" y="272" fill="#334155">AAS or HL</text>
    <rect x="565" y="140" width="150" height="70" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="600" y="172" font-weight="700" fill="#4c1d95">Triangles</text>
    <text x="586" y="196" fill="#5b21b6">are congruent</text>
    <rect x="565" y="250" width="150" height="70" rx="8" fill="#fee2e2" stroke="#f87171"/>
    <text x="603" y="282" font-weight="700" fill="#7f1d1d">CPCTC</text>
    <text x="588" y="306" fill="#991b1b">prove matching parts</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <path d="M195 120 C240 120 250 170 300 175" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M195 215 C245 215 250 215 300 215" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M195 310 C240 310 250 260 300 250" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M455 212 C500 212 520 175 565 175" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M640 210 L640 250" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
