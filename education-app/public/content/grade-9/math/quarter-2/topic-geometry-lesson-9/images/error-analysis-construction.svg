<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Construction error analysis</title>
  <desc id="desc">A copied segment is too long because the compass width was changed before marking the endpoint. The diagram contrasts original length AB with incorrect copied length PQ.</desc>
  <rect width="720" height="420" fill="#fff7ed"/>
  <text x="40" y="42" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Error Analysis: the compass width changed</text>
  <line x1="85" y1="130" x2="255" y2="130" stroke="#0f172a" stroke-width="5"/>
  <circle cx="85" cy="130" r="6" fill="#0f172a"/><circle cx="255" cy="130" r="6" fill="#0f172a"/>
  <text x="75" y="108" font-family="Arial, sans-serif" font-size="18">A</text><text x="260" y="108" font-family="Arial, sans-serif" font-size="18">B</text>
  <text x="112" y="166" fill="#334155" font-family="Arial, sans-serif" font-size="16">original segment</text>
  <line x1="85" y1="280" x2="330" y2="280" stroke="#dc2626" stroke-width="5"/>
  <circle cx="85" cy="280" r="6" fill="#0f172a"/><circle cx="330" cy="280" r="6" fill="#dc2626"/>
  <text x="75" y="305" font-family="Arial, sans-serif" font-size="18">P</text><text x="335" y="305" font-family="Arial, sans-serif" font-size="18">Q</text>
  <path d="M85 130 A170 170 0 0 1 255 280" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M85 280 A245 245 0 0 1 330 130" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="410" y="95" width="260" height="180" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="430" y="130" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="18" font-weight="700">Invalid claim:</text>
  <text x="430" y="163" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="16">PQ ≅ AB</text>
  <text x="430" y="203" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="16">The compass radius changed,</text>
  <text x="430" y="228" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="16">so the copied distance is not</text>
  <text x="430" y="253" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="16">guaranteed congruent.</text>
  <rect x="410" y="300" width="260" height="54" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="430" y="333" fill="#14532d" font-family="Arial, sans-serif" font-size="16">Fix: keep the compass width fixed.</text>
</svg>
