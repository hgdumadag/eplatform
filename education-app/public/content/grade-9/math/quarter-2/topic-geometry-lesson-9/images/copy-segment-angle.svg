<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Copying a segment and an angle</title>
  <desc id="desc">A segment AB is copied to ray PQ using the same compass width, and an angle is copied using matching arcs and chord distance.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="42" y="42" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Copy a segment, then copy an angle</text>
  <g stroke="#0f172a" stroke-width="4" fill="none">
    <line x1="70" y1="120" x2="210" y2="120"/>
    <line x1="70" y1="245" x2="285" y2="245"/>
  </g>
  <circle cx="70" cy="120" r="5" fill="#0f172a"/><circle cx="210" cy="120" r="5" fill="#0f172a"/>
  <circle cx="70" cy="245" r="5" fill="#0f172a"/><circle cx="210" cy="245" r="5" fill="#2563eb"/>
  <path d="M70 120 A140 140 0 0 1 210 245" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="16">A</text><text x="214" y="100" font-family="Arial, sans-serif" font-size="16">B</text>
  <text x="58" y="270" font-family="Arial, sans-serif" font-size="16">P</text><text x="214" y="270" font-family="Arial, sans-serif" font-size="16">Q</text>
  <text x="72" y="302" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="16">same compass width: AB = PQ</text>
  <g transform="translate(398 88)" stroke="#0f172a" stroke-width="4" fill="none">
    <line x1="0" y1="185" x2="210" y2="185"/>
    <line x1="0" y1="185" x2="150" y2="80"/>
    <path d="M65 185 A65 65 0 0 1 53 148" stroke="#2563eb" stroke-width="3"/>
    <line x1="65" y1="185" x2="53" y2="148" stroke="#dc2626" stroke-width="3"/>
    <line x1="0" y1="305" x2="210" y2="305"/>
    <line x1="0" y1="305" x2="150" y2="200"/>
    <path d="M65 305 A65 65 0 0 1 53 268" stroke="#2563eb" stroke-width="3"/>
    <line x1="65" y1="305" x2="53" y2="268" stroke="#dc2626" stroke-width="3"/>
  </g>
  <text x="398" y="58" fill="#334155" font-family="Arial, sans-serif" font-size="17">For angles, copy both the arc radius and the red chord.</text>
  <text x="398" y="386" fill="#991b1b" font-family="Arial, sans-serif" font-size="16">matching chord distance fixes the angle opening</text>
</svg>
