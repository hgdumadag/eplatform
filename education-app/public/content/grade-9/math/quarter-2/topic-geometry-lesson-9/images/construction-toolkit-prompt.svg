<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Construction toolkit prompt</title>
  <desc id="desc">A ruler, compass, protractor, and triangular roof sketch show why exact copied lengths and angles matter in geometric construction.</desc>
  <rect width="720" height="420" fill="#f8fbff"/>
  <rect x="42" y="282" width="330" height="58" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <g stroke="#1e3a8a" stroke-width="2">
    <line x1="62" y1="310" x2="350" y2="310"/>
    <line x1="82" y1="292" x2="82" y2="310"/>
    <line x1="122" y1="296" x2="122" y2="310"/>
    <line x1="162" y1="292" x2="162" y2="310"/>
    <line x1="202" y1="296" x2="202" y2="310"/>
    <line x1="242" y1="292" x2="242" y2="310"/>
    <line x1="282" y1="296" x2="282" y2="310"/>
    <line x1="322" y1="292" x2="322" y2="310"/>
  </g>
  <path d="M115 225 C145 90 228 90 258 225" fill="none" stroke="#64748b" stroke-width="7"/>
  <circle cx="115" cy="225" r="8" fill="#0f172a"/>
  <circle cx="258" cy="225" r="8" fill="#0f172a"/>
  <line x1="186" y1="82" x2="186" y2="250" stroke="#64748b" stroke-width="3"/>
  <circle cx="186" cy="82" r="9" fill="#1d4ed8"/>
  <path d="M430 305 L545 145 L660 305 Z" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/>
  <line x1="545" y1="145" x2="545" y2="305" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M445 292 Q545 230 645 292" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="430" y="335" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="18">roof support must match the plan</text>
  <text x="42" y="54" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Construction is exact drawing with reasons</text>
  <text x="42" y="90" fill="#334155" font-family="Arial, sans-serif" font-size="18">Tools copy distances and angles so a shape can be rebuilt accurately.</text>
  <text x="80" y="365" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="16">ruler / straightedge</text>
  <text x="132" y="260" fill="#334155" font-family="Arial, sans-serif" font-size="16">compass</text>
</svg>
