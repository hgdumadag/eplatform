<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">SSS triangle construction</title>
  <desc id="desc">A base AB is drawn, then compass arcs from A and B intersect to locate vertex C of a triangle with three given side lengths.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="42" y="44" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Construct a triangle from three side lengths</text>
  <line x1="150" y1="300" x2="520" y2="300" stroke="#0f172a" stroke-width="4"/>
  <circle cx="150" cy="300" r="6" fill="#0f172a"/><circle cx="520" cy="300" r="6" fill="#0f172a"/>
  <path d="M150 300 A230 230 0 0 1 359 75" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M520 300 A250 250 0 0 0 359 75" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 6"/>
  <line x1="150" y1="300" x2="330" y2="156" stroke="#0f172a" stroke-width="4"/>
  <line x1="520" y1="300" x2="330" y2="156" stroke="#0f172a" stroke-width="4"/>
  <circle cx="330" cy="156" r="7" fill="#16a34a"/>
  <text x="136" y="326" font-family="Arial, sans-serif" font-size="18">A</text>
  <text x="524" y="326" font-family="Arial, sans-serif" font-size="18">B</text>
  <text x="322" y="137" font-family="Arial, sans-serif" font-size="18">C</text>
  <text x="244" y="333" fill="#334155" font-family="Arial, sans-serif" font-size="17">given base AB</text>
  <text x="118" y="116" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="16">arc radius = AC</text>
  <text x="492" y="116" fill="#991b1b" font-family="Arial, sans-serif" font-size="16">arc radius = BC</text>
  <rect x="52" y="360" width="614" height="36" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="72" y="383" fill="#14532d" font-family="Arial, sans-serif" font-size="17">Base + two copied side lengths create SSS congruence.</text>
</svg>
