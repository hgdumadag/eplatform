<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Error analysis for invalid proof reason</title>
  <desc id="desc">Two segments are drawn to look similar, but only one has no congruence marks. The proof reason 'they look the same length' is crossed out and replaced by the need for a given or marked fact.</desc>
  <rect width="760" height="420" fill="#fff"/>
  <text x="34" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Error analysis: appearance is not proof</text>
  <g transform="translate(65 90)" font-family="Arial, sans-serif">
    <line x1="0" y1="70" x2="210" y2="70" stroke="#1f2937" stroke-width="5"/>
    <text x="-8" y="104" font-size="16" fill="#111827">A</text>
    <text x="205" y="104" font-size="16" fill="#111827">B</text>
    <line x1="0" y1="155" x2="210" y2="155" stroke="#1f2937" stroke-width="5"/>
    <text x="-8" y="190" font-size="16" fill="#111827">C</text>
    <text x="205" y="190" font-size="16" fill="#111827">D</text>
    <text x="14" y="230" font-size="15" fill="#475569">They may look equal...</text>
  </g>
  <g transform="translate(370 95)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="320" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="18" y="32" font-size="16" font-weight="700" fill="#991b1b">Invalid reason</text>
    <text x="18" y="62" font-size="15" fill="#7f1d1d">AB ≅ CD because they look equal</text>
    <line x1="18" y1="70" x2="285" y2="36" stroke="#dc2626" stroke-width="4"/>
    <rect x="0" y="142" width="320" height="106" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="18" y="174" font-size="16" font-weight="700" fill="#14532d">Valid start</text>
    <text x="18" y="204" font-size="15" fill="#14532d">AB ≅ CD</text>
    <text x="18" y="228" font-size="15" fill="#14532d">Reason: Given or marked congruent</text>
  </g>
  <text x="74" y="365" font-family="Arial, sans-serif" font-size="17" fill="#334155">A diagram can suggest an idea. A proof needs a stated or accepted fact.</text>
</svg>
