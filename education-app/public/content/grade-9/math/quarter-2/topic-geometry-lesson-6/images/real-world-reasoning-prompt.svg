<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Window panes compared with a tilted quadrilateral</title>
  <desc id="desc">A visual prompt shows rectangular window panes and a slanted quadrilateral to challenge the conjecture that every four-sided shape has four right angles.</desc>
  <rect width="760" height="360" fill="#f8fbff"/>
  <text x="36" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2a44">What can examples show?</text>
  <g transform="translate(45 76)">
    <rect x="0" y="0" width="250" height="190" fill="#e9f3ff" stroke="#2b6cb0" stroke-width="4"/>
    <line x1="125" y1="0" x2="125" y2="190" stroke="#2b6cb0" stroke-width="4"/>
    <line x1="0" y1="95" x2="250" y2="95" stroke="#2b6cb0" stroke-width="4"/>
    <path d="M12 12 h22 v22 h-22 z" fill="none" stroke="#374151" stroke-width="2"/>
    <path d="M137 12 h22 v22 h-22 z" fill="none" stroke="#374151" stroke-width="2"/>
    <path d="M12 107 h22 v22 h-22 z" fill="none" stroke="#374151" stroke-width="2"/>
    <path d="M137 107 h22 v22 h-22 z" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="28" y="225" font-family="Arial, sans-serif" font-size="16" fill="#1f2937">Many examples: rectangles</text>
  </g>
  <g transform="translate(430 92)">
    <polygon points="50,20 250,20 205,170 5,170" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/>
    <path d="M52 22 h22 v22" fill="none" stroke="#9a3412" stroke-width="2" opacity=".35"/>
    <text x="40" y="215" font-family="Arial, sans-serif" font-size="16" fill="#1f2937">One counterexample: no right angles</text>
  </g>
  <path d="M330 160 C370 130 390 130 420 160" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="314" y="205" font-family="Arial, sans-serif" font-size="15" fill="#475569">Does the pattern prove every case?</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
