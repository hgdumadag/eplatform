<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Diagonals bisect each other</title>
  <desc id="desc">Parallelogram ABCD has diagonals AC and BD crossing at E. Matching tick marks show AE equals EC and BE equals ED.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Diagonals bisect each other</text>
  <g transform="translate(112 78)">
    <polygon points="100,30 500,30 420,230 20,230" fill="#ecfdf5" stroke="#15803d" stroke-width="4"/>
    <line x1="100" y1="30" x2="420" y2="230" stroke="#0f172a" stroke-width="3"/>
    <line x1="500" y1="30" x2="20" y2="230" stroke="#0f172a" stroke-width="3"/>
    <circle cx="260" cy="130" r="6" fill="#dc2626"/>
    <text x="83" y="22" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">A</text>
    <text x="508" y="26" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">B</text>
    <text x="425" y="254" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">C</text>
    <text x="-4" y="254" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">D</text>
    <text x="270" y="126" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#991b1b">E</text>
    <line x1="174" y1="75" x2="185" y2="58" stroke="#2563eb" stroke-width="3"/>
    <line x1="335" y1="176" x2="346" y2="159" stroke="#2563eb" stroke-width="3"/>
    <line x1="371" y1="75" x2="381" y2="92" stroke="#f97316" stroke-width="3"/>
    <line x1="361" y1="81" x2="371" y2="98" stroke="#f97316" stroke-width="3"/>
    <line x1="139" y1="176" x2="149" y2="193" stroke="#f97316" stroke-width="3"/>
    <line x1="129" y1="182" x2="139" y2="199" stroke="#f97316" stroke-width="3"/>
  </g>
  <text x="168" y="328" font-family="Arial, sans-serif" font-size="20" fill="#172033">AE = EC and BE = ED</text>
</svg>
