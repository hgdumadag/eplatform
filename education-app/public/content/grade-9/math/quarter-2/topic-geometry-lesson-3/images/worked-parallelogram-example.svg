<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Worked parallelogram example with three properties</title>
  <desc id="desc">Parallelogram WXYZ is annotated to show opposite sides WX and YZ set equal, consecutive angles W and X adding to 180 degrees, and diagonal halves XM and MZ set equal.</desc>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="34" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Worked example: choose the property first</text>
  <g transform="translate(86 80)">
    <polygon points="95,35 475,35 395,245 15,245" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <line x1="95" y1="35" x2="395" y2="245" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="475" y1="35" x2="15" y2="245" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="245" cy="140" r="6" fill="#dc2626"/>
    <text x="78" y="28" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">W</text>
    <text x="482" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">X</text>
    <text x="402" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Y</text>
    <text x="-8" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Z</text>
    <text x="257" y="139" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">M</text>
    <text x="226" y="24" font-family="Arial, sans-serif" font-size="17" fill="#1d4ed8">WX = 3a + 4</text>
    <text x="176" y="278" font-family="Arial, sans-serif" font-size="17" fill="#1d4ed8">YZ = 25</text>
    <path d="M130 36 A38 38 0 0 0 85 70" fill="none" stroke="#f97316" stroke-width="4"/>
    <text x="105" y="88" font-family="Arial, sans-serif" font-size="16" fill="#9a3412">74°</text>
    <path d="M433 74 A40 40 0 0 0 471 83" fill="none" stroke="#f97316" stroke-width="4"/>
    <text x="385" y="86" font-family="Arial, sans-serif" font-size="16" fill="#9a3412">?</text>
    <text x="310" y="113" font-family="Arial, sans-serif" font-size="16" fill="#166534">XM = 2b - 1</text>
    <text x="278" y="193" font-family="Arial, sans-serif" font-size="16" fill="#166534">MZ = 13</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#172033">
    <rect x="560" y="88" width="165" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="576" y="115" font-weight="700">Side property</text>
    <text x="576" y="139">3a + 4 = 25</text>
    <rect x="560" y="180" width="165" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="576" y="207" font-weight="700">Angle property</text>
    <text x="576" y="231">Angle X = 180 - 74</text>
    <rect x="560" y="278" width="165" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="576" y="305" font-weight="700">Diagonal property</text>
    <text x="576" y="329">2b - 1 = 13</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M555 124 C510 112 455 98 380 96"/>
    <path d="M555 216 C515 194 492 166 523 126"/>
    <path d="M555 316 C480 296 420 230 364 204"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
