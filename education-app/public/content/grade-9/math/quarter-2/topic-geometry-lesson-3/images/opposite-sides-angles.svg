<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Opposite sides and angles of a parallelogram</title>
  <desc id="desc">Parallelogram ABCD has opposite sides marked congruent and opposite angles shown with matching arc marks.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Opposite parts match</text>
  <g transform="translate(140 78)">
    <polygon points="75,30 455,30 375,220 -5,220" fill="#eef2ff" stroke="#4338ca" stroke-width="4"/>
    <text x="62" y="22" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">A</text>
    <text x="462" y="24" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">B</text>
    <text x="380" y="245" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">C</text>
    <text x="-30" y="245" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">D</text>
    <line x1="225" y1="24" x2="247" y2="36" stroke="#dc2626" stroke-width="3"/>
    <line x1="175" y1="214" x2="197" y2="226" stroke="#dc2626" stroke-width="3"/>
    <line x1="31" y1="115" x2="52" y2="125" stroke="#16a34a" stroke-width="3"/>
    <line x1="29" y1="128" x2="50" y2="138" stroke="#16a34a" stroke-width="3"/>
    <line x1="410" y1="112" x2="431" y2="122" stroke="#16a34a" stroke-width="3"/>
    <line x1="408" y1="125" x2="429" y2="135" stroke="#16a34a" stroke-width="3"/>
    <path d="M103 31 A34 34 0 0 0 63 60" fill="none" stroke="#f97316" stroke-width="4"/>
    <path d="M346 219 A34 34 0 0 0 386 190" fill="none" stroke="#f97316" stroke-width="4"/>
    <path d="M416 58 A32 32 0 0 0 449 65" fill="none" stroke="#0891b2" stroke-width="4"/>
    <path d="M34 192 A32 32 0 0 0 1 185" fill="none" stroke="#0891b2" stroke-width="4"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#172033">
    <text x="70" y="310">AB = CD</text>
    <text x="210" y="310">BC = AD</text>
    <text x="360" y="310">Angle A = Angle C</text>
    <text x="540" y="310">Angle B = Angle D</text>
  </g>
</svg>
