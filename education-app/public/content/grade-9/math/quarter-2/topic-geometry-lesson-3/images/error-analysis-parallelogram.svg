<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">Error analysis for parallelogram diagonals</title>
  <desc id="desc">A parallelogram diagram shows diagonals crossing. A note incorrectly says the two diagonals are congruent, and a correction says the halves of each same diagonal are congruent.</desc>
  <rect width="720" height="390" fill="#f8fafc"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Error Analysis: Which diagonal fact?</text>
  <g transform="translate(64 84)">
    <polygon points="70,25 360,25 300,185 10,185" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/>
    <line x1="70" y1="25" x2="300" y2="185" stroke="#111827" stroke-width="3"/>
    <line x1="360" y1="25" x2="10" y2="185" stroke="#111827" stroke-width="3"/>
    <circle cx="185" cy="105" r="6" fill="#b91c1c"/>
    <text x="55" y="18" font-family="Arial, sans-serif" font-size="18" fill="#111827">A</text>
    <text x="365" y="22" font-family="Arial, sans-serif" font-size="18" fill="#111827">B</text>
    <text x="306" y="210" font-family="Arial, sans-serif" font-size="18" fill="#111827">C</text>
    <text x="-8" y="210" font-family="Arial, sans-serif" font-size="18" fill="#111827">D</text>
    <text x="196" y="104" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">E</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="470" y="84" width="205" height="95" rx="8" fill="#fff1f2" stroke="#fb7185"/>
    <text x="488" y="112" font-size="16" font-weight="700" fill="#9f1239">Incorrect</text>
    <text x="488" y="138" font-size="15" fill="#111827">AC = BD, so</text>
    <text x="488" y="160" font-size="15" fill="#111827">AE = BE.</text>
    <rect x="470" y="210" width="205" height="112" rx="8" fill="#ecfdf5" stroke="#22c55e"/>
    <text x="488" y="238" font-size="16" font-weight="700" fill="#166534">Correct</text>
    <text x="488" y="264" font-size="15" fill="#111827">AE = EC</text>
    <text x="488" y="286" font-size="15" fill="#111827">BE = ED</text>
    <text x="488" y="308" font-size="15" fill="#111827">Same diagonal halves match.</text>
  </g>
  <text x="44" y="352" font-family="Arial, sans-serif" font-size="18" fill="#334155">General parallelogram diagonals bisect each other; they are not always congruent to each other.</text>
</svg>
