<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Parallelogram properties map</title>
  <desc id="desc">A central parallelogram diagram points to four rules: opposite sides congruent, opposite angles congruent, consecutive angles supplementary, and diagonals bisect each other.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="36" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Parallelogram Property Map</text>
  <g transform="translate(235 115)">
    <polygon points="35,25 245,25 205,150 -5,150" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/>
    <line x1="35" y1="25" x2="205" y2="150" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="245" y1="25" x2="-5" y2="150" stroke="#0f172a" stroke-width="2.5"/>
    <text x="25" y="18" font-family="Arial, sans-serif" font-size="18" fill="#111827">A</text>
    <text x="250" y="18" font-family="Arial, sans-serif" font-size="18" fill="#111827">B</text>
    <text x="208" y="174" font-family="Arial, sans-serif" font-size="18" fill="#111827">C</text>
    <text x="-25" y="174" font-family="Arial, sans-serif" font-size="18" fill="#111827">D</text>
    <circle cx="120" cy="87.5" r="5" fill="#dc2626"/>
    <text x="130" y="93" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">E</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#172033">
    <rect x="34" y="92" width="185" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="50" y="118" font-weight="700">Opposite sides</text>
    <text x="50" y="140">AB = CD, BC = AD</text>
    <rect x="500" y="92" width="185" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="516" y="118" font-weight="700">Opposite angles</text>
    <text x="516" y="140">A = C, B = D</text>
    <rect x="34" y="268" width="205" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="50" y="294" font-weight="700">Consecutive angles</text>
    <text x="50" y="316">Neighboring sum = 180</text>
    <rect x="486" y="268" width="205" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="502" y="294" font-weight="700">Diagonals</text>
    <text x="502" y="316">AE = EC, BE = ED</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M220 124 L260 140"/>
    <path d="M500 124 L458 140"/>
    <path d="M235 290 L284 252"/>
    <path d="M486 290 L431 252"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
