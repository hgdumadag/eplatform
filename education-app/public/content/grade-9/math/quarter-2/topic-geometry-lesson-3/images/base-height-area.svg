<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Base and height of a parallelogram</title>
  <desc id="desc">A parallelogram has a base labeled 12 centimeters and a perpendicular height labeled 7 centimeters, with a right angle marker.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Area uses perpendicular height</text>
  <g transform="translate(120 78)">
    <polygon points="120,50 500,50 420,230 40,230" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/>
    <line x1="120" y1="50" x2="120" y2="230" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 6"/>
    <path d="M120 210 L140 210 L140 230" fill="none" stroke="#2563eb" stroke-width="3"/>
    <line x1="40" y1="254" x2="420" y2="254" stroke="#111827" stroke-width="2"/>
    <line x1="40" y1="244" x2="40" y2="264" stroke="#111827" stroke-width="2"/>
    <line x1="420" y1="244" x2="420" y2="264" stroke="#111827" stroke-width="2"/>
    <text x="206" y="284" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">base = 12 cm</text>
    <text x="134" y="146" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">height = 7 cm</text>
    <text x="455" y="154" font-family="Arial, sans-serif" font-size="16" fill="#9a3412">slanted side is not the height</text>
  </g>
  <text x="190" y="330" font-family="Arial, sans-serif" font-size="20" fill="#172033">A = bh = 12(7) = 84 square centimeters</text>
</svg>
