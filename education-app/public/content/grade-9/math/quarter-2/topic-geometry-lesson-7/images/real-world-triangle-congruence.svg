<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Real-world triangle congruence in roof trusses</title>
  <desc id="desc">Two roof truss triangles are shown with matching side tick marks to suggest that equal corresponding side lengths make identical triangular supports.</desc>
  <rect width="760" height="420" fill="#f8fbff"/>
  <text x="380" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#111827">Matching triangular supports</text>
  <line x1="70" y1="310" x2="310" y2="310" stroke="#334155" stroke-width="8"/>
  <line x1="70" y1="310" x2="190" y2="105" stroke="#334155" stroke-width="8"/>
  <line x1="190" y1="105" x2="310" y2="310" stroke="#334155" stroke-width="8"/>
  <line x1="100" y1="260" x2="280" y2="260" stroke="#64748b" stroke-width="5"/>
  <line x1="140" y1="190" x2="240" y2="190" stroke="#64748b" stroke-width="5"/>
  <line x1="450" y1="310" x2="690" y2="310" stroke="#334155" stroke-width="8"/>
  <line x1="450" y1="310" x2="570" y2="105" stroke="#334155" stroke-width="8"/>
  <line x1="570" y1="105" x2="690" y2="310" stroke="#334155" stroke-width="8"/>
  <line x1="480" y1="260" x2="660" y2="260" stroke="#64748b" stroke-width="5"/>
  <line x1="520" y1="190" x2="620" y2="190" stroke="#64748b" stroke-width="5"/>
  <path d="M180 310 v18 M200 310 v18 M560 310 v18 M580 310 v18" stroke="#2563eb" stroke-width="4"/>
  <path d="M120 230 l-16 -10 M134 207 l-16 -10 M500 230 l-16 -10 M514 207 l-16 -10" stroke="#16a34a" stroke-width="4"/>
  <path d="M255 207 l16 -10 M270 232 l16 -10 M635 207 l16 -10 M650 232 l16 -10" stroke="#dc2626" stroke-width="4"/>
  <text x="190" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">three matching lengths</text>
  <text x="570" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">same rigid triangle</text>
</svg>
