<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">HL right triangle congruence check</title>
  <desc id="desc">Two right triangles are marked with right angle boxes, matching hypotenuses, and matching legs to show the requirements for the HL theorem.</desc>
  <rect width="760" height="420" fill="#fbfdff"/>
  <text x="380" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#111827">HL works only for right triangles</text>
  <polygon points="95,315 95,105 300,315" fill="#f0f9ff" stroke="#111827" stroke-width="4"/>
  <polygon points="460,315 460,105 665,315" fill="#f0f9ff" stroke="#111827" stroke-width="4"/>
  <path d="M95 315 h34 v-34 h-34" fill="none" stroke="#16a34a" stroke-width="5"/>
  <path d="M460 315 h34 v-34 h-34" fill="none" stroke="#16a34a" stroke-width="5"/>
  <path d="M184 207 l16 -14 M202 226 l16 -14 M549 207 l16 -14 M567 226 l16 -14" stroke="#dc2626" stroke-width="4"/>
  <path d="M78 210 h-18 M78 230 h-18 M443 210 h-18 M443 230 h-18" stroke="#2563eb" stroke-width="4"/>
  <text x="197" y="178" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">hypotenuse</text>
  <text x="562" y="178" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">hypotenuse</text>
  <text x="38" y="225" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">leg</text>
  <text x="403" y="225" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">leg</text>
  <text x="380" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#155e75">Right angle + hypotenuse + leg = HL</text>
</svg>
