<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Marked triangle comparison for corresponding parts</title>
  <desc id="desc">Triangles ABC and DEF are shown with matching side marks AB to DE and AC to DF, and matching angle marks at A and D to demonstrate SAS and vertex order.</desc>
  <rect width="760" height="420" fill="#fbfdff"/>
  <text x="380" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#111827">Match the vertex order and markings</text>
  <polygon points="95,315 285,315 145,95" fill="#eff6ff" stroke="#111827" stroke-width="4"/>
  <text x="82" y="342" font-family="Arial, sans-serif" font-size="20" fill="#111827">A</text>
  <text x="291" y="342" font-family="Arial, sans-serif" font-size="20" fill="#111827">B</text>
  <text x="132" y="82" font-family="Arial, sans-serif" font-size="20" fill="#111827">C</text>
  <polygon points="470,315 660,315 520,95" fill="#f0fdf4" stroke="#111827" stroke-width="4"/>
  <text x="456" y="342" font-family="Arial, sans-serif" font-size="20" fill="#111827">D</text>
  <text x="666" y="342" font-family="Arial, sans-serif" font-size="20" fill="#111827">E</text>
  <text x="507" y="82" font-family="Arial, sans-serif" font-size="20" fill="#111827">F</text>
  <path d="M184 315 v18 M558 315 v18" stroke="#2563eb" stroke-width="4"/>
  <path d="M115 238 l-16 -7 M127 216 l-16 -7 M490 238 l-16 -7 M502 216 l-16 -7" stroke="#16a34a" stroke-width="4"/>
  <path d="M122 315 A42 42 0 0 1 103 279" fill="none" stroke="#dc2626" stroke-width="5"/>
  <path d="M497 315 A42 42 0 0 1 478 279" fill="none" stroke="#dc2626" stroke-width="5"/>
  <text x="190" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">△ABC</text>
  <text x="565" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">△DEF</text>
  <text x="380" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#1e3a8a">AB ↔ DE</text>
  <text x="380" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#166534">AC ↔ DF</text>
  <text x="380" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#991b1b">∠A ↔ ∠D</text>
</svg>
