<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Error analysis for invalid SSA and AAA shortcuts</title>
  <desc id="desc">Left panel shows two sides and a non-included angle labeled SSA with a warning. Right panel shows two same-shape triangles of different sizes labeled AAA is not congruence.</desc>
  <rect width="760" height="420" fill="#fbfdff"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#111827">Invalid shortcuts to reject</text>
  <rect x="35" y="65" width="330" height="300" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="200" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#9a3412">SSA is not SAS</text>
  <polygon points="80,300 300,300 165,140" fill="#ffedd5" stroke="#111827" stroke-width="4"/>
  <path d="M172 300 v18 M196 300 v18" stroke="#2563eb" stroke-width="4"/>
  <path d="M115 260 l-16 -10 M128 242 l-16 -10" stroke="#16a34a" stroke-width="4"/>
  <path d="M286 300 A42 42 0 0 0 261 268" fill="none" stroke="#dc2626" stroke-width="5"/>
  <text x="200" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#9a3412">angle is not between the sides</text>
  <rect x="395" y="65" width="330" height="300" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#991b1b">AAA is not congruence</text>
  <polygon points="430,285 560,285 475,165" fill="#fee2e2" stroke="#111827" stroke-width="4"/>
  <polygon points="585,315 705,315 626,205" fill="#fee2e2" stroke="#111827" stroke-width="4"/>
  <path d="M446 285 A30 30 0 0 1 431 258 M601 315 A30 30 0 0 1 586 288" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M548 285 A32 32 0 0 0 530 257 M693 315 A32 32 0 0 0 675 287" fill="none" stroke="#16a34a" stroke-width="4"/>
  <path d="M470 173 A25 25 0 0 0 485 173 M621 213 A25 25 0 0 0 636 213" fill="none" stroke="#dc2626" stroke-width="4"/>
  <text x="560" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">same angles, different sizes</text>
</svg>
