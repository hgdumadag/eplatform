<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Worked SAS triangle congruence example</title>
  <desc id="desc">Two triangles are marked with two corresponding side pairs and the included angle between them, showing why the congruence reason is SAS.</desc>
  <rect width="760" height="420" fill="#fbfdff"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#111827">SAS: the angle is included</text>
  <polygon points="90,315 315,315 170,90" fill="#ecfeff" stroke="#111827" stroke-width="4"/>
  <polygon points="445,315 670,315 525,90" fill="#ecfeff" stroke="#111827" stroke-width="4"/>
  <path d="M178 315 v18 M200 315 v18 M533 315 v18 M555 315 v18" stroke="#2563eb" stroke-width="4"/>
  <path d="M123 250 l-17 -8 M136 228 l-17 -8 M478 250 l-17 -8 M491 228 l-17 -8" stroke="#16a34a" stroke-width="4"/>
  <path d="M116 315 A52 52 0 0 1 96 270" fill="none" stroke="#dc2626" stroke-width="5"/>
  <path d="M471 315 A52 52 0 0 1 451 270" fill="none" stroke="#dc2626" stroke-width="5"/>
  <text x="88" y="345" font-family="Arial, sans-serif" font-size="19" fill="#111827">A</text>
  <text x="318" y="342" font-family="Arial, sans-serif" font-size="19" fill="#111827">B</text>
  <text x="160" y="78" font-family="Arial, sans-serif" font-size="19" fill="#111827">C</text>
  <text x="443" y="345" font-family="Arial, sans-serif" font-size="19" fill="#111827">D</text>
  <text x="673" y="342" font-family="Arial, sans-serif" font-size="19" fill="#111827">E</text>
  <text x="515" y="78" font-family="Arial, sans-serif" font-size="19" fill="#111827">F</text>
  <text x="380" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#374151">Side</text>
  <text x="380" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#374151">Included angle</text>
  <text x="380" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#374151">Side</text>
  <text x="380" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e3a8a">△ABC ≅ △DEF by SAS</text>
</svg>
