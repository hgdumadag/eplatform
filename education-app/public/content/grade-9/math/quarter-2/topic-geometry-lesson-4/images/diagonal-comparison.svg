<svg xmlns="http://www.w3.org/2000/svg" width="850" height="330" viewBox="0 0 850 330" role="img" aria-labelledby="title desc">
  <title id="title">Diagonal comparison for rectangle, rhombus, and square</title>
  <desc id="desc">Three diagrams compare rectangle diagonals as congruent, rhombus diagonals as perpendicular, and square diagonals as both.</desc>
  <rect width="850" height="330" fill="#f8fafc"/>
  <text x="425" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2937">What do the diagonals tell you?</text>
  <g transform="translate(45,72)">
    <rect x="25" y="35" width="190" height="110" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <line x1="25" y1="35" x2="215" y2="145" stroke="#dc2626" stroke-width="3"/>
    <line x1="215" y1="35" x2="25" y2="145" stroke="#dc2626" stroke-width="3"/>
    <text x="120" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">Rectangle</text>
    <text x="120" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">diagonals congruent</text>
  </g>
  <g transform="translate(320,72)">
    <polygon points="120,20 220,90 120,160 20,90" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <line x1="120" y1="20" x2="120" y2="160" stroke="#dc2626" stroke-width="3"/>
    <line x1="20" y1="90" x2="220" y2="90" stroke="#dc2626" stroke-width="3"/>
    <path d="M120 90 h18 v18 h-18z" fill="none" stroke="#111827" stroke-width="2"/>
    <text x="120" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#15803d">Rhombus</text>
    <text x="120" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">diagonals perpendicular</text>
  </g>
  <g transform="translate(595,72)">
    <rect x="50" y="30" width="135" height="135" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <line x1="50" y1="30" x2="185" y2="165" stroke="#dc2626" stroke-width="3"/>
    <line x1="185" y1="30" x2="50" y2="165" stroke="#dc2626" stroke-width="3"/>
    <path d="M117.5 97.5 h16 v16 h-16z" fill="none" stroke="#111827" stroke-width="2" transform="rotate(45 125.5 105.5)"/>
    <text x="118" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#92400e">Square</text>
    <text x="118" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">both properties</text>
  </g>
</svg>
