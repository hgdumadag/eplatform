<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Worked square diagonal measure problem</title>
  <desc id="desc">Square ABCD with diagonals AC and BD intersecting at E; AE is labeled 7 centimeters.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <rect x="230" y="70" width="250" height="250" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  <line x1="230" y1="70" x2="480" y2="320" stroke="#dc2626" stroke-width="3"/>
  <line x1="480" y1="70" x2="230" y2="320" stroke="#dc2626" stroke-width="3"/>
  <circle cx="355" cy="195" r="5" fill="#111827"/>
  <text x="214" y="62" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">A</text>
  <text x="492" y="62" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">B</text>
  <text x="492" y="342" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">C</text>
  <text x="214" y="342" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">D</text>
  <text x="365" y="192" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">E</text>
  <text x="276" y="145" font-family="Arial, sans-serif" font-size="18" fill="#b91c1c">AE = 7 cm</text>
  <path d="M355 195 h18 v18 h-18z" fill="none" stroke="#111827" stroke-width="2" transform="rotate(45 364 204)"/>
  <text x="360" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Square diagonals are congruent and bisect each other</text>
</svg>
