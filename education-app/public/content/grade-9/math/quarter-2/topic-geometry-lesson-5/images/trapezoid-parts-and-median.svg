<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Trapezoid parts and median formula</title>
  <desc id="desc">An annotated trapezoid showing parallel bases, non-parallel legs, height, and a median joining midpoints of the legs with the formula median equals base one plus base two divided by two.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="32" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">Trapezoid parts that drive the formula</text>
  <g transform="translate(70 82)">
    <polygon points="80,180 460,180 370,35 160,35" fill="#eaf6ff" stroke="#174f78" stroke-width="4"/>
    <line x1="160" y1="35" x2="370" y2="35" stroke="#0a7a57" stroke-width="6"/>
    <line x1="80" y1="180" x2="460" y2="180" stroke="#0a7a57" stroke-width="6"/>
    <line x1="160" y1="35" x2="80" y2="180" stroke="#b45b22" stroke-width="4"/>
    <line x1="370" y1="35" x2="460" y2="180" stroke="#b45b22" stroke-width="4"/>
    <line x1="120" y1="107.5" x2="415" y2="107.5" stroke="#7a3fb0" stroke-width="5"/>
    <circle cx="120" cy="107.5" r="6" fill="#7a3fb0"/>
    <circle cx="415" cy="107.5" r="6" fill="#7a3fb0"/>
    <line x1="280" y1="35" x2="280" y2="180" stroke="#3b6b8a" stroke-width="3" stroke-dasharray="7 6"/>
    <path d="M280 166 h14 v14 h-14z" fill="none" stroke="#3b6b8a" stroke-width="2"/>
    <text x="230" y="25" font-family="Arial, sans-serif" font-size="16" fill="#0a7a57">base 1</text>
    <text x="238" y="208" font-family="Arial, sans-serif" font-size="16" fill="#0a7a57">base 2</text>
    <text x="52" y="107" font-family="Arial, sans-serif" font-size="16" fill="#b45b22">leg</text>
    <text x="464" y="112" font-family="Arial, sans-serif" font-size="16" fill="#b45b22">leg</text>
    <text x="202" y="98" font-family="Arial, sans-serif" font-size="16" fill="#7a3fb0">median / midsegment</text>
    <text x="292" y="112" font-family="Arial, sans-serif" font-size="16" fill="#3b6b8a">height</text>
  </g>
  <g transform="translate(455 89)">
    <rect x="0" y="0" width="218" height="134" rx="8" fill="#f6f0ff" stroke="#7a3fb0" stroke-width="2"/>
    <text x="18" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4b2478">Median Rule</text>
    <text x="18" y="72" font-family="Arial, sans-serif" font-size="18" fill="#2c2c2c">median = (b1 + b2) / 2</text>
    <text x="18" y="106" font-family="Arial, sans-serif" font-size="15" fill="#444">Average the parallel bases.</text>
  </g>
</svg>
