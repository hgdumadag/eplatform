<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">Worked trapezoid and kite measure problems</title>
  <desc id="desc">Two worked diagrams: a trapezoid with bases 16 and 28 showing median equals 22, and a kite with a bisected diagonal showing 9 plus 9 equals 18.</desc>
  <rect width="720" height="390" fill="#ffffff"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#26374a">Worked measure diagrams</text>
  <g transform="translate(46 82)">
    <rect x="0" y="0" width="305" height="260" rx="8" fill="#f4faff" stroke="#b8d6ed"/>
    <text x="18" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#174f78">Trapezoid median</text>
    <polygon points="38,180 252,180 215,70 76,70" fill="#eaf6ff" stroke="#174f78" stroke-width="3"/>
    <line x1="76" y1="70" x2="215" y2="70" stroke="#0a7a57" stroke-width="5"/>
    <line x1="38" y1="180" x2="252" y2="180" stroke="#0a7a57" stroke-width="5"/>
    <line x1="57" y1="125" x2="234" y2="125" stroke="#7a3fb0" stroke-width="4"/>
    <text x="123" y="62" font-family="Arial, sans-serif" font-size="15" fill="#0a7a57">16</text>
    <text x="137" y="206" font-family="Arial, sans-serif" font-size="15" fill="#0a7a57">28</text>
    <text x="136" y="117" font-family="Arial, sans-serif" font-size="15" fill="#7a3fb0">m</text>
    <text x="38" y="236" font-family="Arial, sans-serif" font-size="16" fill="#333">m = (16 + 28) / 2 = 22</text>
  </g>
  <g transform="translate(386 82)">
    <rect x="0" y="0" width="290" height="260" rx="8" fill="#fbfff4" stroke="#cce2b7"/>
    <text x="18" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3f6f24">Kite bisected diagonal</text>
    <polygon points="142,52 238,130 142,220 62,130" fill="#ecf8df" stroke="#3f6f24" stroke-width="3"/>
    <line x1="142" y1="52" x2="142" y2="220" stroke="#6d3ca1" stroke-width="4"/>
    <line x1="62" y1="130" x2="238" y2="130" stroke="#6d3ca1" stroke-width="4"/>
    <path d="M142 130 h15 v15 h-15z" fill="none" stroke="#6d3ca1" stroke-width="2"/>
    <line x1="102" y1="122" x2="102" y2="138" stroke="#111" stroke-width="3"/>
    <line x1="182" y1="122" x2="182" y2="138" stroke="#111" stroke-width="3"/>
    <text x="90" y="118" font-family="Arial, sans-serif" font-size="15" fill="#333">9</text>
    <text x="178" y="118" font-family="Arial, sans-serif" font-size="15" fill="#333">9</text>
    <text x="31" y="238" font-family="Arial, sans-serif" font-size="16" fill="#333">full diagonal = 9 + 9 = 18</text>
  </g>
</svg>
