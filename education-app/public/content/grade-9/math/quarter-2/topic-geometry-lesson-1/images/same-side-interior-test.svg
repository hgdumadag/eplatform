<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Same-side interior angles supplementary test</title>
  <desc id="desc">Two lines crossed by a transversal. Same-side interior angles are labeled 118 degrees and 62 degrees and shown to add to 180 degrees.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <line x1="90" y1="125" x2="615" y2="125" stroke="#0f172a" stroke-width="5"/>
  <line x1="105" y1="285" x2="630" y2="285" stroke="#0f172a" stroke-width="5"/>
  <line x1="430" y1="55" x2="290" y2="350" stroke="#dc2626" stroke-width="5"/>
  <text x="620" y="119" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">p</text>
  <text x="635" y="281" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">q</text>
  <path d="M397 125 A55 55 0 0 0 370 175" fill="none" stroke="#7c3aed" stroke-width="6"/>
  <path d="M325 285 A55 55 0 0 1 350 235" fill="none" stroke="#7c3aed" stroke-width="6"/>
  <text x="333" y="180" font-family="Arial, sans-serif" font-size="22" fill="#7c3aed">118°</text>
  <text x="356" y="247" font-family="Arial, sans-serif" font-size="22" fill="#7c3aed">62°</text>
  <rect x="170" y="335" width="380" height="46" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="360" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4c1d95">118° + 62° = 180°, so p ∥ q</text>
</svg>
