<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Perpendicular lines with a right angle</title>
  <desc id="desc">A horizontal line and vertical line intersect, with one angle marked by a square and labeled 90 degrees.</desc>
  <rect width="640" height="360" fill="#f8fafc"/>
  <line x1="90" y1="190" x2="550" y2="190" stroke="#111827" stroke-width="6"/>
  <line x1="320" y1="55" x2="320" y2="310" stroke="#111827" stroke-width="6"/>
  <path d="M320 190 h45 v-45 h-45" fill="none" stroke="#2563eb" stroke-width="5"/>
  <text x="373" y="155" font-family="Arial, sans-serif" font-size="22" fill="#2563eb">90°</text>
  <text x="560" y="196" font-family="Arial, sans-serif" font-size="18" fill="#111827">line r</text>
  <text x="330" y="55" font-family="Arial, sans-serif" font-size="18" fill="#111827">line s</text>
  <text x="320" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">A right-angle intersection proves r ⟂ s.</text>
</svg>
