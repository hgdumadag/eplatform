<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Real-world models of parallel and perpendicular directions</title>
  <desc id="desc">A road lane pair shows same-direction parallel lines, and a wall meeting a floor shows a right-angle perpendicular intersection.</desc>
  <rect width="720" height="360" fill="#f8fbff"/>
  <rect x="52" y="68" width="270" height="210" rx="6" fill="#e9f2ff" stroke="#9bbce8" stroke-width="2"/>
  <text x="187" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Same direction</text>
  <line x1="95" y1="260" x2="165" y2="85" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
  <line x1="205" y1="260" x2="275" y2="85" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
  <line x1="130" y1="255" x2="200" y2="80" stroke="#facc15" stroke-width="4" stroke-dasharray="14 12"/>
  <text x="187" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">lane markings suggest parallel lines</text>
  <rect x="398" y="68" width="270" height="210" rx="6" fill="#fff7ed" stroke="#f2b879" stroke-width="2"/>
  <text x="533" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4a2a11">Square corner</text>
  <rect x="448" y="92" width="170" height="112" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
  <line x1="448" y1="204" x2="618" y2="204" stroke="#475569" stroke-width="8"/>
  <line x1="448" y1="92" x2="448" y2="266" stroke="#475569" stroke-width="8"/>
  <path d="M448 204 h38 v-38" fill="none" stroke="#1d4ed8" stroke-width="4"/>
  <text x="536" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">a right angle proves perpendicular lines</text>
</svg>
