<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img">
  <title>CPCTC proof flow</title>
  <desc>A three-step flowchart shows that a proof begins with givens and markings, then proves triangle congruence, then uses CPCTC for corresponding parts.</desc>
  <rect width="760" height="360" fill="#fbfcff"/>
  <text x="36" y="42" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">The CPCTC proof path</text>
  <g font-family="Arial, sans-serif">
    <rect x="40" y="95" width="190" height="130" rx="10" fill="#e8f3ff" stroke="#1f6fb2" stroke-width="3"/>
    <text x="70" y="130" font-size="19" font-weight="700" fill="#17324d">1. Gather facts</text>
    <text x="66" y="165" font-size="15" fill="#17324d">givens, marks, shared</text>
    <text x="66" y="188" font-size="15" fill="#17324d">sides, vertical angles</text>
    <rect x="285" y="95" width="190" height="130" rx="10" fill="#edf8ef" stroke="#2e8b57" stroke-width="3"/>
    <text x="315" y="130" font-size="19" font-weight="700" fill="#17324d">2. Prove triangles</text>
    <text x="320" y="165" font-size="15" fill="#17324d">SSS, SAS, ASA,</text>
    <text x="320" y="188" font-size="15" fill="#17324d">AAS, or HL</text>
    <rect x="530" y="95" width="190" height="130" rx="10" fill="#fff5e6" stroke="#c26a00" stroke-width="3"/>
    <text x="560" y="130" font-size="19" font-weight="700" fill="#17324d">3. Use CPCTC</text>
    <text x="560" y="165" font-size="15" fill="#17324d">matching sides or</text>
    <text x="560" y="188" font-size="15" fill="#17324d">angles are congruent</text>
    <path d="M240 160 H270" stroke="#506070" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M485 160 H515" stroke="#506070" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="72" y="282" font-size="18" fill="#17324d">Do not jump to CPCTC until the middle box is complete.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#506070"/>
    </marker>
  </defs>
</svg>
