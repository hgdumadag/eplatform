<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img">
  <title>Error analysis for CPCTC</title>
  <desc>A proof table shows an incorrect CPCTC step before triangle congruence is established, with a warning arrow pointing to the error.</desc>
  <rect width="760" height="420" fill="#fffefe"/>
  <text x="36" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">Error analysis: CPCTC too early</text>
  <g font-family="Arial, sans-serif">
    <rect x="50" y="82" width="430" height="250" rx="8" fill="#ffffff" stroke="#c9d7e6" stroke-width="2"/>
    <rect x="50" y="82" width="430" height="45" rx="8" fill="#f0f5fb"/>
    <line x1="265" y1="82" x2="265" y2="332" stroke="#c9d7e6" stroke-width="2"/>
    <line x1="50" y1="127" x2="480" y2="127" stroke="#c9d7e6" stroke-width="2"/>
    <line x1="50" y1="187" x2="480" y2="187" stroke="#c9d7e6" stroke-width="2"/>
    <line x1="50" y1="247" x2="480" y2="247" stroke="#c9d7e6" stroke-width="2"/>
    <text x="88" y="111" font-size="18" font-weight="700" fill="#17324d">Statement</text>
    <text x="318" y="111" font-size="18" font-weight="700" fill="#17324d">Reason</text>
    <text x="72" y="163" font-size="16" fill="#17324d">AB congruent CB</text>
    <text x="318" y="163" font-size="16" fill="#17324d">Given</text>
    <text x="72" y="223" font-size="16" fill="#17324d">AD congruent CD</text>
    <text x="318" y="223" font-size="16" fill="#b42318" font-weight="700">CPCTC</text>
    <text x="72" y="283" font-size="16" fill="#17324d">Tri ABD congruent Tri CBD</text>
    <text x="318" y="283" font-size="16" fill="#17324d">SAS</text>
    <path d="M495 218 C555 205 565 185 610 164" stroke="#b42318" stroke-width="4" fill="none" marker-end="url(#warnArrow)"/>
    <rect x="555" y="82" width="165" height="92" rx="8" fill="#fff0f0" stroke="#b42318" stroke-width="2"/>
    <text x="575" y="113" font-size="17" font-weight="700" fill="#b42318">Too soon</text>
    <text x="575" y="142" font-size="14" fill="#17324d">Prove triangles</text>
    <text x="575" y="160" font-size="14" fill="#17324d">congruent first.</text>
    <rect x="50" y="350" width="670" height="38" rx="8" fill="#edf8ef" stroke="#2e8b57"/>
    <text x="74" y="374" font-size="16" fill="#17324d">Correct order: givens and shared parts -> triangle congruence -> CPCTC.</text>
  </g>
  <defs>
    <marker id="warnArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b42318"/>
    </marker>
  </defs>
</svg>
