<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Quadrilateral hierarchy</title>
  <desc id="desc">Nested boxes show quadrilaterals containing trapezoids and parallelograms, with rectangles and rhombuses inside parallelograms and squares inside both.</desc>
  <rect width="760" height="430" fill="#f8fafc"/>
  <rect x="30" y="35" width="700" height="355" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="52" y="70" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Quadrilaterals</text>
  <rect x="65" y="105" width="620" height="245" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
  <text x="88" y="139" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#155e75">Trapezoids: at least one pair of parallel sides</text>
  <rect x="110" y="170" width="530" height="150" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
  <text x="132" y="203" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#3730a3">Parallelograms: two pairs of parallel sides</text>
  <rect x="145" y="230" width="195" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="177" y="267" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">Rectangles</text>
  <rect x="410" y="230" width="195" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="463" y="267" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#92400e">Rhombi</text>
  <rect x="310" y="252" width="140" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="346" y="285" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#991b1b">Squares</text>
  <rect x="510" y="55" width="150" height="45" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="564" y="84" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a3412">Kites</text>
</svg>
