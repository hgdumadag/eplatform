<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="title desc">
  <title id="title">Appearance classification error</title>
  <desc id="desc">A tilted quadrilateral is labeled with a warning that appearance alone does not prove it is a rhombus.</desc>
  <rect width="720" height="350" fill="#f8fafc"/>
  <text x="35" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Error analysis: looks are not proof</text>
  <g stroke="#0f172a" stroke-width="4" fill="#ffffff" font-family="Arial, sans-serif">
    <polygon points="285,85 455,135 390,265 220,215"/>
    <text x="260" y="75" font-size="19" fill="#0f172a" stroke="none">No side marks</text>
    <text x="475" y="138" font-size="19" fill="#0f172a" stroke="none">No measurements</text>
    <line x1="505" y1="145" x2="445" y2="140" stroke="#dc2626" stroke-width="3"/>
    <line x1="275" y1="78" x2="300" y2="95" stroke="#dc2626" stroke-width="3"/>
  </g>
  <rect x="70" y="255" width="580" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="95" y="292" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#991b1b">Do not say "rhombus" unless four congruent sides are given.</text>
</svg>
