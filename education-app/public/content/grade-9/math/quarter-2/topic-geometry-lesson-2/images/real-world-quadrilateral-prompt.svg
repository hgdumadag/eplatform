<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Everyday quadrilateral prompt</title>
  <desc id="desc">Four everyday objects modeled by quadrilaterals: a window, a road sign, a floor tile, and a kite shape.</desc>
  <rect width="720" height="320" fill="#f8fafc"/>
  <text x="36" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Which classifications are justified?</text>
  <g font-family="Arial, sans-serif" stroke="#172033" stroke-width="3" fill="#ffffff">
    <rect x="55" y="80" width="110" height="150" rx="4"/>
    <line x1="110" y1="80" x2="110" y2="230"/>
    <line x1="55" y1="155" x2="165" y2="155"/>
    <text x="71" y="262" font-size="18" fill="#172033" stroke="none">window</text>
    <polygon points="255,75 335,115 295,195 215,155" fill="#ecfeff"/>
    <text x="225" y="262" font-size="18" fill="#172033" stroke="none">tilted sign</text>
    <rect x="420" y="90" width="110" height="110" fill="#fff7ed"/>
    <line x1="420" y1="145" x2="530" y2="145" stroke="#fb923c" stroke-width="2"/>
    <line x1="475" y1="90" x2="475" y2="200" stroke="#fb923c" stroke-width="2"/>
    <text x="443" y="262" font-size="18" fill="#172033" stroke="none">tile</text>
    <polygon points="615,65 685,150 615,235 555,150" fill="#eef2ff"/>
    <line x1="615" y1="65" x2="615" y2="235" stroke="#6366f1" stroke-width="2"/>
    <line x1="555" y1="150" x2="685" y2="150" stroke="#6366f1" stroke-width="2"/>
    <text x="584" y="262" font-size="18" fill="#172033" stroke="none">kite shape</text>
  </g>
  <text x="36" y="298" font-family="Arial, sans-serif" font-size="17" fill="#475569">Use properties, not appearance, before choosing a name.</text>
</svg>
