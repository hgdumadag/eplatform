<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Real-life perpendicular examples</title>
  <desc id="desc">A street corner, notebook page, and door frame each show lines meeting at right angles.</desc>
  <rect width="720" height="260" fill="#f7fbff"/>
  <text x="40" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Where do you see square corners?</text>
  <g transform="translate(45 70)">
    <rect x="0" y="42" width="165" height="56" fill="#dbeafe"/>
    <rect x="55" y="0" width="56" height="145" fill="#bfdbfe"/>
    <line x1="83" y1="0" x2="83" y2="145" stroke="#1d4ed8" stroke-width="4"/>
    <line x1="0" y1="70" x2="165" y2="70" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M85 70 h24 v24 h-24z" fill="none" stroke="#b45309" stroke-width="4"/>
    <text x="30" y="172" font-family="Arial, sans-serif" font-size="16" fill="#334155">street intersection</text>
  </g>
  <g transform="translate(280 63)">
    <rect x="0" y="0" width="145" height="165" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <line x1="22" y1="0" x2="22" y2="165" stroke="#ef4444" stroke-width="3"/>
    <line x1="0" y1="35" x2="145" y2="35" stroke="#60a5fa" stroke-width="2"/>
    <line x1="0" y1="65" x2="145" y2="65" stroke="#60a5fa" stroke-width="2"/>
    <line x1="0" y1="95" x2="145" y2="95" stroke="#60a5fa" stroke-width="2"/>
    <path d="M22 35 h22 v22 h-22z" fill="none" stroke="#b45309" stroke-width="4"/>
    <text x="18" y="179" font-family="Arial, sans-serif" font-size="16" fill="#334155">notebook corner</text>
  </g>
  <g transform="translate(515 58)">
    <rect x="0" y="0" width="116" height="170" fill="#e0f2fe" stroke="#0f766e" stroke-width="5"/>
    <line x1="0" y1="0" x2="116" y2="0" stroke="#0f766e" stroke-width="5"/>
    <line x1="0" y1="0" x2="0" y2="170" stroke="#0f766e" stroke-width="5"/>
    <circle cx="94" cy="86" r="5" fill="#f59e0b"/>
    <path d="M2 2 h28 v28 h-28z" fill="none" stroke="#b45309" stroke-width="4"/>
    <text x="15" y="184" font-family="Arial, sans-serif" font-size="16" fill="#334155">door frame</text>
  </g>
</svg>
