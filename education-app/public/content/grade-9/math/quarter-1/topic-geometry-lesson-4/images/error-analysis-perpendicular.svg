<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Error analysis for perpendicular construction</title>
  <desc id="desc">A line intended to be perpendicular misses point P and forms an 86-degree angle, showing two construction errors.</desc>
  <rect width="720" height="260" fill="#fff7ed"/>
  <line x1="80" y1="190" x2="640" y2="190" stroke="#2563eb" stroke-width="5"/>
  <text x="650" y="196" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">line l</text>
  <circle cx="350" cy="190" r="7" fill="#111827"/>
  <text x="360" y="214" font-family="Arial, sans-serif" font-size="20" fill="#111827">P</text>
  <line x1="388" y1="50" x2="375" y2="190" stroke="#dc2626" stroke-width="5"/>
  <circle cx="375" cy="190" r="6" fill="#dc2626"/>
  <path d="M375 190 A52 52 0 0 1 380 138" fill="none" stroke="#991b1b" stroke-width="4"/>
  <text x="405" y="148" font-family="Arial, sans-serif" font-size="20" fill="#991b1b">86 degrees</text>
  <path d="M350 182 C356 150 365 122 382 85" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="80" y="50" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#7c2d12">What went wrong?</text>
  <text x="80" y="84" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12">1. The red line misses point P.</text>
  <text x="80" y="112" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12">2. The angle is not 90 degrees.</text>
</svg>
