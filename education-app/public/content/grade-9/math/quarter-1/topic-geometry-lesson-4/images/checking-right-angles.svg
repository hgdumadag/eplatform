<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Checking right angles</title>
  <desc id="desc">A correct construction shows 90 degrees and an incorrect construction shows 88 degrees, reminding students to check precision.</desc>
  <rect width="720" height="260" fill="#f8fafc"/>
  <g transform="translate(70 55)">
    <text x="0" y="-18" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">Precise</text>
    <line x1="0" y1="125" x2="220" y2="125" stroke="#2563eb" stroke-width="5"/>
    <line x1="110" y1="30" x2="110" y2="200" stroke="#16a34a" stroke-width="5"/>
    <path d="M110 125 h30 v30 h-30z" fill="none" stroke="#166534" stroke-width="4"/>
    <text x="146" y="155" font-family="Arial, sans-serif" font-size="20" fill="#166534">90 degrees</text>
    <text x="32" y="224" font-family="Arial, sans-serif" font-size="17" fill="#334155">perpendicular</text>
  </g>
  <g transform="translate(430 55)">
    <text x="0" y="-18" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#991b1b">Needs adjustment</text>
    <line x1="0" y1="125" x2="220" y2="125" stroke="#2563eb" stroke-width="5"/>
    <line x1="104" y1="30" x2="116" y2="200" stroke="#dc2626" stroke-width="5"/>
    <path d="M110 125 A45 45 0 0 1 113 80" fill="none" stroke="#991b1b" stroke-width="4"/>
    <text x="134" y="100" font-family="Arial, sans-serif" font-size="20" fill="#991b1b">88 degrees</text>
    <text x="18" y="224" font-family="Arial, sans-serif" font-size="17" fill="#334155">not perpendicular yet</text>
  </g>
</svg>
