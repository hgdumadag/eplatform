<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="title desc">
  <title id="title">Reading a protractor</title>
  <desc id="desc">One ray is aligned with zero degrees and another ray crosses the fifty degree mark.</desc>
  <rect width="860" height="420" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="430" y="38" text-anchor="middle" font-size="24" font-weight="700">Read from the zero side</text>
    <path d="M170 310 A260 260 0 0 1 690 310" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <line x1="170" y1="310" x2="690" y2="310" stroke="#0284c7" stroke-width="3"/>
    <circle cx="430" cy="310" r="7" fill="#0f172a"/>
    <g stroke="#0369a1" stroke-width="2">
      <line x1="690" y1="310" x2="672" y2="310"/>
      <line x1="656" y1="221" x2="641" y2="230"/>
      <line x1="575" y1="155" x2="566" y2="170"/>
      <line x1="474" y1="54" x2="470" y2="74"/>
      <line x1="430" y1="50" x2="430" y2="72"/>
      <line x1="305" y1="83" x2="314" y2="101"/>
      <line x1="204" y1="221" x2="219" y2="230"/>
      <line x1="170" y1="310" x2="190" y2="310"/>
    </g>
    <g font-size="14" fill="#075985" text-anchor="middle">
      <text x="690" y="334">0°</text>
      <text x="655" y="208">30°</text>
      <text x="594" y="143">50°</text>
      <text x="430" y="88">90°</text>
      <text x="204" y="208">150°</text>
      <text x="170" y="334">180°</text>
    </g>
    <line x1="430" y1="310" x2="690" y2="310" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
    <line x1="430" y1="310" x2="597" y2="111" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <path d="M478 310 A48 48 0 0 0 461 273" fill="none" stroke="#7c2d12" stroke-width="4"/>
    <text x="512" y="270" font-size="20" font-weight="700" fill="#7c2d12">50°</text>
    <rect x="190" y="355" width="480" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="430" y="381" text-anchor="middle" font-size="17" font-weight="700">Starting ray is at 0°, so the angle measures 50°.</text>
  </g>
</svg>
