<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" role="img" aria-labelledby="title desc">
  <title id="title">Worked angle statement</title>
  <desc id="desc">Angle PQR is shown with vertex Q and a measure of sixty-five degrees.</desc>
  <rect width="780" height="360" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="390" y="38" text-anchor="middle" font-size="24" font-weight="700">Write the complete statement</text>
    <line x1="330" y1="245" x2="230" y2="105" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <line x1="330" y1="245" x2="585" y2="245" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <polygon points="230,105 247,113 235,124" fill="#2563eb"/>
    <polygon points="585,245 567,235 567,255" fill="#2563eb"/>
    <circle cx="330" cy="245" r="8" fill="#dc2626"/>
    <circle cx="230" cy="105" r="6" fill="#0f172a"/>
    <circle cx="585" cy="245" r="6" fill="#0f172a"/>
    <path d="M372 245 A42 42 0 0 0 354 211" fill="none" stroke="#dc2626" stroke-width="4"/>
    <text x="214" y="98" font-size="22" font-weight="700">P</text>
    <text x="318" y="278" font-size="22" font-weight="700">Q</text>
    <text x="596" y="253" font-size="22" font-weight="700">R</text>
    <text x="385" y="205" font-size="22" font-weight="700" fill="#dc2626">65°</text>
    <rect x="130" y="302" width="520" height="38" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="390" y="327" text-anchor="middle" font-size="18" font-weight="700">m∠PQR = 65°</text>
  </g>
</svg>
