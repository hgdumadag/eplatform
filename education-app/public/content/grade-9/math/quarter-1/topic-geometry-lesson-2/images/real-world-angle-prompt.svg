<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Everyday examples of angles</title>
  <desc id="desc">A door, scissors, and clock hands show openings that can be modeled as angles.</desc>
  <rect width="900" height="320" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700">Where do you see an angle?</text>
    <g transform="translate(80 78)">
      <rect x="0" y="0" width="190" height="170" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <line x1="65" y1="135" x2="65" y2="35" stroke="#075985" stroke-width="6"/>
      <line x1="65" y1="135" x2="145" y2="65" stroke="#075985" stroke-width="6"/>
      <path d="M88 115 A35 35 0 0 0 82 94" fill="none" stroke="#dc2626" stroke-width="3"/>
      <text x="95" y="155" text-anchor="middle" font-size="17" font-weight="700">open door</text>
    </g>
    <g transform="translate(355 78)">
      <rect x="0" y="0" width="190" height="170" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
      <circle cx="92" cy="110" r="9" fill="#047857"/>
      <line x1="92" y1="110" x2="42" y2="45" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
      <line x1="92" y1="110" x2="152" y2="52" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
      <path d="M105 94 A25 25 0 0 0 88 83" fill="none" stroke="#dc2626" stroke-width="3"/>
      <text x="95" y="155" text-anchor="middle" font-size="17" font-weight="700">scissors</text>
    </g>
    <g transform="translate(630 78)">
      <rect x="0" y="0" width="190" height="170" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <circle cx="95" cy="82" r="48" fill="#fff7ed" stroke="#92400e" stroke-width="3"/>
      <circle cx="95" cy="82" r="5" fill="#92400e"/>
      <line x1="95" y1="82" x2="95" y2="42" stroke="#92400e" stroke-width="5"/>
      <line x1="95" y1="82" x2="130" y2="102" stroke="#92400e" stroke-width="5"/>
      <path d="M111 51 A34 34 0 0 1 125 81" fill="none" stroke="#dc2626" stroke-width="3"/>
      <text x="95" y="155" text-anchor="middle" font-size="17" font-weight="700">clock hands</text>
    </g>
    <text x="450" y="285" text-anchor="middle" font-size="16">An angle is the opening between two rays with the same endpoint.</text>
  </g>
</svg>
