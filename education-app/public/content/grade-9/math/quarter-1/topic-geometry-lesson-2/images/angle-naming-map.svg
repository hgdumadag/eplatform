<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Angle naming map</title>
  <desc id="desc">Angle ABC is shown with B as the vertex and rays BA and BC as the sides.</desc>
  <rect width="760" height="360" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="380" y="38" text-anchor="middle" font-size="24" font-weight="700">Angle ABC</text>
    <line x1="315" y1="230" x2="180" y2="95" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <line x1="315" y1="230" x2="585" y2="230" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <polygon points="180,95 198,101 188,113" fill="#2563eb"/>
    <polygon points="585,230 567,220 567,240" fill="#2563eb"/>
    <circle cx="315" cy="230" r="8" fill="#dc2626"/>
    <circle cx="180" cy="95" r="6" fill="#0f172a"/>
    <circle cx="585" cy="230" r="6" fill="#0f172a"/>
    <path d="M350 230 A35 35 0 0 0 340 205" fill="none" stroke="#dc2626" stroke-width="4"/>
    <text x="165" y="86" font-size="22" font-weight="700">A</text>
    <text x="305" y="263" font-size="22" font-weight="700">B</text>
    <text x="595" y="237" font-size="22" font-weight="700">C</text>
    <rect x="74" y="286" width="612" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="380" y="314" text-anchor="middle" font-size="18" font-weight="700">The vertex is B, so B must be the middle letter.</text>
  </g>
</svg>
