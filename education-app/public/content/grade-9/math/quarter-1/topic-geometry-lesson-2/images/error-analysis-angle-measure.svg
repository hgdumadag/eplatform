<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="title desc">
  <title id="title">Error analysis for angle measure statements</title>
  <desc id="desc">A wrong angle statement and classification are corrected: a 120 degree angle is obtuse and should be written with m angle notation.</desc>
  <rect width="860" height="360" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="430" y="38" text-anchor="middle" font-size="24" font-weight="700">Two things to fix</text>
    <rect x="55" y="78" width="350" height="230" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="230" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">Incorrect</text>
    <line x1="205" y1="205" x2="310" y2="205" stroke="#991b1b" stroke-width="5"/>
    <line x1="205" y1="205" x2="160" y2="105" stroke="#991b1b" stroke-width="5"/>
    <path d="M235 205 A43 43 0 0 0 189 164" fill="none" stroke="#991b1b" stroke-width="3"/>
    <text x="230" y="248" text-anchor="middle" font-size="16">∠ABC = 120°</text>
    <text x="230" y="275" text-anchor="middle" font-size="16">"acute"</text>
    <rect x="455" y="78" width="350" height="230" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="630" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Correct</text>
    <line x1="605" y1="205" x2="710" y2="205" stroke="#166534" stroke-width="5"/>
    <line x1="605" y1="205" x2="560" y2="105" stroke="#166534" stroke-width="5"/>
    <path d="M635 205 A43 43 0 0 0 589 164" fill="none" stroke="#166534" stroke-width="3"/>
    <text x="630" y="248" text-anchor="middle" font-size="16">m∠ABC = 120°</text>
    <text x="630" y="275" text-anchor="middle" font-size="16">obtuse</text>
    <text x="430" y="335" text-anchor="middle" font-size="17" font-weight="700">Use m∠ for measure. A 120° angle is greater than 90°, so it is obtuse.</text>
  </g>
</svg>
