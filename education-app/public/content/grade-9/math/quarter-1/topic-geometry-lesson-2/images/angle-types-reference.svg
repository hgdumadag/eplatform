<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Angle type reference</title>
  <desc id="desc">Four panels compare acute, right, obtuse, and straight angles by measure.</desc>
  <rect width="900" height="340" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="450" y="36" text-anchor="middle" font-size="24" font-weight="700">Classify by Measure</text>
    <g transform="translate(45 78)">
      <rect width="180" height="190" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
      <line x1="45" y1="125" x2="135" y2="125" stroke="#047857" stroke-width="5"/>
      <line x1="45" y1="125" x2="116" y2="72" stroke="#047857" stroke-width="5"/>
      <path d="M72 125 A27 27 0 0 0 67 109" fill="none" stroke="#dc2626" stroke-width="3"/>
      <text x="90" y="158" text-anchor="middle" font-size="20" font-weight="700">Acute</text>
      <text x="90" y="181" text-anchor="middle" font-size="15">less than 90°</text>
    </g>
    <g transform="translate(260 78)">
      <rect width="180" height="190" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <line x1="55" y1="130" x2="135" y2="130" stroke="#0369a1" stroke-width="5"/>
      <line x1="55" y1="130" x2="55" y2="50" stroke="#0369a1" stroke-width="5"/>
      <path d="M55 104 L82 104 L82 130" fill="none" stroke="#dc2626" stroke-width="3"/>
      <text x="90" y="158" text-anchor="middle" font-size="20" font-weight="700">Right</text>
      <text x="90" y="181" text-anchor="middle" font-size="15">exactly 90°</text>
    </g>
    <g transform="translate(475 78)">
      <rect width="180" height="190" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <line x1="55" y1="130" x2="140" y2="130" stroke="#b45309" stroke-width="5"/>
      <line x1="55" y1="130" x2="25" y2="58" stroke="#b45309" stroke-width="5"/>
      <path d="M82 130 A38 38 0 0 0 49 94" fill="none" stroke="#dc2626" stroke-width="3"/>
      <text x="90" y="158" text-anchor="middle" font-size="20" font-weight="700">Obtuse</text>
      <text x="90" y="181" text-anchor="middle" font-size="15">between 90° and 180°</text>
    </g>
    <g transform="translate(690 78)">
      <rect width="180" height="190" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
      <line x1="35" y1="115" x2="145" y2="115" stroke="#b91c1c" stroke-width="5"/>
      <circle cx="90" cy="115" r="6" fill="#b91c1c"/>
      <path d="M35 115 A55 55 0 0 1 145 115" fill="none" stroke="#dc2626" stroke-width="3"/>
      <text x="90" y="158" text-anchor="middle" font-size="20" font-weight="700">Straight</text>
      <text x="90" y="181" text-anchor="middle" font-size="15">exactly 180°</text>
    </g>
  </g>
</svg>
