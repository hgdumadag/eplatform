<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">Four-step geometric map construction plan</title>
  <desc id="desc">A sequence showing two parallel roads, then a transversal, then a perpendicular road, then labels and angle measures.</desc>
  <rect width="760" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" font-size="16" fill="#0f172a">
    <text x="54" y="42" font-weight="700">1. Parallel roads</text>
    <text x="236" y="42" font-weight="700">2. Add transversal</text>
    <text x="438" y="42" font-weight="700">3. Add perpendicular</text>
    <text x="623" y="42" font-weight="700">4. Label and solve</text>
  </g>
  <g stroke="#334155" stroke-width="8" stroke-linecap="round">
    <path d="M45 100H165M45 165H165"/>
    <path d="M225 100H345M225 165H345"/>
    <path d="M245 200L325 65"/>
    <path d="M425 100H545M425 165H545"/>
    <path d="M445 200L525 65"/>
    <path d="M490 100V220"/>
    <path d="M610 100H730M610 165H730"/>
    <path d="M630 200L710 65"/>
    <path d="M675 100V220"/>
  </g>
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)">
    <path d="M180 132H210"/>
    <path d="M360 132H405"/>
    <path d="M560 132H600"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#be123c" font-weight="700">
    <text x="628" y="94">1</text>
    <text x="653" y="124">2</text>
    <text x="692" y="158">5</text>
    <text x="681" y="96">90</text>
  </g>
</svg>
