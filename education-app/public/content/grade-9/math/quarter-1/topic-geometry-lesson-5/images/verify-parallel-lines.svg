<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Verifying parallel lines</title>
  <desc id="desc">Two parallel lines are checked by equal corresponding angles and equal perpendicular distances.</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="450" y="42" text-anchor="middle" font-size="25" font-weight="700">Two good checks</text>
    <line x1="90" y1="150" x2="810" y2="150" stroke="#16a34a" stroke-width="5"/>
    <line x1="90" y1="305" x2="810" y2="305" stroke="#2563eb" stroke-width="5"/>
    <text x="825" y="157" font-size="20" font-weight="700">m</text>
    <text x="825" y="312" font-size="20" font-weight="700">l</text>
    <line x1="255" y1="350" x2="500" y2="90" stroke="#475569" stroke-width="4"/>
    <path d="M343 305 A45 45 0 0 0 361 270" fill="none" stroke="#dc2626" stroke-width="4"/>
    <path d="M489 150 A45 45 0 0 0 507 115" fill="none" stroke="#dc2626" stroke-width="4"/>
    <text x="370" y="284" font-size="17" fill="#dc2626">70 degrees</text>
    <text x="535" y="129" font-size="17" fill="#dc2626">70 degrees</text>
    <line x1="650" y1="150" x2="650" y2="305" stroke="#f59e0b" stroke-width="4"/>
    <line x1="700" y1="150" x2="700" y2="305" stroke="#f59e0b" stroke-width="4"/>
    <path d="M650 150 L670 150 L670 170" fill="none" stroke="#92400e" stroke-width="3"/>
    <path d="M700 150 L720 150 L720 170" fill="none" stroke="#92400e" stroke-width="3"/>
    <text x="660" y="232" font-size="17" fill="#92400e">3 cm</text>
    <text x="710" y="232" font-size="17" fill="#92400e">3 cm</text>
    <text x="255" y="380" text-anchor="middle" font-size="17">equal corresponding angles</text>
    <text x="675" y="380" text-anchor="middle" font-size="17">equal perpendicular distances</text>
  </g>
</svg>
