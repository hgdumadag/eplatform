<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Real-world parallel line examples</title>
  <desc id="desc">A notebook, road map, and window frame show pairs of lines that stay the same distance apart.</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="700">Where do you see parallel lines?</text>
    <g transform="translate(65 95)">
      <rect x="0" y="0" width="220" height="235" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
      <line x1="35" y1="25" x2="35" y2="215" stroke="#ef4444" stroke-width="3"/>
      <g stroke="#2563eb" stroke-width="3">
        <line x1="55" y1="45" x2="195" y2="45"/>
        <line x1="55" y1="80" x2="195" y2="80"/>
        <line x1="55" y1="115" x2="195" y2="115"/>
        <line x1="55" y1="150" x2="195" y2="150"/>
        <line x1="55" y1="185" x2="195" y2="185"/>
      </g>
      <text x="110" y="265" text-anchor="middle" font-size="18">notebook lines</text>
    </g>
    <g transform="translate(340 95)">
      <rect x="0" y="0" width="220" height="235" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
      <path d="M50 220 L95 15" stroke="#475569" stroke-width="20" stroke-linecap="round"/>
      <path d="M120 220 L165 15" stroke="#475569" stroke-width="20" stroke-linecap="round"/>
      <path d="M50 220 L95 15" stroke="#f8fafc" stroke-width="3" stroke-dasharray="12 12"/>
      <path d="M120 220 L165 15" stroke="#f8fafc" stroke-width="3" stroke-dasharray="12 12"/>
      <text x="110" y="265" text-anchor="middle" font-size="18">parallel roads</text>
    </g>
    <g transform="translate(615 95)">
      <rect x="0" y="0" width="220" height="235" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="4"/>
      <g stroke="#22c55e" stroke-width="8">
        <line x1="35" y1="25" x2="35" y2="210"/>
        <line x1="110" y1="25" x2="110" y2="210"/>
        <line x1="185" y1="25" x2="185" y2="210"/>
      </g>
      <g stroke="#94a3b8" stroke-width="5">
        <line x1="15" y1="70" x2="205" y2="70"/>
        <line x1="15" y1="155" x2="205" y2="155"/>
      </g>
      <text x="110" y="265" text-anchor="middle" font-size="18">window frame</text>
    </g>
  </g>
</svg>
