<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Error analysis for parallel construction</title>
  <desc id="desc">A correct line through P is horizontal and parallel, while an incorrect line through P is tilted because the tool was rotated.</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="450" y="42" text-anchor="middle" font-size="25" font-weight="700">Error: the tool rotated</text>
    <line x1="100" y1="310" x2="800" y2="310" stroke="#2563eb" stroke-width="5"/>
    <text x="815" y="317" font-size="20" font-weight="700">l</text>
    <circle cx="500" cy="150" r="7" fill="#dc2626"/>
    <text x="515" y="155" font-size="20" font-weight="700">P</text>
    <line x1="100" y1="150" x2="800" y2="150" stroke="#16a34a" stroke-width="5" stroke-dasharray="12 8"/>
    <text x="110" y="135" font-size="17" fill="#15803d">correct direction</text>
    <line x1="120" y1="205" x2="790" y2="95" stroke="#dc2626" stroke-width="5"/>
    <text x="640" y="94" font-size="17" fill="#dc2626">rotated line</text>
    <polygon points="420,170 585,143 395,35" fill="#fee2e2" stroke="#dc2626" stroke-width="4" opacity="0.85"/>
    <text x="450" y="232" text-anchor="middle" font-size="18">Passing through P is not enough.</text>
    <text x="450" y="262" text-anchor="middle" font-size="18">The new line must keep the same direction as l.</text>
    <text x="450" y="374" text-anchor="middle" font-size="18">Fix: slide the set square without rotating, then draw through P.</text>
  </g>
</svg>
