<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">Real-world angle pairs</title>
  <desc id="desc">A road intersection, open scissors, and crossed sticks showing angle pairs in everyday objects.</desc>
  <rect width="760" height="320" fill="#f8fafc"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Where do angle pairs appear?</text>
  <g transform="translate(55 85)">
    <rect x="10" y="78" width="190" height="34" rx="4" fill="#dbeafe"/>
    <rect x="88" y="0" width="34" height="190" rx="4" fill="#bfdbfe"/>
    <line x1="10" y1="95" x2="200" y2="95" stroke="#1e40af" stroke-width="4"/>
    <line x1="105" y1="0" x2="105" y2="190" stroke="#1e40af" stroke-width="4"/>
    <path d="M105 95 L150 95 A45 45 0 0 1 105 140 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="48" y="225" font-family="Arial, sans-serif" font-size="17" fill="#334155">road intersection</text>
  </g>
  <g transform="translate(305 92)">
    <circle cx="80" cy="90" r="10" fill="#475569"/>
    <line x1="80" y1="90" x2="25" y2="25" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <line x1="80" y1="90" x2="160" y2="45" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="35" cy="30" rx="23" ry="15" fill="none" stroke="#64748b" stroke-width="5"/>
    <ellipse cx="168" cy="42" rx="23" ry="15" fill="none" stroke="#64748b" stroke-width="5"/>
    <path d="M80 90 L55 61 A37 37 0 0 1 113 71 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="30" y="218" font-family="Arial, sans-serif" font-size="17" fill="#334155">open scissors</text>
  </g>
  <g transform="translate(555 85)">
    <line x1="15" y1="25" x2="160" y2="170" stroke="#92400e" stroke-width="12" stroke-linecap="round"/>
    <line x1="160" y1="25" x2="15" y2="170" stroke="#b45309" stroke-width="12" stroke-linecap="round"/>
    <circle cx="87.5" cy="97.5" r="7" fill="#78350f"/>
    <path d="M87.5 97.5 L122 63 A49 49 0 0 1 122 132 Z" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="43" y="225" font-family="Arial, sans-serif" font-size="17" fill="#334155">crossed sticks</text>
  </g>
</svg>
