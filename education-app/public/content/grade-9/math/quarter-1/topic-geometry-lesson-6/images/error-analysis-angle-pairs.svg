<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Error analysis for angle pairs</title>
  <desc id="desc">A linear pair is incorrectly solved by setting the two expressions equal instead of adding them to 180 degrees.</desc>
  <rect width="760" height="390" fill="#fff7ed"/>
  <text x="38" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#9a3412">Error Analysis: Equal or Add?</text>
  <g transform="translate(72 78)">
    <line x1="50" y1="170" x2="420" y2="170" stroke="#1e293b" stroke-width="5"/>
    <line x1="235" y1="170" x2="318" y2="70" stroke="#1e293b" stroke-width="5"/>
    <circle cx="235" cy="170" r="6" fill="#0f172a"/>
    <path d="M235 170 L158 170 A77 77 0 0 1 284 111 Z" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <path d="M235 170 L284 111 A77 77 0 0 1 312 170 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <text x="154" y="132" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#c2410c">(x + 25)°</text>
    <text x="314" y="143" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">80°</text>
  </g>
  <g transform="translate(505 100)">
    <rect x="0" y="0" width="200" height="155" rx="10" fill="#ffffff" stroke="#fed7aa"/>
    <text x="18" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">Incorrect:</text>
    <text x="18" y="70" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">x + 25 = 80</text>
    <text x="18" y="104" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">Correct:</text>
    <text x="18" y="136" font-family="Arial, sans-serif" font-size="18" fill="#166534">x + 25 + 80 = 180</text>
  </g>
  <text x="86" y="338" font-family="Arial, sans-serif" font-size="20" fill="#334155">A linear pair uses a sum relationship, not an equality relationship.</text>
</svg>
