<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="title desc">
  <title id="title">Angle pair reference chart</title>
  <desc id="desc">Four panels showing adjacent angles, vertical angles, a linear pair, and supplementary angles.</desc>
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Angle Pair Reference</text>
  <g transform="translate(35 70)">
    <rect width="180" height="285" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="18" y="34" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">Adjacent</text>
    <line x1="90" y1="140" x2="35" y2="75" stroke="#1e293b" stroke-width="4"/>
    <line x1="90" y1="140" x2="150" y2="140" stroke="#1e293b" stroke-width="4"/>
    <line x1="90" y1="140" x2="45" y2="205" stroke="#1e293b" stroke-width="4"/>
    <path d="M90 140 L66 112 A38 38 0 0 1 128 140 Z" fill="#bfdbfe" opacity="0.9"/>
    <path d="M90 140 L128 140 A38 38 0 0 1 68 171 Z" fill="#bbf7d0" opacity="0.9"/>
    <text x="30" y="245" font-family="Arial, sans-serif" font-size="14" fill="#334155">share vertex and side</text>
  </g>
  <g transform="translate(245 70)">
    <rect width="180" height="285" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="18" y="34" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#15803d">Vertical</text>
    <line x1="35" y1="205" x2="150" y2="75" stroke="#1e293b" stroke-width="4"/>
    <line x1="35" y1="75" x2="150" y2="205" stroke="#1e293b" stroke-width="4"/>
    <text x="83" y="95" font-family="Arial, sans-serif" font-size="20" fill="#15803d">1</text>
    <text x="83" y="200" font-family="Arial, sans-serif" font-size="20" fill="#15803d">3</text>
    <text x="127" y="146" font-family="Arial, sans-serif" font-size="20" fill="#2563eb">2</text>
    <text x="42" y="146" font-family="Arial, sans-serif" font-size="20" fill="#2563eb">4</text>
    <text x="33" y="245" font-family="Arial, sans-serif" font-size="14" fill="#334155">opposite and equal</text>
  </g>
  <g transform="translate(455 70)">
    <rect width="180" height="285" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="18" y="34" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#c2410c">Linear Pair</text>
    <line x1="25" y1="150" x2="155" y2="150" stroke="#1e293b" stroke-width="4"/>
    <line x1="90" y1="150" x2="120" y2="78" stroke="#1e293b" stroke-width="4"/>
    <path d="M90 150 L55 150 A35 35 0 0 1 104 118 Z" fill="#fed7aa"/>
    <path d="M90 150 L104 118 A35 35 0 0 1 125 150 Z" fill="#fde68a"/>
    <text x="38" y="245" font-family="Arial, sans-serif" font-size="14" fill="#334155">adjacent, sum 180</text>
  </g>
  <g transform="translate(665 70)">
    <rect width="160" height="285" rx="10" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="18" y="34" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#be185d">Supplementary</text>
    <circle cx="58" cy="125" r="32" fill="#fbcfe8"/>
    <path d="M58 125 L88 125 A30 30 0 0 0 43 99 Z" fill="#f472b6"/>
    <text x="40" y="175" font-family="Arial, sans-serif" font-size="18" fill="#831843">65°</text>
    <circle cx="112" cy="125" r="32" fill="#ddd6fe"/>
    <path d="M112 125 L142 125 A30 30 0 1 1 84 140 Z" fill="#a78bfa"/>
    <text x="90" y="175" font-family="Arial, sans-serif" font-size="18" fill="#4c1d95">115°</text>
    <text x="23" y="245" font-family="Arial, sans-serif" font-size="14" fill="#334155">measures add to 180</text>
  </g>
</svg>
