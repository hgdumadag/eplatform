<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-labelledby="title desc">
  <title id="title">Linear pair</title>
  <desc id="desc">Two adjacent angles share a ray and their outside sides form a straight line, so their measures add to 180 degrees.</desc>
  <rect width="680" height="340" fill="#ffffff"/>
  <text x="40" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Linear Pair: Adjacent + Straight Line</text>
  <line x1="90" y1="190" x2="590" y2="190" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="340" y1="190" x2="440" y2="72" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="340" cy="190" r="6" fill="#0f172a"/>
  <path d="M340 190 L265 190 A75 75 0 0 1 388 132 Z" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <path d="M340 190 L388 132 A75 75 0 0 1 415 190 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="252" y="164" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c2410c">Angle A</text>
  <text x="410" y="156" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Angle B</text>
  <text x="225" y="278" font-family="Arial, sans-serif" font-size="22" fill="#334155">m∠A + m∠B = 180°</text>
</svg>
