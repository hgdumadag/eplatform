<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Angle naming with the vertex in the middle</title>
  <desc id="desc">Angle ABC is shown with B as the vertex and rays BA and BC forming the angle.</desc>
  <rect width="760" height="360" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="380" y="42" text-anchor="middle" font-size="24" font-weight="700">Naming an Angle</text>
    <line x1="300" y1="240" x2="185" y2="105" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <line x1="300" y1="240" x2="565" y2="240" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <polygon points="185,105 202,112 192,124" fill="#2563eb"/>
    <polygon points="565,240 547,230 547,250" fill="#2563eb"/>
    <path d="M342 240 A42 42 0 0 0 327 208" fill="none" stroke="#dc2626" stroke-width="4"/>
    <circle cx="300" cy="240" r="8" fill="#dc2626"/>
    <circle cx="185" cy="105" r="7" fill="#0f172a"/>
    <circle cx="565" cy="240" r="7" fill="#0f172a"/>
    <text x="170" y="95" font-size="22" font-weight="700">A</text>
    <text x="292" y="274" font-size="22" font-weight="700">B</text>
    <text x="575" y="248" font-size="22" font-weight="700">C</text>
    <rect x="60" y="285" width="640" height="48" rx="8" fill="#fee2e2" stroke="#ef4444"/>
    <text x="380" y="315" text-anchor="middle" font-size="18" font-weight="700">In angle ABC, B is the vertex because B is the middle letter.</text>
  </g>
</svg>
