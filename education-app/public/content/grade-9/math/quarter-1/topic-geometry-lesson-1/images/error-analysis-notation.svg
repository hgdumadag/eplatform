<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="title desc">
  <title id="title">Error analysis for ray and angle notation</title>
  <desc id="desc">A wrong ray direction and wrong angle vertex are contrasted with corrected notation rules.</desc>
  <rect width="860" height="360" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="430" y="40" text-anchor="middle" font-size="24" font-weight="700">Error Analysis: Notation Matters</text>
    <rect x="55" y="80" width="350" height="220" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="230" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">Incorrect Thinking</text>
    <line x1="135" y1="170" x2="315" y2="170" stroke="#991b1b" stroke-width="5"/>
    <polygon points="135,170 151,160 151,180" fill="#991b1b"/>
    <circle cx="315" cy="170" r="7" fill="#991b1b"/>
    <text x="128" y="200" font-size="16">A</text>
    <text x="307" y="200" font-size="16">B</text>
    <text x="230" y="235" text-anchor="middle" font-size="15">Claims this is ray AB</text>
    <text x="230" y="264" text-anchor="middle" font-size="15">Claims A is vertex of angle ABC</text>
    <rect x="455" y="80" width="350" height="220" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="630" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Correct Reasoning</text>
    <line x1="535" y1="170" x2="715" y2="170" stroke="#166534" stroke-width="5"/>
    <circle cx="535" cy="170" r="7" fill="#166534"/>
    <polygon points="715,170 699,160 699,180" fill="#166534"/>
    <text x="528" y="200" font-size="16">A</text>
    <text x="707" y="200" font-size="16">B</text>
    <text x="630" y="235" text-anchor="middle" font-size="15">ray AB starts at A and passes through B</text>
    <text x="630" y="264" text-anchor="middle" font-size="15">In angle ABC, B is the vertex</text>
    <text x="430" y="330" text-anchor="middle" font-size="17" font-weight="700">For rays, the first letter is the endpoint. For angles, the middle letter is the vertex.</text>
  </g>
</svg>
