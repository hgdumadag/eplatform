<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Worked diagram with geometric objects</title>
  <desc id="desc">A diagram shows examples of a point, line, segment, ray, and angle with labels.</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700">Worked Diagram</text>
    <g transform="translate(60 80)">
      <circle cx="35" cy="50" r="7" fill="#dc2626"/>
      <text x="52" y="56" font-size="18" font-weight="700">A</text>
      <text x="0" y="110" font-size="16">point A</text>
    </g>
    <g transform="translate(230 80)">
      <line x1="0" y1="50" x2="210" y2="50" stroke="#2563eb" stroke-width="5"/>
      <polygon points="0,50 16,40 16,60" fill="#2563eb"/>
      <polygon points="210,50 194,40 194,60" fill="#2563eb"/>
      <circle cx="60" cy="50" r="6" fill="#0f172a"/>
      <circle cx="150" cy="50" r="6" fill="#0f172a"/>
      <text x="55" y="78" font-size="16">A</text>
      <text x="145" y="78" font-size="16">B</text>
      <text x="45" y="110" font-size="16">line AB</text>
    </g>
    <g transform="translate(550 80)">
      <line x1="25" y1="50" x2="175" y2="50" stroke="#059669" stroke-width="5"/>
      <circle cx="25" cy="50" r="7" fill="#059669"/>
      <circle cx="175" cy="50" r="7" fill="#059669"/>
      <text x="20" y="78" font-size="16">C</text>
      <text x="170" y="78" font-size="16">D</text>
      <text x="45" y="110" font-size="16">segment CD</text>
    </g>
    <g transform="translate(160 245)">
      <line x1="35" y1="40" x2="245" y2="40" stroke="#7c3aed" stroke-width="5"/>
      <circle cx="35" cy="40" r="7" fill="#7c3aed"/>
      <circle cx="120" cy="40" r="6" fill="#0f172a"/>
      <polygon points="245,40 229,30 229,50" fill="#7c3aed"/>
      <text x="30" y="70" font-size="16">E</text>
      <text x="115" y="70" font-size="16">F</text>
      <text x="75" y="103" font-size="16">ray EF</text>
    </g>
    <g transform="translate(560 225)">
      <line x1="80" y1="85" x2="35" y2="20" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
      <line x1="80" y1="85" x2="190" y2="85" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
      <path d="M108 85 A28 28 0 0 0 96 62" fill="none" stroke="#dc2626" stroke-width="3"/>
      <circle cx="80" cy="85" r="7" fill="#dc2626"/>
      <text x="24" y="18" font-size="16">X</text>
      <text x="72" y="116" font-size="16">Y</text>
      <text x="198" y="91" font-size="16">Z</text>
      <text x="70" y="145" font-size="16">angle XYZ</text>
    </g>
  </g>
</svg>
