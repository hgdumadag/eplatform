<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="title desc">
  <title id="title">Line, segment, and ray comparison</title>
  <desc id="desc">A line has arrows on both ends, a segment has two endpoints, and a ray has one endpoint and one arrow.</desc>
  <rect width="860" height="360" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="430" y="42" text-anchor="middle" font-size="24" font-weight="700">Compare the Symbols</text>
    <g transform="translate(80 80)">
      <text x="0" y="0" font-size="20" font-weight="700">Line AB</text>
      <line x1="80" y1="50" x2="620" y2="50" stroke="#2563eb" stroke-width="5"/>
      <polygon points="80,50 96,40 96,60" fill="#2563eb"/>
      <polygon points="620,50 604,40 604,60" fill="#2563eb"/>
      <circle cx="260" cy="50" r="6" fill="#0f172a"/>
      <circle cx="440" cy="50" r="6" fill="#0f172a"/>
      <text x="260" y="78" text-anchor="middle" font-size="16">A</text>
      <text x="440" y="78" text-anchor="middle" font-size="16">B</text>
      <text x="650" y="56" font-size="16">extends both ways</text>
    </g>
    <g transform="translate(80 170)">
      <text x="0" y="0" font-size="20" font-weight="700">Segment AB</text>
      <line x1="260" y1="50" x2="440" y2="50" stroke="#059669" stroke-width="5"/>
      <circle cx="260" cy="50" r="7" fill="#059669"/>
      <circle cx="440" cy="50" r="7" fill="#059669"/>
      <text x="260" y="78" text-anchor="middle" font-size="16">A</text>
      <text x="440" y="78" text-anchor="middle" font-size="16">B</text>
      <text x="650" y="56" font-size="16">two endpoints</text>
    </g>
    <g transform="translate(80 260)">
      <text x="0" y="0" font-size="20" font-weight="700">Ray AB</text>
      <line x1="260" y1="50" x2="620" y2="50" stroke="#dc2626" stroke-width="5"/>
      <circle cx="260" cy="50" r="7" fill="#dc2626"/>
      <polygon points="620,50 604,40 604,60" fill="#dc2626"/>
      <circle cx="440" cy="50" r="6" fill="#0f172a"/>
      <text x="260" y="78" text-anchor="middle" font-size="16">A endpoint</text>
      <text x="440" y="78" text-anchor="middle" font-size="16">B</text>
      <text x="650" y="56" font-size="16">starts at A</text>
    </g>
  </g>
</svg>
