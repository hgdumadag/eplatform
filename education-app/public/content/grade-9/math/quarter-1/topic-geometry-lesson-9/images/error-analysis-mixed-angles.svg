<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Error analysis for mixed angle relationships</title>
  <desc id="desc">Parallel lines cut by a transversal show one 65 degree angle, x as a corresponding angle, and y as a linear pair angle. A warning note says not all angles are equal.</desc>
  <rect width="760" height="420" fill="#fff"/>
  <path d="M100 125H650M100 275H650" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  <path d="M250 340L520 70" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#475569" stroke-width="2">
    <path d="M130 96h45M130 110h45M130 246h45M130 260h45"/>
  </g>
  <g fill="#fef3c7" stroke="#92400e" stroke-width="2">
    <path d="M462 125 A48 48 0 0 1 496 91 L496 125 Z"/>
    <path d="M312 275 A48 48 0 0 1 347 241 L347 275 Z"/>
    <path d="M347 275 A56 56 0 0 1 306 313 L347 275 Z"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <text x="476" y="112" fill="#92400e">65°</text>
    <text x="326" y="262" fill="#92400e">x</text>
    <text x="320" y="312" fill="#92400e">y</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="92" y="30" width="575" height="48" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="112" y="61" font-size="18" font-weight="700" fill="#991b1b">Error: "All angles are 65°"</text>
    <rect x="105" y="345" width="550" height="45" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="125" y="374" font-size="17" fill="#155e75">Correct: x = 65° by corresponding angles, but y = 115° by linear pair.</text>
  </g>
</svg>
