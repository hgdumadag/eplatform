<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Worked example for corresponding angle and linear pair</title>
  <desc id="desc">Two parallel lines p and q are cut by a transversal. Angle 1 is 58 degrees, angle 5 corresponds to it, and angle 6 forms a linear pair with angle 5.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <line x1="80" y1="115" x2="640" y2="115" stroke="#111827" stroke-width="4"/>
  <line x1="80" y1="245" x2="640" y2="245" stroke="#111827" stroke-width="4"/>
  <line x1="255" y1="45" x2="470" y2="320" stroke="#b91c1c" stroke-width="4"/>
  <text x="650" y="110" font-family="Arial" font-size="18" fill="#111827">p</text>
  <text x="650" y="240" font-family="Arial" font-size="18" fill="#111827">q</text>
  <path d="M287 115 A36 36 0 0 1 310 82" fill="none" stroke="#2563eb" stroke-width="5"/>
  <text x="270" y="84" font-family="Arial" font-size="18" fill="#2563eb">1</text>
  <text x="305" y="70" font-family="Arial" font-size="16" fill="#2563eb">58°</text>
  <path d="M388 245 A38 38 0 0 1 411 212" fill="none" stroke="#2563eb" stroke-width="5"/>
  <text x="370" y="215" font-family="Arial" font-size="18" fill="#2563eb">5</text>
  <text x="414" y="215" font-family="Arial" font-size="16" fill="#2563eb">58°</text>
  <path d="M411 212 A45 45 0 0 1 452 245" fill="none" stroke="#ea580c" stroke-width="5"/>
  <text x="452" y="219" font-family="Arial" font-size="18" fill="#ea580c">6</text>
  <text x="478" y="236" font-family="Arial" font-size="16" fill="#ea580c">122°</text>
  <text x="92" y="310" font-family="Arial" font-size="18" fill="#0f172a">1 corresponds to 5, then 5 and 6 form a linear pair.</text>
</svg>
