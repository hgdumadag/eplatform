<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Error analysis for same-side interior angles</title>
  <desc id="desc">Angles 3 and 5 are highlighted between two lines on the same side of the transversal. A note shows the incorrect label alternate interior crossed out.</desc>
  <rect width="900" height="430" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="450" y="42" text-anchor="middle" font-size="25" font-weight="700">Error Analysis: Check the Side of the Transversal</text>
    <rect x="150" y="135" width="580" height="150" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="10 8"/>
    <line x1="150" y1="135" x2="730" y2="135" stroke="#2563eb" stroke-width="5"/>
    <line x1="150" y1="285" x2="730" y2="285" stroke="#2563eb" stroke-width="5"/>
    <line x1="350" y1="370" x2="590" y2="70" stroke="#f97316" stroke-width="6"/>
    <circle cx="459" cy="135" r="7" fill="#111827"/>
    <circle cx="339" cy="285" r="7" fill="#111827"/>
    <path d="M459 135 L421 135 A48 48 0 0 0 430 174 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <path d="M339 285 L301 285 A48 48 0 0 1 330 246 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <text x="405" y="180" font-size="25" font-weight="700">3</text>
    <text x="275" y="268" font-size="25" font-weight="700">5</text>
    <text x="560" y="180" font-size="20" fill="#991b1b" font-weight="700">Not alternate interior</text>
    <line x1="555" y1="174" x2="750" y2="160" stroke="#dc2626" stroke-width="4"/>
    <text x="560" y="225" font-size="20" fill="#166534" font-weight="700">Correct: same-side interior</text>
    <text x="560" y="255" font-size="17">Both are interior and both sit left of the transversal.</text>
  </g>
</svg>
