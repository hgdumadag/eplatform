<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Alternate interior angles</title>
  <desc id="desc">A transversal crosses two lines. Angles 3 and 6 are highlighted between the lines on opposite sides of the transversal.</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="450" y="40" text-anchor="middle" font-size="25" font-weight="700">Alternate Interior Angles</text>
    <rect x="145" y="135" width="610" height="150" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="10 8"/>
    <line x1="150" y1="135" x2="750" y2="135" stroke="#2563eb" stroke-width="5"/>
    <line x1="150" y1="285" x2="750" y2="285" stroke="#2563eb" stroke-width="5"/>
    <line x1="330" y1="370" x2="570" y2="70" stroke="#f97316" stroke-width="6"/>
    <path d="M461 135 L423 135 A48 48 0 0 0 432 174 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <path d="M341 285 L379 285 A48 48 0 0 0 370 246 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="404" y="180" font-size="24" font-weight="700">3</text>
    <text x="384" y="266" font-size="24" font-weight="700">6</text>
    <text x="555" y="206" font-size="19">Between the lines</text>
    <text x="555" y="236" font-size="19">Opposite sides of the transversal</text>
  </g>
</svg>
