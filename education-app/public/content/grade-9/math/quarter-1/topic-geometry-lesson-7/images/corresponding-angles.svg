<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Corresponding angle positions</title>
  <desc id="desc">A transversal crosses two lines. Angles 1 and 5 are highlighted in matching upper-left positions.</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="450" y="40" text-anchor="middle" font-size="25" font-weight="700">Corresponding Angles: Matching Positions</text>
    <line x1="150" y1="135" x2="750" y2="135" stroke="#2563eb" stroke-width="5"/>
    <line x1="150" y1="285" x2="750" y2="285" stroke="#2563eb" stroke-width="5"/>
    <line x1="330" y1="370" x2="570" y2="70" stroke="#f97316" stroke-width="6"/>
    <path d="M461 135 L423 135 A48 48 0 0 1 452 96 Z" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <path d="M341 285 L303 285 A48 48 0 0 1 332 246 Z" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <text x="397" y="116" font-size="24" font-weight="700">1</text>
    <text x="277" y="266" font-size="24" font-weight="700">5</text>
    <text x="570" y="200" font-size="19">Same relative corner at each intersection</text>
    <text x="570" y="230" font-size="19" font-weight="700" fill="#92400e">Example: angle 1 and angle 5</text>
  </g>
</svg>
