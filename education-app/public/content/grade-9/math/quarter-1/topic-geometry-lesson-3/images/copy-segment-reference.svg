<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Copy a segment reference length</title>
  <desc id="desc">Original segment AB is measured, then the same length is transferred to segment CD on a new ray.</desc>
  <rect width="720" height="300" fill="#f8fafc"/>
  <text x="180" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Original segment</text>
  <line x1="80" y1="95" x2="280" y2="95" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="80" cy="95" r="6" fill="#2563eb"/>
  <circle cx="280" cy="95" r="6" fill="#2563eb"/>
  <text x="80" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">A</text>
  <text x="280" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">B</text>
  <line x1="80" y1="125" x2="280" y2="125" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="180" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#166534">measure AB</text>
  <text x="540" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Copied length</text>
  <line x1="430" y1="200" x2="650" y2="200" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="430" y1="200" x2="630" y2="200" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="430" cy="200" r="6" fill="#dc2626"/>
  <circle cx="630" cy="200" r="6" fill="#dc2626"/>
  <text x="430" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7f1d1d">C</text>
  <text x="630" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7f1d1d">D</text>
  <path d="M300 100 C370 95 390 175 425 195" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="360" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#166534">transfer length</text>
  <text x="530" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">CD = AB</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
