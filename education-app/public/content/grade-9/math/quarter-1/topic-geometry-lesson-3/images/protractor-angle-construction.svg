<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Construct an angle with a protractor</title>
  <desc id="desc">A protractor centered on vertex Q with a base ray and a mark at fifty degrees used to draw the second ray.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <path d="M160 260 A200 200 0 0 1 560 260" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <line x1="160" y1="260" x2="560" y2="260" stroke="#0369a1" stroke-width="3"/>
  <circle cx="360" cy="260" r="7" fill="#dc2626"/>
  <text x="360" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7f1d1d">Q</text>
  <line x1="360" y1="260" x2="535" y2="260" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <text x="540" y="250" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">P</text>
  <line x1="360" y1="260" x2="489" y2="106" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="489" cy="106" r="6" fill="#2563eb"/>
  <text x="505" y="103" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">R</text>
  <path d="M410 260 A50 50 0 0 0 392 222" fill="none" stroke="#ea580c" stroke-width="4"/>
  <text x="430" y="225" font-family="Arial, sans-serif" font-size="20" fill="#9a3412">50 degrees</text>
  <g stroke="#0369a1" stroke-width="2">
    <line x1="535" y1="260" x2="555" y2="260"/>
    <line x1="489" y1="106" x2="502" y2="91"/>
    <line x1="260" y1="87" x2="247" y2="69"/>
    <line x1="185" y1="191" x2="166" y2="181"/>
  </g>
  <text x="550" y="280" font-family="Arial, sans-serif" font-size="16" fill="#0369a1">0</text>
  <text x="505" y="85" font-family="Arial, sans-serif" font-size="16" fill="#0369a1">50</text>
  <text x="220" y="62" font-family="Arial, sans-serif" font-size="16" fill="#0369a1">120</text>
  <text x="130" y="180" font-family="Arial, sans-serif" font-size="16" fill="#0369a1">160</text>
  <text x="360" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Center on vertex, align 0, mark the required angle.</text>
</svg>
