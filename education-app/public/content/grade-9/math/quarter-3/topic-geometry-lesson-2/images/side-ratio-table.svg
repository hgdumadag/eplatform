<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Side-ratio table</title>
  <desc id="desc">A table shows corresponding original and image sides with each ratio equal to a scale factor of three.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <text x="360" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">Corresponding Side Ratios</text>
  <rect x="90" y="75" width="540" height="220" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="90" y1="125" x2="630" y2="125" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="270" y1="75" x2="270" y2="295" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="450" y1="75" x2="450" y2="295" stroke="#cbd5e1" stroke-width="2"/>
  <text x="180" y="108" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">Original</text>
  <text x="360" y="108" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d" text-anchor="middle">Image</text>
  <text x="540" y="108" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Image/Original</text>
  <g font-family="Arial, sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">
    <text x="180" y="164">4</text><text x="360" y="164">12</text><text x="540" y="164">12/4 = 3</text>
    <text x="180" y="214">5</text><text x="360" y="214">15</text><text x="540" y="214">15/5 = 3</text>
    <text x="180" y="264">7</text><text x="360" y="264">21</text><text x="540" y="264">21/7 = 3</text>
  </g>
  <text x="360" y="330" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">All ratios match, so the scale factor is 3.</text>
</svg>
