<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Area intuition for scale factor</title>
  <desc id="desc">A one by one square scaled by a factor of three becomes a three by three square with nine unit squares.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">Area Scales by k Squared</text>
  <rect x="115" y="130" width="70" height="70" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
  <text x="150" y="118" font-family="Arial, sans-serif" font-size="18" fill="#075985" text-anchor="middle">1 unit</text>
  <text x="150" y="235" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#075985" text-anchor="middle">Area = 1</text>
  <path d="M230 165 H315" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="273" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">k = 3</text>
  <g transform="translate(380 85)">
    <rect x="0" y="0" width="210" height="210" fill="#fef9c3" stroke="#ca8a04" stroke-width="4"/>
    <path d="M70 0 V210 M140 0 V210 M0 70 H210 M0 140 H210" stroke="#ca8a04" stroke-width="2"/>
  </g>
  <text x="485" y="74" font-family="Arial, sans-serif" font-size="18" fill="#854d0e" text-anchor="middle">3 units</text>
  <text x="485" y="330" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#854d0e" text-anchor="middle">Area = 9</text>
  <rect x="90" y="285" width="250" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="215" y="312" font-family="Arial, sans-serif" font-size="18" fill="#0f172a" text-anchor="middle">3 x 3 = 9 unit squares</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
