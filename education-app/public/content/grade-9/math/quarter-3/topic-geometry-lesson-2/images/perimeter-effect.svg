<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Perimeter effect of scale factor</title>
  <desc id="desc">Two similar rectangles show that when every side is multiplied by three, the perimeter is also multiplied by three.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <text x="360" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">Perimeter Scales by k</text>
  <rect x="100" y="110" width="120" height="80" fill="#cffafe" stroke="#0891b2" stroke-width="4"/>
  <text x="160" y="98" font-family="Arial, sans-serif" font-size="18" fill="#164e63" text-anchor="middle">6 cm</text>
  <text x="78" y="156" font-family="Arial, sans-serif" font-size="18" fill="#164e63" text-anchor="middle">4 cm</text>
  <text x="160" y="232" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#164e63" text-anchor="middle">P = 20 cm</text>
  <path d="M255 150 H345" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="132" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">k = 3</text>
  <rect x="390" y="70" width="240" height="160" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="510" y="58" font-family="Arial, sans-serif" font-size="18" fill="#14532d" text-anchor="middle">18 cm</text>
  <text x="657" y="156" font-family="Arial, sans-serif" font-size="18" fill="#14532d" text-anchor="middle">12 cm</text>
  <text x="510" y="273" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#14532d" text-anchor="middle">P = 60 cm</text>
  <rect x="110" y="300" width="500" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="360" y="324" font-family="Arial, sans-serif" font-size="18" fill="#0f172a" text-anchor="middle">20 x 3 = 60, so the perimeter is multiplied by the scale factor.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
