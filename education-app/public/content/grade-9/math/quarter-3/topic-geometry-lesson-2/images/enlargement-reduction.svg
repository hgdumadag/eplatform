<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Enlargement and reduction</title>
  <desc id="desc">A shape scaled by a factor greater than one becomes larger, while a shape scaled by a factor between zero and one becomes smaller.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="180" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Enlargement: k = 2</text>
  <rect x="70" y="110" width="70" height="70" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
  <rect x="205" y="75" width="140" height="140" fill="#fecaca" stroke="#b91c1c" stroke-width="4"/>
  <path d="M152 145 H195" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="105" y="203" font-family="Arial, sans-serif" font-size="17" fill="#7f1d1d" text-anchor="middle">side 4</text>
  <text x="275" y="242" font-family="Arial, sans-serif" font-size="17" fill="#7f1d1d" text-anchor="middle">side 8</text>
  <text x="540" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Reduction: k = 1/2</text>
  <rect x="455" y="75" width="140" height="140" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <rect x="625" y="110" width="70" height="70" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="4"/>
  <path d="M602 145 H620" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="525" y="242" font-family="Arial, sans-serif" font-size="17" fill="#1e3a8a" text-anchor="middle">side 8</text>
  <text x="660" y="203" font-family="Arial, sans-serif" font-size="17" fill="#1e3a8a" text-anchor="middle">side 4</text>
  <rect x="67" y="280" width="586" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="360" y="307" font-family="Arial, sans-serif" font-size="18" fill="#0f172a" text-anchor="middle">k &gt; 1 means larger. 0 &lt; k &lt; 1 means smaller.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
