<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Floor plan grid for a quarter scale model</title>
  <desc id="desc">A grid shows a six centimeter by four centimeter model base with a two centimeter door and a three centimeter roof guide, helping learners place scaled measurements accurately.</desc>
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="36" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Quarter scale floor plan grid</text>
  <g transform="translate(80 80)">
    <rect x="0" y="0" width="480" height="320" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="80" y1="0" x2="80" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/><line x1="240" y1="0" x2="240" y2="320"/><line x1="320" y1="0" x2="320" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/>
      <line x1="0" y1="80" x2="480" y2="80"/><line x1="0" y1="160" x2="480" y2="160"/><line x1="0" y1="240" x2="480" y2="240"/>
    </g>
    <rect x="160" y="240" width="160" height="80" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/>
    <text x="190" y="290" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">door 2 cm</text>
    <line x1="0" y1="344" x2="480" y2="344" stroke="#334155" stroke-width="3"/>
    <text x="212" y="374" font-family="Arial, sans-serif" font-size="20" fill="#334155">6 cm</text>
    <line x1="510" y1="0" x2="510" y2="320" stroke="#334155" stroke-width="3"/>
    <text x="525" y="168" font-family="Arial, sans-serif" font-size="20" fill="#334155">4 cm</text>
  </g>
  <rect x="620" y="122" width="100" height="52" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="636" y="154" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0e7490">1 grid</text>
  <text x="614" y="198" font-family="Arial, sans-serif" font-size="16" fill="#334155">Each grid step</text>
  <text x="614" y="220" font-family="Arial, sans-serif" font-size="16" fill="#334155">can represent</text>
  <text x="614" y="242" font-family="Arial, sans-serif" font-size="16" fill="#334155">1 model cm.</text>
</svg>
