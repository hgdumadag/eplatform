<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Consistent proportion setup</title>
  <desc id="desc">A table shows corresponding height and shadow measurements, then writes height over shadow equals height over shadow.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <rect x="70" y="55" width="580" height="180" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="105" x2="650" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="55" x2="260" y2="235" stroke="#94a3b8" stroke-width="2"/>
  <line x1="455" y1="55" x2="455" y2="235" stroke="#94a3b8" stroke-width="2"/>
  <text x="116" y="87" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">Triangle</text>
  <text x="316" y="87" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">Height</text>
  <text x="508" y="87" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">Shadow</text>
  <text x="112" y="154" font-family="Arial, sans-serif" font-size="18" fill="#0f766e">reference</text>
  <text x="330" y="154" font-family="Arial, sans-serif" font-size="18" fill="#0f766e">1.8 m</text>
  <text x="528" y="154" font-family="Arial, sans-serif" font-size="18" fill="#0f766e">2.4 m</text>
  <text x="112" y="204" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12">unknown</text>
  <text x="344" y="204" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12">x</text>
  <text x="536" y="204" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12">16 m</text>
  <text x="175" y="302" font-family="Arial, sans-serif" font-size="28" fill="#1e293b">1.8 / 2.4 = x / 16</text>
  <text x="170" y="332" font-family="Arial, sans-serif" font-size="17" fill="#475569">height over shadow equals height over shadow</text>
</svg>
