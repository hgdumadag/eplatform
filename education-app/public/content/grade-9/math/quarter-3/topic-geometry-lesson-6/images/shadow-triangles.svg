<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Shadow triangles for indirect measurement</title>
  <desc id="desc">A student and a tree cast shadows at the same sun angle, forming two similar right triangles with corresponding heights and shadow lengths.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <line x1="60" y1="300" x2="670" y2="300" stroke="#334155" stroke-width="3"/>
  <line x1="145" y1="300" x2="145" y2="210" stroke="#0f766e" stroke-width="8"/>
  <line x1="145" y1="210" x2="265" y2="300" stroke="#f59e0b" stroke-width="4"/>
  <line x1="145" y1="300" x2="265" y2="300" stroke="#64748b" stroke-width="5"/>
  <line x1="470" y1="300" x2="470" y2="90" stroke="#15803d" stroke-width="14"/>
  <polygon points="450,115 470,55 490,115" fill="#16a34a"/>
  <line x1="470" y1="90" x2="650" y2="300" stroke="#f59e0b" stroke-width="4"/>
  <line x1="470" y1="300" x2="650" y2="300" stroke="#64748b" stroke-width="5"/>
  <path d="M78 64 L153 64" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <path d="M98 45 L153 64 L98 83" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="38" font-family="Arial, sans-serif" font-size="18" fill="#334155">same sun angle</text>
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="17" fill="#0f766e">1.5 m</text>
  <text x="180" y="324" font-family="Arial, sans-serif" font-size="17" fill="#334155">2 m shadow</text>
  <text x="500" y="118" font-family="Arial, sans-serif" font-size="18" fill="#15803d">x m</text>
  <text x="530" y="324" font-family="Arial, sans-serif" font-size="17" fill="#334155">10 m shadow</text>
  <text x="236" y="218" font-family="Arial, sans-serif" font-size="16" fill="#92400e">similar</text>
  <text x="574" y="178" font-family="Arial, sans-serif" font-size="16" fill="#92400e">similar</text>
</svg>
