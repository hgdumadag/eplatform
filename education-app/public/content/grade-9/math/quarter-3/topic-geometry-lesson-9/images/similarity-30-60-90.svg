<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Similarity plus 30-60-90 reasoning</title>
  <desc id="desc">Two similar 30-60-90 triangles compare hypotenuses 10 and 25, then use the special triangle ratio to label the large long leg as 12.5 square root 3.</desc>
  <rect width="760" height="360" fill="#fff7ed"/>
  <text x="32" y="42" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Similarity + 30-60-90</text>
  <g stroke="#7c2d12" stroke-width="4" fill="none" stroke-linejoin="round">
    <path d="M80 285 L210 285 L210 60 Z"/>
    <path d="M395 285 L655 285 L655 55 Z"/>
  </g>
  <g fill="#fed7aa" stroke="#ea580c" stroke-width="2">
    <rect x="196" y="271" width="14" height="14"/>
    <rect x="641" y="271" width="14" height="14"/>
  </g>
  <g font-family="Arial" fill="#0f172a" font-size="17">
    <text x="118" y="308">short leg 5</text>
    <text x="216" y="178">long leg 5sqrt(3)</text>
    <text x="112" y="170">hypotenuse 10</text>
    <text x="468" y="308">short leg 12.5</text>
    <text x="668" y="178">long leg 12.5sqrt(3)</text>
    <text x="470" y="158">hypotenuse 25</text>
    <text x="175" y="266">60 deg</text>
    <text x="620" y="266">60 deg</text>
  </g>
  <path d="M250 165 C305 125 340 125 380 165" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="266" y="118" font-family="Arial" font-size="18" font-weight="700" fill="#1d4ed8">25/10 = 2.5</text>
  <rect x="418" y="62" width="195" height="54" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="434" y="95" font-family="Arial" font-size="17" fill="#1e3a8a">long = short x sqrt(3)</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
