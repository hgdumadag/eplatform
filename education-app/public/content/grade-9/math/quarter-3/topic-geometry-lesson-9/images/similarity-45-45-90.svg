<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Similarity plus 45-45-90 reasoning</title>
  <desc id="desc">A small right triangle and a larger similar 45-45-90 triangle show a scale factor from leg 4 to leg 12, then the larger hypotenuse is labeled 12 square root 2.</desc>
  <rect width="760" height="360" fill="#f8fafc"/>
  <text x="32" y="42" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Similarity + 45-45-90</text>
  <g stroke="#334155" stroke-width="4" fill="none" stroke-linejoin="round">
    <path d="M70 270 L190 270 L190 150 Z"/>
    <path d="M370 270 L610 270 L610 30 Z"/>
  </g>
  <g fill="#e0f2fe" stroke="#0284c7" stroke-width="2">
    <rect x="176" y="256" width="14" height="14"/>
    <rect x="596" y="256" width="14" height="14"/>
  </g>
  <g font-family="Arial" fill="#0f172a" font-size="18">
    <text x="112" y="292">4</text>
    <text x="198" y="214">4</text>
    <text x="104" y="200">4sqrt(2)</text>
    <text x="472" y="292">12</text>
    <text x="622" y="154">12</text>
    <text x="470" y="142">12sqrt(2)</text>
    <text x="148" y="252">45 deg</text>
    <text x="548" y="252">45 deg</text>
  </g>
  <path d="M230 170 C275 145 300 145 340 170" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="248" y="132" font-family="Arial" font-size="18" font-weight="700" fill="#166534">scale factor x3</text>
  <rect x="426" y="40" width="155" height="48" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="442" y="70" font-family="Arial" font-size="18" fill="#14532d">leg x sqrt(2)</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
