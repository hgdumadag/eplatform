<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Parallel side splitter proportion</title>
  <desc id="desc">A triangle with segment DE parallel to BC, side parts AD, DB, AE, and EC labeled to show AD over DB equals AE over EC.</desc>
  <rect width="900" height="500" fill="#fffaf5"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2937">Parallel side splitter: compare split parts</text>
  <polygon points="140,425 780,425 450,70" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
  <line x1="313" y1="239" x2="598" y2="239" stroke="#2563eb" stroke-width="5"/>
  <text x="450" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">A</text>
  <text x="122" y="453" font-family="Arial, sans-serif" font-size="22" font-weight="700">B</text>
  <text x="785" y="453" font-family="Arial, sans-serif" font-size="22" font-weight="700">C</text>
  <text x="288" y="238" font-family="Arial, sans-serif" font-size="22" font-weight="700">D</text>
  <text x="608" y="238" font-family="Arial, sans-serif" font-size="22" font-weight="700">E</text>
  <text x="325" y="153" font-family="Arial, sans-serif" font-size="21" fill="#111827">AD = 4</text>
  <text x="195" y="350" font-family="Arial, sans-serif" font-size="21" fill="#111827">DB = 6</text>
  <text x="530" y="153" font-family="Arial, sans-serif" font-size="21" fill="#111827">AE = x</text>
  <text x="650" y="350" font-family="Arial, sans-serif" font-size="21" fill="#111827">EC = 9</text>
  <line x1="350" y1="222" x2="560" y2="222" stroke="#2563eb" stroke-width="2"/>
  <line x1="325" y1="425" x2="615" y2="425" stroke="#ea580c" stroke-width="2"/>
  <text x="450" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">DE</text>
  <text x="470" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#c2410c">BC</text>
  <rect x="228" y="20" width="444" height="32" rx="6" fill="#ffffff" stroke="#fed7aa"/>
  <text x="450" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111827">DE parallel BC</text>
  <rect x="255" y="455" width="390" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="450" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111827">AD/DB = AE/EC, so 4/6 = x/9</text>
</svg>
