<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Cross-products worked example</title>
  <desc id="desc">A worked proportion six ninths equals eight over x with diagonal arrows showing cross-products six x and nine times eight.</desc>
  <rect width="900" height="440" fill="#f8fafc"/>
  <text x="450" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2937">After matching sides, use cross-products</text>
  <rect x="70" y="95" width="760" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="250" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" fill="#111827">6</text>
  <line x1="210" y1="222" x2="290" y2="222" stroke="#111827" stroke-width="4"/>
  <text x="250" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" fill="#111827">9</text>
  <text x="450" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" fill="#111827">=</text>
  <text x="650" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" fill="#111827">8</text>
  <line x1="610" y1="222" x2="690" y2="222" stroke="#111827" stroke-width="4"/>
  <text x="650" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" fill="#111827">x</text>
  <line x1="280" y1="177" x2="620" y2="285" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <line x1="280" y1="285" x2="620" y2="177" stroke="#dc2626" stroke-width="5" marker-end="url(#arrowRed)"/>
  <text x="255" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#2563eb">6x</text>
  <text x="640" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#dc2626">9(8) = 72</text>
  <text x="450" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">6x = 72, so x = 12</text>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
