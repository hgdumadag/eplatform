<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Common wrong correspondence in similar triangles</title>
  <desc id="desc">A warning diagram showing that AC should correspond to DF, not EF, for triangle ABC similar to triangle DEF.</desc>
  <rect width="900" height="470" fill="#fef2f2"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7f1d1d">Do not cross-match corresponding sides</text>
  <polygon points="80,330 300,330 150,110" fill="#ffffff" stroke="#991b1b" stroke-width="4"/>
  <polygon points="560,330 820,330 640,70" fill="#ffffff" stroke="#991b1b" stroke-width="4"/>
  <text x="68" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="700">A</text>
  <text x="304" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="700">B</text>
  <text x="142" y="98" font-family="Arial, sans-serif" font-size="22" font-weight="700">C</text>
  <text x="548" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="700">D</text>
  <text x="823" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="700">E</text>
  <text x="632" y="58" font-family="Arial, sans-serif" font-size="22" font-weight="700">F</text>
  <line x1="135" y1="220" x2="632" y2="190" stroke="#16a34a" stroke-width="5" marker-end="url(#ok)"/>
  <text x="380" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#166534">AC &lt;-&gt; DF</text>
  <line x1="165" y1="210" x2="740" y2="205" stroke="#dc2626" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#bad)"/>
  <text x="463" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#991b1b">AC does not match EF</text>
  <rect x="115" y="385" width="670" height="50" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
  <text x="450" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#111827">For ABC similar to DEF: AB &lt;-&gt; DE, BC &lt;-&gt; EF, AC &lt;-&gt; DF</text>
  <defs>
    <marker id="ok" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="bad" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
