<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Corresponding side labels in similar triangles</title>
  <desc id="desc">Two similar triangles ABC and DEF with matching angle colors and side labels showing AB corresponds to DE, BC to EF, and AC to DF.</desc>
  <rect width="900" height="430" fill="#f7f9fc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2937">Use the vertex order to match sides</text>
  <polygon points="95,330 315,330 150,105" fill="#e8f3ff" stroke="#2563eb" stroke-width="4"/>
  <polygon points="555,330 820,330 622,60" fill="#f1f8ee" stroke="#16a34a" stroke-width="4"/>
  <text x="87" y="354" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">A</text>
  <text x="318" y="354" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">B</text>
  <text x="139" y="93" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">C</text>
  <text x="545" y="354" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">D</text>
  <text x="823" y="354" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">E</text>
  <text x="613" y="49" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">F</text>
  <text x="188" y="358" font-family="Arial, sans-serif" font-size="20" fill="#2563eb">AB</text>
  <text x="660" y="358" font-family="Arial, sans-serif" font-size="20" fill="#16a34a">DE</text>
  <text x="95" y="220" font-family="Arial, sans-serif" font-size="20" fill="#2563eb">AC</text>
  <text x="550" y="205" font-family="Arial, sans-serif" font-size="20" fill="#16a34a">DF</text>
  <text x="250" y="215" font-family="Arial, sans-serif" font-size="20" fill="#2563eb">BC</text>
  <text x="742" y="205" font-family="Arial, sans-serif" font-size="20" fill="#16a34a">EF</text>
  <path d="M180 355 C250 390, 610 390, 680 355" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M138 190 C220 140, 490 120, 582 175" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M280 205 C370 150, 660 130, 760 205" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="450" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111827">AB &lt;-&gt; DE, AC &lt;-&gt; DF, BC &lt;-&gt; EF</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
