<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Similarity statement mapping</title>
  <desc id="desc">Triangles PQR and XYZ are shown with matching colored vertices and side labels. The diagram teaches that PQR must be written in the same order as XYZ.</desc>
  <rect width="760" height="420" fill="#fbfdff"/>
  <text x="380" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111827">The order of the letters carries the meaning</text>
  <polygon points="105,310 290,310 145,120" fill="#eff6ff" stroke="#111827" stroke-width="4"/>
  <polygon points="470,310 655,310 510,120" fill="#f0fdf4" stroke="#111827" stroke-width="4"/>
  <circle cx="105" cy="310" r="9" fill="#dc2626"/>
  <circle cx="470" cy="310" r="9" fill="#dc2626"/>
  <circle cx="290" cy="310" r="9" fill="#2563eb"/>
  <circle cx="655" cy="310" r="9" fill="#2563eb"/>
  <circle cx="145" cy="120" r="9" fill="#16a34a"/>
  <circle cx="510" cy="120" r="9" fill="#16a34a"/>
  <text x="87" y="340" font-family="Arial, sans-serif" font-size="20" fill="#111827">P</text>
  <text x="296" y="340" font-family="Arial, sans-serif" font-size="20" fill="#111827">Q</text>
  <text x="132" y="106" font-family="Arial, sans-serif" font-size="20" fill="#111827">R</text>
  <text x="452" y="340" font-family="Arial, sans-serif" font-size="20" fill="#111827">X</text>
  <text x="662" y="340" font-family="Arial, sans-serif" font-size="20" fill="#111827">Y</text>
  <text x="497" y="106" font-family="Arial, sans-serif" font-size="20" fill="#111827">Z</text>
  <path d="M120 326 C205 382 370 382 455 326" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>
  <path d="M290 292 C355 250 590 250 655 292" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M160 116 C245 64 425 64 500 116" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="298" y="135" width="165" height="105" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="380" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">P to X</text>
  <text x="380" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">Q to Y</text>
  <text x="380" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#166534">R to Z</text>
  <text x="380" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111827">Correct: triangle PQR is similar to triangle XYZ</text>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
