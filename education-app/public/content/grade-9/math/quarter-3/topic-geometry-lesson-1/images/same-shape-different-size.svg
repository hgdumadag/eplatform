<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Same shape at different sizes</title>
  <desc id="desc">Two rectangles have the same width-to-height ratio. The larger rectangle is a scaled copy of the smaller rectangle, showing that similar figures may have different sizes.</desc>
  <rect width="760" height="420" fill="#fbfdff"/>
  <text x="380" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111827">Similar figures keep the same shape</text>
  <rect x="105" y="135" width="150" height="100" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <rect x="425" y="95" width="240" height="160" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
  <text x="180" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">3 by 2</text>
  <text x="545" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">6 by 4</text>
  <path d="M285 185 H390" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="337" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">scale factor 2</text>
  <text x="180" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1d4ed8">width/height = 3/2</text>
  <text x="545" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#15803d">width/height = 6/4 = 3/2</text>
  <text x="380" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111827">Same ratio means no stretching or squashing.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
