<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Corresponding vertices determine similarity order</title>
  <desc id="desc">Triangles ABC and DEF are shown with colored vertex dots and a mapping table, demonstrating A to D, B to E, and C to F.</desc>
  <rect width="760" height="420" fill="#fbfdff"/>
  <text x="380" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111827">Match vertices before writing the statement</text>
  <polygon points="100,320 285,320 155,105" fill="#eff6ff" stroke="#111827" stroke-width="4"/>
  <polygon points="475,320 660,320 530,105" fill="#f0fdf4" stroke="#111827" stroke-width="4"/>
  <circle cx="100" cy="320" r="9" fill="#dc2626"/>
  <circle cx="475" cy="320" r="9" fill="#dc2626"/>
  <circle cx="285" cy="320" r="9" fill="#2563eb"/>
  <circle cx="660" cy="320" r="9" fill="#2563eb"/>
  <circle cx="155" cy="105" r="9" fill="#16a34a"/>
  <circle cx="530" cy="105" r="9" fill="#16a34a"/>
  <text x="82" y="350" font-family="Arial, sans-serif" font-size="20" fill="#111827">A</text>
  <text x="292" y="350" font-family="Arial, sans-serif" font-size="20" fill="#111827">B</text>
  <text x="141" y="91" font-family="Arial, sans-serif" font-size="20" fill="#111827">C</text>
  <text x="457" y="350" font-family="Arial, sans-serif" font-size="20" fill="#111827">D</text>
  <text x="667" y="350" font-family="Arial, sans-serif" font-size="20" fill="#111827">E</text>
  <text x="516" y="91" font-family="Arial, sans-serif" font-size="20" fill="#111827">F</text>
  <rect x="315" y="112" width="130" height="154" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="380" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">Mapping</text>
  <text x="380" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">A to D</text>
  <text x="380" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">B to E</text>
  <text x="380" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#166534">C to F</text>
  <text x="380" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111827">Write: triangle ABC is similar to triangle DEF</text>
</svg>
