<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Equal corresponding angles in similar triangles</title>
  <desc id="desc">Two triangles are marked with equal angle arcs. A matches D, B matches E, and C matches F, showing the angle evidence used for similarity.</desc>
  <rect width="760" height="420" fill="#fbfdff"/>
  <text x="380" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111827">Corresponding angles are equal</text>
  <polygon points="110,320 300,320 165,100" fill="#eff6ff" stroke="#111827" stroke-width="4"/>
  <polygon points="470,320 660,320 525,100" fill="#f0fdf4" stroke="#111827" stroke-width="4"/>
  <text x="94" y="348" font-family="Arial, sans-serif" font-size="20" fill="#111827">A</text>
  <text x="306" y="348" font-family="Arial, sans-serif" font-size="20" fill="#111827">B</text>
  <text x="153" y="88" font-family="Arial, sans-serif" font-size="20" fill="#111827">C</text>
  <text x="454" y="348" font-family="Arial, sans-serif" font-size="20" fill="#111827">D</text>
  <text x="666" y="348" font-family="Arial, sans-serif" font-size="20" fill="#111827">E</text>
  <text x="513" y="88" font-family="Arial, sans-serif" font-size="20" fill="#111827">F</text>
  <path d="M142 320 A38 38 0 0 1 120 288" fill="none" stroke="#dc2626" stroke-width="5"/>
  <path d="M502 320 A38 38 0 0 1 480 288" fill="none" stroke="#dc2626" stroke-width="5"/>
  <path d="M267 320 A36 36 0 0 0 290 288" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M627 320 A36 36 0 0 0 650 288" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M151 126 A35 35 0 0 0 183 126" fill="none" stroke="#16a34a" stroke-width="5"/>
  <path d="M511 126 A35 35 0 0 0 543 126" fill="none" stroke="#16a34a" stroke-width="5"/>
  <text x="380" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">angle A = angle D</text>
  <text x="380" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">angle B = angle E</text>
  <text x="380" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#166534">angle C = angle F</text>
  <text x="380" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111827">Equal angle patterns preserve shape.</text>
</svg>
