<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Proportional corresponding side pairs</title>
  <desc id="desc">Two right triangles show side pairs 3 to 6, 4 to 8, and 5 to 10. Each larger side is twice the matching smaller side.</desc>
  <rect width="760" height="420" fill="#fbfdff"/>
  <text x="380" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111827">Corresponding sides use the same scale factor</text>
  <polygon points="105,315 265,315 105,195" fill="#eff6ff" stroke="#111827" stroke-width="4"/>
  <polygon points="455,315 675,315 455,150" fill="#f0fdf4" stroke="#111827" stroke-width="4"/>
  <text x="185" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">AB = 4</text>
  <text x="82" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">AC = 3</text>
  <text x="195" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">BC = 5</text>
  <text x="565" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#15803d">DE = 8</text>
  <text x="427" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#15803d">DF = 6</text>
  <text x="580" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#15803d">EF = 10</text>
  <text x="105" y="342" font-family="Arial, sans-serif" font-size="18" fill="#111827">A</text>
  <text x="268" y="342" font-family="Arial, sans-serif" font-size="18" fill="#111827">B</text>
  <text x="84" y="192" font-family="Arial, sans-serif" font-size="18" fill="#111827">C</text>
  <text x="455" y="342" font-family="Arial, sans-serif" font-size="18" fill="#111827">D</text>
  <text x="678" y="342" font-family="Arial, sans-serif" font-size="18" fill="#111827">E</text>
  <text x="433" y="147" font-family="Arial, sans-serif" font-size="18" fill="#111827">F</text>
  <rect x="296" y="122" width="170" height="120" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="381" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">Ratio check</text>
  <text x="381" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">8/4 = 2</text>
  <text x="381" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">6/3 = 2</text>
  <text x="381" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">10/5 = 2</text>
  <text x="380" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111827">All corresponding side ratios match, so the side evidence supports similarity.</text>
</svg>
