<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Worked missing side proportion setup</title>
  <desc id="desc">Similar triangles show corresponding sides five to fifteen and seven to x. The proportion five over fifteen equals seven over x gives x equals twenty-one.</desc>
  <rect width="760" height="360" fill="#f0fdfa"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#134e4a">Use corresponding sides to set up the missing side</text>
  <polygon points="80,255 205,255 135,110" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>
  <polygon points="445,255 705,255 560,25" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
  <text x="142" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#115e59">BC = 7</text>
  <text x="86" y="183" font-family="Arial, sans-serif" font-size="17" fill="#115e59">AB = 5</text>
  <text x="565" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#075985">EF = x</text>
  <text x="454" y="160" font-family="Arial, sans-serif" font-size="17" fill="#075985">DE = 15</text>
  <path d="M205 255 C270 285, 378 285, 445 255" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M135 110 C250 45, 440 38, 560 25" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="255" y="105" width="205" height="120" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  <text x="357" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">AB/DE = BC/EF</text>
  <text x="357" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f766e">5/15 = 7/x</text>
  <text x="357" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f766e">x = 21</text>
  <text x="380" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">Keep the same order: small triangle side over matching large triangle side.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
