<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Proportional side triplets for SSS similarity</title>
  <desc id="desc">Two triangles show corresponding side lengths 4, 6, 8 and 6, 9, 12. The ratios all simplify to two thirds, proving SSS similarity.</desc>
  <rect width="760" height="330" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">SSS Similarity: all three side ratios match</text>
  <polygon points="90,245 230,245 150,85" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <polygon points="465,245 675,245 555,5" fill="#dcfce7" stroke="#16a34a" stroke-width="4" transform="translate(0 80) scale(1 0.78)"/>
  <text x="160" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">6</text>
  <text x="101" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">4</text>
  <text x="219" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">8</text>
  <text x="570" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#166534">9</text>
  <text x="480" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#166534">6</text>
  <text x="660" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#166534">12</text>
  <text x="380" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">Compare corresponding sides</text>
  <text x="380" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">4/6 = 6/9 = 8/12</text>
  <text x="380" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f766e">All equal 2/3</text>
  <path d="M270 218 H455" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
