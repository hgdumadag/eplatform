<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Decision tree for SSS and SAS similarity</title>
  <desc id="desc">A decision tree asks whether three side ratios match, then whether two side ratios and the included angle match, leading to SSS, SAS, or not enough evidence.</desc>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Which similarity theorem should be chosen?</text>
  <rect x="245" y="62" width="270" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="380" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Do three corresponding</text>
  <text x="380" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">side ratios match?</text>
  <path d="M300 120 V165 H180 V205" stroke="#64748b" stroke-width="3" fill="none"/>
  <path d="M460 120 V165 H580 V205" stroke="#64748b" stroke-width="3" fill="none"/>
  <text x="230" y="158" font-family="Arial, sans-serif" font-size="15" fill="#334155">Yes</text>
  <text x="526" y="158" font-family="Arial, sans-serif" font-size="15" fill="#334155">No</text>
  <rect x="85" y="205" width="190" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="180" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">SSS Similarity</text>
  <rect x="455" y="205" width="250" height="70" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="580" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Do two side ratios match</text>
  <text x="580" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">and is the included angle congruent?</text>
  <path d="M525 275 V325 H415 V360" stroke="#64748b" stroke-width="3" fill="none"/>
  <path d="M635 275 V325 H635 V360" stroke="#64748b" stroke-width="3" fill="none"/>
  <text x="478" y="318" font-family="Arial, sans-serif" font-size="15" fill="#334155">Yes</text>
  <text x="646" y="318" font-family="Arial, sans-serif" font-size="15" fill="#334155">No</text>
  <rect x="320" y="360" width="190" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="415" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">SAS Similarity</text>
  <rect x="545" y="360" width="180" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="635" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#991b1b">Not enough</text>
</svg>
