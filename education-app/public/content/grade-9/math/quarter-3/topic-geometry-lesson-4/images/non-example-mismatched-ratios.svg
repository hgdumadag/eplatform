<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">Non-example with mismatched side ratios</title>
  <desc id="desc">Two triangles have two side ratios equal to one half, but the third ratio is three fifths. The mismatched ratio means SSS similarity cannot be used.</desc>
  <rect width="760" height="350" fill="#fef2f2"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7f1d1d">Non-example: one mismatched ratio breaks SSS</text>
  <polygon points="80,260 230,260 145,90" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
  <polygon points="480,260 680,260 565,65" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  <text x="155" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">6</text>
  <text x="92" y="176" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">4</text>
  <text x="204" y="176" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">9</text>
  <text x="580" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#92400e">12</text>
  <text x="492" y="170" font-family="Arial, sans-serif" font-size="17" fill="#92400e">8</text>
  <text x="648" y="170" font-family="Arial, sans-serif" font-size="17" fill="#92400e">15</text>
  <rect x="278" y="92" width="205" height="170" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
  <text x="380" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">4/8 = 1/2</text>
  <text x="380" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">6/12 = 1/2</text>
  <text x="380" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">9/15 = 3/5</text>
  <line x1="319" y1="208" x2="441" y2="108" stroke="#dc2626" stroke-width="5"/>
  <line x1="441" y1="208" x2="319" y2="108" stroke="#dc2626" stroke-width="5"/>
  <text x="380" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">Not all ratios match</text>
  <text x="380" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">Do not choose SSS Similarity.</text>
</svg>
