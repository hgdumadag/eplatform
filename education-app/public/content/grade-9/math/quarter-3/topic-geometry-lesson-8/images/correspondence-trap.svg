<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Common correspondence trap in a 30-60-90 triangle</title>
  <desc id="desc">Two side-matching notes compare the incorrect claim that x square root of 3 is opposite 30 degrees with the correct rule that x is opposite 30 degrees.</desc>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Avoid the Correspondence Trap</text>
  <polygon points="145,332 385,332 385,112" fill="#fef2f2" stroke="#dc2626" stroke-width="4"/>
  <path d="M385 307 H360 V332" fill="none" stroke="#0f172a" stroke-width="3"/>
  <text x="185" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#be123c">30 degrees</text>
  <text x="350" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#be123c">60 degrees</text>
  <text x="265" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#dc2626">wrong: x&#8730;3</text>
  <text x="414" y="229" font-family="Arial, sans-serif" font-size="22" fill="#dc2626">wrong: x</text>
  <line x1="118" y1="82" x2="424" y2="378" stroke="#dc2626" stroke-width="7" opacity="0.75"/>
  <line x1="424" y1="82" x2="118" y2="378" stroke="#dc2626" stroke-width="7" opacity="0.75"/>
  <rect x="485" y="112" width="220" height="220" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="595" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#166534">Correct match</text>
  <text x="512" y="195" font-family="Arial, sans-serif" font-size="19" fill="#0f172a">opposite 30 degrees: x</text>
  <text x="512" y="232" font-family="Arial, sans-serif" font-size="19" fill="#0f172a">opposite 60 degrees: x&#8730;3</text>
  <text x="512" y="269" font-family="Arial, sans-serif" font-size="19" fill="#0f172a">opposite 90 degrees: 2x</text>
  <text x="595" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">Match by angle, not by drawing shape.</text>
</svg>
