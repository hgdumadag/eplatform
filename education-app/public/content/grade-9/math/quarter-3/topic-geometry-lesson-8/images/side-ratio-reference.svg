<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Reference diagram for the 30-60-90 side ratio</title>
  <desc id="desc">A 30-60-90 triangle labels the short leg as x, the long leg as x square root of 3, and the hypotenuse as 2x.</desc>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">30-60-90 Side Ratio</text>
  <polygon points="190,340 570,340 570,120" fill="#ecfeff" stroke="#0891b2" stroke-width="4"/>
  <path d="M570 315 H545 V340" fill="none" stroke="#0f172a" stroke-width="3"/>
  <text x="382" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">short leg: x</text>
  <text x="606" y="235" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">long leg: x&#8730;3</text>
  <text x="335" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">hypotenuse: 2x</text>
  <text x="222" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#be123c">30 degrees</text>
  <text x="536" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#be123c">60 degrees</text>
  <text x="570" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">opposite 30 degrees</text>
  <text x="651" y="267" font-family="Arial, sans-serif" font-size="18" fill="#334155">opposite 60 degrees</text>
  <rect x="88" y="76" width="220" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="198" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Memory order</text>
  <text x="198" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1d4ed8">x : x&#8730;3 : 2x</text>
</svg>
