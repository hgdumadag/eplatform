<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">Parallel-line angle evidence for AA similarity</title>
  <desc id="desc">Parallel segments AB and DE create one angle pair, and intersecting diagonals create vertical angles for a second pair.</desc>
  <rect width="720" height="340" fill="#f8fafc"/>
  <g stroke="#94a3b8" stroke-width="5">
    <line x1="80" y1="88" x2="285" y2="88"/>
    <line x1="430" y1="250" x2="635" y2="250"/>
  </g>
  <g fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round">
    <line x1="80" y1="88" x2="635" y2="250"/>
    <line x1="285" y1="88" x2="430" y2="250"/>
    <line x1="80" y1="88" x2="285" y2="88"/>
    <line x1="430" y1="250" x2="635" y2="250"/>
  </g>
  <g fill="none" stroke-width="4">
    <path d="M111 89 Q129 101 139 117" stroke="#2563eb"/>
    <path d="M462 250 Q478 237 500 236" stroke="#2563eb"/>
    <path d="M339 149 Q359 169 379 169" stroke="#dc2626"/>
    <path d="M374 188 Q354 170 334 171" stroke="#dc2626"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">
    <text x="58" y="80">A</text><text x="291" y="80">B</text><text x="348" y="177">C</text>
    <text x="408" y="278">D</text><text x="640" y="278">E</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#334155" font-size="17">
    <text x="88" y="45">AB parallel DE</text>
    <text x="245" y="315">parallel angles + vertical angles = AA</text>
  </g>
</svg>
