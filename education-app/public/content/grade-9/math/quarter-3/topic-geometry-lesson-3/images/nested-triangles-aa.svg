<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Nested triangles proving AA similarity</title>
  <desc id="desc">A smaller triangle ADE sits inside triangle ABC with DE parallel to BC, creating two pairs of corresponding angles.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <g fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round">
    <path d="M360 55 L105 300 L625 300 Z"/>
    <path d="M245 190 L485 190"/>
  </g>
  <g stroke="#64748b" stroke-width="3">
    <line x1="120" y1="314" x2="615" y2="314"/>
    <line x1="250" y1="204" x2="480" y2="204"/>
  </g>
  <g fill="none" stroke-width="4">
    <path d="M251 190 Q269 209 294 213" stroke="#2563eb"/>
    <path d="M118 300 Q141 279 170 281" stroke="#2563eb"/>
    <path d="M480 190 Q454 207 432 213" stroke="#dc2626"/>
    <path d="M611 300 Q585 279 556 281" stroke="#dc2626"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
    <text x="353" y="42">A</text><text x="82" y="323">B</text><text x="628" y="323">C</text>
    <text x="220" y="188">D</text><text x="492" y="188">E</text>
  </g>
  <text x="218" y="340" font-family="Arial, sans-serif" font-size="18" fill="#334155">DE parallel BC, so triangle ADE is similar to triangle ABC</text>
</svg>
