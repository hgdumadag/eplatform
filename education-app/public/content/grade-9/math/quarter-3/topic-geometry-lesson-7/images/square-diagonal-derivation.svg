<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Square diagonal derivation of a 45-45-90 triangle</title>
  <desc id="desc">A square with side length x is cut by a diagonal into two congruent right triangles with legs x and x and hypotenuse x sqrt(2).</desc>
  <rect x="120" y="60" width="240" height="240" fill="#eef7ff" stroke="#1f5f8b" stroke-width="4"/>
  <line x1="120" y1="300" x2="360" y2="60" stroke="#d63f2f" stroke-width="5"/>
  <path d="M120 270 L150 270 L150 300" fill="none" stroke="#234" stroke-width="3"/>
  <text x="230" y="330" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">x</text>
  <text x="90" y="185" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">x</text>
  <text x="265" y="170" font-family="Arial, sans-serif" font-size="24" fill="#b5251c" transform="rotate(-45 265 170)">x sqrt(2)</text>
  <text x="390" y="90" font-family="Arial, sans-serif" font-size="22">45 degrees</text>
  <text x="55" y="310" font-family="Arial, sans-serif" font-size="22">45 degrees</text>
  <text x="410" y="175" font-family="Arial, sans-serif" font-size="22">x^2 + x^2 = c^2</text>
  <text x="410" y="215" font-family="Arial, sans-serif" font-size="22">c = x sqrt(2)</text>
</svg>
