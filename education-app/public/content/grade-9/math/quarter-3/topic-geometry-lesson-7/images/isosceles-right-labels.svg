<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Isosceles right triangle labels</title>
  <desc id="desc">A right triangle with congruent legs is labeled with 45 degree acute angles, showing that an isosceles right triangle is a 45-45-90 triangle.</desc>
  <polygon points="150,285 150,85 350,285" fill="#eef9f5" stroke="#176b60" stroke-width="4"/>
  <path d="M150 255 L180 255 L180 285" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="210" y1="285" x2="210" y2="273" stroke="#176b60" stroke-width="3"/>
  <line x1="138" y1="225" x2="150" y2="225" stroke="#176b60" stroke-width="3"/>
  <text x="232" y="314" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">leg</text>
  <text x="107" y="190" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">leg</text>
  <text x="165" y="75" font-family="Arial, sans-serif" font-size="22">45 degrees</text>
  <text x="308" y="312" font-family="Arial, sans-serif" font-size="22">45 degrees</text>
  <text x="405" y="130" font-family="Arial, sans-serif" font-size="28" font-weight="700">Isosceles right</text>
  <text x="405" y="178" font-family="Arial, sans-serif" font-size="24">equal legs</text>
  <text x="405" y="218" font-family="Arial, sans-serif" font-size="24">equal acute angles</text>
  <text x="405" y="258" font-family="Arial, sans-serif" font-size="24">45 degrees, 45 degrees, 90 degrees</text>
</svg>
